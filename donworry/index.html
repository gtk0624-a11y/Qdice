<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도디쌤의 돈워리 비해피 · 업무파탈 시리즈3</title>
<meta name="theme-color" content="#E3F6EC">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* ===== 도디쌤의 돈워리 비해피 — 스타일 (색은 :root 변수에서 바꾸세요) ===== */
:root{--ink:#2b2a33;--mint:#E3F6EC;--mint2:#9FE3C8;--green:#1f8a68;--cream:#FFF6DF;--yellow:#FFE07A;--coral:#FFD3CB;--red:#c8432e;--sky:#EAF2FF;--line:#e6e2d6;--mu:#6a6773}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mint);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
#app{max-width:980px;margin:0 auto;padding:18px 18px 70px}
.demo-banner{background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:14px}
.demo-banner b{color:var(--yellow)}.demo-banner a{color:var(--yellow);font-weight:700}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px;margin:8px 0 14px}
.series{display:inline-block;background:var(--ink);color:#fff;border-radius:40px;padding:3px 14px;font-size:13px;font-weight:700}
h1{margin:6px 0 0;font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1.2}
.sub{color:var(--mu);font-size:14px}
.mascot{width:78px;height:auto;display:block;margin-left:auto}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
nav.tabs button{flex:none;border:3px solid var(--ink);background:#fff;border-radius:40px;padding:8px 18px;font-weight:700;font-size:15px}
nav.tabs button.on{background:var(--ink);color:#fff}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 0 rgba(43,42,51,.14)}
.card.flat{box-shadow:none}
h2{margin:0 0 4px;font-size:22px;font-weight:900;letter-spacing:-.5px}
h3{margin:0 0 8px;font-size:17px;font-weight:900}
.hint{color:var(--mu);font-size:14px;margin:2px 0 10px}
.btn{border:3px solid var(--ink);background:#fff;border-radius:40px;padding:7px 16px;font-weight:700;font-size:14px;line-height:1.3}
.btn:hover{background:var(--yellow)}
.btn.pri{background:var(--ink);color:#fff}.btn.pri:hover{background:#000}
.btn.yel{background:var(--yellow)}
.btn.sm{padding:3px 11px;font-size:13px;border-width:2px}
.btn.del{border-color:var(--red);color:var(--red)}
.btn.del:hover{background:var(--coral)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 160px}
input,select,textarea{border:2px solid var(--ink);border-radius:12px;padding:8px 11px;background:#fff;max-width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid var(--mint2);outline-offset:1px}
textarea{width:100%;min-height:120px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mu)}
label.f input,label.f select{display:block;width:100%;margin-top:3px;font-weight:400;color:var(--ink);font-size:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sumbox{border:3px solid var(--ink);border-radius:18px;padding:12px 16px;background:var(--cream)}
.sumbox small{display:block;font-size:13px;font-weight:700;color:var(--mu)}
.sumbox b{font-size:26px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.sumbox.bal{background:var(--mint2)}
.bar{height:16px;background:#eee;border-radius:10px;overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--yellow)}
.bar i.over{background:var(--red)}
.chip{display:inline-block;border-radius:40px;padding:2px 12px;font-size:13px;font-weight:700;border:2px solid var(--ink);background:#fff;white-space:nowrap}
.chip.soon{background:var(--coral);border-color:var(--red);color:#a3331f}
.chip.ok{background:var(--mint)}.chip.done{background:#eee;color:var(--mu);border-color:#bbb}.chip.over{background:var(--red);color:#fff;border-color:var(--red)}
.num{font-variant-numeric:tabular-nums;text-align:right}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;text-align:left;color:#fff;background:var(--ink);padding:8px 10px;white-space:nowrap}
th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
th.num{text-align:right}
td{padding:9px 10px;border-bottom:2px solid var(--line);vertical-align:middle}
tr.total td{background:var(--cream);font-weight:900;border-bottom:0}
td input.cell{width:100%;border-width:1.5px;padding:5px 8px;border-radius:8px}
td input.cell.amt{text-align:right;min-width:90px}
.tw{overflow-x:auto}
.item{border:3px solid var(--ink);border-radius:20px;margin-bottom:12px;background:#fff;overflow:hidden}
.item>.hd{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 18px;cursor:pointer;align-items:center}
.item>.hd .nm{font-weight:900;font-size:18px;letter-spacing:-.4px}
.item>.hd .dp{font-size:13px;color:var(--mu)}
.item>.hd .nums{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--mu)}
.item>.hd .nums b{color:var(--ink)}
.item>.hd .nums .bl{color:var(--green);font-weight:900}
.item>.hd .barw{grid-column:1/-1}
.item .bd{padding:4px 18px 18px;border-top:3px dashed var(--line);background:#fffdf7}
.empty{text-align:center;padding:34px 10px;color:var(--mu)}
.empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
.tag{font-size:12px;font-weight:700;color:var(--green)}
.todo{display:flex;gap:8px;align-items:center;padding:4px 0}
.todo.done span{text-decoration:line-through;color:var(--mu)}
.todo input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.drop{border:3px dashed var(--ink);border-radius:20px;padding:22px;text-align:center;background:var(--cream);cursor:pointer;display:block}
.drop.over{background:var(--mint2)}
.drop b{font-size:18px}
.warn{background:var(--coral);border:2px solid var(--red);border-radius:14px;padding:9px 14px;font-size:14px;margin:8px 0}
.note{background:var(--sky);border-radius:14px;padding:10px 14px;font-size:14px;margin:8px 0}
footer{text-align:center;font-size:12px;color:var(--mu);margin-top:26px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:40px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.printonly{display:none}
@media (max-width:640px){
 #app{padding:12px 12px 60px}h1{font-size:26px}.card{padding:16px}
 .sumrow{grid-template-columns:1fr}.sumbox b{font-size:22px}
 .item>.hd{padding:12px 14px}
}
@media print{
 body{background:#fff}
 header.top,nav.tabs,.noprint,footer,.demo-banner,#toast{display:none!important}
 .card{box-shadow:none;border:0;padding:0}
 .printonly{display:block}
 th{background:#ddd!important;color:#000!important;-webkit-print-color-adjust:exact}
 td input.cell{border:0;padding:0}
}
</style>
</head>
<body>
<div id="app">
  <div class="demo-banner" id="demoBanner" hidden>
    <span><b>체험판</b> · 예시 데이터로 마음껏 눌러 보세요. 이 화면은 <b>저장되지 않아요</b>(새로고침하면 처음으로).</span>
    <a href="../donworry/">실제판 열기 →</a>
  </div>
  <header class="top">
    <div>
      <span class="series">업무파탈 · SERIES 3</span>
      <h1>도디쌤의 돈워리 비해피</h1>
      <div class="sub">돈 걱정은 행복하지 않아 — 내 업무 예산을 세우고 · 쓰고 · 정리</div>
    </div>
    <div><img class="mascot" src="ggumsong.png" alt="꿈송이" onerror="this.hidden=true"><div class="sub" id="ownerLine"></div></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <footer>© 김정환 · M.A.D.T (Moral And Digital Teacher)</footer>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" async></script>
<script>
/* =====================================================================
   도디쌤의 돈워리 비해피 — 구조 안내 (자세한 설명은 구조설명.md)
   1) 데이터   : S (items 예산항목[집행내역 포함] / events 행사 / owner·year) — 이 기기 localStorage('dwb_v1')
   2) 화면     : render() → 탭별 함수 vHome / vLedger / vImport / vEvents / vRequest / vSettings
   3) 입력     : parseAny() — 엑셀·csv·붙여넣은 글에서 사업명·금액·기한을 뽑아 draft 로 만듦
   4) 체험판   : DEMO=true 이면 예시 데이터로 시작하고 저장하지 않음
   ===================================================================== */
const DEMO = false;
const KEY = 'dwb_v1';

/* ---------- 도우미 ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Math.round(Number(n)) || 0).toLocaleString('ko-KR');
const toNum = s => Number(String(s ?? '').replace(/[^\d.-]/g, '')) || 0;
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const addDays = n => { const t = today(); return iso(new Date(t.getFullYear(), t.getMonth(), t.getDate() + n)); };
const dday = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); if (!y) return null; return Math.round((new Date(y, m - 1, d) - today()) / 864e5); };
const ddayTxt = n => n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n);
const $ = id => document.getElementById(id);
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- 데이터 ---------- */
function empty() { return { v: 1, owner: '', year: String(today().getFullYear()), items: [], events: [] }; }
function sample() {
  const s = empty();
  s.owner = '도디쌤(예시)';
  s.items = [
    { id: uid(), name: '학생인권 교육 운영', dept: '학생인권부', alloc: 500000, deadline: addDays(14), memo: '강사료·교재',
      spent: [{ id: uid(), date: addDays(-30), title: '교육 자료 인쇄', amount: 120000 }, { id: uid(), date: addDays(-12), title: '강사 사례비', amount: 200000 }] },
    { id: uid(), name: '교권보호 연수', dept: '학생인권부', alloc: 300000, deadline: addDays(40), memo: '',
      spent: [{ id: uid(), date: addDays(-50), title: '연수 강사비', amount: 300000 }] },
    { id: uid(), name: '곡선제 운영', dept: '학생인권부', alloc: 800000, deadline: addDays(25), memo: '무대·음향·간식',
      spent: [{ id: uid(), date: addDays(-8), title: '현수막 제작', amount: 195000 }] },
    { id: uid(), name: '인권규정 개정 협의회', dept: '학생인권부', alloc: 200000, deadline: addDays(6), memo: '다과·회의 자료', spent: [] }
  ];
  s.events = [
    { id: uid(), name: '제16회 곡선제', date: addDays(25), itemId: s.items[2].id, done: false,
      todos: [{ t: '무대·음향 업체 확정', d: true }, { t: '현수막 시안 확인', d: true }, { t: '간식 구입 품의', d: false }, { t: '학부모 안내문 발송', d: false }] }
  ];
  return s;
}
function load() {
  if (DEMO) return sample();
  try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); return Object.assign(empty(), o, { items: Array.isArray(o.items) ? o.items : [], events: Array.isArray(o.events) ? o.events : [] }); } } catch (e) {}
  return empty();
}
let S = load();
function save() {
  if (DEMO) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('이 브라우저에 저장하지 못했어요. 설정에서 백업을 내려받아 주세요'); }
}
const ui = { tab: 'home', open: new Set(), edit: null, draft: null, req: null, reqPct: 0, reqTitle: '' };

function calc(it) {
  const spent = (it.spent || []).reduce((a, b) => a + (Number(b.amount) || 0), 0);
  const alloc = Number(it.alloc) || 0;
  return { spent, alloc, bal: alloc - spent, pct: alloc > 0 ? Math.min(100, spent / alloc * 100) : (spent > 0 ? 100 : 0) };
}
function totals() { return S.items.reduce((t, it) => { const c = calc(it); t.alloc += c.alloc; t.spent += c.spent; t.bal += c.bal; return t; }, { alloc: 0, spent: 0, bal: 0 }); }
function chipFor(it) {
  const c = calc(it), d = dday(it.deadline);
  if (c.bal < 0) return '<span class="chip over">예산 초과</span>';
  if (c.alloc > 0 && c.bal === 0) return '<span class="chip done">전액 집행</span>';
  if (d === null) return '';
  if (d < 0) return '<span class="chip soon">기한 지남 ' + ddayTxt(d) + '</span>';
  if (d <= 14) return '<span class="chip soon">' + ddayTxt(d) + '</span>';
  return '<span class="chip ok">' + ddayTxt(d) + '</span>';
}

/* ---------- 계획서·표에서 사업명/금액/기한 뽑기 ---------- */
function inferYear(m, d) {
  const t = today(); let y = t.getFullYear();
  if (new Date(y, m - 1, d) < new Date(t.getFullYear(), t.getMonth(), t.getDate() - 120)) y++;
  return y;
}
function findDate(str) {
  let m;
  if ((m = str.match(/(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?/))) return { iso: m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0'), raw: m[0] };
  if ((m = str.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) { const y = inferYear(+m[1], +m[2]); return { iso: y + '-' + String(m[1]).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0'), raw: m[0] }; }
  if ((m = str.match(/(\d{1,2})\/(\d{1,2})\s*까지/))) { const y = inferYear(+m[1], +m[2]); return { iso: y + '-' + String(m[1]).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0'), raw: m[0] }; }
  return null;
}
function findAmount(str) {
  const re = /(\d{1,3}(?:,\d{3})+|\d+)\s*(천원|만원|원|명|회|학년|시간|차시|월|일|개|부|권|%|년|반|차)?/g;
  let m, best = null;
  while ((m = re.exec(str))) {
    const hasComma = m[1].includes(','); const n = Number(m[1].replace(/,/g, '')); const u = m[2];
    let v = 0;
    if (u === '원') v = n; else if (u === '천원') v = n * 1000; else if (u === '만원') v = n * 10000;
    else if (!u && (hasComma || n >= 10000)) v = n;
    else continue;
    if (v >= 1000 && (!best || v > best.v)) best = { v, raw: m[0] };
  }
  return best;
}
function cleanName(s) {
  return s.replace(/^[\s\-–•·*▶▷■□○●◆◇※\d.)\]①②③④⑤⑥⑦⑧⑨⑩]+/, '').replace(/(기한|마감|집행기한|집행 기한)\s*[:：]?/g, '').replace(/까지/g, '').replace(/[\s:：,;|\/~\-–]+$/g, '').replace(/^[\s:：,;|\/~\-–]+/g, '').replace(/\s{2,}/g, ' ').trim();
}
function parseText(txt) {
  const out = [];
  String(txt || '').split(/\r?\n/).forEach(line0 => {
    let line = line0.replace(/\t/g, ' | ').trim();
    if (!line) return;
    const dt = findDate(line); let rest = line; if (dt) rest = rest.replace(dt.raw, ' ');
    const am = findAmount(rest); if (!am) return;
    rest = rest.replace(am.raw, ' ');
    const name = cleanName(rest);
    if (/^(합계|총계|소계|계|총액)$/.test(name.replace(/\s/g, ''))) return;
    out.push({ name: name || '(이름 없음)', amount: am.v, deadline: dt ? dt.iso : '', dept: '', on: true });
  });
  return out;
}
function cellDate(v) {
  if (v instanceof Date && !isNaN(v)) return iso(v);
  if (typeof v === 'string') { const d = findDate(v); if (d) return d.iso; const m = v.match(/^(20\d{2})-(\d{2})-(\d{2})/); if (m) return m[0]; }
  return '';
}
function parseRows(rows) {
  rows = rows.filter(r => r.some(c => String(c).trim() !== ''));
  let hi = -1, ci = {};
  for (let i = 0; i < Math.min(12, rows.length); i++) {
    const r = rows[i].map(c => String(c));
    const n = r.findIndex(c => /사업|항목|명칭|과제|내역|프로그램|행사/.test(c));
    const a = r.findIndex(c => /금액|예산|배정|계획액|요구액/.test(c));
    if (n >= 0 && a >= 0 && n !== a) {
      hi = i; ci = { n, a, d: r.findIndex(c => /기한|마감|집행일|일자|날짜/.test(c)), p: r.findIndex(c => /부서|담당/.test(c)) }; break;
    }
  }
  const out = [];
  if (hi >= 0) {
    rows.slice(hi + 1).forEach(r => {
      const name = String(r[ci.n] ?? '').trim(); const amt = toNum(r[ci.a]);
      if (!name || !amt || /^(합계|총계|소계|계|총액)$/.test(name.replace(/\s/g, ''))) return;
      out.push({ name, amount: amt, deadline: ci.d >= 0 ? cellDate(r[ci.d]) : '', dept: ci.p >= 0 ? String(r[ci.p] ?? '').trim() : '', on: true });
    });
    if (out.length) return out;
  }
  rows.forEach(r => {
    let name = '', amt = 0, dl = '';
    r.forEach(c => {
      if (c instanceof Date) { if (!dl) dl = cellDate(c); return; }
      const s = String(c).trim(); if (!s) return;
      if (typeof c === 'number') { if (c >= 1000 && c > amt) amt = c; return; }
      const fd = cellDate(s); if (fd && !dl && s.length <= 16) { dl = fd; return; }
      if (/^[\d,\s원]+$/.test(s)) { const v = toNum(s); if (v >= 1000 && v > amt) amt = v; return; }
      if (!name && /[가-힣A-Za-z]/.test(s)) name = s;
    });
    if (name && amt && !/^(합계|총계|소계|계|총액)$/.test(name.replace(/\s/g, ''))) out.push({ name, amount: amt, deadline: dl, dept: '', on: true });
  });
  return out;
}
async function parseFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (['xlsx', 'xls', 'csv'].includes(ext)) {
    if (window.XLSX) {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      let all = [];
      wb.SheetNames.forEach(n => { all = all.concat(parseRows(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }))); });
      return all;
    }
    if (ext === 'csv') return parseText(await file.text());
    throw new Error('엑셀 도구를 아직 못 불러왔어요. 인터넷을 확인하고 다시 시도하거나, 내용을 복사해 붙여넣어 주세요.');
  }
  if (['txt', 'md'].includes(ext)) return parseText(await file.text());
  throw new Error('한글(hwp)·PDF·워드 파일은 내용을 직접 읽지 못해요. 파일을 열어 표/글을 복사한 뒤 아래 칸에 붙여넣어 주세요.');
}

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'todo') { const ev = S.events.find(x => x.id === t.dataset.id); if (ev) { ev.todos[+t.dataset.i].d = t.checked; save(); render(); } return; }
  if (t.id === 'fileIn') { if (t.files[0]) handleFile(t.files[0], 'draft'); return; }
  if (t.id === 'fileReq') { if (t.files[0]) handleFile(t.files[0], 'req'); return; }
  if (t.id === 'jsonIn') { if (t.files[0]) importJson(t.files[0]); return; }
  if (t.dataset.di !== undefined) {
    const d = ui.draft[+t.dataset.di], f = t.dataset.f;
    if (f === 'on') d.on = t.checked; else if (f === 'amount') { d.amount = toNum(t.value); t.value = won(d.amount); } else d[f] = t.value;
  }
  if (t.dataset.ri !== undefined && t.dataset.f === 'next') { t.value = won(toNum(t.value)); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.di !== undefined && t.dataset.f !== 'on' && t.dataset.f !== 'amount') ui.draft[+t.dataset.di][t.dataset.f] = t.value;
  if (t.dataset.ri !== undefined) {
    const i = +t.dataset.ri, r = ui.req[i], f = t.dataset.f;
    if (f === 'next') { r.next = toNum(t.value); const c = $('rd' + i); if (c) c.textContent = diffTxt(r.next - r.prev); recalcReqTotals(); }
    else r[f] = t.value;
  }
});
function recalcReqTotals() { const t = reqTotals(); if ($('rtNext')) { $('rtNext').textContent = won(t.next); $('rtDiff').textContent = diffTxt(t.next - t.prev); $('rtPrev').textContent = won(t.prev); } }
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('.drop'); if (!z) return;
  e.preventDefault();
  if (ev === 'dragover') z.classList.add('over'); else z.classList.remove('over');
  if (ev === 'drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0], z.id === 'drop2' ? 'req' : 'draft');
}));
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fd = Object.fromEntries(new FormData(f)); const kind = f.dataset.form;
  if (kind === 'addItem') { S.items.push({ id: uid(), name: fd.name.trim(), dept: (fd.dept || '').trim(), alloc: toNum(fd.alloc), deadline: fd.deadline || '', memo: (fd.memo || '').trim(), spent: [] }); save(); toast('장부에 추가했어요'); render(); }
  else if (kind === 'saveItem') { const it = S.items.find(x => x.id === f.dataset.id); Object.assign(it, { name: fd.name.trim(), dept: (fd.dept || '').trim(), alloc: toNum(fd.alloc), deadline: fd.deadline || '', memo: (fd.memo || '').trim() }); ui.edit = null; save(); toast('저장했어요'); render(); }
  else if (kind === 'addSpent') { const it = S.items.find(x => x.id === f.dataset.id); it.spent.push({ id: uid(), date: fd.date || iso(today()), title: fd.title.trim(), amount: toNum(fd.amount) }); save(); const c = calc(it); toast(c.bal < 0 ? '⚠️ 예산을 ' + won(-c.bal) + '원 넘었어요' : '기록했어요 · 잔액 ' + won(c.bal) + '원'); render(); }
  else if (kind === 'addEvent') { S.events.push({ id: uid(), name: fd.name.trim(), date: fd.date || '', itemId: fd.itemId || '', done: false, todos: [] }); save(); render(); }
  else if (kind === 'addTodo') { const ev = S.events.find(x => x.id === f.dataset.id); ev.todos.push({ t: fd.t.trim(), d: false }); save(); render(); }
  else if (kind === 'meta') { S.owner = (fd.owner || '').trim(); S.year = (fd.year || '').trim() || String(today().getFullYear()); save(); toast('저장했어요'); render(); }
});
async function handleFile(file, target) {
  try {
    const rows = await parseFile(file);
    if (target === 'draft') { ui.draft = rows; render(); toast(rows.length ? rows.length + '건을 찾았어요' : '찾은 항목이 없어요'); }
    else { setReq(rows); }
  } catch (err) { toast(err.message || '파일을 읽지 못했어요'); }
}
function setReq(rows) {
  ui.req = rows.map(r => ({ name: r.name, prev: r.amount, next: r.amount, why: '' })); ui.reqPct = 0;
  render(); toast(rows.length ? rows.length + '개 항목으로 틀을 만들었어요' : '찾은 항목이 없어요');
}
function act(a, d) {
  if (a === 'tab') { ui.tab = d.k; render(); window.scrollTo(0, 0); }
  else if (a === 'toggle') { ui.open.has(d.id) ? ui.open.delete(d.id) : ui.open.add(d.id); ui.edit = null; render(); }
  else if (a === 'editItem') { ui.edit = d.id; render(); }
  else if (a === 'cancelEdit') { ui.edit = null; render(); }
  else if (a === 'delItem') { if (confirm('이 사업과 집행 내역을 모두 지울까요?')) { S.items = S.items.filter(x => x.id !== d.id); S.events.forEach(e => { if (e.itemId === d.id) e.itemId = ''; }); save(); render(); } }
  else if (a === 'delSpent') { const it = S.items.find(x => x.id === d.id); it.spent = it.spent.filter(s => s.id !== d.sid); save(); render(); }
  else if (a === 'delEvent') { if (confirm('이 행사를 지울까요?')) { S.events = S.events.filter(x => x.id !== d.id); save(); render(); } }
  else if (a === 'doneEvent') { const ev = S.events.find(x => x.id === d.id); ev.done = !ev.done; save(); render(); }
  else if (a === 'delTodo') { const ev = S.events.find(x => x.id === d.id); ev.todos.splice(+d.i, 1); save(); render(); }
  else if (a === 'sampleTxt') { $('pasteTxt').value = '학생인권 교육 운영 500,000원 12월 20일까지\n교권보호 연수 300,000원 2026-12-10\n곡선제 운영 800,000원\n- 인권규정 개정 협의회 20만원 1월 15일'; }
  else if (a === 'parse') { ui.draft = parseText($('pasteTxt').value); const v = $('pasteTxt').value; render(); $('pasteTxt').value = v; toast(ui.draft.length ? ui.draft.length + '건을 찾았어요' : '찾은 항목이 없어요'); }
  else if (a === 'draftAdd') {
    const pick = ui.draft.filter(x => x.on && x.name && x.amount); if (!pick.length) return toast('체크된 항목이 없어요');
    pick.forEach(x => S.items.push({ id: uid(), name: x.name, dept: x.dept || '', alloc: x.amount, deadline: x.deadline || '', memo: '', spent: [] }));
    ui.draft = null; save(); ui.tab = 'ledger'; render(); toast(pick.length + '건을 장부에 넣었어요');
  }
  else if (a === 'draftClear') { ui.draft = null; render(); }
  else if (a === 'reqParse') { const rows = parseText($('reqTxt').value); setReq(rows); }
  else if (a === 'reqLedger') { if (!S.items.length) return toast('장부에 항목이 없어요'); setReq(S.items.map(i => ({ name: i.name, amount: Number(i.alloc) || 0 }))); }
  else if (a === 'reqApply') { const p = Number($('reqPct').value) || 0; ui.reqPct = p; ui.req.forEach(r => r.next = Math.round(r.prev * (1 + p / 100) / 1000) * 1000); render(); toast('전체 ' + (p >= 0 ? '+' : '') + p + '% 적용(천원 단위 반올림)'); }
  else if (a === 'reqDel') { ui.req.splice(+d.i, 1); render(); }
  else if (a === 'reqPrint') { window.print(); }
  else if (a === 'reqXlsx') { reqXlsx(); }
  else if (a === 'exportXlsx') { exportXlsx(); }
  else if (a === 'exportJson') { download('돈워리비해피_백업_' + iso(today()) + '.json', new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); }
  else if (a === 'copyJson') { copyText(JSON.stringify(S)).then(ok => toast(ok ? '복사했어요. 메모 앱에 붙여 두세요' : '복사하지 못했어요')); }
  else if (a === 'resetAll') { if (confirm(DEMO ? '예시 데이터로 되돌릴까요?' : '모든 예산·행사 자료를 지웁니다. 되돌릴 수 없어요. 계속할까요?')) { S = DEMO ? sample() : empty(); ui.open.clear(); ui.draft = ui.req = null; save(); render(); } }
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); return true; } catch (e) { try { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e2) { return false; } } }
function download(name, blob) {
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  catch (e) { toast('내려받기가 막혔어요. 크롬에서 열어 주세요'); }
}
function importJson(file) {
  file.text().then(t => {
    try { const o = JSON.parse(t); if (!Array.isArray(o.items)) throw 0; S = Object.assign(empty(), o); save(); ui.open.clear(); render(); toast('백업을 불러왔어요'); }
    catch (e) { toast('백업 파일이 아니에요'); }
  });
}
function needX() { if (window.XLSX) return true; toast('엑셀 도구를 못 불러왔어요. 인터넷을 확인해 주세요'); return false; }
function exportXlsx() {
  if (!needX()) return;
  const a = [['사업', '부서', '배정', '집행', '잔액', '기한', '메모']].concat(S.items.map(i => { const c = calc(i); return [i.name, i.dept, c.alloc, c.spent, c.bal, i.deadline, i.memo]; }));
  const t = totals(); a.push(['합계', '', t.alloc, t.spent, t.bal, '', '']);
  const b = [['사업', '날짜', '내용', '금액']]; S.items.forEach(i => (i.spent || []).forEach(s => b.push([i.name, s.date, s.title, s.amount])));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a), '예산 현황'); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(b), '집행 내역');
  try { XLSX.writeFile(wb, '돈워리비해피_' + iso(today()) + '.xlsx'); } catch (e) { toast('내려받기가 막혔어요. 크롬에서 열어 주세요'); }
}
function reqXlsx() {
  if (!needX()) return;
  const y = (toNum(S.year) || today().getFullYear()) + 1;
  const a = [[y + '학년도 예산요구서(초안)'], ['항목', '작년', '올해 요구액', '증감', '산출 근거·사유']].concat(ui.req.map(r => [r.name, r.prev, r.next, r.next - r.prev, r.why]));
  const t = reqTotals(); a.push(['합계', t.prev, t.next, t.next - t.prev, '']);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a), '예산요구서');
  try { XLSX.writeFile(wb, '예산요구서_초안_' + y + '.xlsx'); } catch (e) { toast('내려받기가 막혔어요. 크롬에서 열어 주세요'); }
}
render();
</script>
