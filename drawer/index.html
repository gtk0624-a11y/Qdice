<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e3a8a">
<title>도디쌤 서랍</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --brand:#1e3a8a; --brand2:#2563eb; --star:#f59e0b; --new:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:10px 12px 10px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:17px;margin:0;flex:1;letter-spacing:-.3px}
.top .modebadge{font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:99px}
.iconbtn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;width:34px;height:34px;font-size:17px;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.28)}
.search{margin-top:8px;display:flex;background:#fff;border-radius:12px;overflow:hidden}
.search input{flex:1;border:0;outline:0;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--ink);min-width:0}
.search .clear{border:0;background:none;padding:0 12px;font-size:16px;color:var(--sub);cursor:pointer;display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
main{flex:1;padding:4px 12px 120px}
.wm{position:fixed;left:0;right:0;bottom:0;z-index:7;text-align:center;font-size:11px;color:var(--sub);background:var(--bg);border-top:1px solid var(--line);padding:7px 8px;letter-spacing:-.2px;pointer-events:none;user-select:none}
.sec{margin:14px 2px 6px;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.3px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:6px;cursor:pointer;user-select:none}
.row:hover,.row:focus{border-color:var(--brand2);outline:0;box-shadow:0 0 0 2px rgba(37,99,235,.15)}
.row.nourl{opacity:.6}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;font-weight:700}
.info{flex:1;min-width:0}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:10px;font-weight:700;color:#fff;background:var(--new);border-radius:99px;padding:2px 6px}
.lock{flex:none;font-size:12px;opacity:.55}
.star,.del{flex:none;border:0;background:none;font-size:19px;cursor:pointer;color:#c4c9d4;padding:2px 4px;line-height:1}
.star.on{color:var(--star)}
.star:hover{color:var(--star)}
.del{font-size:14px}
.del:hover{color:var(--new)}
.empty{text-align:center;color:var(--sub);padding:40px 10px;line-height:1.7}
.fab{position:fixed;right:max(14px,calc(50% - 266px));bottom:44px;border:0;background:var(--brand2);color:#fff;border-radius:99px;padding:12px 18px;font-size:15px;font-weight:700;font-family:inherit;box-shadow:0 6px 18px rgba(30,58,138,.35);cursor:pointer;z-index:6}
.fab:hover{background:var(--brand)}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,380px);box-shadow:0 20px 50px rgba(0,0,0,.3);font-family:inherit;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 12px;font-size:17px}
label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 4px}
input[type=text],input[type=url],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
.hint{font-size:11px;color:var(--sub);margin-top:3px}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;border:0;border-radius:10px;padding:11px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.btns .ok{background:var(--brand2);color:#fff}
.btns .no{background:#eef0f5;color:var(--ink)}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--ink);margin:8px 0}
.seg{display:flex;gap:6px}
.seg label{flex:1;margin:0;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:14px;color:var(--ink);font-weight:700;cursor:pointer}
.seg input{display:none}
.seg input:checked+span{color:var(--brand2)}
.seg label:has(input:checked){border-color:var(--brand2);background:#eff4ff}
#toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:88vw;text-align:center}
#toast.show{opacity:.95}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <h1>🗄️ 도디쌤 서랍</h1>
      <button class="iconbtn" id="btnSet" title="설정" aria-label="설정">⚙️</button>
    </div>
    <div class="search">
      <input id="q" type="text" placeholder="🔍 이름으로 찾기 (Enter = 첫 번째 열기)" autocomplete="off">
      <button class="clear" id="qclear" aria-label="검색어 지우기">✕</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="list"></main>
</div>
<button class="fab" id="btnAdd">＋ 추가</button>
<div class="wm">© 김정환 · M.A.D.T (Moral And Digital Teacher)</div>
<div id="toast"></div>

<!-- 추가·수정 창 -->
<dialog id="dlgAdd">
  <h2 id="addTitle">＋ 사이트 추가</h2>
  <label for="fUrl">주소(링크) *</label>
  <input id="fUrl" type="text" placeholder="https://..." autocomplete="off">
  <label for="fName">이름 (비우면 사이트 주소로 표시)</label>
  <input id="fName" type="text" placeholder="예: 업무포털" autocomplete="off">
  <label for="fIcon">아이콘 이모지 (선택)</label>
  <input id="fIcon" type="text" placeholder="예: 📝" maxlength="4" autocomplete="off">
  <label for="fCat">분류</label>
  <select id="fCat"></select>
  <div class="btns"><button class="no" id="addCancel" type="button">취소</button><button class="ok" id="addOk" type="button">추가</button></div>
</dialog>

<!-- 설정 창 -->
<dialog id="dlgSet">
  <h2>⚙️ 설정</h2>
  <label class="opt"><input type="checkbox" id="optClose"> 사이트를 연 뒤 서랍 창 자동으로 닫기</label>
  <label>백업 (다른 컴퓨터로 옮기거나, 만일을 대비할 때)</label>
  <div class="btns" style="margin-top:4px">
    <button class="no" id="btnExport" type="button">📤 백업 저장</button>
    <button class="no" id="btnImport" type="button">📥 백업 불러오기</button>
  </div>
  <input type="file" id="fileImport" accept="application/json,.json" style="display:none">
  <div class="hint">내 사이트 목록은 이 컴퓨터(이 브라우저)에만 저장됩니다. 다른 사람이 같은 주소로 열어도 내 목록은 보이지 않습니다.</div>
  <div class="btns"><button class="ok" id="setOk" type="button">확인</button></div>
</dialog>

<script>
"use strict";
/* ====== 기본 설정 ====== */
const CATS = ["수업","업무","개인","기타"];
const CAT_COLOR = {"수업":"#2563eb","업무":"#059669","개인":"#ea580c","기타":"#6b7280"};
const LS = {fav:"drawer.fav", recent:"drawer.recent", mine:"drawer.mine", closeAfter:"drawer.closeAfter", sized:"drawer.sized"};
const RECENT_MAX = 3;     // 최근 사용 표시 개수
const MAX_ITEMS = 500;    // 가져오기 때 최대 개수 (안전장치)

/* ====== 저장소 도우미 (실패해도 앱이 멈추지 않게) ====== */
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast("⚠ 저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요."); } }

/* ====== 상태 ====== */
let mine = load(LS.mine, []);                 // 내가 넣은 사이트 (이 컴퓨터에만 저장)
if(!Array.isArray(mine)) mine = [];
let fav = new Set(load(LS.fav, []));
let recent = load(LS.recent, []);
if(!Array.isArray(recent)) recent = [];
let closeAfter = load(LS.closeAfter, false);
let tab = "전체";
let q = "";
let editIdx = -1;                             // -1 이면 '추가', 0 이상이면 '수정'

/* ====== 유틸 ====== */
const $ = id => document.getElementById(id);
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2400); }
function safeUrl(u){
  u = String(u||"").trim();
  if(!u) return "";
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u;   // 주소 앞에 https:// 자동 보충
  try{ const p = new URL(u); return (p.protocol === "http:" || p.protocol === "https:") ? p.href : ""; }catch(e){ return ""; }
}
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; } }
function normalize(o, idx){
  const url = safeUrl(o["주소"]);
  const name = String(o["이름"] || (url ? hostOf(url) : "이름없음")).trim();
  return {
    id: "m:" + url, idx, url, name,
    cat: CATS.includes(o["분류"]) ? o["분류"] : "기타",
    icon: String(o["아이콘"] || "").trim()
  };
}
function allItems(){ return mine.map((o, i) => normalize(o, i)).filter(it => it.url); }

/* ====== 동작 ====== */
function openItem(it){
  recent = [it.id].concat(recent.filter(x => x !== it.id)).slice(0, RECENT_MAX);
  save(LS.recent, recent);
  window.open(it.url, "_blank", "noopener");
  if(closeAfter && window.matchMedia("(display-mode: standalone)").matches){
    setTimeout(() => { try{ window.close(); }catch(e){} }, 200);
  }
  render();
}
function toggleFav(it){
  if(fav.has(it.id)) fav.delete(it.id); else fav.add(it.id);
  save(LS.fav, Array.from(fav));
  render();
}
function removeItem(it){
  if(!confirm("'" + it.name + "' 을(를) 서랍에서 뺄까요?")) return;
  mine.splice(it.idx, 1);
  fav.delete(it.id);
  recent = recent.filter(x => x !== it.id);
  save(LS.mine, mine); save(LS.fav, Array.from(fav)); save(LS.recent, recent);
  render(); toast("뺐습니다.");
}
function openForm(it){
  editIdx = it ? it.idx : -1;
  $("addTitle").textContent = it ? "✎ 사이트 수정" : "＋ 사이트 추가";
  $("addOk").textContent = it ? "저장" : "추가";
  $("fUrl").value = it ? it.url : "";
  $("fName").value = it ? (mine[it.idx]["이름"] || "") : "";
  $("fIcon").value = it ? it.icon : "";
  $("fCat").value = it ? it.cat : "기타";
  $("dlgAdd").showModal(); $("fUrl").focus();
}

/* ====== 화면 그리기 ====== */
function makeRow(it){
  const r = el("div", "row");
  r.tabIndex = 0; r.setAttribute("role", "button");
  r.title = it.url;
  const ic = el("div", "ic", it.icon || Array.from(it.name)[0] || "?");
  ic.style.background = CAT_COLOR[it.cat];
  const info = el("div", "info");
  info.appendChild(el("div", "name", it.name));
  info.appendChild(el("div", "desc", hostOf(it.url)));
  r.appendChild(ic); r.appendChild(info);

  const st = el("button", "star" + (fav.has(it.id) ? " on" : ""), fav.has(it.id) ? "★" : "☆");
  st.type = "button"; st.setAttribute("aria-label", "즐겨찾기"); st.title = "즐겨찾기";
  st.addEventListener("click", e => { e.stopPropagation(); toggleFav(it); });
  const ed = el("button", "del", "✎");
  ed.type = "button"; ed.setAttribute("aria-label", "수정"); ed.title = "수정";
  ed.addEventListener("click", e => { e.stopPropagation(); openForm(it); });
  const de = el("button", "del", "✕");
  de.type = "button"; de.setAttribute("aria-label", "빼기"); de.title = "서랍에서 빼기";
  de.addEventListener("click", e => { e.stopPropagation(); removeItem(it); });
  r.appendChild(st); r.appendChild(ed); r.appendChild(de);

  r.addEventListener("click", () => openItem(it));
  r.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openItem(it); } });
  return r;
}
function matches(it){
  if(!q) return true;
  return (it.name + " " + it.url).toLowerCase().includes(q.toLowerCase());
}
function renderTabs(items){
  const box = $("tabs"); box.textContent = "";
  const names = ["전체", "⭐ 즐겨찾기"].concat(CATS.filter(c => items.some(i => i.cat === c)));
  names.forEach(n => {
    const key = n === "⭐ 즐겨찾기" ? "즐겨찾기" : n;
    const b = el("button", "chip" + (tab === key ? " on" : ""), n);
    b.type = "button";
    b.addEventListener("click", () => { tab = key; render(); });
    box.appendChild(b);
  });
}
function emptyMsg(text){
  const d = el("div", "empty", text); d.style.whiteSpace = "pre-line"; return d;
}
function render(){
  const items = allItems();
  if(tab !== "전체" && tab !== "즐겨찾기" && !items.some(i => i.cat === tab)) tab = "전체";
  renderTabs(items);
  const box = $("list"); box.textContent = "";
  $("qclear").style.display = q ? "block" : "none";

  if(!items.length){
    box.appendChild(emptyMsg("🗄️ 서랍이 비어 있습니다.\n\n아래 ＋ 추가 버튼을 눌러\n자주 가는 사이트의 주소를 넣어 보세요."));
    return;
  }
  let pool = items.filter(matches);
  if(tab === "즐겨찾기") pool = pool.filter(i => fav.has(i.id));
  else if(tab !== "전체") pool = pool.filter(i => i.cat === tab);

  if(!pool.length){
    box.appendChild(emptyMsg(tab === "즐겨찾기" && !q ? "⭐ 즐겨찾기가 비어 있습니다.\n항목 오른쪽의 ☆ 를 눌러 보세요." : "검색 결과가 없습니다."));
    return;
  }
  if(tab === "전체" && !q){
    const fv = pool.filter(i => fav.has(i.id));
    if(fv.length){ box.appendChild(el("div", "sec", "⭐ 즐겨찾기")); fv.forEach(i => box.appendChild(makeRow(i))); }
    const rc = recent.map(id => pool.find(i => i.id === id)).filter(Boolean);
    if(rc.length){ box.appendChild(el("div", "sec", "🕘 최근 사용")); rc.forEach(i => box.appendChild(makeRow(i))); }
    CATS.forEach(c => {
      const g = pool.filter(i => i.cat === c);
      if(!g.length) return;
      box.appendChild(el("div", "sec", c + " (" + g.length + ")"));
      g.forEach(i => box.appendChild(makeRow(i)));
    });
  }else{
    box.appendChild(el("div", "sec", pool.length + "개"));
    pool.forEach(i => box.appendChild(makeRow(i)));
  }
}

/* ====== 검색 ====== */
$("q").addEventListener("input", e => { q = e.target.value; render(); });
$("q").addEventListener("keydown", e => {
  if(e.key === "Enter"){ const first = $("list").querySelector(".row"); if(first) first.click(); }
  if(e.key === "Escape"){ q = ""; e.target.value = ""; render(); }
});
$("qclear").addEventListener("click", () => { q = ""; $("q").value = ""; render(); $("q").focus(); });
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("q") && !document.querySelector("dialog[open]")){ e.preventDefault(); $("q").focus(); }
});

/* ====== 추가 · 수정 ====== */
CATS.forEach(c => { const o = el("option", "", c); o.value = c; $("fCat").appendChild(o); });
$("btnAdd").addEventListener("click", () => openForm(null));
$("addCancel").addEventListener("click", () => $("dlgAdd").close());
$("addOk").addEventListener("click", () => {
  const url = safeUrl($("fUrl").value);
  if(!url){ toast("올바른 주소를 입력해 주세요. (예: https://example.com)"); return; }
  if(mine.some((o, i) => i !== editIdx && safeUrl(o["주소"]) === url)){ toast("이미 들어 있는 주소입니다."); return; }
  const obj = {"이름": $("fName").value.trim(), "주소": url, "분류": $("fCat").value, "아이콘": $("fIcon").value.trim()};
  if(editIdx >= 0){
    const oldId = "m:" + safeUrl(mine[editIdx]["주소"]);
    mine[editIdx] = obj;
    if(oldId !== "m:" + url){
      if(fav.has(oldId)){ fav.delete(oldId); fav.add("m:" + url); }
      recent = recent.map(x => x === oldId ? "m:" + url : x);
      save(LS.fav, Array.from(fav)); save(LS.recent, recent);
    }
  }else{
    mine.push(obj);
  }
  save(LS.mine, mine);
  $("dlgAdd").close(); tab = "전체"; render();
  toast(editIdx >= 0 ? "저장했습니다." : "넣었습니다.");
});

/* ====== 설정 · 백업 ====== */
$("btnSet").addEventListener("click", () => { $("optClose").checked = !!closeAfter; $("dlgSet").showModal(); });
$("setOk").addEventListener("click", () => {
  closeAfter = $("optClose").checked; save(LS.closeAfter, closeAfter);
  $("dlgSet").close();
});
$("btnExport").addEventListener("click", () => {
  const data = {app: "도디쌤서랍", version: 1, mine: mine, fav: Array.from(fav)};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "도디쌤서랍-백업.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("백업 파일을 저장했습니다.");
});
$("btnImport").addEventListener("click", () => $("fileImport").click());
$("fileImport").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(String(rd.result));
      if(!data || !Array.isArray(data.mine)) throw new Error("형식 오류");
      let added = 0;
      data.mine.slice(0, MAX_ITEMS).forEach(o => {
        if(!o || typeof o !== "object") return;
        const url = safeUrl(o["주소"]);
        if(!url || mine.some(x => safeUrl(x["주소"]) === url)) return;
        mine.push({"이름": String(o["이름"] || "").trim().slice(0, 60), "주소": url, "분류": CATS.includes(o["분류"]) ? o["분류"] : "기타", "아이콘": String(o["아이콘"] || "").trim().slice(0, 4)});
        added++;
      });
      if(Array.isArray(data.fav)) data.fav.forEach(x => { if(typeof x === "string" && x.startsWith("m:")) fav.add(x); });
      save(LS.mine, mine); save(LS.fav, Array.from(fav));
      $("dlgSet").close(); tab = "전체"; render();
      toast("백업에서 " + added + "개를 불러왔습니다.");
    }catch(err){
      toast("⚠ 백업 파일을 읽을 수 없습니다. 서랍에서 저장한 백업 파일인지 확인해 주세요.");
    }
  };
  rd.readAsText(f);
});

/* ====== 시작 ====== */
render();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}   // 브라우저가 내 목록을 함부로 지우지 않도록 요청

/* 설치형 앱으로 처음 열렸을 때 작은 창으로 한 번만 줄이기 (지원 안 하면 조용히 무시) */
try{
  if(window.matchMedia("(display-mode: standalone)").matches && !load(LS.sized, false)){
    window.resizeTo(420, 720); save(LS.sized, true);
  }
}catch(e){}

/* 서비스워커 등록 (설치 가능 + 오프라인 대비) */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
