<style>/* 업무파탈 style.css — 프랑스 신문 1면 느낌: 종이색 바탕 · 먹색 글자 · 보르도 한 가지 포인트 */
:root{--paper:#F2EBDD;--ink:#1B1613;--red:#6E1423;--mu:#5F564D;--rule:#CFC4B0;--rule2:#E3D9C6;--pl:#FBF7EE;
--serif:'Playfair Display','Noto Serif KR','Nanum Myeongjo','Batang',serif;--sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--ink)}a:hover{color:var(--red)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mu{color:var(--mu);font-size:13px}.hot{color:var(--red)}.hot2{color:var(--red)}.r{text-align:right}
#app{max-width:1100px;margin:0 auto;padding:28px 40px 120px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mast{border-top:4px solid var(--ink);border-bottom:1px solid var(--ink);padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.mast1{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
h1{margin:0;font-family:var(--serif);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.02em}
.fr{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;color:var(--red)}
.mast2{text-align:right;font-size:13px;color:var(--mu)}.dt{font-family:'Playfair Display',serif;font-size:15px;letter-spacing:.12em;color:var(--ink)}
.nav{display:flex;gap:4px 22px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--ink);font-size:14px}
.nav a{text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}.nav a[aria-current]{border-bottom-color:var(--red);font-weight:700}
main{padding-top:6px}
.bh{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px;flex-wrap:wrap;gap:6px}
h2{margin:0;font-family:var(--serif);font-size:24px}.h3{font-family:var(--serif);font-size:19px;margin:26px 0 8px;padding-top:10px;border-top:1px solid var(--ink)}
/* 게시판 줄 */
.cols,.row>summary{display:grid;grid-template-columns:56px minmax(120px,.9fr) minmax(200px,1.7fr) 100px 14px;gap:6px 16px;align-items:center}
.cols{padding:8px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-size:12px;color:var(--mu);letter-spacing:.06em}
.row{border-bottom:1px solid var(--rule)}
.row>summary{padding:14px 0;cursor:pointer;list-style:none}.row>summary::-webkit-details-marker{display:none}
.cat{font-size:12px;color:var(--red);letter-spacing:.06em}.ttl{font-family:var(--serif);font-size:17px;font-weight:700}.st{font-size:14px}.due{text-align:right;font-size:13px;color:var(--mu)}
.chev{width:8px;height:8px;border-right:1.6px solid var(--ink);border-bottom:1.6px solid var(--ink);transform:rotate(45deg);transition:transform .15s;margin-top:-4px}
.row[open] .chev{transform:rotate(225deg);margin-top:4px}
.rb{padding:2px 0 18px}
.num{font-family:'Playfair Display',serif;font-size:17px}
.soon{margin:18px 0;font-size:13px;color:var(--mu)}.soon b{color:var(--red);margin-right:6px}
/* 단추·입력 */
.btn{background:transparent;border:1px solid var(--ink);padding:7px 14px;text-decoration:none;display:inline-block;font-size:13px;margin:6px 6px 0 0;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--paper)}.btn.sm{padding:4px 10px;font-size:12px}.btn.pri{background:var(--red);border-color:var(--red);color:var(--paper)}
.x{background:none;border:0;font-size:12px;color:var(--mu);text-decoration:underline;padding:2px 6px}.x:hover{color:var(--red)}
.file{cursor:pointer}
input,select,textarea{background:var(--pl);border:1px solid var(--ink);padding:8px 10px;border-radius:0;max-width:100%}
textarea{width:100%;resize:vertical}label{display:block;font-size:13px;color:var(--mu);margin:10px 0}label input,label select,label textarea{display:block;width:100%;margin-top:4px;color:var(--ink);font-size:15px}
.inl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.inl input[name=title]{flex:1 1 200px}.inl .btn{margin:0}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:10px 0}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}.chk input{width:auto;margin:4px 0 0}
.fm{max-width:520px}.hides{display:flex;flex-wrap:wrap;gap:4px 24px}
/* 할 일·진도·평가 */
.td,.tr{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--rule2)}.tl{flex:1}
.ck{flex:none;width:20px;height:20px;border:1.5px solid var(--ink);background:transparent;padding:0}.ck[aria-pressed=true]{background:var(--ink)}.ck.off{opacity:.3}
.dn .tl{color:#8B8174;text-decoration:line-through}
.stamp{opacity:0;font-size:12px;letter-spacing:.1em;color:var(--red);border:1.5px solid var(--red);padding:1px 8px;transform:rotate(-5deg)}.dn .stamp{opacity:1}
.late{color:var(--red);font-size:12px}
.stp{display:flex;align-items:center;gap:12px;padding:6px 0}.stp span{width:130px}.stp .btn{margin:0}
.ls{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--rule2);flex-wrap:wrap}.lc{width:36px;font-weight:700}.lu{width:110px;color:var(--mu);font-size:13px}.ls .bar{flex:1 1 120px}.ls .btn{margin:0}
.bar{height:3px;background:#D9CFBC}.bar i{display:block;height:3px;background:var(--ink)}.bar i.hot{background:var(--red)}
.strip{display:flex;flex-wrap:wrap;gap:8px}.pc{flex:1 1 90px;padding:10px;border:1px solid var(--rule);font-size:13px;color:var(--mu)}.pc b{display:block;font-family:'Playfair Display',serif;font-size:20px;color:var(--ink)}.pc.now{background:var(--red);border-color:var(--red);color:var(--paper)}.pc.now b{color:var(--paper)}
.as{padding:10px 0;border-top:1px solid var(--rule2)}.steps{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.stp1{background:transparent;border:1px solid var(--rule);padding:4px 12px;font-size:13px;color:var(--mu)}.stp1.past{border-color:var(--ink);color:var(--ink)}.stp1.on{border-color:var(--red);color:var(--red);border-bottom:3px solid var(--red);font-weight:700}
.nl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--rule2)}.bp{padding:6px 0;border-top:1px solid var(--rule2)}
/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}.tbl th{font-weight:500;color:var(--mu);font-size:12px;text-align:left;padding:6px 6px;border-bottom:1px solid var(--ink)}.tbl th.r{text-align:right}
.tbl td{padding:8px 6px;border-top:1px solid var(--rule2);vertical-align:top}.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}.tbl .act{white-space:nowrap;text-align:right}
.tbl tr.sp td{color:var(--mu);font-size:12px}.tbl tr.tot td{border-top:1px solid var(--ink);font-weight:700}.tbl tr.mine td{background:#EFE3D2}
.tt td{padding:2px}.tt input{width:100%;border:1px solid var(--rule);padding:6px;font-size:13px}.tt th:first-child{width:28px}
.sum{display:flex;gap:24px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}.sum span{display:block;font-size:12px;color:var(--mu)}.sum b{font-size:24px}
.bkh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.bkh .h3{margin-right:auto}
.srch{width:100%;max-width:360px;margin-bottom:6px}
.doc{border-top:1px solid var(--rule2);padding:8px 0}.doc pre{white-space:pre-wrap;font-family:var(--sans);font-size:12px;background:var(--pl);padding:10px;max-height:240px;overflow:auto}
/* 캘린더 */
.calh{display:flex;align-items:center;gap:10px}.calh .btn{margin:0}.calt{font-family:var(--serif);font-size:20px;min-width:130px;text-align:center}
.calw,.cal{display:grid;grid-template-columns:repeat(7,1fr)}.calw span{font-size:12px;color:var(--mu);padding:8px 4px;border-bottom:1px solid var(--ink)}
.cd{min-height:78px;border:0;border-bottom:1px solid var(--rule2);border-right:1px solid var(--rule2);background:transparent;text-align:left;padding:4px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cd.e{cursor:default}.cd .n{font-size:13px}.cd small{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--red)}.cd small.dn{color:#8B8174;text-decoration:line-through}
.cd.tdy .n{background:var(--red);color:var(--paper);width:22px;text-align:center;border-radius:50%}.cd.sel{background:var(--pl);outline:1px solid var(--ink)}
/* 기록 */
.nwrap{display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:22px;align-items:start}
.nlist{display:flex;flex-direction:column;border-right:1px solid var(--rule);padding-right:12px}.nlist a{text-decoration:none;padding:8px 0;border-bottom:1px solid var(--rule2);display:flex;flex-direction:column}.nlist a.on b{color:var(--red)}.nlist .btn{margin:0 0 8px}
.nh{display:flex;gap:8px;flex-wrap:wrap}.nh input[data-note=title]{flex:1 1 220px;font-family:var(--serif);font-size:18px}
.tabs{display:flex;gap:0;margin:12px 0 0;border-bottom:1px solid var(--ink)}.tab{background:none;border:0;padding:8px 16px;font-size:14px;border-bottom:3px solid transparent}.tab.on{border-bottom-color:var(--red);font-weight:700}
#nbody{margin-top:10px;min-height:340px}
#ink{width:100%;background:var(--pl);border:1px solid var(--ink);touch-action:none;display:block;margin-top:8px;cursor:crosshair}.inkbar{margin-top:8px}
.npan{border-left:1px solid var(--rule);padding-left:18px}.npan .h3{margin-top:0;border:0;padding:0}
/* 환영·설정 */
.wel{max-width:520px;margin:60px auto;padding:0 20px;border-top:4px solid var(--ink)}.wel h1{margin-top:24px}.wel .fr{margin-bottom:12px}
.mas{width:72px;height:72px;border:1px dashed var(--red);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--red);overflow:hidden;border-radius:50%}.mas img{width:100%;height:100%;object-fit:cover}
.drawer{margin-top:34px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:12px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}.drawer b{font-family:var(--serif);font-size:18px}.sl{color:#B7AC98;margin:0 -4px}.drawer .btn{margin:0}
.cp{text-align:center;font-size:11px;color:var(--mu);margin:18px 0}
/* 대화상자·알림 */
.dlg{border:1px solid var(--ink);background:var(--paper);padding:20px;width:min(420px,92vw);color:var(--ink)}.dlg.wide{width:min(640px,94vw);max-height:90vh;overflow:auto}.dlg::backdrop{background:rgba(27,22,19,.45)}
.dlg h3{margin:0 0 6px;font-family:var(--serif)}.btns{display:flex;flex-direction:row;gap:8px;margin-top:14px}.btns button{padding:8px 16px;border:1px solid var(--ink);background:transparent}.btns .pri{background:var(--red);border-color:var(--red);color:var(--paper)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}#toast.show{opacity:1;transform:translate(-50%,0)}
/* 꿈송이 */
#chatfab{position:fixed;right:20px;bottom:20px;width:68px;height:68px;border-radius:50%;background:var(--red);color:var(--paper);border:3px double var(--paper);outline:2px solid var(--red);font-family:var(--serif);font-size:13px;font-weight:700;padding:0;overflow:hidden;z-index:30}#chatfab img{width:100%;height:100%;object-fit:cover}
#chatpan{position:fixed;right:20px;bottom:100px;width:380px;max-width:calc(100vw - 24px);height:min(560px,calc(100vh - 130px));background:var(--paper);border:1px solid var(--ink);display:flex;flex-direction:column;z-index:30;box-shadow:6px 6px 0 rgba(27,22,19,.18)}#chatpan[hidden]{display:none}
.ch-h{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ink)}.ch-h div{flex:1;display:flex;flex-direction:column;font-family:var(--serif)}.ch-h .mu{font-family:var(--sans)}
.ch-face{width:42px;height:42px;border-radius:50%;border:1px dashed var(--red);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--red);text-align:center;line-height:1.2;flex:none}.ch-face img{width:100%;height:100%;object-fit:cover}.ch-face i{font-style:normal}

.me{align-self:flex-end;background:var(--rule2);padding:8px 10px;max-width:85%}.bot p{margin:0 0 6px}

/* ===== 디자인 틀 50가지: html[data-*] 속성으로 모양을 바꿉니다 ===== */
html{--rr:12px}
html[data-round="0"]{--rr:0px}html[data-round="6"]{--rr:6px}html[data-round="12"]{--rr:12px}html[data-round="18"]{--rr:22px}

/* 책상 무늬 */
html[data-bg=none] body{background:var(--desk)}

html[data-page=notebook] #app{padding-left:64px;border-radius:6px calc(var(--rr)*1.4) calc(var(--rr)*1.4) 6px;background:linear-gradient(90deg,transparent 44px,var(--margin) 44px,var(--margin) 46px,transparent 46px),var(--paper2)}
html[data-page=sheet] #app{background:var(--paper2);padding:28px 40px 70px;border-radius:var(--rr)}html[data-page=sheet] #app::after{display:block}
html[data-page=plain] #app{background:transparent;box-shadow:none;border-radius:0;margin:0 auto;padding:24px 36px 100px;max-width:1100px}
html[data-page=full] #app{background:transparent;box-shadow:none;border-radius:0;margin:0;padding:24px 28px 100px;max-width:none;min-height:100vh}
html[data-page=card] #app{background:var(--paper2);padding:28px 40px 70px;border-radius:calc(var(--rr)*1.6);box-shadow:0 14px 40px rgba(0,0,0,.35)}
html[data-page=window] #app{background:var(--paper2);padding:58px 40px 70px;border:2px solid #1b1b1b;border-radius:var(--rr);box-shadow:6px 8px 0 rgba(0,0,0,.35)}
html[data-page=window] #app::before{display:block;content:"";position:absolute;left:0;right:0;top:0;bottom:auto;width:auto;height:38px;border-radius:calc(var(--rr) - 2px) calc(var(--rr) - 2px) 0 0;background:radial-gradient(circle at 20px 19px,#ff5f57 6px,transparent 7px),radial-gradient(circle at 42px 19px,#febc2e 6px,transparent 7px),radial-gradient(circle at 64px 19px,#28c840 6px,transparent 7px),color-mix(in srgb,var(--ink) 12%,var(--paper2));border-bottom:1px solid #1b1b1b}
html[data-page=steno] #app{background:var(--paper2);padding:54px 40px 70px;border-radius:var(--rr)}
html[data-page=steno] #app::before{display:block;content:"";position:absolute;left:0;right:0;top:-9px;bottom:auto;width:auto;height:30px;background:radial-gradient(circle at 14px 14px,#222 0 5px,#9a9a9a 6px 8px,transparent 9px) 0 0/34px 30px repeat-x}
html:not([data-page=notebook]):not([data-page=sheet]) #app::after{display:none}
/* 메뉴 모양 */
html[data-nav=bar] .nav{gap:2px;border-bottom:1px solid var(--rule)}html[data-nav=bar] .nav a{background:transparent!important;border:0;border-bottom:3px solid transparent;border-radius:0;top:0;padding:9px 14px}html[data-nav=bar] .nav a[aria-current=page]{border-bottom-color:var(--cover);box-shadow:none;background:transparent!important}
html[data-nav=pills] .nav a{background:color-mix(in srgb,var(--cover) 12%,var(--card2))!important;border:0;border-radius:999px;top:0;margin:6px 2px 8px;padding:7px 17px}html[data-nav=pills] .nav a[aria-current=page]{background:var(--cover)!important;color:var(--paper2)!important;box-shadow:none;padding-top:7px}
html[data-nav=box] .nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));border:2px solid var(--ink);gap:0;margin:10px 0}html[data-nav=box] .nav a{border:0;border-right:1px solid var(--ink);border-radius:0;background:var(--card2)!important;text-align:center;top:0;padding:10px 6px}html[data-nav=box] .nav a[aria-current=page]{background:var(--ink)!important;color:var(--paper2)!important;box-shadow:none;padding-top:10px}
html[data-nav=dots] .nav{gap:0;justify-content:center}html[data-nav=dots] .nav a{background:none!important;border:0;border-radius:0;top:0;padding:7px 10px}html[data-nav=dots] .nav a+a::before{content:"·";margin-right:18px;opacity:.5}html[data-nav=dots] .nav a[aria-current=page]{box-shadow:none;border-bottom:3px solid var(--cover);padding-top:7px}
html[data-nav=left] #app,html[data-nav=right] #app{display:grid;grid-template-columns:210px minmax(0,1fr);column-gap:30px;align-items:start}
html[data-nav=right] #app{grid-template-columns:minmax(0,1fr) 210px}

html[data-nav=left] .nav,html[data-nav=right] .nav{flex-direction:column;align-items:stretch;position:sticky;top:12px;gap:6px;margin:6px 0 0}

/* ===== 제목·부제·항목 위계 (맨 마지막. 큰제목 > 부제 > 항목 제목 > 항목 설명 순으로 한눈에 구분) ===== */
/* 1) 쪽 큰제목: 크고 굵게, 아래에 진한 줄 */
.bh{border-bottom:3px solid var(--ink);padding-bottom:10px;margin:26px 0 14px;align-items:center}
.bh h2{font-weight:800;font-size:calc(44px*var(--hs));line-height:1.15;color:var(--ink);flex:1 1 auto}
/* 2) 부제: 큰제목 바로 아래 한 줄을 통째로 차지, 색 띠로 눈에 띄게 */
.bh>.mu{order:3;flex:0 0 100%;font-size:17px;font-weight:500;color:var(--ink)!important;background:color-mix(in srgb,var(--cover) 9%,#fff);border-left:5px solid var(--cover);padding:6px 12px;border-radius:0 6px 6px 0}
.bh .btn.sm{order:2}
/* 3) 소제목: 왼쪽 굵은 막대 + 굵은 글씨 */
.h3,h3.h3{font-weight:800;font-size:calc(30px*var(--hs));line-height:1.25;color:var(--ink);border-top:0;border-left:8px solid var(--cover);padding:2px 0 2px 12px;margin:30px 0 12px}
/* 4) 게시판 줄: 분류 = 색 알약, 제목 = 크고 굵게, 설명 = 작고 보통 굵기 */
.row{border-left:6px solid var(--cover)}
.row>summary{grid-template-columns:76px minmax(170px,1fr) minmax(200px,1.5fr) 100px 14px}
.cat{justify-self:start;background:var(--cover);color:#fff;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;line-height:1.5;white-space:nowrap}
.row .ttl,.ttl{font-size:22px;font-weight:800;line-height:1.3}
.row .st,.st{font-size:17px;font-weight:400;color:color-mix(in srgb,var(--ink) 78%,var(--paper2))}
.row[open]>summary{border-bottom:2px solid var(--cover);margin-bottom:10px}
/* 5) 큰제목 바로 아래 흐릿한 설명이 되던 .mu 는 그대로 두고, 표 머리글만 진하게 */
.tbl th,.cols{color:var(--ink);font-weight:700}

*/
window.TF_FIREBASE = null;

'use strict';
/* ===== 업무파탈 core.js : 공통 도구 · 저장소 · 대화상자 ===== */
const $ = (s, e = document) => e.querySelector(s);
const $$ = (s, e = document) => [...e.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const won = n => Number(n || 0).toLocaleString('ko-KR');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const dd = s => { if (!s) return null; const a = new Date(s + 'T00:00:00'), b = new Date(today() + 'T00:00:00'); return Math.round((a - b) / 864e5); };
const ddText = n => n === null ? '' : n === 0 ? '오늘' : n > 0 ? 'D-' + n : 'D+' + (-n);

/* ---- 큰 자료(필기 그림, 업로드 문서, 꿈송이 사진)는 IndexedDB, 막히면 메모리 ---- */
const mem = new Map();
const idb = {
  p: null,
  open() {
    if (this.p) return this.p;
    this.p = new Promise((res, rej) => {
      try {
        const r = indexedDB.open(window.TF_DEMO ? 'travailfatal-demo' : 'travailfatal', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return this.p;
  },
  async get(k) {
    try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); }
    catch (e) { return mem.get(k); }
  },
  async set(k, v) {
    try { const db = await this.open(); await new Promise((res, rej) => { const q = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); q.onsuccess = res; q.onerror = () => rej(q.error); }); }
    catch (e) { mem.set(k, v); }
  },
  async del(k) {
    try { const db = await this.open(); await new Promise(res => { const q = db.transaction('kv', 'readwrite').objectStore('kv').delete(k); q.onsuccess = res; q.onerror = res; }); }
    catch (e) { mem.delete(k); }
  }
};

  { const dn = ['', '월', '화', '수', '목', '금'];

  add('profile', '내 정보', `이름 ${S.profile.name} 학교 ${S.profile.school} 교과 ${S.profile.subject} 담당 반 ${S.profile.classes.join(', ')} 1교시 시작 ${S.profile.start} 개발 연수 목표 ${S.profile.devTarget}시간`, '#/set');

    (l.spends || []).forEach(s => add('budget', `예산 · ${p.name} · ${l.item} 지출`, `${s.date} ${s.desc} ${won(s.amt)}원 (${p.name} ${l.item})`, '#/budget'));

  S.pages.forEach(pg => {
    const lines = (pg.blocks || []).map(b => b.t === 'table' ? (b.rows || []).map(r => r.join(' | ')).join('\n') : b.t === 'todo' ? (b.done ? '[완료] ' : '[할 일] ') + b.x : b.t === 'toggle' ? b.x + ' ' + (b.y || '') : b.t === 'link' ? b.x + ' ' + (b.u || '') : b.t === 'ref' ? '연결: ' + ((resolve(b.u) || {}).label || '') : b.x || '').filter(x => String(x).trim());
    (pg.links || []).forEach(k => { const r = resolve(k); if (r) lines.push('연결: ' + r.label); });

    lines.forEach(l => { if ((buf + ' ' + l).length > 380) flush(); buf += (buf ? '\n' : '') + l; }); flush();
    if (!lines.length) add('page', '내 페이지', pg.title || '제목 없음', '#/page/' + pg.id, pg.lock);
  });
  S.links.forEach(l => add('link', '서랍', `${l.name} ${l.url}`, l.url));
  LIB.forEach(d => {
    const pages = d.text.split('\f');

/* 2) 말투가 엉망이어도 찾도록: 글자 두 개씩 끊어 비교 + 비슷한 말 + 의도 파악 */
const SYN = {
  '돈': ['예산', '금액', '집행', '잔액'], '쓰는': ['집행', '사용'], '비용': ['예산', '집행'], '얼마': ['금액', '잔액'],
  '누가': ['담당', '업무'], '누구': ['담당', '업무'], '맡': ['담당'], '전화': ['내선', '연락'], '번호': ['내선', '전화'], '연락': ['내선', '전화'],
  '회의': ['회의록', '협의', '결정'], '언제': ['기한', '마감', '일정'], '까지': ['기한', '마감'], '마감': ['기한'], '숙제': ['할 일', '제출'],
  '체육관': ['강당', '체육'], '시험': ['평가', '지필', '수행'], '수행': ['평가'], '연수': ['이수', '시간'], '출장': ['복명', '여비'], '결시': ['미인정', '인정', '결석'],
  '진도': ['차시', '단원'], '평가': ['수행', '성적']
};
const STOP = new Set(['했더', '더라', '라고', '다고', '는지', '있나', '있어', '어디', '뭐였', '였더', '한테', '에서', '에게', '해줘', '알려', '려줘', '주세', '세요', '무엇', '어떻', '떻게', '입니', '니다', '이랑', '하는', '하고', '그거', '저번', '지난', '이번', '어떤', '였지', '했지', '였나', '한다', '된다', '있는', '없는', '알아']);
const norm = s => String(s).toLowerCase().replace(/[^0-9a-z가-힣]/g, '');
function grams(s) { const n = norm(s), g = new Set(); for (let i = 0; i < n.length - 1; i++) { const b = n.slice(i, i + 2); if (!STOP.has(b)) g.add(b); } return g; }

function intent(q) {
  const t = new Set();
  if (/누가|누구|담당|맡|분장/.test(q)) { t.add('duty'); t.add('contact'); }
  if (/전화|번호|내선|연락/.test(q)) t.add('contact');
  if (/돈|예산|잔액|얼마|집행|비용|품의|결제/.test(q)) t.add('budget');
  if (/회의|결정|협의|말씀|얘기/.test(q)) t.add('note');
  if (/수행|평가|채점|시험/.test(q)) t.add('assess');
  if (/연수|이수/.test(q)) t.add('training');
  if (/시간표|교시|몇\s*교시|수업\s*시간/.test(q)) t.add('timetable');
  if (/공문/.test(q)) t.add('docs');
  if (/학사|방학|개학|행사|시험|입학|졸업/.test(q)) t.add('item');
  if (/진도|차시|단원/.test(q)) t.add('lesson');
  if (/규정|지침|복무|출장|결시|학칙|규칙/.test(q)) t.add('doc');
  return t;
}

function search(q, forLLM) {
  const all = buildChunks().filter(c => !(forLLM && c.priv));
  if (!all.length) return [];
  const qg = new Map();
  grams(q).forEach(g => qg.set(g, 1));
  const qn = norm(q);
  Object.keys(SYN).forEach(k => { if (qn.includes(k)) SYN[k].forEach(w => grams(w).forEach(g => { if (!qg.has(g)) qg.set(g, .6); })); });
  if (!qg.size) return [];
  const docs = all.map(c => ({ c, n: norm(c.src + c.text) }));
  const df = new Map(); qg.forEach((_, g) => df.set(g, docs.filter(d => d.n.includes(g)).length));
  const it = intent(q);
  let res = docs.map(d => {
    let s = 0, hit = 0;
    qg.forEach((w, g) => { if (d.n.includes(g)) { hit++; s += w * (Math.log(1 + docs.length / (1 + df.get(g)))); } });
    if (it.has(d.c.type)) s *= 1.6;
    return { c: d.c, s, hit };
  }).filter(r => r.hit >= 2 && r.s > 0).sort((a, b) => b.s - a.s);
  if (res.length) { const top = res[0].s; res = res.filter(r => r.s >= top * .35); }
  return res.slice(0, 5);
}

function snippet(text, q) {
  const gs = [...grams(q)];
  let pos = 0; for (const g of gs) { const i = norm(text).indexOf(g); if (i >= 0) { pos = i; break; } }
  let t = text.length > 200 ? text.slice(Math.max(0, pos - 40), pos + 160) + '…' : text;
  t = esc(t);
  return t;
}

/* 3) 바로 계산해서 답할 수 있는 질문(잔액, 마감, 내 업무) */
function direct(q) {
  const out = [];
  if (/잔액|남은\s*(돈|예산)|얼마\s*(남|썼)|예산\s*(현황|얼마)/.test(q)) {
    const t = btot();
    if (S.budget.length) out.push({ src: '예산 장부(계산)', text: `전체 배정 ${won(t.a)}원 · 집행 ${won(t.s)}원 · 잔액 ${won(t.b)}원 (집행 ${t.a ? Math.round(t.s / t.a * 100) : 0}%)`, ref: '#/budget' });
  }
  if (/급식|점심|중식|석식|메뉴|밥/.test(q) && typeof mealFor === 'function') {
    const k = /모레/.test(q) ? 2 : /내일/.test(q) ? 1 : 0, d = new Date(Date.now() + k * 864e5), ds = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), m = mealFor(ds);
    out.push({ src: '급식 · ' + md(ds), text: m.length ? m.map(x => `${x.kind}: ${x.dishes.map(cleanDish).join(', ')} ${x.kcal || ''}`).join(' / ') : `${md(ds)}에는 급식 자료가 없습니다(주말·방학이거나 아직 받지 못함).`, ref: '#/' });
  }
  if (/마감|기한|급한|다가오|이번\s*주/.test(q)) {
    const ev = upcoming(14);
    if (ev.length) out.push({ src: '일정(계산)', text: '14일 안의 기한: ' + ev.slice(0, 6).map(e => `${md(e.date)} ${e.t}(${ddText(dd(e.date))})`).join(' / '), ref: '#/cal' });
  }
  if (/이수\s*번호|이수증|연수.*(현황|목록|전부|모두|다)|들은\s*연수/.test(q)) {
    const T = S.training;
    if (T.length) out.push({ src: '연수 이수 현황(전체)', text: T.map(t => `${t.title}(${t.type} ${t.hours}시간): ${t.done ? '이수 · 번호 ' + (t.certNo || '미입력') + (t.doneDate ? ' · ' + t.doneDate : '') : '미이수' + (t.due ? ' · 기한 ' + t.due : '')}`).join('\n'), ref: '#/today' });
  }
  if (/오늘\s*(수업|시간표)|몇\s*교시|시간표/.test(q)) {
    const d = new Date().getDay(), l = d >= 1 && d <= 5 ? [1, 2, 3, 4, 5, 6, 7].map(p => `${p}교시 ${S.timetable[d + '-' + p] || '—'}`) : [];
    if (l.length && Object.keys(S.timetable).some(k => S.timetable[k])) out.push({ src: '시간표(오늘)', text: l.join(' / '), ref: '#/class' });
  }
  if (/(내|제|나의).*(업무|담당)|내가\s*맡/.test(q)) {
    const m = S.duties.filter(d => d.mine);
    const mm = S.mine || [];
    if (mm.length) out.push({ src: '내 업무', text: mm.map(x => `${x.cat}: ${x.title}${x.done ? '(완료)' : ''}`).join(' / '), ref: '#/' });
    else if (m.length) out.push({ src: '업무 분장표(내 업무)', text: m.map(d => `${d.dept}: ${d.work}`).join(' / '), ref: '#/lib' });
  }
  return out;
}

/* 4) 선택: Claude 키를 넣으면 찾은 조각만 보내서 문장으로 정리 */
async function askClaude(q, hits) {
  const key = localStorage.getItem('tf.claudeKey'); if (!key) return null;
  const ctx = hits.map((h, i) => `[${i + 1}] (${h.c.src}) ${h.c.text}`).join('\n');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-haiku-5-5', max_tokens: 700, system: '당신은 학교 교사의 업무 비서 꿈송이입니다. 아래 [자료] 안에서만 존댓말로 짧게 답하고, 근거 번호를 [1]처럼 붙이세요. 자료에 없으면 없다고 말하세요. 질문이 맞춤법·말투가 엉망이어도 의도를 파악하세요.', messages: [{ role: 'user', content: `질문: ${q}\n\n[자료]\n${ctx}` }] })
  });
  if (!r.ok) throw new Error('Claude 응답 오류 ' + r.status);
  const j = await r.json(); return (j.content || []).map(x => x.text || '').join('');
}

/* 5) 계획서·공문 글에서 '항목+금액+기한' 후보 뽑기 */
function extractBudget(text) {
  const out = [];
  const dateRe = /(20\d\d)[.\-/]\s?(\d{1,2})[.\-/]\s?(\d{1,2})|(\d{1,2})\s?월\s?(\d{1,2})\s?일|(\d{1,2})\/(\d{1,2})/;
  const yr = new Date().getFullYear();
  text.split(/\n|\f/).forEach(line => {
    const m = line.match(/([가-힣A-Za-z·\s()]{2,30}?)[\s:：|·\-]*([\d]{1,3}(?:,\d{3})+|\d{4,})\s*원?/);
    if (!m) return;
    const amt = +m[2].replace(/,/g, ''); if (amt < 1000) return;
    if (/(전화|연락|우편|번호)/.test(m[1])) return;
    let item = m[1].replace(/\s+/g, ' ').trim(); if (item.length < 2) return;
    let dl = ''; const d = line.match(dateRe);
    if (d) { if (d[1]) dl = `${d[1]}-${pad(d[2])}-${pad(d[3])}`; else if (d[4]) dl = `${yr}-${pad(d[4])}-${pad(d[5])}`; else if (+d[6] <= 12 && +d[7] <= 31) dl = `${yr}-${pad(d[6])}-${pad(d[7])}`; }
    out.push({ item, alloc: amt, deadline: dl, on: true });
  });
  return out.slice(0, 40);
}

/* 6) 학사일정 글에서 '날짜(또는 기간) + 행사 이름' 뽑기 — 연도가 없으면 학년도(3월~다음해 2월)로 추정 */
function schoolYearNow() { const n = new Date(); return n.getMonth() + 1 >= 3 ? n.getFullYear() : n.getFullYear() - 1; }
function extractSchedule(text, sy) {
  const yr = m => (m >= 3 ? sy : sy + 1), out = [];
  const W = '\\s*(?:\\([월화수목금토일]\\))?';
  const re = new RegExp('(?:(20\\d\\d)\\s*[.\\-/년]\\s*)?(\\d{1,2})\\s*[.\\-/월]\\s*(\\d{1,2})\\s*일?' + W + '(?:\\s*[~∼～–\\-]\\s*(?:(20\\d\\d)\\s*[.\\-/년]\\s*)?(?:(\\d{1,2})\\s*[.\\-/월]\\s*)?(\\d{1,2})\\s*일?' + W + ')?', 'g');
  const clean = s => s.replace(/[|]+/g, ' ').replace(/^[\s:：,.\-–·•○▪■※*)\]]+/, '').replace(/[\s,;]+$/, '').replace(/\s+[월화수목금토일]$/, '').replace(/\s+/g, ' ').trim();
  text.split(/\n|\f/).forEach(line => {
    line = line.trim(); if (!line) return;
    const ms = [...line.matchAll(re)].filter(m => +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31);
    ms.forEach((m, i) => {
      const next = ms[i + 1], seg = line.slice(m.index + m[0].length, next ? next.index : line.length);
      let title = clean(seg); if (!title && i === 0) title = clean(line.slice(0, m.index));
      if (title.length < 2 || /^[\d\s.]+$/.test(title)) return;
      const sm = +m[2], sd = +m[3], sY = m[1] ? +m[1] : yr(sm);
      const date = `${sY}-${pad(sm)}-${pad(sd)}`; let end = '';
      if (m[6]) { const em = m[5] ? +m[5] : sm, ed = +m[6]; if (em >= 1 && em <= 12 && ed >= 1 && ed <= 31) { const eY = m[4] ? +m[4] : (m[5] ? yr(em) : sY); end = `${eY}-${pad(em)}-${pad(ed)}`; if (end <= date) end = ''; } }
      out.push({ on: true, date, end, title: title.slice(0, 60), dup: false });
    });
  });
  return out.slice(0, 200);
}

/* ===== 업무파탈 sync.js : 선택 기능 · 구글 로그인으로 폰·태블릿·PC 동기화 =====
   firebase-config.js 에 내 파이어베이스 설정을 붙여 넣으면 켜지고, 비어 있으면 이 기기에만 저장됩니다.
   동기화 대상: 일정·예산·수업·평가·연수·업무분장·연락망·서랍·노트 글(잠금 노트와 손글씨 그림, 업로드 문서는 제외) */
(function () {
  const cfg = window.TF_FIREBASE;
  const info = { on: !!cfg, user: null, msg: cfg ? '로그인 전' : '꺼짐(이 기기에만 저장)' };
  let db, auth, unsub, timer, applying = false;
  const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';

  function payload() {
    const c = JSON.parse(JSON.stringify(S));
    c.notes = (c.notes || []).filter(n => !n.lock); c.pages = (c.pages || []).filter(n => !n.lock);
    return JSON.stringify(c);
  }
  async function start() {
    if (!cfg) return;
    await loadScript(FB + 'firebase-app-compat.js'); await loadScript(FB + 'firebase-auth-compat.js'); await loadScript(FB + 'firebase-firestore-compat.js');
    firebase.initializeApp(cfg); auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(u => {
      info.user = u; info.msg = u ? (u.email + ' 로그인됨') : '로그인 전';
      if (unsub) { unsub(); unsub = null; }
      if (u) unsub = db.collection('users').doc(u.uid).onSnapshot(snap => {
        if (!snap.exists) { push(true); return; }
        const d = snap.data(); if (!d || !d.state || (d.updatedAt || 0) <= (S.updatedAt || 0)) return;
        const remote = JSON.parse(d.state); const keep = (S.notes || []).filter(n => n.lock), keepP = (S.pages || []).filter(n => n.lock);
        applying = true; Object.assign(S, remote); S.notes = (remote.notes || []).concat(keep); S.pages = (remote.pages || []).concat(keepP); S.updatedAt = d.updatedAt; applying = false;
        save(true); TF.render && TF.render(); toast('다른 기기의 최신 내용을 불러왔습니다.');
      }, e => { info.msg = '동기화 오류: ' + e.message; });
      TF.render && TF.render();
    });
  }
  function push(now) {
    if (!db || !info.user || applying) return;
    clearTimeout(timer);
    timer = setTimeout(() => db.collection('users').doc(info.user.uid).set({ state: payload(), updatedAt: S.updatedAt }).catch(e => { info.msg = '저장 오류: ' + e.message; }), now ? 0 : 1500);
  }
  async function login() { if (!auth) return toast('동기화가 꺼져 있습니다. firebase-config.js 를 확인하세요.'); try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch (e) { toast('로그인 실패: ' + e.message); } }
  const logout = () => auth && auth.signOut();
  TF.sync = { info, push, login, logout, start };
})();

   읽는 순서: 맨 위 공통 계산 → 화면(오늘/캘린더/수업·평가/예산/기록/자료·연락/설정) → 동작(A) → 폼(FM) → 꿈송이 → 시작 */
const ASSESS_STEPS = ['계획', '안내', '수행', '채점', '입력', '확정'];

/* ---------- 공통 계산 ---------- */
function btot() { let a = 0, s = 0; S.budget.forEach(p => { a += projAlloc(p); s += projSpent(p); }); return { a, s, b: a - s }; }
function allEvents() {
  const e = [];
  S.items.forEach(i => {
    if (!i.date) return; const kind = i.cat === 'todo' ? '할 일' : (i.src === '학사' ? '학사' : '일정');
    if (i.end && i.end > i.date) { const a = new Date(i.date + 'T00:00:00'), b = new Date(i.end + 'T00:00:00'); for (let k = 0, d = new Date(a); d <= b && k < 70; k++, d.setDate(d.getDate() + 1)) e.push({ date: ymd(d), t: `${i.title} (${md(i.date)}~${md(i.end)})`, kind, id: i.id, done: i.done, span: true }); }
    else e.push({ date: i.date, t: i.title, kind, id: i.id, done: i.done });
  });
  S.assess.forEach(a => { if (a.due) e.push({ date: a.due, t: a.title + ' (수행평가)', kind: '평가', done: (a.step || 0) >= 5 }); });
  S.budget.forEach(p => p.lines.forEach(l => { if (l.deadline && (l.alloc - spentOf(l)) > 0) e.push({ date: l.deadline, t: `${p.name} ${l.item} 집행 (잔액 ${won(l.alloc - spentOf(l))}원)`, kind: '예산', done: false }); }));
  S.training.forEach(t => { if (t.due) e.push({ date: t.due, t: t.title + ' (연수)', kind: '연수', done: !!t.done }); });
  (S.dday || []).forEach(x => { if (x.date) e.push({ date: x.date, t: x.title, kind: '디데이', done: false }); });
  return e;
}
function upcoming(n) { const seen = new Set(); return allEvents().filter(e => !e.done && dd(e.date) !== null && dd(e.date) >= 0 && dd(e.date) <= n).sort((a, b) => a.date.localeCompare(b.date)).filter(e => { if (!e.span) return true; if (seen.has(e.id)) return false; seen.add(e.id); return true; }); }
function periodInfo() {
  const p = S.profile, [h, m] = p.start.split(':').map(Number), now = new Date(), mins = now.getHours() * 60 + now.getMinutes(), st = h * 60 + m;
  let cur = 0, next = 0;
  if (p.bell && p.bell.length) { p.bell.forEach(x => { if (mins >= x.s && mins < x.e) cur = x.p; else if (mins < x.s && !next) next = x.p; }); return { dow: now.getDay(), cur, next }; }
  for (let i = 1; i <= 7; i++) { const a = st + (i - 1) * (+p.classMin + +p.breakMin), b = a + +p.classMin; if (mins >= a && mins < b) cur = i; else if (mins < a && !next) next = i; }
  return { dow: now.getDay(), cur, next };
}
const tt = (d, p) => S.timetable[d + '-' + p] || '';
const lessonPct = l => (+l.total ? Math.round(+l.done / +l.total * 100) : 0);

function todayView() {
  const t = today(), P = periodInfo(), rows = [];
  /* 일과 */
  {

    let st = '시간표가 비어 있습니다 → 수업·평가에서 "컴시간에서 가져오기"', due = '';
    if (has) {

      else if (P.cur) { st = `${P.cur}교시 ${esc(tt(P.dow, P.cur) || '공강')} 진행 중`; due = P.cur < 7 ? '다음 ' + (P.cur + 1) + '교시' : ''; }
      else if (P.next) { st = `다음 ${P.next}교시 ${esc(tt(P.dow, P.next) || '공강')}`; due = ''; }

      `<form class="inl" data-form="todo"><input name="title" placeholder="할 일 추가" required aria-label="할 일"><input type="date" name="date" value="${t}" aria-label="날짜"><button class="btn">추가</button></form>`;

  }

    rows.push(row('r3', '업무', '공문', st, '오늘', step('recv', '오늘 받은 공문') + step('done', '처리한 공문') + (typeof docLogBody === 'function' ? docLogBody() : '')));
  }
  /* 수업 진도 */
  {
    const L = S.lessons, avg = L.length ? Math.round(L.reduce((a, l) => a + lessonPct(l), 0) / L.length) : 0;

  }
  /* 평가 */
  {
    const A = [...S.assess].sort((a, b) => (a.due || '9').localeCompare(b.due || '9')), nx = A.find(a => (a.step || 0) < 5);
    const st = nx ? `${esc(nx.title)} · <b>${ASSESS_STEPS[nx.step || 0]}</b> 단계` : (A.length ? '모든 평가가 확정되었습니다' : '수행평가를 등록해 보세요');
    const b = A.map(a => `<div class="as"><div class="ah"><b>${esc(a.title)}</b> <span class="mu">${esc(a.grade || '')} ${a.due ? '· 입력기한 ' + md(a.due) + ' ' + ddText(dd(a.due)) : ''}</span> <button class="x" data-act="edit_assess" data-id="${a.id}">수정</button>${xbtn('del_assess', a.id)}</div><div class="steps">${ASSESS_STEPS.map((s, i) => `<button class="stp1 ${i === (a.step || 0) ? 'on' : ''} ${i < (a.step || 0) ? 'past' : ''}" data-act="assessStep" data-id="${a.id}" data-s="${i}">${s}</button>`).join('')}</div></div>`).join('') + `<button class="btn sm" data-act="add_assess">+ 수행평가 추가</button>`;
    rows.push(row('r5', '평가', '수행평가', st, nx && nx.due ? md(nx.due) + ' ' + ddText(dd(nx.due)) : '', b));

  /* 예산 */
  {
    const T = btot(), dl = [];
    S.budget.forEach(p => p.lines.forEach(l => { if (l.deadline && l.alloc - spentOf(l) > 0) dl.push(l.deadline); })); dl.sort();
    const st = S.budget.length ? `잔액 <b class="num">${won(T.b)}</b>원 · 집행 ${T.a ? Math.round(T.s / T.a * 100) : 0}%` : '예산 항목을 만들어 보세요';
    const b = S.budget.map(p => `<div class="bp"><b>${esc(p.name)}</b> <span class="mu">총액 ${won(projAlloc(p))} · 집행 ${won(projSpent(p))} · 잔액 ${won(projAlloc(p) - projSpent(p))}원</span></div>`).join('') + '<a class="btn sm" href="#/budget">예산 장부 열기</a>';

  {
    const req = S.training.filter(x => x.type === '필수'), rd = req.filter(x => x.done).length;
    const dev = S.training.filter(x => x.type === '개발' && x.done).reduce((a, x) => a + (+x.hours || 0), 0);
    const left = S.training.filter(x => !x.done && x.due).sort((a, b) => a.due.localeCompare(b.due))[0];
    const noNo = S.training.filter(x => x.done && !x.certNo).length;
    const hrs = f => S.training.filter(f).reduce((q, x) => q + (+x.hours || 0), 0), totH = hrs(x => x.done), reqH = hrs(x => x.done && x.type === '필수');
    const sum = `<div class="trsum"><b>이수한 연수 합계 ${totH}시간</b><span>필수 ${reqH}시간 · 개발 ${dev}시간 (목표 ${S.profile.devTarget}시간 중 ${Math.min(100, Math.round(dev / (S.profile.devTarget || 1) * 100))}%)</span><i style="--p:${Math.min(100, Math.round(dev / (S.profile.devTarget || 1) * 100))}%"></i></div>`;
    const b = sum + S.training.map(x => `<div class="tr ${x.done ? 'dn' : ''}"><button class="ck" data-act="trToggle" data-id="${x.id}" aria-pressed="${!!x.done}" aria-label="이수 표시"></button><span class="tl">${esc(x.title)}<br><span class="mu">${x.type} ${x.hours}시간 ${x.due ? '· 기한 ' + md(x.due) : ''}${x.done && x.doneDate ? ' · 이수일 ' + md(x.doneDate) : ''}</span></span>${x.done ? `<input class="cert" data-cert="${x.id}" value="${esc(x.certNo || '')}" placeholder="이수번호 입력" aria-label="${esc(x.title)} 이수번호">` : '<span class="mu">다 들으면 이수번호 입력</span>'}<button class="x" data-act="edit_training" data-id="${x.id}">수정</button>${xbtn('del_training', x.id)}</div>`).join('') + `<button class="btn sm" data-act="add_training">+ 연수 추가</button>` + (typeof trSitesHtml === 'function' ? trSitesHtml() : '');
    rows.push(row('r7', '연수', '연수 이수', `이수 합계 ${totH}시간 · 필수 ${rd}/${req.length} · 개발 ${dev}/${S.profile.devTarget}시간${noNo ? ` · <span class="hot">이수번호 미입력 ${noNo}</span>` : ''}`, left ? md(left.due) + ' ' + ddText(dd(left.due)) : '', b));
  }
  /* 기록 */
  {
    const N = [...S.notes].sort((a, b) => b.date.localeCompare(a.date)), n = N[0];
    const cnt = s => String(s || '').split('\n').filter(x => x.trim()).length;
    const st = n ? `${esc(n.title)} · 결정 ${cnt(n.decisions)}건 · <span class="hot">후속 ${cnt(n.followups)}건</span>` : '회의·연수 노트를 써 보세요';
    const b = N.slice(0, 5).map(x => `<div class="nl"><a href="#/note/${x.id}">${md(x.date)} ${esc(x.title)}</a><span class="mu">${esc(x.kind)}</span></div>`).join('') + '<a class="btn sm" href="#/notes">기록 전체</a>';
    rows.push(row('r8', '기록', '회의·연수 노트', st, n ? md(n.date) : '', b));
  }
  /* 업무 분장 / 연락망 */
  {
    const mine = S.duties.filter(d => d.mine);
    rows.push(row('r9', '학교', '업무 분장표', S.duties.length ? `내 업무 ${mine.length}건${mine[0] ? ' · ' + esc(mine[0].work) : ''}` : '업무 분장표를 올려 보세요', '', mine.map(d => `<div class="nl"><span>${esc(d.dept)} · ${esc(d.work)}</span></div>`).join('') + '<a class="btn sm" href="#/lib">분장표 열기</a>'));
    rows.push(typeof mineRow === 'function' ? mineRow() : '');
    rows.push(typeof mealRow === 'function' ? mealRow() : '');
    rows.push(typeof ddayRow === 'function' ? ddayRow() : '');
    rows.push(row('r10', '학교', '교내 연락망', S.contacts.length ? `교직원 ${S.contacts.length}명 · 이름·부서·내선 검색` : '연락망을 올려 보세요', '', '<a class="btn sm" href="#/lib">연락망 열기</a>'));
  }
  S.pages.filter(p => p.pin).forEach(p => {
    const todos = (p.blocks || []).filter(b => b.t === 'todo'), dn = todos.filter(b => b.done).length, first = (p.blocks || []).find(b => b.x && b.t !== 'todo');
    const st = todos.length ? `${dn} / ${todos.length} 완료` + (first ? ' · ' + esc(first.x.slice(0, 30)) : '') : (first ? esc(first.x.slice(0, 50)) : '내용 없음');
    rows.push(row('pg' + p.id, '페이지', esc(p.title || '제목 없음'), st, '', todos.map(b => `<div class="td ${b.done ? 'dn' : ''}"><button class="ck" data-act="bTodo" data-p="${p.id}" data-b="${b.id}" aria-pressed="${!!b.done}" aria-label="완료 표시"></button><span class="tl">${esc(b.x)}</span><span class="stamp">완료</span></div>`).join('') + `<a class="btn sm" href="#/page/${p.id}">페이지 열기</a>`));
  });
  const up = upcoming(7);
  return `${typeof schoolBanner === 'function' ? schoolBanner() : ''}${typeof ddayStrip === 'function' ? ddayStrip() : ''}<div class="bh"><h2>오늘의 게시판</h2><span class="mu">줄을 누르면 펼쳐집니다.</span><button class="btn sm" data-act="ordPick">↕ 순서 바꾸기</button><button class="btn sm" data-act="rowPick">☑ 보일 줄 고르기</button></div>
  <div class="spread"><div class="pgL">${miniCal()}${up.length ? `<p class="soon"><b>이번 주 기한</b><br>${up.slice(0, 6).map(e => `${md(e.date)} ${esc(e.t)}`).join('<br>')}</p>` : ''}</div>
  <div class="pgR"><div class="cols"><span>분류</span><span>제목</span><span>현황</span><span class="r">기한</span><span></span></div>${(typeof orderRows === 'function' ? orderRows(rows) : rows).join('')}</div></div>`;
}

/* ---------- 캘린더 ---------- */
function calView() {
  const [Y, M] = UI.cal.split('-').map(Number), first = new Date(Y, M - 1, 1), n = new Date(Y, M, 0).getDate(), ev = allEvents(), by = {};
  ev.forEach(e => (by[e.date] = by[e.date] || []).push(e));
  let cells = '';
  for (let i = 0; i < first.getDay(); i++) cells += '<span class="cd e"></span>';
  for (let d = 1; d <= n; d++) {
    const ds = `${Y}-${pad(M)}-${pad(d)}`, e = by[ds] || [];
    cells += `<button class="cd ${ds === today() ? 'tdy' : ''} ${ds === UI.day ? 'sel' : ''}" data-act="calDay" data-d="${ds}"><span class="n">${d}${(S.dayMemo || {})[ds] ? ' 📝' : ''}</span>${e.slice(0, 2).map(x => `<small class="${x.done ? 'dn' : ''}">${esc(x.t)}</small>`).join('')}${e.length > 2 ? `<small class="mu">+${e.length - 2}</small>` : ''}</button>`;

  return `<div class="bh"><h2>캘린더</h2><span class="mu">평가·예산·연수 기한이 자동으로 모입니다.</span></div>
  <div class="calh"><button class="btn sm" data-act="calMove" data-d="-1" aria-label="이전 달">‹</button><b class="calt">${Y}년 ${M}월</b><button class="btn sm" data-act="calMove" data-d="1" aria-label="다음 달">›</button><button class="btn sm" data-act="calMove" data-d="0">오늘</button></div>
  <div class="calw">${DOW.map(d => `<span>${d}</span>`).join('')}</div><div class="cal">${cells}</div>
  <div class="tools"><label class="btn file">학사일정 파일 올리기<input type="file" id="schedUp" accept=".txt,.csv,.xlsx,.xls,.pdf,.hwp,.hwpx,.docx" hidden></label><button class="btn" data-act="schedPaste">학사일정 붙여넣기</button></div><p class="mu">학사일정(PDF·엑셀·텍스트, 또는 나이스·홈페이지에서 복사한 글)을 넣으면 날짜와 행사를 찾아 캘린더에 한꺼번에 넣어 드립니다. 「3/2 입학식」「7.21~8.20 여름방학」 같은 줄을 알아봅니다.</p>
  <h3 class="h3">${md(UI.day)} (${DOW[new Date(UI.day + 'T00:00:00').getDay()]})</h3>${list}
  ${typeof dayMemoBox === 'function' ? dayMemoBox(UI.day) : ''}
  <form class="inl" data-form="evt"><input name="title" placeholder="일정·할 일 추가" required aria-label="내용"><select name="cat" aria-label="종류"><option value="event">일정</option><option value="todo">할 일</option></select><button class="btn">추가</button></form>`;

/* ---------- 예산 장부 ---------- */

    ${p.lines.map(l => { const sp = spentOf(l), b2 = l.alloc - sp, late = l.deadline && b2 > 0 && dd(l.deadline) < 0; return `<tr><td>${esc(l.item)}</td><td class="r">${won(l.alloc)}</td><td class="r">${won(sp)}</td><td class="r ${b2 < 0 ? 'hot' : ''}">${won(b2)}</td><td class="r">${l.alloc ? Math.round(sp / l.alloc * 100) : 0}%</td><td class="${late ? 'hot' : ''}">${l.deadline ? md(l.deadline) + ' ' + ddText(dd(l.deadline)) : ''}</td><td class="act"><button class="x" data-act="spendAdd" data-p="${p.id}" data-id="${l.id}">지출</button><button class="x" data-act="lineEdit" data-p="${p.id}" data-id="${l.id}">수정</button><button class="x" data-act="lineDel" data-p="${p.id}" data-id="${l.id}">삭제</button></td></tr>${(l.spends || []).map(s => `<tr class="sp"><td colspan="2">└ ${md(s.date)} ${esc(s.desc)}</td><td class="r">${won(s.amt)}</td><td colspan="3"></td><td class="act"><button class="x" data-act="spendDel" data-p="${p.id}" data-l="${l.id}" data-id="${s.id}">삭제</button></td></tr>`).join('')}`; }).join('')}</tbody></table>` : '';

    <form class="inl" data-form="pspend" data-p="${p.id}"><input type="date" name="date" value="${today()}" aria-label="날짜"><input name="desc" placeholder="사용 내용 (선택)" aria-label="사용 내용"><input name="amt" type="number" min="0" inputmode="numeric" placeholder="사용 금액(원)" required aria-label="사용 금액"><button class="btn pri">사용 금액 넣기</button></form>
    ${rows ? `<table class="tbl"><thead><tr><th>날짜</th><th>내용</th><th class="r">사용액</th><th class="r">누적 집행</th><th class="r">잔액</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="mu">사용한 금액을 하나씩 넣으면 집행률과 잔액이 바로 계산됩니다.</p>'}
    <details class="doc"><summary>목·항목별로 나누어 관리하기 (선택) ${p.lines.length ? '· ' + p.lines.length + '개' : ''}</summary>${lines}<button class="btn sm" data-act="lineAdd" data-p="${p.id}">+ 목·항목</button><p class="mu">목별 배정액을 넣으면 위 총액 대신 목별 배정의 합이 총액이 됩니다(총액 칸이 비어 있을 때).</p></details></section>`;

}

/* ---------- 손글씨 ---------- */
function mountNote(id) {
  const n = S.notes.find(x => x.id === id); if (!n) return;
  const cv = $('#ink'); if (!cv) return;
  cv.width = 1400; cv.height = 900; const ctx = cv.getContext('2d'); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  idb.get('ink:' + id).then(u => { if (u) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0); im.src = u; } });
  const T = { color: '#1B1613', w: 3, erase: false }, hist = []; let drawing = false, last = null, sawPen = false, t;
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
  const persist = () => { clearTimeout(t); t = setTimeout(() => idb.set('ink:' + id, cv.toDataURL('image/png')), 500); };
  cv.addEventListener('pointerdown', e => { if (e.pointerType === 'pen') sawPen = true; if (sawPen && e.pointerType === 'touch') return; e.preventDefault(); cv.setPointerCapture(e.pointerId); hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 8) hist.shift(); drawing = true; last = pt(e); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e); ctx.globalCompositeOperation = T.erase ? 'destination-out' : 'source-over'; ctx.strokeStyle = T.color; ctx.lineWidth = T.erase ? 22 : T.w * (e.pointerType === 'pen' && e.pressure ? .5 + e.pressure : 1); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  const end = () => { if (drawing) { drawing = false; persist(); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  $('#inkbox').addEventListener('click', e => {
    const b = e.target.closest('[data-ink]'); if (!b) return; const k = b.dataset.ink;
    if (k === 'pen') { T.color = '#1B1613'; T.erase = false; } else if (k === 'red') { T.color = '#6E1423'; T.erase = false; } else if (k === 'erase') T.erase = true; else if (k === 'thin') T.w = 2; else if (k === 'thick') T.w = 6;
    else if (k === 'undo') { const h = hist.pop(); if (h) { ctx.globalCompositeOperation = 'source-over'; ctx.putImageData(h, 0, 0); persist(); } }
    else if (k === 'clear') sure('필기를 모두 지울까요?', () => { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); ctx.clearRect(0, 0, cv.width, cv.height); persist(); });
    else if (k === 'png') { const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = (n.title || '필기') + '.png'; a.click(); }
  });
}

  const esc2 = esc, H = /^(\d{1,2}\s*[.)]\s|[가-하]\s*[.)]\s|[ⅠⅡⅢⅣⅤⅥⅦ]+\s*[.)]?\s|[□■◆▣◇▶【\[])/, B = /^([○●ㆍ·•\-*※]\s*)/;
  let h = '', tb = [];
  const flush = () => { if (tb.length) { h += `<div class="tw"><table class="tbl">${tb.map(r => `<tr>${r.map(c => `<td>${esc2(c)}</td>`).join('')}</tr>`).join('')}</table></div>`; tb = []; } };
  text.split('\n').forEach(raw => {
    if (raw.includes('\f')) { flush(); h += '<hr class="pgb">'; raw = raw.replace(/\f/g, ''); }
    const l = raw.trim(); if (!l) return;

    flush();

/* mine.js — 업무분장표 → "내 업무" 자동 분류 (접이식 줄 + 전부 편집 가능) */
const mineSplit = w => [...new Set(String(w || '').split(/[\n·•ㆍ;]|\s\/\s|,\s*/).map(s => s.replace(/^[\-\d.)\s]+/, '').trim()).filter(s => s.length > 1))];

function csvLine(l) { const o = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { o.push(cur.trim()); cur = ''; } else cur += ch; } o.push(cur.trim()); return o; }
/* 분장표 글자 → [{dept, work, who, mine}] (표는 ' | '·탭·쉼표로 나뉜 줄, 표 구조가 없으면 이름 줄 위의 두 줄을 업무로 봄) */
function dutyParse(text, name) {
  const out = []; let dept = '', prev = [];
  for (const line of String(text || '').split(/\n/)) {
    const l = line.replace(/\f/g, '').trim(); if (!l) continue;
    const raw = /\s\|\s|\t/.test(l) ? l.split(/\s\|\s|\t/).map(s => s.trim()) : csvLine(l), lead = raw.length > 2 && !raw[0];
    const cells = raw.map(s => s.replace(/^"|"$/g, '').trim()).filter(Boolean);
    if (cells.length >= 2) {
      if (/^(부서|구분|연번|번호)/.test(cells[0]) && /업무|담당/.test(l) && l.length < 80) continue;
      const ni = name ? cells.findIndex(x => x.includes(name)) : -1, wi = ni >= 0 ? ni : cells.length - 1;
      const who = cells[wi], rest = cells.filter((x, i) => i !== wi && !/^\d{1,3}$/.test(x));
      if (!rest.length) continue;
      let d = dept, work;
      if (rest.length >= 2 && !lead) { d = rest[0]; dept = d; work = rest.slice(1).sort((a, b) => b.length - a.length)[0]; } else work = rest.sort((a, b) => b.length - a.length)[0];
      out.push({ dept: d, work, who, mine: ni >= 0 });
      prev = [];
    } else {
      if (name && l.includes(name) && l.length < 30 && prev.length) out.push({ dept: prev[prev.length - 2] || '', work: prev[prev.length - 1], who: l, mine: true });
      else { prev.push(l); if (prev.length > 3) prev.shift(); }
    }
  }

}

  return `<details class="sbanner" data-k="sb" ${OPEN.has('sb') ? 'open' : ''}><summary><span class="sbn">🏫 ${esc(name)}</span><span class="sbm">${brief}</span><i class="chev"></i></summary><div class="sbb"><div class="tools">${h ? `<a class="btn pri" href="${esc(h)}" target="_blank" rel="noopener">학교 홈페이지 열기</a>` : ''}<button class="btn sm" data-act="schoolSet">홈페이지 주소·설정</button><button class="btn sm" data-act="mealNow">급식 새로고침</button></div>${cls ? `<p><b>학급</b> ${esc(cls)}</p>` : ''}${sc && (sc.addr || sc.tel) ? `<p class="mu">${esc(sc.addr || '')}${sc.tel ? ' · ☎ ' + esc(sc.tel) : ''}</p>` : ''}<h4 class="dlh">급식 (오늘부터)</h4>${week || '<p class="mu">급식 자료가 아직 없습니다. [급식 새로고침]을 눌러 보세요.</p>'}<p class="mu">알레르기 번호: 1난류 2우유 3메밀 4땅콩 5대두 6밀 7고등어 8게 9새우 10돼지고기 11복숭아 12토마토 13아황산류 14호두 15닭고기 16쇠고기 17오징어 18조개류 19잣 · 출처 나이스 교육정보 개방포털 · 학생 개인별 학적은 나이스 내부 정보라 연동되지 않습니다.</p></div></details>`;
}

/* dday.js — ① 디데이(직접 추가)  ② 기한 알림: 기한이 N일(기본 2일) 안으로 다가오면 화면 아래 얇은 막대로 알려 줌
   - 알림 대상: 할 일 · 수행평가 성적입력 기한 · 예산 집행 기한 · 연수 기한 · 내 디데이 (끝낸 것은 제외)
   - 서버가 없는 앱이라 "앱을 열어 둔 동안"만 알려 줍니다(브라우저 알림을 켜면 열 때 한 번 더 알림). */
const ddList = () => (S.dday = S.dday || []);
const ALARM_KINDS = ['할 일', '평가', '예산', '연수', '디데이'];
const alarmOff = () => parseInt((S.profile || {}).alarmDays, 10) === -1;
const alarmDays = () => { const n = parseInt((S.profile || {}).alarmDays, 10); return n >= 0 && n <= 14 ? n : 2; };
const ddBadge = n => n === 0 ? 'D-Day' : n > 0 ? 'D-' + n : 'D+' + (-n);

/* 알림에 올릴 항목: 오늘부터 N일 안의 기한 */
function alarmItems() {
  const N = alarmDays(), seen = new Set(), out = [];
  allEvents().forEach(e => {
    if (e.done || !ALARM_KINDS.includes(e.kind)) return;
    const n = dd(e.date); if (n === null || n < 0 || n > N) return;
    const k = (e.id || '') + '|' + e.t + '|' + e.date; if (seen.has(k)) return; seen.add(k);
    out.push({ t: String(e.t).replace(/ \((수행평가|연수)\)$/, ''), date: e.date, n, kind: e.kind });
  });
  return out.sort((a, b) => a.n - b.n || a.t.localeCompare(b.t));
}

/* ---- 화면 아래 알림 막대 ---- */
const ALK = 'tf.alarm', ALN = 'tf.alarmNote';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch (e) { return {}; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
function renderAlarm() {
  let bar = document.getElementById('alarmbar');
  if (!bar) { bar = document.createElement('div'); bar.id = 'alarmbar'; bar.setAttribute('role', 'status'); bar.setAttribute('aria-live', 'polite'); document.body.appendChild(bar); }
  const items = (S.setup && !alarmOff()) ? alarmItems() : [];
  const sig = items.map(i => i.date + i.t).join('|'), st = lsGet(ALK);
  if (!items.length || (st.day === today() && st.sig === sig)) { bar.hidden = true; document.body.classList.remove('hasalarm'); return; }
  const open = bar.dataset.open === '1', f = items[0];
  bar.hidden = false; document.body.classList.add('hasalarm');
  bar.innerHTML = open
    ? `<div class="al-h"><b>⏰ 기한이 다가옵니다</b><span class="mu">${alarmDays() === 0 ? '오늘' : alarmDays() + '일 안'} · ${items.length}건</span><button class="al-x" data-act="alToggle" aria-label="접기">접기</button></div>
       <div class="al-l">${items.slice(0, 8).map(i => `<div class="al-i"><span class="al-b ${i.n <= 1 ? 'hot' : ''}">${ddBadge(i.n)}</span><span class="al-t">${esc(i.t)}</span><span class="al-d">${md(i.date)}</span></div>`).join('')}${items.length > 8 ? `<div class="mu">외 ${items.length - 8}건</div>` : ''}</div>
       <div class="al-f"><button class="btn sm" data-act="alClose">오늘은 그만 보기</button><button class="btn sm" data-act="ddAlarm">알림 설정</button></div>`
    : `<button class="al-main" data-act="alToggle" aria-label="기한 알림 펼치기"><span class="al-ic">⏰</span><span class="al-b ${f.n <= 1 ? 'hot' : ''}">${ddBadge(f.n)}</span><span class="al-t">${esc(f.t)}</span>${items.length > 1 ? `<span class="al-more">외 ${items.length - 1}건</span>` : ''}<i class="al-chev"></i></button><button class="al-x" data-act="alClose" aria-label="오늘은 그만 보기">×</button>`;
  ddNotify(items, sig);
}
/* 브라우저 알림(허용했을 때만, 같은 내용은 하루 한 번) */
function ddNotify(items, sig) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const n = lsGet(ALN); if (n.day === today() && n.sig === sig) return; lsSet(ALN, { day: today(), sig });
    const body = items.slice(0, 4).map(i => `${ddBadge(i.n)} ${i.t}`).join('\n') + (items.length > 4 ? `\n외 ${items.length - 4}건` : '');
    const opt = { body, icon: 'icons/icon-192.png', tag: 'tf-alarm' };
    if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification('업무파탈 · 기한 알림', opt)).catch(() => new Notification('업무파탈 · 기한 알림', opt));
    else new Notification('업무파탈 · 기한 알림', opt);
  } catch (e) { }
}

/* ---- 오늘 화면: 위쪽 디데이 칩 + 관리용 줄(r13) ---- */
function ddayStrip() {
  const L = ddList().map(x => ({ ...x, n: dd(x.date) })).filter(x => x.n !== null && x.n >= 0).sort((a, b) => a.n - b.n).slice(0, 4);
  if (!L.length) return '';
  return `<div class="ddstrip" aria-label="디데이">${L.map(x => `<span class="ddc ${x.n <= 1 ? 'hot' : ''}"><b>${ddBadge(x.n)}</b>${esc(x.title)}</span>`).join('')}</div>`;
}
function ddayRow() {
  const L = ddList().slice().sort((a, b) => a.date.localeCompare(b.date)), nx = L.find(x => dd(x.date) >= 0);
  const perm = ('Notification' in window) ? Notification.permission : 'none', N = alarmDays();
  const st = nx ? `${esc(nx.title)} <b>${ddBadge(dd(nx.date))}</b>` : '기다리는 날을 추가해 보세요';
  const body = (L.length ? L.map(x => `<div class="td"><span class="ddn ${dd(x.date) < 0 ? 'past' : ''}">${ddBadge(dd(x.date))}</span><span class="tl">${esc(x.title)}</span><span class="mu">${md(x.date)}</span>${xbtn('ddDel', x.id)}</div>`).join('') : '<p class="mu">수능·시험·행사처럼 기다리는 날을 추가하면 오늘 화면 위쪽에 작게 보입니다.</p>')
    + `<div class="tools"><button class="btn sm pri" data-act="ddAdd">+ 디데이 추가</button><button class="btn sm" data-act="ddAlarm">알림 설정 (${alarmOff() ? '꺼짐' : N === 0 ? '당일만' : N + '일 전부터'})</button>${perm === 'default' ? '<button class="btn sm" data-act="ddPerm">브라우저 알림 켜기</button>' : ''}</div>`
    + `<p class="mu">할 일·수행평가·예산·연수 기한이 ${N}일 안으로 다가오면 화면 아래에 작은 막대로 알려 드립니다.${perm === 'granted' ? ' 브라우저 알림도 함께 받습니다.' : ''} 앱을 열어 둔 동안 알려 주며, 닫아 둔 동안에는 보낼 수 없습니다.</p>`;
  return row('r13', '일정', '디데이·기한 알림', st, '', body);
}

Object.assign(A, {
  ddAdd() { ask('디데이 추가', [{ k: 'title', label: '이름 (예: 수능, 기말고사, 곡선제)', req: 1 }, { k: 'date', label: '날짜', type: 'date', req: 1 }], o => { ddList().push({ id: uid(), title: o.title.trim(), date: o.date }); OPEN.add('r13'); try { localStorage.setItem('tf.open', JSON.stringify([...OPEN])); } catch (e) { } commit(); toast('디데이를 추가했습니다.'); }); },
  ddDel(el) { S.dday = ddList().filter(x => x.id !== el.dataset.id); commit(); },
  ddAlarm() { ask('기한 알림 설정', [{ k: 'n', label: '기한 며칠 전부터 알릴까요? (0=당일만, 최대 14, 끄려면 -1)', type: 'number', val: alarmOff() ? -1 : alarmDays() }], o => { const n = parseInt(o.n, 10); S.profile.alarmDays = isNaN(n) ? 2 : Math.max(-1, Math.min(14, n)); lsSet(ALK, {}); commit(); toast(alarmOff() ? '기한 알림을 껐습니다.' : '기한 ' + alarmDays() + '일 전부터 화면 아래에 알려 드립니다.'); }); },
  ddPerm() { if (!('Notification' in window)) return toast('이 브라우저는 알림을 지원하지 않습니다.'); Notification.requestPermission().then(p => { toast(p === 'granted' ? '브라우저 알림을 켰습니다.' : '알림이 허용되지 않았습니다.'); lsSet(ALN, {}); commit(); }); },
  alToggle() { const b = document.getElementById('alarmbar'); if (b) { b.dataset.open = b.dataset.open === '1' ? '0' : '1'; renderAlarm(); } },
  alClose() { lsSet(ALK, { day: today(), sig: alarmItems().map(i => i.date + i.t).join('|') }); renderAlarm(); }
});
BOARD_ROWS.push(['r13', '디데이·기한 알림']);

/* 화면을 다시 그릴 때마다 알림 막대도 다시 계산 (날짜가 바뀌면 5분 안에 갱신) */
(() => { const r = TF.render; TF.render = function () { const v = r.apply(this, arguments); renderAlarm(); return v; }; })();
setInterval(renderAlarm, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderAlarm(); });
window.addEventListener('hashchange', () => setTimeout(renderAlarm, 50));
setTimeout(renderAlarm, 300);

/* setui.js — 설정의 "작업표시줄에 고정 · 위젯" 안내 칸(app.js `.guide`) 위에 [앱으로 설치하기]·[위젯 열기] 버튼을 붙입니다.
   (설정 칸 접기는 extra.js `setFold()`가 맡습니다.) */
const isStandalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
let _ip = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _ip = e; });
window.addEventListener('appinstalled', () => { _ip = null; toast('설치했습니다. 작업표시줄 아이콘을 오른쪽 클릭해 "작업 표시줄에 고정"을 누르세요.'); });
Object.assign(A, {
  pwaInstall() {
    if (isStandalone()) return toast('이미 앱으로 열려 있습니다.');
    if (!_ip) return toast('설치 창을 바로 띄울 수 없습니다. 크롬 ⋮ → 저장 및 공유 → 페이지를 앱으로 설치를 눌러 주세요.');
    _ip.prompt(); _ip.userChoice.finally(() => { _ip = null; });
  },
  widgetOpen() {
    const w = window.open('widget.html', 'tfwidget', `popup=yes,width=380,height=580,left=${Math.max(0, (screen.availWidth || 1200) - 410)},top=60`);
    if (!w) toast('팝업이 막혔습니다. 주소창 오른쪽의 팝업 차단을 풀어 주세요.');
  }
});
function installTools() {
  const g = document.querySelector('main .guide'); if (!g || g.querySelector('.itools')) return;
  const st = isStandalone(), d = document.createElement('div'); d.className = 'itools';
  d.innerHTML = `<div class="tools"><button class="btn pri" data-act="pwaInstall" ${st ? 'disabled' : ''}>${st ? '✅ 앱으로 열려 있습니다' : '앱으로 설치하기'}</button><button class="btn" data-act="widgetOpen">🧩 위젯 열기</button></div><p class="mu">🧩 위젯은 디데이·기한 임박·오늘 할 일만 작게 보여 주는 창입니다(보기 전용). 설치 후 작업표시줄 아이콘을 오른쪽 클릭하면 "위젯 열기"도 나옵니다. 항상 맨 위에 두려면 Windows PowerToys의 "Always On Top"(Win+Ctrl+T)을 쓰세요.</p>`;
  g.prepend(d);
}
new MutationObserver(installTools).observe(document.getElementById('app'), { childList: true, subtree: true });
/* 맨 마지막에 불러오는 파일이라, 여기서 한 번 더 그려 새 부품(디데이 칩·줄)이 처음 화면부터 빠짐없이 나오게 함 */
if (S.setup && TF.render) TF.render();
</script>
</body>
