<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>업무파탈 · Travail Fatal</title>
<meta name="theme-color" content="#F2EBDD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nanum+Pen+Script&family=Gaegu:wght@700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>/* 업무파탈 style.css — 프랑스 신문 1면 느낌: 종이색 바탕 · 먹색 글자 · 보르도 한 가지 포인트 */
:root{--paper:#F2EBDD;--ink:#1B1613;--red:#6E1423;--mu:#5F564D;--rule:#CFC4B0;--rule2:#E3D9C6;--pl:#FBF7EE;
--serif:'Playfair Display','Noto Serif KR','Nanum Myeongjo','Batang',serif;--sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--ink)}a:hover{color:var(--red)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mu{color:var(--mu);font-size:13px}.hot{color:var(--red)}.hot2{color:var(--red)}.r{text-align:right}
#app{max-width:1100px;margin:0 auto;padding:28px 40px 120px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mast{border-top:4px solid var(--ink);border-bottom:1px solid var(--ink);padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.mast1{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
h1{margin:0;font-family:var(--serif);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.02em}
.fr{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;color:var(--red)}
.mast2{text-align:right;font-size:13px;color:var(--mu)}.dt{font-family:'Playfair Display',serif;font-size:15px;letter-spacing:.12em;color:var(--ink)}
.nav{display:flex;gap:4px 22px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--ink);font-size:14px}
.nav a{text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}.nav a[aria-current]{border-bottom-color:var(--red);font-weight:700}
main{padding-top:6px}
.bh{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px;flex-wrap:wrap;gap:6px}
h2{margin:0;font-family:var(--serif);font-size:24px}.h3{font-family:var(--serif);font-size:19px;margin:26px 0 8px;padding-top:10px;border-top:1px solid var(--ink)}
/* 게시판 줄 */
.cols,.row>summary{display:grid;grid-template-columns:56px minmax(120px,.9fr) minmax(200px,1.7fr) 100px 14px;gap:6px 16px;align-items:center}
.cols{padding:8px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-size:12px;color:var(--mu);letter-spacing:.06em}
.row{border-bottom:1px solid var(--rule)}
.row>summary{padding:14px 0;cursor:pointer;list-style:none}.row>summary::-webkit-details-marker{display:none}
.cat{font-size:12px;color:var(--red);letter-spacing:.06em}.ttl{font-family:var(--serif);font-size:17px;font-weight:700}.st{font-size:14px}.due{text-align:right;font-size:13px;color:var(--mu)}
.chev{width:8px;height:8px;border-right:1.6px solid var(--ink);border-bottom:1.6px solid var(--ink);transform:rotate(45deg);transition:transform .15s;margin-top:-4px}
.row[open] .chev{transform:rotate(225deg);margin-top:4px}
.rb{padding:2px 0 18px}
.num{font-family:'Playfair Display',serif;font-size:17px}
.soon{margin:18px 0;font-size:13px;color:var(--mu)}.soon b{color:var(--red);margin-right:6px}
/* 단추·입력 */
.btn{background:transparent;border:1px solid var(--ink);padding:7px 14px;text-decoration:none;display:inline-block;font-size:13px;margin:6px 6px 0 0;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--paper)}.btn.sm{padding:4px 10px;font-size:12px}.btn.pri{background:var(--red);border-color:var(--red);color:var(--paper)}
.x{background:none;border:0;font-size:12px;color:var(--mu);text-decoration:underline;padding:2px 6px}.x:hover{color:var(--red)}
.file{cursor:pointer}
input,select,textarea{background:var(--pl);border:1px solid var(--ink);padding:8px 10px;border-radius:0;max-width:100%}
textarea{width:100%;resize:vertical}label{display:block;font-size:13px;color:var(--mu);margin:10px 0}label input,label select,label textarea{display:block;width:100%;margin-top:4px;color:var(--ink);font-size:15px}
.inl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.inl input[name=title]{flex:1 1 200px}.inl .btn{margin:0}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:10px 0}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}.chk input{width:auto;margin:4px 0 0}
.fm{max-width:520px}.hides{display:flex;flex-wrap:wrap;gap:4px 24px}
/* 할 일·진도·평가 */
.td,.tr{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--rule2)}.tl{flex:1}
.ck{flex:none;width:20px;height:20px;border:1.5px solid var(--ink);background:transparent;padding:0}.ck[aria-pressed=true]{background:var(--ink)}.ck.off{opacity:.3}
.dn .tl{color:#8B8174;text-decoration:line-through}
.stamp{opacity:0;font-size:12px;letter-spacing:.1em;color:var(--red);border:1.5px solid var(--red);padding:1px 8px;transform:rotate(-5deg)}.dn .stamp{opacity:1}
.late{color:var(--red);font-size:12px}
.stp{display:flex;align-items:center;gap:12px;padding:6px 0}.stp span{width:130px}.stp .btn{margin:0}
.ls{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--rule2);flex-wrap:wrap}.lc{width:36px;font-weight:700}.lu{width:110px;color:var(--mu);font-size:13px}.ls .bar{flex:1 1 120px}.ls .btn{margin:0}
.bar{height:3px;background:#D9CFBC}.bar i{display:block;height:3px;background:var(--ink)}.bar i.hot{background:var(--red)}
.strip{display:flex;flex-wrap:wrap;gap:8px}.pc{flex:1 1 90px;padding:10px;border:1px solid var(--rule);font-size:13px;color:var(--mu)}.pc b{display:block;font-family:'Playfair Display',serif;font-size:20px;color:var(--ink)}.pc.now{background:var(--red);border-color:var(--red);color:var(--paper)}.pc.now b{color:var(--paper)}
.as{padding:10px 0;border-top:1px solid var(--rule2)}.steps{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.stp1{background:transparent;border:1px solid var(--rule);padding:4px 12px;font-size:13px;color:var(--mu)}.stp1.past{border-color:var(--ink);color:var(--ink)}.stp1.on{border-color:var(--red);color:var(--red);border-bottom:3px solid var(--red);font-weight:700}
.nl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--rule2)}.bp{padding:6px 0;border-top:1px solid var(--rule2)}
/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}.tbl th{font-weight:500;color:var(--mu);font-size:12px;text-align:left;padding:6px 6px;border-bottom:1px solid var(--ink)}.tbl th.r{text-align:right}
.tbl td{padding:8px 6px;border-top:1px solid var(--rule2);vertical-align:top}.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}.tbl .act{white-space:nowrap;text-align:right}
.tbl tr.sp td{color:var(--mu);font-size:12px}.tbl tr.tot td{border-top:1px solid var(--ink);font-weight:700}.tbl tr.mine td{background:#EFE3D2}
.tt td{padding:2px}.tt input{width:100%;border:1px solid var(--rule);padding:6px;font-size:13px}.tt th:first-child{width:28px}
.sum{display:flex;gap:24px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}.sum span{display:block;font-size:12px;color:var(--mu)}.sum b{font-size:24px}
.bkh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.bkh .h3{margin-right:auto}
.srch{width:100%;max-width:360px;margin-bottom:6px}
.doc{border-top:1px solid var(--rule2);padding:8px 0}.doc pre{white-space:pre-wrap;font-family:var(--sans);font-size:12px;background:var(--pl);padding:10px;max-height:240px;overflow:auto}
/* 캘린더 */
.calh{display:flex;align-items:center;gap:10px}.calh .btn{margin:0}.calt{font-family:var(--serif);font-size:20px;min-width:130px;text-align:center}
.calw,.cal{display:grid;grid-template-columns:repeat(7,1fr)}.calw span{font-size:12px;color:var(--mu);padding:8px 4px;border-bottom:1px solid var(--ink)}
.cd{min-height:78px;border:0;border-bottom:1px solid var(--rule2);border-right:1px solid var(--rule2);background:transparent;text-align:left;padding:4px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cd.e{cursor:default}.cd .n{font-size:13px}.cd small{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--red)}.cd small.dn{color:#8B8174;text-decoration:line-through}
.cd.tdy .n{background:var(--red);color:var(--paper);width:22px;text-align:center;border-radius:50%}.cd.sel{background:var(--pl);outline:1px solid var(--ink)}
/* 기록 */
.nwrap{display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:22px;align-items:start}
.nlist{display:flex;flex-direction:column;border-right:1px solid var(--rule);padding-right:12px}.nlist a{text-decoration:none;padding:8px 0;border-bottom:1px solid var(--rule2);display:flex;flex-direction:column}.nlist a.on b{color:var(--red)}.nlist .btn{margin:0 0 8px}
.nh{display:flex;gap:8px;flex-wrap:wrap}.nh input[data-note=title]{flex:1 1 220px;font-family:var(--serif);font-size:18px}
.tabs{display:flex;gap:0;margin:12px 0 0;border-bottom:1px solid var(--ink)}.tab{background:none;border:0;padding:8px 16px;font-size:14px;border-bottom:3px solid transparent}.tab.on{border-bottom-color:var(--red);font-weight:700}
#nbody{margin-top:10px;min-height:340px}
#ink{width:100%;background:var(--pl);border:1px solid var(--ink);touch-action:none;display:block;margin-top:8px;cursor:crosshair}.inkbar{margin-top:8px}
.npan{border-left:1px solid var(--rule);padding-left:18px}.npan .h3{margin-top:0;border:0;padding:0}
/* 환영·설정 */
.wel{max-width:520px;margin:60px auto;padding:0 20px;border-top:4px solid var(--ink)}.wel h1{margin-top:24px}.wel .fr{margin-bottom:12px}
.mas{width:72px;height:72px;border:1px dashed var(--red);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--red);overflow:hidden;border-radius:50%}.mas img{width:100%;height:100%;object-fit:cover}
.drawer{margin-top:34px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:12px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}.drawer b{font-family:var(--serif);font-size:18px}.sl{color:#B7AC98;margin:0 -4px}.drawer .btn{margin:0}
.cp{text-align:center;font-size:11px;color:var(--mu);margin:18px 0}
/* 대화상자·알림 */
.dlg{border:1px solid var(--ink);background:var(--paper);padding:20px;width:min(420px,92vw);color:var(--ink)}.dlg.wide{width:min(640px,94vw);max-height:90vh;overflow:auto}.dlg::backdrop{background:rgba(27,22,19,.45)}
.dlg h3{margin:0 0 6px;font-family:var(--serif)}.btns{display:flex;flex-direction:row;gap:8px;margin-top:14px}.btns button{padding:8px 16px;border:1px solid var(--ink);background:transparent}.btns .pri{background:var(--red);border-color:var(--red);color:var(--paper)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}#toast.show{opacity:1;transform:translate(-50%,0)}
/* 꿈송이 */
#chatfab{position:fixed;right:20px;bottom:20px;width:68px;height:68px;border-radius:50%;background:var(--red);color:var(--paper);border:3px double var(--paper);outline:2px solid var(--red);font-family:var(--serif);font-size:13px;font-weight:700;padding:0;overflow:hidden;z-index:30}#chatfab img{width:100%;height:100%;object-fit:cover}
#chatpan{position:fixed;right:20px;bottom:100px;width:380px;max-width:calc(100vw - 24px);height:min(560px,calc(100vh - 130px));background:var(--paper);border:1px solid var(--ink);display:flex;flex-direction:column;z-index:30;box-shadow:6px 6px 0 rgba(27,22,19,.18)}#chatpan[hidden]{display:none}
.ch-h{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ink)}.ch-h div{flex:1;display:flex;flex-direction:column;font-family:var(--serif)}.ch-h .mu{font-family:var(--sans)}
.ch-face{width:42px;height:42px;border-radius:50%;border:1px dashed var(--red);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--red);text-align:center;line-height:1.2;flex:none}.ch-face img{width:100%;height:100%;object-fit:cover}.ch-face i{font-style:normal}
.ch-b{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.me{align-self:flex-end;background:var(--rule2);padding:8px 10px;max-width:85%}.bot p{margin:0 0 6px}
.hit{display:flex;gap:8px;border-left:3px solid var(--red);padding-left:8px;margin:6px 0}.no{font-family:'Playfair Display',serif;color:var(--red)}.src{font-size:11px;color:var(--mu);margin-top:2px}
.ch-act{margin-top:4px}.ch-q{padding:6px 12px 0;display:flex;gap:6px;flex-wrap:wrap}.chip{background:transparent;border:1px solid var(--ink);padding:3px 10px;font-size:12px}
.ch-f{display:flex;gap:6px;padding:10px 12px}.ch-f input{flex:1;min-width:0}.ch-f .btn{margin:0}
/* 폰 */
@media (max-width:760px){
#app{padding:16px 16px 120px}h1{font-size:42px}.fr{font-size:22px}
.cols{display:none}
.row>summary{grid-template-columns:48px 1fr 14px;grid-template-areas:"c t v" "s s s" "d d d";gap:2px 10px;padding:12px 0}
.cat{grid-area:c}.ttl{grid-area:t}.chev{grid-area:v}.st{grid-area:s}.due{grid-area:d;text-align:left}
.nwrap{grid-template-columns:1fr}.nlist{border-right:0;padding-right:0;flex-direction:row;overflow-x:auto;gap:12px}.nlist a{min-width:130px}.npan{border-left:0;padding-left:0;border-top:1px solid var(--ink);padding-top:10px}
.cd{min-height:58px}.cd small{display:none}.lu{width:auto}.stp span{width:100px}
.tbl{display:block;overflow-x:auto}
#chatpan{right:8px;bottom:84px}
}
@media (min-width:761px) and (max-width:1100px){.nwrap{grid-template-columns:150px minmax(0,1fr) 240px}}
@media print{.nav,.drawer,#chatbox,.btn,.x{display:none!important}}
.tot1{margin:0}.tot1 input{width:170px;font-size:18px;font-family:'Playfair Display',serif;margin-top:2px}
.sum label span{display:block}
/* 내 페이지 */
.nwrap.pw{grid-template-columns:220px minmax(0,1fr)}
.nlist a.on b{color:var(--red)}
.ptitle{width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;font-family:var(--serif);font-size:30px;font-weight:700;padding:6px 0}
.blk{display:flex;align-items:flex-start;gap:8px;padding:3px 0;position:relative}
.blk .bctl{margin-left:auto;display:flex;gap:2px;align-items:center;opacity:.35;flex:none}.blk:hover .bctl,.blk:focus-within .bctl{opacity:1}
.bctl select{width:auto;padding:2px 4px;font-size:12px;border-color:var(--rule)}
.bta{flex:1;min-width:0;border:0;background:transparent;resize:none;overflow:hidden;padding:4px 2px;font-size:15px;line-height:1.6}.bta:focus,.blk input:focus{background:var(--pl);outline:1px solid var(--rule)}
.blk input{border:0;background:transparent;flex:1;min-width:0}
.bh1{font-family:var(--serif);font-size:26px;font-weight:700}.bh2{font-family:var(--serif);font-size:19px;font-weight:700}
.dot{padding-top:5px;color:var(--red)}.blk-todo .ck{margin-top:7px}
.blk-quote .bta{border-left:3px solid var(--red);padding-left:12px;font-family:var(--serif);font-size:17px}
.blk-divider hr{flex:1;border:0;border-top:1px solid var(--ink);margin:12px 0}
.blk-toggle details{flex:1;border-left:2px solid var(--rule);padding-left:10px}.blk-toggle summary{cursor:pointer}
.blk-link input{border-bottom:1px solid var(--rule)}.blk-link .btn{margin:0}
.tw{flex:1;overflow-x:auto}.pt td{padding:0;border:1px solid var(--rule)}.pt input{width:100%;padding:8px;border:0}
.addb{margin-top:16px;padding-top:10px;border-top:1px solid var(--rule2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (max-width:760px){.nwrap.pw{grid-template-columns:1fr}.blk .bctl{opacity:1;flex-wrap:wrap}.ptitle{font-size:24px}}
.links{margin-top:22px}.links .h3{margin-top:0}
.lk{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--ink);padding:2px 4px 2px 10px;margin:0 6px 6px 0;font-size:13px}.lk a{color:var(--ink);text-decoration:none}.lk a:hover{color:var(--red)}
.blk-ref{align-items:center;flex-wrap:wrap}.blk-ref .btn{margin:0}
[hidden]{display:none!important}
label.btn{display:inline-block;color:var(--ink);margin:6px 6px 0 0}
label.btn:hover{color:var(--paper)}

/* ===== 가독성 개선: 글자 키우기 · 진하게 · 줄 간격 넓히기 ===== */
:root{--mu:#40382F;--rule:#A89C86;--rule2:#CFC4B0}
body{font-size:17px;line-height:1.7;font-family:var(--sans)}
.mu{font-size:15px;color:var(--mu)}
.mast2{font-size:15px;color:var(--mu)}.dt{font-size:16px}
.nav{font-size:17px;gap:6px 26px;padding:12px 0}.nav a{padding:6px 0}
h2{font-family:var(--sans);font-weight:700;font-size:26px}
.h3{font-family:var(--sans);font-weight:700;font-size:21px;margin:30px 0 10px}
.cols{font-size:14px;color:var(--mu)}
.row>summary{padding:18px 0;min-height:56px}
.cat{font-size:14px;font-weight:700}
.ttl{font-family:var(--sans);font-size:19px;font-weight:700}
.st{font-size:17px}.due{font-size:15px;color:var(--mu)}
.rb{padding:4px 0 22px;font-size:16px}
.num{font-size:19px;font-weight:700}
.btn{font-size:16px;padding:10px 18px;margin:8px 8px 0 0;border-width:1.5px}
.btn.sm{font-size:15px;padding:7px 14px}
.x{font-size:15px;color:var(--ink);padding:6px 8px}
input,select,textarea{font-size:17px;padding:10px 12px;border-width:1.5px}
label{font-size:15px;color:var(--mu)}
.chip{font-size:15px;padding:6px 14px;border-width:1.5px}
.td,.tr{padding:12px 0}.tl{font-size:17px}
.ck{width:26px;height:26px;border-width:2px}
.late{font-size:14px}.stamp{font-size:14px}
.ls{padding:10px 0}.lc{width:44px;font-size:17px}.lu{font-size:15px;width:120px}
.bar,.bar i{height:6px}
.pc{font-size:15px}.pc b{font-size:22px}
.stp1{font-size:15px;padding:7px 14px}
.nl,.bp{padding:9px 0;font-size:16px}
.tbl{font-size:16px}.tbl th{font-size:14px;color:var(--ink);font-weight:700;padding:8px 8px}.tbl td{padding:11px 8px}.tbl tr.sp td{font-size:14px}
.tt input,.pt input{font-size:16px}
.sum span{font-size:14px}.sum b{font-size:28px}
.cd{min-height:96px}.cd .n{font-size:16px}.cd small{font-size:13px;line-height:1.3}
.calw span{font-size:14px;color:var(--ink)}.calt{font-size:22px}
.nlist a{padding:11px 0;font-size:16px}
.bta{font-size:17px}.bh1{font-size:28px}.bh2{font-size:21px}
.ptitle{font-size:32px}
.dlg{font-size:16px}.dlg h3{font-size:21px}.btns button{font-size:16px;padding:10px 18px}
.drawer{font-size:17px}.cp{font-size:13px;color:var(--mu)}
.soon{font-size:15px;color:var(--ink)}
#toast{font-size:16px}
/* 꿈송이 */
.ch-b{font-size:16px;line-height:1.65}.src{font-size:13px;color:var(--mu)}.ch-h .mu{font-size:13px}
#chatpan{width:420px}
#chatfab{width:76px;height:76px;font-size:15px}
.me{background:var(--rule2)}
@media (max-width:760px){
body{font-size:17px}
.st{font-size:17px}.due{font-size:15px}.ttl{font-size:19px}
.cd{min-height:60px}.btn{padding:11px 18px}

/* ===== 디자인 틀 50가지: html[data-*] 속성으로 모양을 바꿉니다 ===== */
html{--rr:12px}
html[data-round="0"]{--rr:0px}html[data-round="6"]{--rr:6px}html[data-round="12"]{--rr:12px}html[data-round="18"]{--rr:22px}

html[data-page=notebook] #app{padding-left:64px;border-radius:6px calc(var(--rr)*1.4) calc(var(--rr)*1.4) 6px;background:linear-gradient(90deg,transparent 44px,var(--margin) 44px,var(--margin) 46px,transparent 46px),var(--paper2)}

html[data-page=steno] #app::before{display:block;content:"";position:absolute;left:0;right:0;top:-9px;bottom:auto;width:auto;height:30px;background:radial-gradient(circle at 14px 14px,#222 0 5px,#9a9a9a 6px 8px,transparent 9px) 0 0/34px 30px repeat-x}
html:not([data-page=notebook]):not([data-page=sheet]) #app::after{display:none}
/* 메뉴 모양 */
html[data-nav=bar] .nav{gap:2px;border-bottom:1px solid var(--rule)}html[data-nav=bar] .nav a{background:transparent!important;border:0;border-bottom:3px solid transparent;border-radius:0;top:0;padding:9px 14px}html[data-nav=bar] .nav a[aria-current=page]{border-bottom-color:var(--cover);box-shadow:none;background:transparent!important}

html[data-nav=box] .nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));border:2px solid var(--ink);gap:0;margin:10px 0}html[data-nav=box] .nav a{border:0;border-right:1px solid var(--ink);border-radius:0;background:var(--card2)!important;text-align:center;top:0;padding:10px 6px}html[data-nav=box] .nav a[aria-current=page]{background:var(--ink)!important;color:var(--paper2)!important;box-shadow:none;padding-top:10px}

/* ===== 제목·부제·항목 위계 (맨 마지막. 큰제목 > 부제 > 항목 제목 > 항목 설명 순으로 한눈에 구분) ===== */
/* 1) 쪽 큰제목: 크고 굵게, 아래에 진한 줄 */
.bh{border-bottom:3px solid var(--ink);padding-bottom:10px;margin:26px 0 14px;align-items:center}
.bh h2{font-weight:800;font-size:calc(44px*var(--hs));line-height:1.15;color:var(--ink);flex:1 1 auto}
/* 2) 부제: 큰제목 바로 아래 한 줄을 통째로 차지, 색 띠로 눈에 띄게 */
.bh>.mu{order:3;flex:0 0 100%;font-size:17px;font-weight:500;color:var(--ink)!important;background:color-mix(in srgb,var(--cover) 9%,#fff);border-left:5px solid var(--cover);padding:6px 12px;border-radius:0 6px 6px 0}
.bh .btn.sm{order:2}
/* 3) 소제목: 왼쪽 굵은 막대 + 굵은 글씨 */
.h3,h3.h3{font-weight:800;font-size:calc(30px*var(--hs));line-height:1.25;color:var(--ink);border-top:0;border-left:8px solid var(--cover);padding:2px 0 2px 12px;margin:30px 0 12px}
/* 4) 게시판 줄: 분류 = 색 알약, 제목 = 크고 굵게, 설명 = 작고 보통 굵기 */
.row{border-left:6px solid var(--cover)}
.row>summary{grid-template-columns:76px minmax(170px,1fr) minmax(200px,1.5fr) 100px 14px}
.cat{justify-self:start;background:var(--cover);color:#fff;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;line-height:1.5;white-space:nowrap}
.row .ttl,.ttl{font-size:22px;font-weight:800;line-height:1.3}
.row .st,.st{font-size:17px;font-weight:400;color:color-mix(in srgb,var(--ink) 78%,var(--paper2))}
.row[open]>summary{border-bottom:2px solid var(--cover);margin-bottom:10px}
/* 5) 큰제목 바로 아래 흐릿한 설명이 되던 .mu 는 그대로 두고, 표 머리글만 진하게 */
.tbl th,.cols{color:var(--ink);font-weight:700}

/* ===== 플래너 스킨 (굿노트·캔바 디지털 플래너 느낌: 흰 카드 · 둥근 모서리 · 한 가지 파스텔 포인트) ===== */
html[data-skin="planner"] body{background:color-mix(in srgb,var(--cover) 13%,#fff) fixed!important}
html[data-skin="planner"] #app{max-width:1200px;margin:16px auto 90px;padding:22px 30px 60px!important;background:#fff!important;border:0!important;border-radius:28px!important;box-shadow:0 12px 44px rgba(50,60,90,.10)!important}
html[data-skin="planner"] #app::before,html[data-skin="planner"] #app::after{display:none!important}
html[data-skin="planner"] .mast{border:0!important;padding:4px 0 8px!important}
html[data-skin="planner"] .mast2 .dt,html[data-skin="planner"] .mast2{background:color-mix(in srgb,var(--cover) 12%,#fff)!important;border:0!important;box-shadow:none!important;border-radius:14px;padding:6px 14px;transform:none!important;color:var(--ink)}
html[data-skin="planner"] .nav{display:flex;flex-wrap:wrap;gap:8px!important;padding:8px 0 14px!important;border:0!important;background:transparent!important}
html[data-skin="planner"] .nav a{background:color-mix(in srgb,var(--cover) 12%,#fff)!important;color:var(--ink)!important;border:0!important;border-radius:999px!important;padding:9px 20px!important;font-weight:800;box-shadow:none!important;text-decoration:none}
html[data-skin="planner"] .nav a[aria-current]{background:var(--cover)!important;color:#fff!important}
html[data-skin="planner"] .bh{border-bottom:0!important;margin:14px 0 10px!important;padding-bottom:0!important}
html[data-skin="planner"] .bh h2{font-size:calc(38px*var(--hs))!important}
html[data-skin="planner"] .bh>.mu{background:color-mix(in srgb,var(--cover) 10%,#fff)!important;border-left:0!important;border-radius:12px!important}
html[data-skin="planner"] .h3,html[data-skin="planner"] h3.h3{border:0!important;padding:0!important;margin:26px 0 10px!important;font-size:calc(24px*var(--hs))!important;display:flex;align-items:center;gap:10px}
html[data-skin="planner"] .h3::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--cover)}
html[data-skin="planner"] .cols{display:none!important}
html[data-skin="planner"] .row{border:0!important;border-radius:20px!important;background:color-mix(in srgb,var(--cover) 8%,#fff)!important;box-shadow:none!important;margin:10px 0!important}
html[data-skin="planner"] .row[open]{background:#fff!important;box-shadow:0 6px 22px rgba(50,60,90,.12)!important;outline:2px solid color-mix(in srgb,var(--cover) 30%,#fff)}
html[data-skin="planner"] .row>summary{padding:14px 20px!important;border:0!important}
html[data-skin="planner"] .row[open]>summary{border-bottom:0!important}
html[data-skin="planner"] .cat{background:color-mix(in srgb,var(--cover) 28%,#fff)!important;color:var(--ink)!important}
html[data-skin="planner"] .mcal,html[data-skin="planner"] .sbanner,html[data-skin="planner"] .dw,html[data-skin="planner"] .pmemo,html[data-skin="planner"] .soon{border:0!important;border-radius:22px!important;background:color-mix(in srgb,var(--cover) 7%,#fff)!important;box-shadow:none!important}
html[data-skin="planner"] .drawer{border:0!important;border-radius:22px;padding:14px 18px!important}
html[data-skin="planner"] .btn{border:0!important;border-radius:999px!important;background:color-mix(in srgb,var(--cover) 14%,#fff)!important;color:var(--ink)!important;font-weight:700}
html[data-skin="planner"] .btn.pri,html[data-skin="planner"] .nvx{background:var(--cover)!important;color:#fff!important}
html[data-skin="planner"] .btn:hover{filter:brightness(.96)}
html[data-skin="planner"] input:not([type=checkbox]):not([type=radio]),html[data-skin="planner"] select{border:1.5px solid color-mix(in srgb,var(--cover) 28%,#fff)!important;border-radius:14px!important;background:#fff!important}
html[data-skin="planner"] .tbl th{background:color-mix(in srgb,var(--cover) 14%,#fff)}
html[data-skin="planner"] .tbl td,html[data-skin="planner"] .tbl th{border-color:color-mix(in srgb,var(--cover) 14%,#fff)!important}
html[data-skin="planner"] #wm{opacity:.28}
html[data-skin="planner"] details.sec{border-bottom:1px solid color-mix(in srgb,var(--cover) 14%,#fff)}
@media(max-width:700px){html[data-skin="planner"] #app{margin:0 auto 70px;padding:14px 14px 50px!important;border-radius:0 0 22px 22px!important}html[data-skin="planner"] .nav a{padding:8px 14px!important;font-size:15px}}
html[data-skin="planner"] nav.nav{border:0!important;border-bottom:0!important}html[data-skin="planner"] .mcal .wk,html[data-skin="planner"] .mcal thead{border-color:transparent!important}
.agc{background:#f4f8ff;border:1px solid #b9d4f5;border-radius:14px;padding:10px 12px;margin:6px 0}.agc ul{margin:6px 0;padding-left:18px}.agc li{margin:4px 0;line-height:1.5}.agc li.bad{color:var(--red)}.agd{font-weight:800;margin:6px 0 0}
.ckb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:#fff8e6;border-top:1px solid #f0dca8;font-size:12px}.ckb.on{background:#eef8f0;border-color:#cfe8d5}.ckb span{flex:1 1 100%}.ckb.on span{flex:1}.ckb input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line,#ddd);border-radius:8px}

#demostrip{position:sticky;top:0;z-index:70;background:#d9534f;color:#fff;font-size:13px;text-align:center;padding:6px 10px;line-height:1.5}#demostrip a{color:#fff;font-weight:800;margin-left:8px;text-decoration:underline}@media print{#demostrip{display:none}}

/* ===== 소개 페이지 디자인을 기본 화면으로: 크림색 줄노트 + 굵은 선·딱지 그림자 + 파스텔 카드 (플래너 기본 스킨 덮어쓰기) ===== */
html[data-skin="planner"]{--ink2:#2b2a33;--pk:#ffd9e0;--sk:#d6e8ff;--lm:#fff2b8;--lv:#e6dcff;--mt:#cfeee3;--mt2:#9bd8c2}
html[data-skin="planner"] body{background:#fffdf6 linear-gradient(#e6e0cf 1px,transparent 1px) 0 0/100% 34px fixed!important;color:var(--ink2);word-break:keep-all;line-height:1.7}
html[data-skin="planner"] #app{background:transparent!important;box-shadow:none!important;border-radius:0!important;max-width:1100px}
html[data-skin="planner"] h1,html[data-skin="planner"] h2,html[data-skin="planner"] .mast1 h1,html[data-skin="planner"] .bh h2{font-weight:900!important;letter-spacing:-.03em}
html[data-skin="planner"] .h3,html[data-skin="planner"] h3.h3{font-weight:900!important;letter-spacing:-.02em}
html[data-skin="planner"] .h3::before{width:14px;height:14px;background:var(--mt2);border:2px solid var(--ink2)}
html[data-skin="planner"] .mast2,html[data-skin="planner"] .mast2 .dt{background:var(--lm)!important;border:2px solid var(--ink2)!important;border-radius:12px!important;box-shadow:3px 3px 0 var(--ink2)!important;transform:rotate(-.6deg)}
html[data-skin="planner"] .nav a{background:#fff!important;border:2px solid var(--ink2)!important;box-shadow:2px 2px 0 var(--ink2);font-weight:800!important;color:var(--ink2)!important}
html[data-skin="planner"] .nav a[aria-current]{background:var(--mt2)!important;color:var(--ink2)!important}
html[data-skin="planner"] .nav .nvx{background:#ffb4ab!important;color:var(--ink2)!important}
html[data-skin="planner"] .row,html[data-skin="planner"] .mcal,html[data-skin="planner"] .sbanner,html[data-skin="planner"] .dw,html[data-skin="planner"] .pmemo,html[data-skin="planner"] .soon,html[data-skin="planner"] .drawer,html[data-skin="planner"] .qk,html[data-skin="planner"] .agc,html[data-skin="planner"] .docdlg{border:2px solid var(--ink2)!important;border-radius:18px!important;box-shadow:4px 4px 0 rgba(43,42,51,.92)!important}
html[data-skin="planner"] .row{background:#fff!important}
html[data-skin="planner"] .row:nth-of-type(4n+1){background:var(--mt)!important}
html[data-skin="planner"] .row:nth-of-type(4n+2){background:var(--sk)!important}
html[data-skin="planner"] .row:nth-of-type(4n+3){background:var(--lm)!important}
html[data-skin="planner"] .row:nth-of-type(4n){background:var(--pk)!important}
html[data-skin="planner"] .row[open]{outline:0;background:#fff!important}
html[data-skin="planner"] .mcal,html[data-skin="planner"] .dw,html[data-skin="planner"] .soon{background:#fff!important}
html[data-skin="planner"] .sbanner{background:var(--lv)!important}
html[data-skin="planner"] .bh>.mu{background:var(--lm)!important;border:2px solid var(--ink2)!important;border-radius:12px!important}
html[data-skin="planner"] .cat{background:var(--lv)!important;border:1.5px solid var(--ink2);font-weight:800}
html[data-skin="planner"] .btn{background:#fff!important;border:2px solid var(--ink2)!important;border-radius:14px!important;box-shadow:3px 3px 0 var(--ink2);color:var(--ink2)!important;font-weight:800!important;transition:transform .12s,box-shadow .12s}
html[data-skin="planner"] .btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink2);filter:none}
html[data-skin="planner"] .btn.pri{background:var(--mt2)!important;color:var(--ink2)!important}
html[data-skin="planner"] input:not([type=checkbox]):not([type=radio]),html[data-skin="planner"] select,html[data-skin="planner"] textarea{border:2px solid var(--ink2)!important;border-radius:12px!important}
html[data-skin="planner"] .tbl th{background:var(--lm)!important}
html[data-skin="planner"] .tbl td,html[data-skin="planner"] .tbl th{border-color:var(--ink2)!important}
html[data-skin="planner"] #wm{opacity:.22}
html[data-skin="planner"] #chatpan{border:2px solid var(--ink2);box-shadow:6px 6px 0 var(--ink2)}
@media(prefers-reduced-motion:reduce){html[data-skin="planner"] .btn{transition:none}}
html[data-skin="planner"] .mast2 .dt{border:0!important;box-shadow:none!important;transform:none;background:transparent!important}
.trsum{background:#fff8d6;border:2px solid var(--ink,#2b2a33);border-radius:14px;padding:10px 14px;margin:6px 0 10px;position:relative;overflow:hidden}.trsum b{display:block;font-size:19px;font-weight:900}.trsum span{font-size:13.5px;color:var(--mu)}.trsum i{display:block;height:8px;border-radius:99px;background:#fff;border:1.5px solid var(--ink,#2b2a33);margin-top:6px;position:relative}.trsum i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p);background:#9bd8c2;border-radius:99px}
.trsites{margin-top:12px;padding-top:10px;border-top:2px dashed var(--rule,#ccc)}.trsites h4{margin:0 0 8px;font-size:16px;font-weight:900}.trchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.trchip{display:inline-flex;align-items:center;gap:2px;background:#d6e8ff;border:2px solid var(--ink,#2b2a33);border-radius:999px;padding:3px 6px 3px 12px;font-weight:800}.trchip a{color:inherit;text-decoration:none}.trchip .x{border:0;background:transparent;padding:2px 5px;cursor:pointer;font-size:13px}


/* ===== 디데이 칩 + 기한 알림 막대 (조용한 톤: 종이색 바탕, 빨강은 D-1 이하에만) ===== */
.ddstrip{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.ddc{display:inline-flex;align-items:baseline;gap:8px;background:var(--card2);border:1px solid var(--rule);border-radius:999px;padding:4px 14px 4px 12px;font-size:16px;color:var(--ink)}

.ddn{flex:none;min-width:64px;font-weight:800;font-size:18px}.ddn.past{color:var(--mu);font-weight:500}
#alarmbar{position:fixed;left:14px;bottom:14px;width:min(520px,calc(100vw - 118px));z-index:40;background:var(--card2);color:var(--ink);border:1px solid var(--rule);border-left:5px solid var(--cover);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.22);display:flex;flex-wrap:wrap;align-items:center}

#alarmbar .al-h{flex:1 0 100%;display:flex;align-items:baseline;gap:10px;padding:10px 6px 4px 14px}

#alarmbar .al-i .al-t{flex:1;white-space:normal}#alarmbar .al-d{color:var(--mu);font-size:14px}
#alarmbar .al-f{flex:1 0 100%;padding:4px 14px 10px}#alarmbar .al-f .btn{margin:6px 8px 0 0}
body.hasalarm #app{margin-bottom:96px}

@media(max-width:760px){#alarmbar{left:8px;width:calc(100vw - 100px)}}
@media print{#alarmbar{display:none!important}}

#alarmbar .al-h{flex-wrap:nowrap}#alarmbar .al-h b,#alarmbar .al-h .mu{white-space:nowrap}

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

/* ---- 큰 자료(필기 그림, 업로드 문서, 꿈송이 사진)는 IndexedDB, 막히면 메모리 ---- */
const mem = new Map();
const idb = {
  p: null,
  open() {
    if (this.p) return this.p;
    this.p = new Promise((res, rej) => {
      try {
        const r = indexedDB.open(window.TF_DEMO ? 'travailfatal-demo' : 'travailfatal', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return this.p;
  },
  async get(k) {
    try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); }
    catch (e) { return mem.get(k); }
  },
  async set(k, v) {
    try { const db = await this.open(); await new Promise((res, rej) => { const q = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); q.onsuccess = res; q.onerror = () => rej(q.error); }); }
    catch (e) { mem.set(k, v); }
  },
  async del(k) {
    try { const db = await this.open(); await new Promise(res => { const q = db.transaction('kv', 'readwrite').objectStore('kv').delete(k); q.onsuccess = res; q.onerror = res; }); }
    catch (e) { mem.delete(k); }
  }
};

  S.duties.forEach(d => add('duty', '업무 분장표 · ' + d.dept, `${d.dept} 업무: ${d.work} / 담당: ${d.who}`, '#/lib'));
  (S.mine || []).forEach(m => add('duty', '내 업무 · ' + m.cat, `내 업무(${m.cat}): ${m.title}${m.memo ? ' / 메모: ' + m.memo : ''}${m.done ? ' (완료)' : ''}`, '#/'));
  (S.docLog || []).forEach(x => add('doc', '공문 기록 · ' + x.date, `공문 ${x.title}: ${x.done ? '처리 완료' : '아직 처리 안 함'}${x.note ? ' · 처리 내용: ' + x.note : ''}`, '#/'));
  Object.keys(S.pmemo || {}).forEach(k => { if ((S.pmemo[k] || '').trim()) add('note', '페이지 메모 · ' + ((PMEMO.find(p => p[0] === k) || [0, k])[1]), S.pmemo[k], '#/' + k); });
  Object.keys(S.dayMemo || {}).forEach(k => { if ((S.dayMemo[k] || '').trim()) add('note', '캘린더 메모 · ' + k, `${k} 메모: ${S.dayMemo[k]}`, '#/cal'); });
  S.contacts.forEach(d => add('contact', '교내 연락망 · ' + d.dept, `${d.dept} ${d.name} 내선 ${d.ext || '-'} 전화 ${d.phone || '-'}`, '#/lib'));
  S.notes.forEach(n => {
    const head = `회의·연수 노트 · ${n.date} ${n.title}`;
    (n.links || []).forEach(k => { const r = resolve(k); if (r) add('note', head + ' · 연결', '연결: ' + r.label, '#/note/' + n.id, n.lock); });
    if (n.decisions) add('note', head + ' · 결정', n.decisions, '#/note/' + n.id, n.lock);

    String(n.body || '').split(/\n{1,}/).filter(x => x.trim()).forEach(p => add('note', head, p, '#/note/' + n.id, n.lock));
  });
  S.items.forEach(i => add('item', i.src === '학사' ? '학사일정' : (i.cat === 'todo' ? '할 일' : '일정'), `${i.title} ${i.date ? i.date : ''}${i.end ? ' ~ ' + i.end : ''} ${i.cat === 'todo' ? (i.done ? '완료' : '미완료') : (i.src === '학사' ? '학사일정' : '일정')}`, '#/cal'));
  { const dn = ['', '월', '화', '수', '목', '금'];
    for (let d = 1; d <= 5; d++) { const l = [1, 2, 3, 4, 5, 6, 7].filter(p => S.timetable[d + '-' + p]).map(p => `${p}교시 ${S.timetable[d + '-' + p]}`); if (l.length) add('timetable', '시간표 · ' + dn[d] + '요일', `${dn[d]}요일 시간표 ${l.join(', ')}`, '#/class'); } }
  Object.keys(S.docs || {}).forEach(k => { const d = S.docs[k]; if (d && (d.recv || d.done)) add('docs', '공문 현황', `${k} 공문 접수 ${d.recv} 처리 ${d.done} 남음 ${d.recv - d.done}`, '#/today'); });
  add('profile', '내 정보', `이름 ${S.profile.name} 학교 ${S.profile.school} 교과 ${S.profile.subject} 담당 반 ${S.profile.classes.join(', ')} 1교시 시작 ${S.profile.start} 개발 연수 목표 ${S.profile.devTarget}시간`, '#/set');
  S.budget.forEach(p => {
    add('budget', `예산 · ${p.name}`, `${p.name} 총액 ${won(projAlloc(p))}원 집행 ${won(projSpent(p))}원 잔액 ${won(projAlloc(p) - projSpent(p))}원 집행률 ${projAlloc(p) ? Math.round(projSpent(p) / projAlloc(p) * 100) : 0}%`, '#/budget');
    (p.spends || []).forEach(s => add('budget', `예산 · ${p.name} 사용내역`, `${s.date} ${s.desc} ${won(s.amt)}원 (${p.name})`, '#/budget'));
  });
  S.budget.forEach(p => p.lines.forEach(l => {
    const sp = spentOf(l);

    (l.spends || []).forEach(s => add('budget', `예산 · ${p.name} · ${l.item} 지출`, `${s.date} ${s.desc} ${won(s.amt)}원 (${p.name} ${l.item})`, '#/budget'));
  }));
  S.assess.forEach(a => add('assess', '수행평가', `${a.title} ${a.grade || ''} 기한 ${a.due || '미정'} 단계 ${ASSESS_STEPS[a.step || 0]}`, '#/eval'));
  S.training.forEach(t => add('training', '연수 · ' + t.title, `${t.title} ${t.type}연수 ${t.hours}시간 ${t.done ? '이수' : '미이수'} 이수번호 ${t.certNo || '미입력'} 이수일 ${t.doneDate || '없음'} 기한 ${t.due || '없음'}`, '#/today'));
  S.lessons.forEach(l => add('lesson', '수업 진도', `${l.cls} ${l.unit} ${l.done}/${l.total}차시`, '#/class'));
  S.pages.forEach(pg => {
    const lines = (pg.blocks || []).map(b => b.t === 'table' ? (b.rows || []).map(r => r.join(' | ')).join('\n') : b.t === 'todo' ? (b.done ? '[완료] ' : '[할 일] ') + b.x : b.t === 'toggle' ? b.x + ' ' + (b.y || '') : b.t === 'link' ? b.x + ' ' + (b.u || '') : b.t === 'ref' ? '연결: ' + ((resolve(b.u) || {}).label || '') : b.x || '').filter(x => String(x).trim());
    (pg.links || []).forEach(k => { const r = resolve(k); if (r) lines.push('연결: ' + r.label); });
    let buf = ''; const flush = () => { if (buf.trim()) add('page', '내 페이지 · ' + (pg.title || '제목 없음'), buf.trim(), '#/page/' + pg.id, pg.lock); buf = ''; };
    lines.forEach(l => { if ((buf + ' ' + l).length > 380) flush(); buf += (buf ? '\n' : '') + l; }); flush();
    if (!lines.length) add('page', '내 페이지', pg.title || '제목 없음', '#/page/' + pg.id, pg.lock);
  });
  S.links.forEach(l => add('link', '서랍', `${l.name} ${l.url}`, l.url));
  LIB.forEach(d => {
    const pages = d.text.split('\f');
    pages.forEach((pg, pi) => {
      const paras = pg.split(/\n+/).map(x => x.trim()).filter(Boolean);
      let buf = '';
      const flush = () => { if (buf.trim()) add('doc', `${d.kind} · ${d.name}${pages.length > 1 ? ' · ' + (pi + 1) + '쪽' : ''}`, buf.trim(), '#/lib'); buf = ''; };
      paras.forEach(p => { if ((buf + ' ' + p).length > 380) flush(); buf += (buf ? ' ' : '') + p; });
      flush();
    });
  });
  return c;
}

/* 2) 말투가 엉망이어도 찾도록: 글자 두 개씩 끊어 비교 + 비슷한 말 + 의도 파악 */
const SYN = {
  '돈': ['예산', '금액', '집행', '잔액'], '쓰는': ['집행', '사용'], '비용': ['예산', '집행'], '얼마': ['금액', '잔액'],
  '누가': ['담당', '업무'], '누구': ['담당', '업무'], '맡': ['담당'], '전화': ['내선', '연락'], '번호': ['내선', '전화'], '연락': ['내선', '전화'],
  '회의': ['회의록', '협의', '결정'], '언제': ['기한', '마감', '일정'], '까지': ['기한', '마감'], '마감': ['기한'], '숙제': ['할 일', '제출'],
  '체육관': ['강당', '체육'], '시험': ['평가', '지필', '수행'], '수행': ['평가'], '연수': ['이수', '시간'], '출장': ['복명', '여비'], '결시': ['미인정', '인정', '결석'],
  '진도': ['차시', '단원'], '평가': ['수행', '성적']
};
const STOP = new Set(['했더', '더라', '라고', '다고', '는지', '있나', '있어', '어디', '뭐였', '였더', '한테', '에서', '에게', '해줘', '알려', '려줘', '주세', '세요', '무엇', '어떻', '떻게', '입니', '니다', '이랑', '하는', '하고', '그거', '저번', '지난', '이번', '어떤', '였지', '했지', '였나', '한다', '된다', '있는', '없는', '알아']);
const norm = s => String(s).toLowerCase().replace(/[^0-9a-z가-힣]/g, '');
function grams(s) { const n = norm(s), g = new Set(); for (let i = 0; i < n.length - 1; i++) { const b = n.slice(i, i + 2); if (!STOP.has(b)) g.add(b); } return g; }

function intent(q) {
  const t = new Set();
  if (/누가|누구|담당|맡|분장/.test(q)) { t.add('duty'); t.add('contact'); }
  if (/전화|번호|내선|연락/.test(q)) t.add('contact');
  if (/돈|예산|잔액|얼마|집행|비용|품의|결제/.test(q)) t.add('budget');
  if (/회의|결정|협의|말씀|얘기/.test(q)) t.add('note');
  if (/수행|평가|채점|시험/.test(q)) t.add('assess');
  if (/연수|이수|교육|훈련|소방|안전|재난|예방/.test(q)) t.add('training');
  if (/시간표|교시|몇\s*교시|수업\s*시간/.test(q)) t.add('timetable');
  if (/공문/.test(q)) t.add('docs');
  if (/학사|방학|개학|행사|시험|입학|졸업/.test(q)) t.add('item');
  if (/진도|차시|단원/.test(q)) t.add('lesson');
  if (/규정|지침|복무|출장|결시|학칙|규칙/.test(q)) t.add('doc');
  return t;
}

function search(q, forLLM) {
  const all = buildChunks().filter(c => !(forLLM && c.priv));
  if (!all.length) return [];
  const qg = new Map();
  grams(q).forEach(g => qg.set(g, 1));
  const qn = norm(q);
  Object.keys(SYN).forEach(k => { if (qn.includes(k)) SYN[k].forEach(w => grams(w).forEach(g => { if (!qg.has(g)) qg.set(g, .6); })); });
  if (!qg.size) return [];
  const docs = all.map(c => ({ c, n: norm(c.src + c.text) }));
  const df = new Map(); qg.forEach((_, g) => df.set(g, docs.filter(d => d.n.includes(g)).length));
  const it = intent(q);
  let res = docs.map(d => {
    let s = 0, hit = 0;
    qg.forEach((w, g) => { if (d.n.includes(g)) { hit++; s += w * (Math.log(1 + docs.length / (1 + df.get(g)))); } });
    if (it.has(d.c.type)) s *= 1.6;
    return { c: d.c, s, hit };
  }).filter(r => r.hit >= 2 && r.s > 0).sort((a, b) => b.s - a.s);
  if (res.length) { const top = res[0].s; res = res.filter(r => r.s >= top * .35); }
  return res.slice(0, 5);
}

function snippet(text, q) {
  const gs = [...grams(q)];
  let pos = 0; for (const g of gs) { const i = norm(text).indexOf(g); if (i >= 0) { pos = i; break; } }
  let t = text.length > 200 ? text.slice(Math.max(0, pos - 40), pos + 160) + '…' : text;
  t = esc(t);
  return t;
}

/* 3) 바로 계산해서 답할 수 있는 질문(잔액, 마감, 내 업무) */
function direct(q) {
  const out = [];
  if (/잔액|남은\s*(돈|예산)|얼마\s*(남|썼)|예산\s*(현황|얼마)/.test(q)) {
    const t = btot();
    if (S.budget.length) out.push({ src: '예산 장부(계산)', text: `전체 배정 ${won(t.a)}원 · 집행 ${won(t.s)}원 · 잔액 ${won(t.b)}원 (집행 ${t.a ? Math.round(t.s / t.a * 100) : 0}%)`, ref: '#/budget' });
  }
  if (/번호|전화|연락처|내선|연락\s?망|핸드폰|폰번/.test(q) && (S.contacts || []).length) {
    const toks = q.replace(/번호|전화|연락처|내선|연락\s?망|핸드폰|폰번|알려줘|알려|찾아줘|찾아|좀|뭐야|뭐지|어디|선생님|샘|쌤|님|[은는이가의을를도]\b/g, ' ').split(/[\s,?.!]+/).filter(w => w.length >= 2);
    const hit = (S.contacts || []).filter(c => toks.some(t => (c.dept + ' ' + c.name).includes(t) || t.includes(c.name || '\u0000') || t.includes(c.dept || '\u0000')));
    if (hit.length) out.push({ src: '교내 연락망', text: hit.slice(0, 8).map(c => `${c.dept} ${c.name} · 내선 ${c.ext || '-'} · 전화 ${c.phone || '-'}`).join(' / '), ref: '#/lib' });
  }
  if (/급식|점심|중식|석식|메뉴|밥/.test(q) && typeof mealFor === 'function') {
    const k = /모레/.test(q) ? 2 : /내일/.test(q) ? 1 : 0, d = new Date(Date.now() + k * 864e5), ds = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), m = mealFor(ds);
    out.push({ src: '급식 · ' + md(ds), text: m.length ? m.map(x => `${x.kind}: ${x.dishes.map(cleanDish).join(', ')} ${x.kcal || ''}`).join(' / ') : `${md(ds)}에는 급식 자료가 없습니다(주말·방학이거나 아직 받지 못함).`, ref: '#/' });
  }
  if (/마감|기한|급한|다가오|이번\s*주/.test(q)) {
    const ev = upcoming(14);
    if (ev.length) out.push({ src: '일정(계산)', text: '14일 안의 기한: ' + ev.slice(0, 6).map(e => `${md(e.date)} ${e.t}(${ddText(dd(e.date))})`).join(' / '), ref: '#/cal' });
  }
  if (/이수\s*번호|이수증|연수.*(현황|목록|전부|모두|다)|들은\s*연수/.test(q)) {
    const T = S.training;
    if (T.length) out.push({ src: '연수 이수 현황(전체)', text: T.map(t => `${t.title}(${t.type} ${t.hours}시간): ${t.done ? '이수 · 번호 ' + (t.certNo || '미입력') + (t.doneDate ? ' · ' + t.doneDate : '') : '미이수' + (t.due ? ' · 기한 ' + t.due : '')}`).join('\n'), ref: '#/today' });
  }
  if (/오늘\s*(수업|시간표)|몇\s*교시|시간표/.test(q)) {
    const d = new Date().getDay(), l = d >= 1 && d <= 5 ? [1, 2, 3, 4, 5, 6, 7].map(p => `${p}교시 ${S.timetable[d + '-' + p] || '—'}`) : [];
    if (l.length && Object.keys(S.timetable).some(k => S.timetable[k])) out.push({ src: '시간표(오늘)', text: l.join(' / '), ref: '#/class' });
  }
  if (/(내|제|나의).*(업무|담당)|내가\s*맡/.test(q)) {
    const m = S.duties.filter(d => d.mine);
    const mm = S.mine || [];
    if (mm.length) out.push({ src: '내 업무', text: mm.map(x => `${x.cat}: ${x.title}${x.done ? '(완료)' : ''}`).join(' / '), ref: '#/' });
    else if (m.length) out.push({ src: '업무 분장표(내 업무)', text: m.map(d => `${d.dept}: ${d.work}`).join(' / '), ref: '#/lib' });
  }
  return out;
}

/* 4) 선택: Claude 키를 넣으면 찾은 조각만 보내서 문장으로 정리 */
async function askClaude(q, hits) {
  const key = localStorage.getItem('tf.claudeKey'); if (!key) return null;
  const ctx = hits.map((h, i) => `[${i + 1}] (${h.c.src}) ${h.c.text}`).join('\n');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-haiku-5-5', max_tokens: 700, system: '당신은 학교 교사의 업무 비서 꿈송이입니다. 아래 [자료] 안에서만 존댓말로 짧게 답하고, 근거 번호를 [1]처럼 붙이세요. 자료에 없으면 없다고 말하세요. 질문이 맞춤법·말투가 엉망이어도 의도를 파악하세요.', messages: [{ role: 'user', content: `질문: ${q}\n\n[자료]\n${ctx}` }] })
  });
  if (!r.ok) throw new Error('Claude 응답 오류 ' + r.status);
  const j = await r.json(); return (j.content || []).map(x => x.text || '').join('');
}

/* 5) 계획서·공문 글에서 '항목+금액+기한' 후보 뽑기 */
function extractBudget(text) {
  const out = [];
  const dateRe = /(20\d\d)[.\-/]\s?(\d{1,2})[.\-/]\s?(\d{1,2})|(\d{1,2})\s?월\s?(\d{1,2})\s?일|(\d{1,2})\/(\d{1,2})/;
  const yr = new Date().getFullYear();
  text.split(/\n|\f/).forEach(line => {
    const m = line.match(/([가-힣A-Za-z·\s()]{2,30}?)[\s:：|·\-]*([\d]{1,3}(?:,\d{3})+|\d{4,})\s*원?/);
    if (!m) return;
    const amt = +m[2].replace(/,/g, ''); if (amt < 1000) return;
    if (/(전화|연락|우편|번호)/.test(m[1])) return;
    let item = m[1].replace(/\s+/g, ' ').trim(); if (item.length < 2) return;
    let dl = ''; const d = line.match(dateRe);
    if (d) { if (d[1]) dl = `${d[1]}-${pad(d[2])}-${pad(d[3])}`; else if (d[4]) dl = `${yr}-${pad(d[4])}-${pad(d[5])}`; else if (+d[6] <= 12 && +d[7] <= 31) dl = `${yr}-${pad(d[6])}-${pad(d[7])}`; }
    out.push({ item, alloc: amt, deadline: dl, on: true });
  });
  return out.slice(0, 40);
}

/* 6) 학사일정 글에서 '날짜(또는 기간) + 행사 이름' 뽑기 — 연도가 없으면 학년도(3월~다음해 2월)로 추정 */
function schoolYearNow() { const n = new Date(); return n.getMonth() + 1 >= 3 ? n.getFullYear() : n.getFullYear() - 1; }
function extractSchedule(text, sy) {
  const yr = m => (m >= 3 ? sy : sy + 1), out = [];
  const W = '\\s*(?:\\([월화수목금토일]\\))?';
  const re = new RegExp('(?:(20\\d\\d)\\s*[.\\-/년]\\s*)?(\\d{1,2})\\s*[.\\-/월]\\s*(\\d{1,2})\\s*일?' + W + '(?:\\s*[~∼～–\\-]\\s*(?:(20\\d\\d)\\s*[.\\-/년]\\s*)?(?:(\\d{1,2})\\s*[.\\-/월]\\s*)?(\\d{1,2})\\s*일?' + W + ')?', 'g');
  const clean = s => s.replace(/[|]+/g, ' ').replace(/^[\s:：,.\-–·•○▪■※*)\]]+/, '').replace(/[\s,;]+$/, '').replace(/\s+[월화수목금토일]$/, '').replace(/\s+/g, ' ').trim();
  text.split(/\n|\f/).forEach(line => {
    line = line.trim(); if (!line) return;
    const ms = [...line.matchAll(re)].filter(m => +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31);
    ms.forEach((m, i) => {

    <label class="pnote">📝 비고·특이사항<textarea data-pnote="${p.id}" rows="2" placeholder="예: 3월까지 집행, 외부 강사비 별도 편성, 이월 불가" aria-label="사업 비고">${esc(p.note || '')}</textarea></label>
    <form class="inl" data-form="pspend" data-p="${p.id}"><input type="date" name="date" value="${today()}" aria-label="날짜"><input name="desc" placeholder="사용 내용 (선택)" aria-label="사용 내용"><input name="amt" type="number" min="0" inputmode="numeric" placeholder="사용 금액(원)" required aria-label="사용 금액"><button class="btn pri">사용 금액 넣기</button></form>
    ${rows ? `<table class="tbl"><thead><tr><th>날짜</th><th>내용</th><th class="r">사용액</th><th class="r">누적 집행</th><th class="r">잔액</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="mu">사용한 금액을 하나씩 넣으면 집행률과 잔액이 바로 계산됩니다.</p>'}
    <details class="doc"><summary>목·항목별로 나누어 관리하기 (선택) ${p.lines.length ? '· ' + p.lines.length + '개' : ''}</summary>${lines}<button class="btn sm" data-act="lineAdd" data-p="${p.id}">+ 목·항목</button><p class="mu">목별 배정액을 넣으면 위 총액 대신 목별 배정의 합이 총액이 됩니다(총액 칸이 비어 있을 때).</p></details></section>`;
  }).join('');
  return `<div class="bh"><h2>예산 장부</h2><span class="mu">총액을 넣고 쓴 돈을 하나씩 넣으면 집행률·잔액이 저절로 나옵니다.</span></div>

  <p class="mu">계획서(PDF·엑셀·텍스트)를 올리면 항목·금액·기한 후보를 찾아 보여 드립니다. 확인하고 체크한 것만 장부에 들어갑니다. 한글(hwp) 파일은 PDF로 저장해서 올려 주세요.</p>${projs || '<p class="mu">아직 사업이 없습니다. “사업 만들기”를 눌러 시작하세요.</p>'}`;

  <h3 class="h3">작업표시줄에 고정 · 위젯처럼 쓰기 (설치 방법)</h3><div class="guide"><p><b>① 컴퓨터(윈도우) — 크롬·엣지</b></p><ol><li>평소 업무포털에 로그인하는 브라우저로 이 사이트 주소를 엽니다.</li><li>주소창 오른쪽 끝의 <b>설치 아이콘</b>(모니터에 아래 화살표)을 누르고 <b>설치</b>를 누릅니다. 엣지는 ⋯ 메뉴 → 앱 → <b>이 사이트를 앱으로 설치</b>입니다.</li><li>따로 앱 창이 뜨면 작업표시줄의 아이콘을 <b>우클릭 → 작업 표시줄에 고정</b>합니다. (설치 창에서 '작업 표시줄에 고정'을 고를 수도 있습니다.)</li><li>이제 아이콘 한 번으로 바로 열립니다.</li></ol><p><b>② 위젯처럼 작게 띄워 두기</b></p><ol><li>설치한 앱 창을 모니터 한쪽 구석으로 줄여 놓으면 창 크기를 기억합니다. 시간표·할 일·급식이 나오는 <b>오늘 화면</b>만 띄워 두면 위젯처럼 쓸 수 있습니다.</li><li>윈도우 위젯판·바탕화면 위젯에는 웹앱을 직접 넣을 수 없습니다. 그래서 '작게 띄운 앱 창'이 가장 가깝고 안정적인 방법입니다.</li></ol><p><b>③ 폰·태블릿</b></p><ul><li><b>안드로이드(크롬):</b> ⋮ 메뉴 → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>.</li><li><b>아이폰·아이패드(사파리):</b> 공유 버튼 → <b>홈 화면에 추가</b>.</li><li>홈 화면 아이콘으로 열면 주소창 없이 앱처럼 보입니다.</li></ul><p class="mu">설치가 안 보이면 주소가 https:// 로 시작하는 깃허브 페이지 주소인지 확인하세요. 파일을 더블클릭해 연 화면에서는 설치되지 않습니다. 화면이 예전 그대로면 Ctrl+Shift+R 을 한 번 누르세요.</p></div>

3 class="h3">새 학년도</h3><p class="mu">학년도가 바뀌면 이 버튼을 누르세요. 자동으로 백업 파일을 받은 뒤, 시간표·일정·진도·평가·예산·연수·공문·업무분장·연락망을 비웁니다. 내 정보, 메모, 내 페이지, 서랍, 자료실은 그대로 남습니다.</p><div class="tools"><button class="btn pri" data-act="newYear">새 학년도 시작하기</button></div><p class="mu">브라우저 기록을 지우면 이 기기의 데이터가 사라질 수 있으니 가끔 백업 파일을 받아 두세요.</p>`;

/* ---------- 손글씨 ---------- */
function mountNote(id) {
  const n = S.notes.find(x => x.id === id); if (!n) return;
  const cv = $('#ink'); if (!cv) return;
  cv.width = 1400; cv.height = 900; const ctx = cv.getContext('2d'); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  idb.get('ink:' + id).then(u => { if (u) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0); im.src = u; } });
  const T = { color: '#1B1613', w: 3, erase: false }, hist = []; let drawing = false, last = null, sawPen = false, t;
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
  const persist = () => { clearTimeout(t); t = setTimeout(() => idb.set('ink:' + id, cv.toDataURL('image/png')), 500); };
  cv.addEventListener('pointerdown', e => { if (e.pointerType === 'pen') sawPen = true; if (sawPen && e.pointerType === 'touch') return; e.preventDefault(); cv.setPointerCapture(e.pointerId); hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 8) hist.shift(); drawing = true; last = pt(e); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e); ctx.globalCompositeOperation = T.erase ? 'destination-out' : 'source-over'; ctx.strokeStyle = T.color; ctx.lineWidth = T.erase ? 22 : T.w * (e.pointerType === 'pen' && e.pressure ? .5 + e.pressure : 1); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  const end = () => { if (drawing) { drawing = false; persist(); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  $('#inkbox').addEventListener('click', e => {
    const b = e.target.closest('[data-ink]'); if (!b) return; const k = b.dataset.ink;
    if (k === 'pen') { T.color = '#1B1613'; T.erase = false; } else if (k === 'red') { T.color = '#6E1423'; T.erase = false; } else if (k === 'erase') T.erase = true; else if (k === 'thin') T.w = 2; else if (k === 'thick') T.w = 6;
    else if (k === 'undo') { const h = hist.pop(); if (h) { ctx.globalCompositeOperation = 'source-over'; ctx.putImageData(h, 0, 0); persist(); } }
    else if (k === 'clear') sure('필기를 모두 지울까요?', () => { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); ctx.clearRect(0, 0, cv.width, cv.height); persist(); });
    else if (k === 'png') { const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = (n.title || '필기') + '.png'; a.click(); }
  });
}

  CH.push({ role: 'me', text: q }); busy = true; renderChat();
  if (typeof agentTry === 'function') { let done = false; try { done = await agentTry(q); } catch (e) { done = false; } if (done) { busy = false; renderChat(); return; } }
  const dir = direct(q), hits = search(q), blocks = [...dir.map(d => ({ src: d.src, text: d.text, ref: d.ref })), ...hits.map(h => ({ src: h.c.src, text: h.c.text, ref: h.c.ref }))];
  let text = '';
  if (localStorage.getItem('tf.claudeKey')) { try { const h2 = search(q, true); if (h2.length) text = '꿈송이 정리\n' + await askClaude(q, h2); } catch (e) { text = '(문장 정리는 실패해서 찾은 원문만 보여 드립니다: ' + e.message + ')'; } }
  if (!blocks.length && !text) text = '올려 주신 자료에서 찾지 못했습니다. 자료가 아직 안 올라갔거나 표현이 달랐을 수 있어요. 다른 말로 한 번 더 물어봐 주세요.';
  busy = false; CH.push({ role: 'bot', q, blocks, text }); renderChat();
}

/* dday.js — ① 디데이(직접 추가)  ② 기한 알림: 기한이 N일(기본 2일) 안으로 다가오면 화면 아래 얇은 막대로 알려 줌

function ddList() { return (S.dday = S.dday || []); }
const ALARM_KINDS = ['할 일', '평가', '예산', '연수', '디데이'];
const alarmOff = () => parseInt((S.profile || {}).alarmDays, 10) === -1;

/* 알림에 올릴 항목: 오늘부터 N일 안의 기한 */
function alarmItems() {
  const N = alarmDays(), seen = new Set(), out = [];
  allEvents().forEach(e => {
    if (e.done || !ALARM_KINDS.includes(e.kind)) return;
    const n = dd(e.date); if (n === null || n < 0 || n > N) return;
    const k = (e.id || '') + '|' + e.t + '|' + e.date; if (seen.has(k)) return; seen.add(k);
    out.push({ t: String(e.t).replace(/ \((수행평가|연수)\)$/, ''), date: e.date, n, kind: e.kind });
  });
  return out.sort((a, b) => a.n - b.n || a.t.localeCompare(b.t));
}

오랑캐 땅에서도 행해진다.","논어 위령공"],["뜻있는 선비와 어진 사람은 삶을 구하려 어짊을 해치지 않고, 몸을 죽여서라도 어짊을 이룬다.","논어 위령공"],["공부는 미치지 못할 듯이 하라. 그러고도 놓칠까 두려워하라.","논어 태백"],["선비는 넓고 굳세지 않을 수 없다. 짐은 무겁고 길은 멀다.","논어 태백"],["한 번 듣고 열 번 안다.","논어 공야장(안회)"],["총명하되 배우기를 좋아하고 아랫사람에게 묻기를 부끄러워하지 않는다.","논어 공야장"],["거듭 생각한 뒤에 행한다. 두 번이면 충분하다.","논어 공야장"],["어진 사람은 산을 좋아하고 지혜로운 사람은 물을 좋아한다.","논어 옹야"],["어진 사람은 자기가 서고자 할 때 남을 세워 주고, 자기가 이르고자 할 때 남을 이르게 한다.","논어 옹야"],["바탕이 겉모양을 이기면 거칠고, 겉모양이 바탕을 이기면 번지르르하다. 둘이 어우러진 뒤에야 군자다.","논어 옹야"],["얻고자 하는 것이 있으면 먼저 어려운 것을 하고 뒤에 얻으라.","논어 옹야"],["그 위치에 있지 않으면 그 일을 꾀하지 마라.","논어 태백"],["오직 어진 사람만이 사람을 좋아할 수 있고 미워할 수 있다.","논어 이인"],["부귀는 사람이 바라는 것이지만 바른 길로 얻지 않으면 머물지 않는다.","논어 이인"],["의롭지 않은 부귀는 내게 뜬구름과 같다.","논어 술이"],["배우는 데 싫증 내지 않고 가르치는 데 게으르지 않는다.","논어 술이"],["나는 나면서 아는 사람이 아니라, 옛것을 좋아하여 부지런히 구한 사람이다.","논어 술이"],["깨닫고자 애쓰지 않으면 열어 주지 않고, 말하려 애쓰지 않으면 일러 주지 않는다.","논어 술이"],["하나를 들어 세 귀퉁이를 돌려 알지 못하면 다시 가르치지 않는다.","논어 술이"],["공손함이 예에 맞지 않으면 수고롭기만 하고, 신중함이 예에 맞지 않으면 두렵기만 하다.","논어 태백"],["기술자가 일을 잘하려면 먼저 연장을 날카롭게 해야 한다.","논어 위령공"],["작은 일을 참지 못하면 큰 계획을 어지럽힌다.","논어 위령공"],["많은 사람이 미워해도 반드시 살피고, 많은 사람이 좋아해도 반드시 살펴야 한다.","논어 위령공"],["도가 같지 않으면 서로 의논하지 않는다.","논어 위령공"],["사람이 도를 넓히는 것이지 도가 사람을 넓히는 것이 아니다.","논어 위령공"],["군자는 세 가지를 두려워한다. 하늘의 명, 큰 사람, 성인의 말씀.","논어 계씨"],["군자에게는 아홉 가지 생각이 있다. 볼 때는 밝게 보기를, 들을 때는 밝게 듣기를 생각한다.","논어 계씨"],["이로움을 보면 의로움을 생각하고, 위태로움을 보면 목숨을 건다.","논어 헌문"],["말이 행동보다 지나치는 것을 군자는 부끄러워한다.","논어 헌문"],["덕으로 원망을 갚아야 하며, 곧음으로 원망을 갚는다.","논어 헌문"],["옛날 배우는 사람은 자기를 위해 배웠고, 지금 배우는 사람은 남에게 보이려고 배운다.","논어 헌문"],["사람이 가난하면서도 즐거워하고 부유하면서도 예를 좋아하는 것만 못하다.","논어 학이"],["가난하면서 아첨하지 않고 부유하면서 교만하지 않으면 어떻습니까.","논어 학이(자공)"],["절차탁마, 자르고 갈고 쪼고 닦는다.","논어 학이"],["시 삼백 편을 한마디로 하면 생각에 사악함이 없다는 것이다.","논어 위정"],["뒤에 오는 이를 두려워하라. 그들이 지금의 우리만 못하리라 어찌 알겠는가.","논어 자한"],["사람이 사람을 대할 때 측은히 여기는 마음은 어짊의 실마리다.","맹자 공손추 상"],["옳음을 부끄러워하고 그름을 미워하는 마음은 의로움의 실마리다.","맹자 공손추 상"],["사양하는 마음은 예의 실마리이고, 옳고 그름을 가리는 마음은 지혜의 실마리다.","맹자 공손추 상"],["하늘의 때는 땅의 이로움만 못하고, 땅의 이로움은 사람의 화합만 못하다.","맹자 공손추 하"],["도를 얻은 이는 돕는 이가 많고, 도를 잃은 이는 돕는 이가 적다.","맹자 공손추 하"],["부귀도 그를 어지럽히지 못하고, 가난도 그를 바꾸지 못하며, 위세와 무력도 그를 꺾지 못한다. 이를 대장부라 한다.","맹자 등문공 하"],["하늘이 장차 큰 임무를 어떤 사람에게 내리려 할 때는 반드시 먼저 그 마음과 뜻을 괴롭게 한다.","맹자 고자 하"],["근심과 걱정 속에서 살아나고, 안락 속에서 죽는다.","맹자 고자 하"],["남을 사랑하는데도 친해지지 않으면 내 어짊을 돌아보라.","맹자 이루 상"],["남을 다스리는데도 다스려지지 않으면 내 지혜를 돌아보라.","맹자 이루 상"],["행하고도 얻지 못하는 것이 있으면 모두 돌이켜 자기에게서 구하라.","맹자 이루 상"],["사람이 남을 업신여긴 뒤에야 남이 그를 업신여긴다.","맹자 이루 상"],["사람들의 병은 남의 스승이 되기를 좋아하는 데 있다.","맹자 이루 상"],["어린아이의 마음을 잃지 않는 사람이 대인이다.","맹자 이루 하"],["책을 다 믿는다면 책이 없는 것만 못하다.","맹자 진심 하"],["백성이 가장 귀하고 사직이 그다음이며 임금은 가벼운 존재다.","맹자 진심 하"],["군자에게 세 가지 즐거움이 있다. 부모가 모두 살아 계시고 형제가 무고한 것, 하늘과 사람에게 부끄럽지 않은 것, 천하의 영재를 얻어 가르치는 것.","맹자 진심 상"],["있는 힘을 다하면 길이 열린다. 마음을 다하면 본성을 안다.","맹자 진심 상"],["우물을 아홉 길 파고도 샘에 닿지 못하면 우물을 버린 것과 같다.","맹자 진심 상"],["그만두어서는 안 될 곳에서 그만두는 사람은 그만두지 않는 곳이 없다.","맹자 진심 상"],["사물을 저울질한 뒤에야 가볍고 무거움을 알고, 마음을 헤아린 뒤에야 길고 짧음을 안다.","맹자 양혜왕 상"],["사람이 하지 않는 것이 있은 뒤에야 할 수 있는 것이 있다.","맹자 이루 하"],["오십 걸음으로 백 걸음을 비웃는다.","맹자 양혜왕 상"],["씨 뿌리고 때를 어기지 않으면 곡식을 다 먹을 수 없다.","맹자 양혜왕 상"],["배움의 길은 다른 것이 없다. 풀어진 마음을 찾는 것일 뿐이다.","맹자 고자 상"],["닭이나 개가 달아나면 찾을 줄 알면서 마음이 달아나면 찾을 줄 모른다.","맹자 고자 상"],["사람마다 요순이 될 수 있다.","맹자 고자 하"],["큰 사람은 말에 반드시 믿음을 두지 않고 행동에 반드시 결과를 두지 않으며 오직 의로움이 있는 곳을 따른다.","맹자 이루 하"],["내가 먼저 사람을 사랑하면 사람도 늘 나를 사랑한다.","맹자 이루 하"],["사물이 같지 않은 것은 사물의 실정이다.","맹자 등문공 상"],["배움의 목적은 지극한 선에 머무르는 데 있다.","대학"],["그칠 데를 안 뒤에야 정함이 있고, 정함이 있은 뒤에야 고요할 수 있다.","대학"],["사물에는 뿌리와 가지가 있고 일에는 끝과 시작이 있으니, 먼저 할 것과 나중에 할 것을 알면 도에 가깝다.","대학"],["날마다 새로워지고 또 날마다 새로워져라.","대학"],["몸이 닦인 뒤에 집안이 가지런해지고, 집안이 가지런해진 뒤에 나라가 다스려진다.","대학"],["마음이 거기에 있지 않으면 보아도 보이지 않고 들어도 들리지 않는다.","대학"],["홀로 있을 때 삼가라.","대학·중용"],["하늘이 명한 것을 본성이라 하고 본성을 따르는 것을 도라 한다.","중용"],["기쁨과 노여움과 슬픔과 즐거움이 일어나지 않은 상태를 중이라 하고 일어나 모두 절도에 맞는 것을 화라 한다.","중용"],["널리 배우고 자세히 묻고 신중히 생각하고 분명히 가리고 독실히 행하라.","중용"],["남이 한 번에 능하면 나는 백 번을 하고, 남이 열 번에 능하면 나는 천 번을 한다.","중용"],["도는 잠시도 떠날 수 없다. 떠날 수 있다면 도가 아니다.","중용"],["군자는 화합하되 휩쓸리지 않으니 굳세다.","중용"],["가장 부드러운 것이 가장 단단한 것을 이긴다.","노자 43장"],["천 리 길도 한 걸음에서 시작된다.","노자 64장"],["아홉 층 누대도 한 줌 흙에서 시작된다.","노자 64장"],["가장 좋은 것은 물과 같다. 물은 만물을 이롭게 하면서도 다투지 않는다.","노자 8장"],["남을 아는 사람은 지혜롭고 자기를 아는 사람은 밝다.","노자 33장"],["남을 이기는 사람은 힘이 있고 자기를 이기는 사람은 강하다.","노자 33장"],["만족을 아는 사람은 부유하다.","노자 33장"],["족함을 알면 욕되지 않고 멈출 줄 알면 위태롭지 않다.","노자 44장"],["큰 그릇은 늦게 이루어진다.","노자 41장"],["큰 소리는 소리가 드물다.","노자 41장"],["큰 지혜는 어리석은 듯하다.","노자 45장"],["고요함은 조급함의 임금이다.","노자 26장"],["말이 많으면 자주 막힌다. 속에 품고 있는 것만 못하다.","노자 5장"],["아는 사람은 말하지 않고 말하는 사람은 알지 못한다.","노자 56장"],["믿음직한 말은 아름답지 않고 아름다운 말은 믿음직하지 않다.","노자 81장"],["어려운 일은 쉬운 데서 풀고 큰일은 작은 데서 이룬다.","노자 63장"],["하늘 아래 가장 부드러운 것이 가장 단단한 것을 부린다.","노자 43장"],["그칠 때를 알면 위태롭지 않아 오래갈 수 있다.","노자 44장"],["선한 사람은 선한 이의 스승이요, 선하지 않은 이는 선한 이의 거울이다.","노자 27장"],["하지 않는 듯 하되 하지 않음이 없다.","노자 37장"],["꽉 채워 두는 것은 알맞을 때 그만두는 것만 못하다.","노자 9장"],["빛을 부드럽게 하고 먼지와 함께한다.","노자 4장"],["화는 복이 기대는 곳이고 복은 화가 숨어 있는 곳이다.","노자 58장"],["남에게 주고 나면 내게는 더 많아진다.","노자 81장"],["슬기로움을 끊고 지혜를 버리면 백성의 이로움이 백 배가 된다.","노자 19장"],["바라는 것이 적으면 얻고, 많으면 미혹된다.","노자 22장"],["굽히면 온전해지고 구부리면 곧아진다.","노자 22장"],["스스로 드러내지 않는 이가 밝다.","노자 24장"],["발끝으로 서면 오래 서 있지 못한다.","노자 24장"],["성인은 늘 마음이 없고 백성의 마음을 자기 마음으로 삼는다.","노자 49장"],["좋은 말은 값을 사고 좋은 행동은 남에게 더해진다.","노자 62장"],["뿌리가 깊어야 줄기가 튼튼하다.","노자 59장"],["작은 생선을 굽듯이 나라를 다스려라. 자주 뒤집지 마라.","노자 60장"],["북쪽 바다에 곤이라는 물고기가 있는데 그 크기가 몇 천 리인지 모른다.","장자 소요유"],["우물 안 개구리에게 바다를 말할 수 없다. 사는 곳에 묶여 있기 때문이다.","장자 추수"],["여름 벌레에게 얼음을 말할 수 없다. 때에 묶여 있기 때문이다.","장자 추수"],["쓸모없음의 쓸모를 아는 사람과 함께 이야기할 수 있다.","장자 외물"],["삶에는 끝이 있으나 앎에는 끝이 없다. 끝이 있는 것으로 끝이 없는 것을 좇으면 위태롭다.","장자 양생주"],["오리 다리가 짧다고 늘이면 근심하고, 학의 다리가 길다고 자르면 슬퍼한다.","장자 변무"],["샘이 마르면 물고기들이 땅 위에서 서로 침을 뱉어 적셔 준다. 강과 호수에서 서로를 잊는 것만 못하다.","장자 대종사"],["나는 꿈에 나비가 되었는데, 깨어 보니 나비가 나인지 내가 나비인지 알 수 없었다.","장자 제물론"],["군자의 사귐은 물처럼 담담하고 소인의 사귐은 단술처럼 달다.","장자 산목"],["큰 지혜는 한가롭고 작은 지혜는 아등바등한다.","장자 제물론"],["천지는 나와 함께 살고 만물은 나와 하나다.","장자 제물론"],["기술이 도에 이르면 칼이 소의 틈새를 노닌다.","장자 양생주(포정해우)"],["바람이 쌓이지 않으면 큰 날개를 띄울 힘이 없다.","장자 소요유"],["성인은 이름이 없고 신인은 공이 없다.","장자 소요유"],["싸우지 않고 이기는 것이 최선 중의 최선이다.","손자병법 모공"],["적을 알고 나를 알면 백 번 싸워도 위태롭지 않다.","손자병법 모공"],["이길 수 있는 조건은 내게 달려 있고, 이길 수 있는 기회는 적에게 달려 있다.","손자병법 군형"],["먼저 이길 수 있는 처지를 만든 뒤에 싸운다.","손자병법 군형"],["군대는 속임수의 길이다.","손자병법 계"],["싸움에서는 빠름을 귀히 여기고 오래 끄는 것을 귀히 여기지 않는다.","손자병법 작전"],["이기는 군대는 먼저 이겨 놓고 싸우고 패하는 군대는 먼저 싸우고 이기기를 구한다.","손자병법 군형"],["상황의 흐름을 타는 이는 물이 높은 곳에서 아래로 쏟아지듯 한다.","손자병법 세"],["장수가 갖출 것은 지혜, 신의, 어짊, 용기, 엄함이다.","손자병법 계"],["푸른색은 쪽에서 나왔지만 쪽보다 푸르다.","순자 권학"],["쌓은 흙이 산을 이루면 바람과 비가 거기서 일어난다.","순자 권학"],["반걸음씩 쌓지 않으면 천 리에 이를 수 없고, 작은 물줄기를 모으지 않으면 강과 바다를 이룰 수 없다.","순자 권학"],["조각하다 그만두면 썩은 나무도 부러뜨리지 못하고, 멈추지 않고 새기면 쇠와 돌도 새길 수 있다.","순자 권학"],["배움은 그칠 수 없다.","순자 권학"],["군자는 박학하면서 날마다 자기를 돌아본다.","순자 권학"],["옥은 쪼지 않으면 그릇이 되지 못하고, 사람은 배우지 않으면 도를 알지 못한다.","예기 학기"],["가르치고 배우면서 서로 자란다.","예기 학기"],["하늘의 운행은 굳건하니 군자는 스스로 쉬지 않고 힘쓴다.","주역 건괘"],["땅의 형세는 곧 덕을 싣는 것이니 군자는 두터운 덕으로 만물을 싣는다.","주역 곤괘"],["선을 쌓은 집안에는 반드시 남는 경사가 있다.","주역 곤괘"],["궁하면 변하고 변하면 통하고 통하면 오래간다.","주역 계사전"],["하늘이 짓는 재앙은 피할 수 있어도 스스로 짓는 재앙은 살 수 없다.","서경 태갑"],["시작은 있으나 끝이 있는 이는 드물다.","시경 탕"],["다른 산의 돌도 옥을 가는 데 쓸 수 있다.","시경 학명"],["너 자신을 알라.","델포이 아폴론 신전 새김글"],["검토되지 않은 삶은 살 가치가 없다.","소크라테스(플라톤 『변명』)"],["나는 내가 모르는 것을 안다고 생각하지 않는다.","소크라테스(플라톤 『변명』)"],["시작은 모든 일의 가장 중요한 부분이다.","플라톤 『국가』"],["가장 큰 승리는 자기 자신을 이기는 것이다.","플라톤 『법률』"],["놀라움은 철학자의 표지다. 철학은 놀라움에서 시작된다.","플라톤 『테아이테토스』"],["인간은 본성상 앎을 원한다.","아리스토텔레스 『형이상학』"],["인간은 본성상 정치적 동물이다.","아리스토텔레스 『정치학』"],["제비 한 마리가 온다고 봄이 되는 것은 아니다.","아리스토텔레스 『니코마코스 윤리학』"],["화내는 것은 누구나 할 수 있다. 그러나 알맞은 사람에게, 알맞은 정도로, 알맞은 때에, 알맞은 방식으로 화내는 것은 쉽지 않다.","아리스토텔레스 『니코마코스 윤리학』"],["친구란 두 몸에 깃든 하나의 영혼이다.","아리스토텔레스(디오게네스 라에르티오스 전함)"],["교육의 뿌리는 쓰지만 그 열매는 달다.","아리스토텔레스(디오게네스 라에르티오스 전함)"],["충분한 것으로 만족하지 못하는 이에게는 아무것도 충분하지 않다.","에피쿠로스 『바티칸 금언』"],["지혜가 삶 전체의 행복을 위해 마련하는 것 중 가장 큰 것은 우정이다.","에피쿠로스 『주요 교설』"],["같은 강물에 두 번 들어갈 수 없다.","헤라클레이토스"],["성격이 곧 운명이다.","헤라클레이토스"],["삶은 짧고 기술은 길다.","히포크라테스"],["우리는 현실보다 상상 속에서 더 자주 괴로워한다.","세네카 『서간집』"],["어느 항구로 가는지 모르는 이에게는 어떤 바람도 순풍이 아니다.","세네카 『서간집』"],["삶은 짧지 않다. 우리가 짧게 만들 뿐이다.","세네카 『삶의 짧음에 관하여』"],["사람은 가르치면서 배운다.","세네카 『서간집』"],["가난한 사람은 적게 가진 사람이 아니라 더 많이 바라는 사람이다.","세네카 『서간집』"],["우리가 감히 하지 못하는 것은 어려워서가 아니다. 감히 하지 않기 때문에 어려워지는 것이다.","세네카 『서간집』"],["가르침의 길은 멀고 본보기의 길은 짧고 효과적이다.","세네카 『서간집』"],["우리를 괴롭히는 것은 사건이 아니라 사건에 대한 우리의 판단이다.","에픽테토스 『엥케이리디온』"],["어떤 일은 우리에게 달려 있고 어떤 일은 달려 있지 않다.","에픽테토스 『엥케이리디온』"],["일어나는 일이 네 뜻대로 되기를 바라지 말고, 일어나는 대로 되기를 바라라. 그러면 평안할 것이다.","에픽테토스 『엥케이리디온』"],["방해가 되는 것이 오히려 길이 된다.","마르쿠스 아우렐리우스 『명상록』"],["아침에 일어나기 싫을 때 생각하라. 나는 사람의 일을 하러 일어난다.","마르쿠스 아우렐리우스 『명상록』"],["영혼은 생각의 빛깔로 물든다.","마르쿠스 아우렐리우스 『명상록』"],["가장 좋은 복수는 그와 같은 사람이 되지 않는 것이다.","마르쿠스 아우렐리우스 『명상록』"],["밖의 일 때문에 괴로운 것이 아니다. 그것에 대한 너의 판단 때문이며, 그 판단은 지금 당장 지울 수 있다.","마르쿠스 아우렐리우스 『명상록』"],["사람에게 가능하고 어울리는 일이라면 너에게도 가능하다고 생각하라.","마르쿠스 아우렐리우스 『명상록』"],["정원과 도서관이 있다면 필요한 것은 모두 갖춘 것이다.","키케로 『서간』"],["감사는 가장 큰 덕일 뿐 아니라 모든 덕의 어머니다.","키케로 『플란키우스 변호』"],["오늘을 붙잡아라. 내일에는 최소한의 믿음만 두어라.","호라티우스 『송가』"],["감히 알려고 하라.","호라티우스 『서간』"],["물방울이 돌을 뚫는 것은 힘이 세서가 아니라 자주 떨어지기 때문이다.","오비디우스 『흑해에서 온 편지』"],["나는 무엇을 아는가?","몽테뉴 『수상록』"],["내가 고양이와 놀 때, 고양이가 나와 노는지 내가 고양이와 노는지 누가 알겠는가.","몽테뉴 『수상록』"],["인간은 생각하는 갈대다.","파스칼 『팡세』"],["마음에는 이성이 알지 못하는 나름의 이유가 있다.","파스칼 『팡세』"],["인간의 모든 불행은 방 안에 조용히 머물 줄 모르는 데서 비롯된다.","파스칼 『팡세』"],["클레오파트라의 코가 조금만 낮았더라면 세계의 역사는 달라졌을 것이다.","파스칼 『팡세』"],["나는 생각한다, 그러므로 존재한다.","데카르트 『방법서설』"],["좋은 정신을 가진 것만으로는 부족하다. 중요한 것은 그것을 잘 쓰는 것이다.","데카르트 『방법서설』"],["아는 것이 힘이다.","프랜시스 베이컨"],["자연은 복종함으로써만 지배할 수 있다.","프랜시스 베이컨 『신기관』"],["뛰어난 것은 모두 어렵고 또 드물다.","스피노자 『윤리학』"],["자유로운 사람은 죽음에 대해 가장 적게 생각한다.","스피노자 『윤리학』"],["내가 더 멀리 보았다면 그것은 거인들의 어깨 위에 서 있었기 때문이다.","아이작 뉴턴(훅에게 보낸 편지)"],["인간은 자유롭게 태어났으나 어디서나 사슬에 묶여 있다.","루소 『사회계약론』"],["우리는 우리의 정원을 가꾸어야 합니다.","볼테르 『캉디드』"],["사람은 노력하는 한 방황한다.","괴테 『파우스트』"],["아는 것만으로는 충분하지 않다. 적용해야 한다. 원하는 것만으로는 충분하지 않다. 실행해야 한다.","괴테 『빌헬름 마이스터』"],["내 위에는 별이 빛나는 하늘이, 내 안에는 도덕 법칙이 있다.","칸트 『실천이성비판』"],["감히 스스로 생각하라.","칸트 『계몽이란 무엇인가』"],["인간을 결코 한낱 수단으로만 대하지 말고 언제나 동시에 목적으로 대하라.","칸트 『도덕 형이상학 정초』"],["건강한 거지가 병든 왕보다 행복하다.","쇼펜하우어 『소품과 부록』"],["미네르바의 올빼미는 황혼이 짙어서야 날기 시작한다.","헤겔 『법철학』"],["만족한 돼지보다 불만족한 인간이 낫고, 만족한 바보보다 불만족한 소크라테스가 낫다.","존 스튜어트 밀 『공리주의』"],["나를 죽이지 못하는 것은 나를 더 강하게 만든다.","니체 『우상의 황혼』"],["살아야 할 이유를 아는 사람은 거의 어떤 방식으로든 견딜 수 있다.","니체 『우상의 황혼』"],["춤추는 별을 낳으려면 자기 안에 혼돈을 지니고 있어야 한다.","니체 『차라투스트라는 이렇게 말했다』"],["네가 누구인지 되어라.","니체 『즐거운 학문』"],["음악이 없다면 삶은 오류일 것이다.","니체 『우상의 황혼』"],["삶은 뒤돌아보아야 이해되지만 앞을 향해 살아야 한다.","키르케고르 『일기』"],["불안은 자유의 현기증이다.","키르케고르 『불안의 개념』"],["대다수 사람은 조용한 절망 속에서 살아간다.","소로 『월든』"],["나는 삶을 의도적으로 살아 보고 싶어서 숲으로 갔다.","소로 『월든』"],["꿈을 향해 자신 있게 나아가 상상한 삶을 살려 애쓰면 뜻밖의 성공을 만난다.","소로 『월든』"],["공중에 누각을 지었더라도 그 일이 헛된 것은 아니다. 이제 그 밑에 토대를 쌓아라.","소로 『월든』"],["태양은 하나의 아침별에 지나지 않는다.","소로 『월든』"],["어리석은 일관성은 소인배의 도깨비다.","에머슨 『자기 신뢰』"],["자신을 믿어라. 모든 마음은 그 쇠줄에 떤다.","에머슨 『자기 신뢰』"],["친구를 얻는 유일한 방법은 스스로 친구가 되는 것이다.","에머슨 『우정』"],["열정 없이 이루어진 위대한 것은 없다.","에머슨 『원』"],["국민의, 국민에 의한, 국민을 위한 정부는 이 땅에서 사라지지 않을 것이다.","링컨 게티즈버그 연설"],["삶을 사랑하는가? 그렇다면 시간을 낭비하지 마라. 시간은 삶을 이루는 재료다.","벤저민 프랭클린 『가난한 리처드의 달력』"],["천재는 1퍼센트의 영감과 99퍼센트의 땀이다.","토머스 에디슨"],["관찰의 영역에서 우연은 준비된 정신에게만 기회를 준다.","파스퇴르"],["교육은 미래의 삶을 위한 준비가 아니라 삶 그 자체의 과정이다.","존 듀이 『나의 교육 신조』"],["모든 행복한 가정은 서로 닮았고, 불행한 가정은 저마다 다른 이유로 불행하다.","톨스토이 『안나 카레니나』"],["모두가 세상을 바꾸려 하지만 아무도 자기 자신을 바꾸려 하지 않는다.","톨스토이"],["가장 중요한 때는 지금이고, 가장 중요한 사람은 지금 함께 있는 사람이며, 가장 중요한 일은 그 사람에게 선을 행하는 것이다.","톨스토이 「세 가지 질문」"],["인간은 신비다. 그것을 풀려고 평생을 바쳐도 시간을 헛되이 쓴 것이 아니다.","도스토옙스키(형에게 보낸 편지)"],["고통은 넓은 의식과 깊은 마음을 가진 사람에게 언제나 따르기 마련이다.","도스토옙스키 『죄와 벌』"],["아름다움이 세상을 구원할 것이다.","도스토옙스키 『백치』"],["사느냐 죽느냐, 그것이 문제로다.","셰익스피어 『햄릿』"],["세상은 무대이고 모든 남녀는 배우일 뿐이다.","셰익스피어 『뜻대로 하세요』"],["우리의 의심은 배신자다. 시도하기를 두려워하게 하여 얻을 수 있는 것을 잃게 한다.","셰익스피어 『자에는 자로』"],["그것은 최고의 시절이자 최악의 시절이었다.","찰스 디킨스 『두 도시 이야기』"],["인생 최고의 행복은 우리가 사랑받고 있다는 확신이다.","빅토르 위고 『레 미제라블』"],["가장 중요한 것은 눈에 보이지 않아.","생텍쥐페리 『어린 왕자』"],["길들인다는 것은 관계를 맺는다는 뜻이야.","생텍쥐페리 『어린 왕자』"],["사막이 아름다운 것은 어딘가에 우물을 숨기고 있기 때문이야.","생텍쥐페리 『어린 왕자』"],["모든 오류에 문을 닫아 버리면 진리도 밖에 갇힌다.","타고르 『길 잃은 새들』"],["죽음은 빛을 끄는 것이 아니다. 새벽이 왔으므로 등불을 끄는 것이다.","타고르 『반딧불』"],["희망이란 본래 있다고도 없다고도 할 수 없다. 땅 위의 길과 같다. 본래 길은 없었는데 걷는 사람이 많아지면 길이 된다.","루쉰 「고향」"],["마음은 모든 것에 앞서고 마음이 주인이며 마음이 모든 것을 만든다.","법구경 쌍서품"],["원한은 원한으로 갚으면 끝내 가라앉지 않고, 원한을 놓아야 가라앉는다.","법구경 쌍서품"],["스스로를 이기는 것이 전장에서 천 명의 적을 이기는 것보다 낫다.","법구경 천품"],["한 방울씩 떨어지는 물도 마침내 항아리를 채운다.","법구경 악행품·선행품"],["자기가 자기의 주인이다. 남이 어찌 주인이겠는가.","법구경 자기품"],["게으르지 않음은 죽지 않는 길이요, 게으름은 죽음의 길이다.","법구경 불방일품"],["무소의 뿔처럼 혼자서 가라.","숫타니파타"],["이것이 있으므로 저것이 있고, 이것이 생기므로 저것이 생긴다.","잡아함경"],["남에게 베풀거든 보답을 바라지 말고, 베푼 뒤에 후회하지 마라.","명심보감 성심편"],["착한 일은 아무리 작아도 하지 않을 수 없고, 악한 일은 아무리 작아도 해서는 안 된다.","명심보감 계선편"],["하루라도 착한 일을 생각하지 않으면 온갖 악이 저절로 일어난다.","명심보감 계선편"],["복은 맑고 검소한 데서 생기고, 덕은 낮추고 물러나는 데서 생긴다.","명심보감 성심편"],["한때의 분을 참으면 백 일의 근심을 면한다.","명심보감 계성편"],["집이 가난하면 어진 아내를 생각하고 나라가 어지러우면 어진 재상을 생각한다.","명심보감 성심편"],["젊어서 배우지 않으면 늙어서 아는 것이 없다.","명심보감 권학편"],["입은 사람을 해치는 도끼요, 말은 혀를 베는 칼이다.","명심보감 언어편"],["일생의 계획은 어릴 때에 있고, 일 년의 계획은 봄에 있으며, 하루의 계획은 새벽에 있다.","명심보감 권학편"],["물이 너무 맑으면 고기가 없고 사람이 너무 살피면 따르는 이가 없다.","공자가어 입관"],["꽃은 반쯤 피었을 때 보고, 술은 조금 취했을 때 마셔라.","채근담 후집"],["나물 뿌리를 씹을 수 있는 사람은 백 가지 일을 할 수 있다.","채근담"],["산중의 도적은 깨뜨리기 쉬우나 마음속의 도적은 깨뜨리기 어렵다.","왕양명"],["사람은 누구나 한 번 죽지만, 어떤 죽음은 태산보다 무겁고 어떤 죽음은 기러기 털보다 가볍다.","사마천 「보임안서」"],["복숭아와 자두는 말이 없어도 그 아래에 저절로 길이 난다.","사마천 『사기』"],["작은 제방도 개미구멍 하나로 무너진다.","한비자 유로"],["학업은 부지런함에서 정밀해지고 놀이에서 황폐해지며, 행실은 생각에서 이루어지고 따라 함에서 무너진다.","한유 「진학해」"],["담박하지 않으면 뜻을 밝힐 수 없고, 고요하지 않으면 멀리 이를 수 없다.","제갈량 「계자서」"],["몸을 굽혀 온 힘을 다하고, 죽은 뒤에야 그치겠습니다.","제갈량 「후출사표」"],["이미 지나간 일은 돌이킬 수 없으나 앞으로 올 일은 따라잡을 수 있음을 알았다.","도연명 「귀거래사」"],["듣지 않는 것은 듣는 것만 못하고, 듣는 것은 보는 것만 못하며, 보는 것은 아는 것만 못하고, 아는 것은 행하는 것만 못하다.","순자 유효"],["처음 배우는 사람은 먼저 뜻을 세워야 한다.","율곡 이이 『격몽요결』"],["청렴은 목민관의 본분이요, 모든 선의 근원이며 모든 덕의 뿌리다.","정약용 『목민심서』"],["내게 두 글자의 신비한 부적이 있으니 평생 써도 다 쓰지 못할 것이다. 하나는 부지런함이고 하나는 검소함이다.","정약용 「두 아들에게 보내는 가계」"],["옛것을 본받되 변화할 줄 알고, 새것을 만들되 법도에 맞아야 한다.","박지원 『연암집』(법고창신)"],["하루라도 책을 읽지 않으면 입 안에 가시가 돋는다.","안중근 유묵"],["나는 우리나라가 세계에서 가장 아름다운 나라가 되기를 원한다. 가장 부강한 나라가 되기를 원하지 않는다.","김구 『백범일지』 「나의 소원」"],["오직 한없이 가지고 싶은 것은 높은 문화의 힘이다.","김구 『백범일지』 「나의 소원」"],["널리 글을 배우고 예로써 단속하면 어긋나지 않을 수 있다.","논어 옹야"],["먼저 사람이 되고, 남는 힘이 있으면 글을 배워라.","논어 학이"],["젊은이는 집에서는 효도하고 나가서는 공손하며, 삼가고 믿음이 있고, 사람들을 널리 사랑하라.","논어 학이"],["군자는 먹는 데 배부름을 구하지 않고 사는 데 편안함을 구하지 않는다.","논어 학이"],["말을 민첩하게 하고 행동을 삼가라.","논어 학이"],["믿음이 의로움에 가까우면 그 말을 실천할 수 있다.","논어 학이"],["공손함이 예에 가까우면 치욕을 멀리할 수 있다.","논어 학이"],["덕으로 다스리는 것은 북극성이 제자리에 있고 뭇별이 그것을 향하는 것과 같다.","논어 위정"],["이끌기를 법령으로 하고 가지런히 하기를 형벌로 하면 백성은 피하되 부끄러움이 없다.","논어 위정"],["열다섯에 배움에 뜻을 두었고, 서른에 섰으며, 마흔에 흔들리지 않았다.","논어 위정"],["쉰에 하늘의 뜻을 알았고, 예순에 귀가 순해졌으며, 일흔에 마음 가는 대로 해도 법도를 넘지 않았다.","논어 위정"],["많이 듣고 의심스러운 것은 빼 두며 나머지를 신중히 말하면 허물이 적다.","논어 위정"],["어진 것이 아름다운 마을을 골라 살지 않으면 어찌 지혜롭다 하겠는가.","논어 이인"],["어질지 않은 사람은 오래 곤궁함에 머물 수 없고 오래 즐거움에 머물 수도 없다.","논어 이인"],["사람의 허물은 각기 그 부류에 따른다. 허물을 보면 그가 어진 사람인지 알 수 있다.","논어 이인"],["도에 뜻을 두고 선비가 해진 옷과 거친 음식을 부끄러워하면 함께 의논할 수 없다.","논어 이인"],["썩은 나무에는 조각할 수 없고 더러운 흙담에는 흙손질할 수 없다.","논어 공야장"],["처음에는 남의 말을 듣고 그 행동을 믿었으나, 이제는 말을 듣고 행동을 살핀다.","논어 공야장"],["나는 아직 굳센 사람을 보지 못했다.","논어 공야장"],["다른 사람이 나에게 가하는 것을 나도 남에게 가하지 않고자 합니다.","논어 공야장(자공)"],["어진 사람은 근심하지 않고 지혜로운 사람은 미혹되지 않는다.","논어 헌문"],["스스로를 닦아 사람들을 편안하게 한다.","논어 헌문"],["군자는 도를 도모하고 먹는 것을 도모하지 않는다.","논어 위령공"],["이미 이루어진 일은 말하지 않고 끝난 일은 간하지 않으며 지나간 일은 허물하지 않는다.","논어 팔일"],["군자는 다투지 않는다.","논어 팔일"],["예는 사치스럽기보다 차라리 검소해야 하고, 상례는 형식에 치우치기보다 차라리 슬퍼해야 한다.","논어 팔일"],["오직 어진 사람만이 사람을 좋아하고 미워할 수 있다.","논어 이인"],["진실로 어짊에 뜻을 두면 악이 없다.","논어 이인"],["나는 열 집밖에 안 되는 마을에도 반드시 나처럼 충직하고 신실한 사람이 있겠지만 나처럼 배우기를 좋아하는 사람은 없을 것이라 생각한다.","논어 공야장"],["그것을 아는 이는 그것을 좋아하는 이만 못하다.","논어 옹야"],["마음을 쓰지 않고 배부르게 먹으며 하루를 보내는 사람은 어찌할 수가 없다.","논어 양화"],["말을 하지 않으려 한다. 하늘이 무슨 말을 하던가. 사계절이 운행되고 만물이 자라나는데 하늘이 무슨 말을 하던가.","논어 양화"],["성품은 서로 비슷하지만 습관으로 서로 멀어진다.","논어 양화"],["오직 가장 지혜로운 사람과 가장 어리석은 사람만은 바뀌지 않는다.","논어 양화"],["군자는 그 말이 행동보다 지나치는 것을 부끄러워한다.","논어 헌문"],["군자가 어짊을 떠나면 어찌 이름을 이루겠는가.","논어 이인"],["선비가 편안히 지내는 것을 생각하면 선비라고 하기에 부족하다.","논어 헌문"],["군자는 곤궁함을 굳게 지키고 소인은 곤궁하면 넘친다.","논어 위령공"],["군자는 신뢰를 얻은 뒤에 백성을 부린다.","논어 자장"],["작은 덕은 넘나들어도 큰 덕은 넘지 않으면 된다.","논어 자장"],["뛰어난 사람을 보면 그와 같아지려 하고 못한 사람을 보면 스스로 반성한다.","논어 이인"],["사람에게 어짊이 없다면 예가 무슨 소용이며, 어짊이 없다면 음악이 무슨 소용인가.","논어 팔일"],["배우고 생각하고 묻고 분별하고 실천하라.","중용 20장"],["성실함은 하늘의 도이고 성실해지려는 것은 사람의 도다.","중용 20장"],["정성스러우면 겉으로 드러나고, 드러나면 밝아지며, 밝아지면 움직이고, 움직이면 변하며, 변하면 길러 낸다.","중용 23장"],["군자는 자기 지위에 맞게 행하고 그 밖의 것을 원하지 않는다.","중용 14장"],["군자의 도는 먼 곳을 가려면 반드시 가까운 곳에서 시작하고, 높은 곳에 오르려면 반드시 낮은 곳에서 시작하는 것과 같다.","중용 15장"],["활쏘기는 군자와 비슷한 점이 있다. 과녁을 맞히지 못하면 돌이켜 자기에게서 원인을 찾는다.","중용 14장"],["뜻을 정성스럽게 하려는 사람은 먼저 그 마음을 바르게 한다.","대학"],["뜻이 성실해진 뒤에 마음이 바르게 되고, 마음이 바르게 된 뒤에 몸이 닦인다.","대학"],["진실로 어느 날 새로워지려면 날마다 새로워지고, 또 날마다 새로워져라.","대학"],["이른바 성의란 스스로를 속이지 않는 것이다.","대학"],["좋아하면서도 그 나쁜 점을 알고, 미워하면서도 그 좋은 점을 아는 사람은 드물다.","대학"],["높은 곳에 오르려면 반드시 낮은 곳에서부터, 먼 곳에 가려면 반드시 가까운 곳에서부터 시작한다.","중용"],["사람이 스스로 해치는 자와는 함께 말할 수 없고 스스로 버리는 자와는 함께 일할 수 없다.","맹자 이루 상"],["사람은 누구나 남에게 차마 하지 못하는 마음이 있다.","맹자 공손추 상"],["사람이 어린아이가 우물에 빠지려는 것을 보면 누구나 깜짝 놀라 측은한 마음이 생긴다.","맹자 공손추 상"],["스스로 돌이켜 곧으면 천만 명이 가로막아도 나아간다.","맹자 공손추 상"],["호연지기는 지극히 크고 강하다. 곧게 기르고 해치지 않으면 천지 사이에 가득 찬다.","맹자 공손추 상"],["싹이 자라기를 바라 억지로 잡아당긴 송나라 사람은 싹을 말라 죽게 했다.","맹자 공손추 상"],["어진 사람은 적이 없다.","맹자 양혜왕 상"],["사람이 배우지 않고 알며 생각하지 않고 능한 것이 양지와 양능이다.","맹자 진심 상"],["자기 본성을 다하는 이는 하늘을 안다.","맹자 진심 상"],["몸을 닦고 하늘의 명을 기다려라.","맹자 진심 상"],["도를 알려면 마음이 비어 있고 한결같고 고요해야 한다.","순자 해폐"],["나무가 먹줄을 받으면 곧아지고 쇠가 숫돌에 닿으면 날카로워진다. 군자는 널리 배우고 날마다 자신을 살피면 총명하고 행동에 허물이 없다.","순자 권학"],["깊은 못이 있어야 용이 나고 흙이 쌓여 산을 이루면 바람과 비가 일어난다.","순자 권학"],["선한 말을 남에게 베푸는 것은 비단옷보다 따뜻하다.","순자 영욕"],["아름다운 말로 사람을 대하는 것은 베나 비단보다 따뜻하다.","순자 영욕"],["서른 개의 바큇살이 한 바퀴통에 모이지만 그 빈 곳이 있기에 수레가 쓸모 있다.","노자 11장"],["그릇을 만드는 것은 흙이지만 그 속의 빈 곳이 그릇의 쓸모다.","노자 11장"],["가장 훌륭한 지도자는 사람들이 그가 있는 줄만 아는 사람이다.","노자 17장"],["공을 이루고 몸은 물러나는 것이 하늘의 도다.","노자 9장"],["많이 가지려는 사람은 크게 잃는다.","노자 44장"],["참으로 곧은 것은 굽은 듯하고 참으로 뛰어난 것은 서툰 듯하며 참으로 잘 말하는 것은 어눌한 듯하다.","노자 45장"],["가장 부드러운 것이 가장 단단한 것 속을 달린다.","노자 43장"],["천하에 물보다 부드럽고 약한 것은 없지만 굳고 강한 것을 치는 데 이보다 나은 것은 없다.","노자 78장"],["부드럽고 약한 것이 굳고 강한 것을 이긴다.","노자 36장"],["살아 있는 사람은 부드럽고 약하며 죽은 사람은 굳고 뻣뻣하다.","노자 76장"],["믿음이 부족하면 불신이 생긴다.","노자 17장"],["스스로 보는 사람은 밝지 않고 스스로 옳다 하는 사람은 드러나지 않는다.","노자 24장"],["말을 줄이는 것이 자연이다.","노자 23장"],["회오리바람은 아침 내내 불지 못하고 소나기는 하루 종일 내리지 못한다.","노자 23장"],["큰 나라를 다스리는 것은 작은 생선을 지지는 것과 같다.","노자 60장"],["천하의 어려운 일은 반드시 쉬운 일에서 시작되고 천하의 큰일은 반드시 작은 일에서 시작된다.","노자 63장"],["합쳐 안은 큰 나무도 털끝만 한 싹에서 자라난다.","노자 64장"],["일을 서두르는 사람은 실패하고 붙드는 사람은 잃는다.","노자 64장"],["끝을 신중히 하기를 처음과 같이 하면 실패하는 일이 없다.","노자 64장"],["바다가 모든 강과 개울의 왕이 될 수 있는 것은 그것이 낮은 곳에 있기 때문이다.","노자 66장"],["나에게는 세 가지 보물이 있어 지니고 아낀다. 첫째는 자애, 둘째는 검소, 셋째는 감히 천하의 앞이 되려 하지 않는 것이다.","노자 67장"],["알면서도 모른다고 하는 것이 가장 좋고 모르면서 안다고 하는 것이 병이다.","노자 71장"],["하늘의 그물은 넓고 성글어도 놓치는 것이 없다.","노자 73장"],["사람이 태어나면 부드럽고 약하나 죽으면 단단하고 뻣뻣하다.","노자 76장"],["하늘의 도는 남는 것을 덜어 모자란 것을 채운다.","노자 77장"],["나라가 작고 백성이 적더라도 그 나라를 아름답게 하고 그 풍속을 즐기게 한다.","노자 80장"],["진실하지 않은 말은 아름답고 아름다운 말은 진실하지 않다.","노자 81장"],["선한 사람은 변론하지 않고 변론하는 사람은 선하지 않다.","노자 81장"],["성인은 쌓아 두지 않는다. 남을 위해 쓰면서 자신은 더욱 가진다.","노자 81장"],["공손하면 온전하고, 굽으면 곧아지며, 움푹 패면 가득 차고, 낡으면 새로워진다.","노자 22장"],["도는 크고 하늘은 크고 땅도 크며 사람도 크다.","노자 25장"],["도는 자연을 본받는다.","노자 25장"],["강과 바다가 모든 골짜기의 왕이 되는 까닭은 아래로 잘 내려가기 때문이다.","노자 66장"],["오색은 눈을 멀게 하고 오음은 귀를 먹게 한다.","노자 12장"],["소꿉놀이하는 아이처럼 순수한 기를 오롯이 하고 부드러워질 수 있는가.","노자 10장"],["뛰어난 장수는 용맹을 자랑하지 않는다.","노자 68장"],["작은 것을 보는 것을 밝음이라 하고 부드러움을 지키는 것을 강함이라 한다.","노자 52장"],["사람은 땅을 본받고 땅은 하늘을 본받고 하늘은 도를 본받고 도는 스스로 그러함을 본받는다.","노자 25장"],["큰 지혜는 자잘한 앎을 넘어선다.","장자 제물론"],["물이 고여 깊어지지 않으면 큰 배를 띄울 힘이 없다.","장자 소요유"],["뱁새는 깊은 숲에 집을 지어도 가지 하나면 족하고, 두더지는 강물을 마셔도 배가 차면 족하다.","장자 소요유"],["쓸모 있는 나무는 베이고 쓸모없는 나무는 오래 산다.","장자 인간세"],["기러기는 잘 울지 못해서 죽는다.","장자 산목"],["진인은 삶을 기뻐할 줄도 죽음을 싫어할 줄도 모른다.","장자 대종사"],["모든 것은 마음이 지어낸다.","화엄경(일체유심조)"],["마음은 화가와 같아서 갖가지 세계를 그려 낸다.","화엄경"],["머무는 곳 없이 마음을 내라.","금강경"],["나라말이 중국과 달라 한자와 서로 통하지 않으므로 어리석은 백성이 말하고자 해도 제 뜻을 펴지 못하는 일이 많다. 내가 이를 불쌍히 여겨 새로 스물여덟 자를 만드니 사람마다 쉽게 익혀 날마다 쓰는 데 편하게 하고자 할 따름이다.","세종 『훈민정음』 서문"],["군자는 그릇이 아니다.","논어 위정"],["내가 어질고자 하면 어짊이 곧 이른다.","논어 술이"],["자기를 꾸짖기는 두텁게 하고 남을 꾸짖기는 가볍게 하면 원망이 멀어진다.","논어 위령공"],["벗으로 이로운 세 가지가 있다. 곧은 사람, 믿음직한 사람, 견문이 넓은 사람.","논어 계씨"],["이로운 즐거움이 세 가지다. 예악을 알맞게 즐기고, 남의 좋은 점을 말하기를 즐기며, 어진 벗이 많음을 즐기는 것.","논어 계씨"],["집에 있을 때는 공손하고 일을 맡으면 공경하며 사람을 대할 때는 충직하라.","논어 자로"],["군자는 태연하되 교만하지 않고 소인은 교만하되 태연하지 못하다.","논어 자로"],["굳세고 곧고 소박하고 말이 더딘 사람은 어짊에 가깝다.","논어 자로"],["말은 뜻을 전하면 그것으로 족하다.","논어 위령공"],["예가 아니면 보지 말고, 예가 아니면 듣지 말고, 예가 아니면 말하지 말고, 예가 아니면 움직이지 마라.","논어 안연"],["한 그릇 밥과 한 표주박 물로 누추한 골목에 살면 남들은 그 근심을 견디지 못하는데 안회는 그 즐거움을 바꾸지 않는다.","논어 옹야"],["나이 들어 배우기를 좋아하는 것은 밤에 촛불을 밝히는 것과 같다.","유향 『설원』"],["먹고 입는 것이 넉넉해도 가르침이 없으면 짐승에 가까워진다.","맹자 등문공 상"],["일정한 생업이 없어도 흔들리지 않는 마음을 가질 수 있는 사람은 오직 선비뿐이다.","맹자 양혜왕 상"],["말이 가까우면서도 뜻이 먼 것이 좋은 말이다.","맹자 진심 하"],["군자가 도로써 깊이 나아가는 것은 스스로 얻고자 해서다.","맹자 이루 하"],["널리 배우고 자세히 말하는 것은 장차 돌이켜 요약해 말하기 위해서다.","맹자 이루 하"],["임금은 배이고 백성은 물이다. 물은 배를 띄우기도 하고 엎기도 한다.","순자 왕제"],["백 번 듣는 것이 한 번 보는 것만 못하다.","한서 조충국전"],["머리가 하얗게 세도록 사귀어도 처음 같은 이가 있고, 길에서 잠깐 만나도 오랜 벗 같은 이가 있다.","사기 추양 「옥중상서」"],["큰일을 하려는 사람은 작은 일에 구애받지 않는다.","사기 항우본기"],["대나무를 그리려면 먼저 가슴속에 완성된 대나무가 있어야 한다.","소식(소동파) 「문여가의 묵군당 기」"],["신에게는 아직 열두 척의 배가 있습니다.","이순신 장계"],["죽고자 하면 살고, 살고자 하면 죽는다.","이순신(『이충무공행록』 전함)"],["참되기를 힘쓰고 행하기를 힘써라.","안창호(무실역행)"],["웃지 말고, 울지 말고, 미워하지 말고, 이해하라.","스피노자 『정치론』"],["우리가 깨어 있는 만큼만 날이 밝는다.","소로 『월든』"],["죽음이 두려운 것이 아니라 삶을 시작하지 못하는 것이 두려운 일이다.","마르쿠스 아우렐리우스 『명상록』"],["삶은 이야기와 같아서 얼마나 긴가가 아니라 얼마나 좋은가가 중요하다.","세네카 『서간집』"],["세상에서 가장 위대한 일은 자기 자신으로 존재하는 법을 아는 것이다.","몽테뉴 『수상록』"],["우리는 이성만으로 진리를 아는 것이 아니라 마음으로도 안다.","파스칼 『팡세』"],["우리 마음은 당신 안에서 쉼을 얻기까지 평안하지 않습니다.","아우구스티누스 『고백록』"],["순간이여, 멈추어라. 너는 참으로 아름답구나.","괴테 『파우스트』"],["삶이 살 가치가 있다고 믿어라. 그 믿음이 그 사실을 만드는 데 힘이 될 것이다.","윌리엄 제임스 「삶은 살 가치가 있는가」"],["악을 행하는 것보다 악을 당하는 것이 더 낫다.","소크라테스(플라톤 『고르기아스』)"],["사람이 가장 높은 데 이르려면 가장 낮은 데서 시작해야 한다.","공자(『중용』 15장)"],["책 중에는 맛보는 것이 있고, 삼키는 것이 있고, 씹어 소화시켜야 하는 것이 있다.","프랜시스 베이컨 「학문에 대하여」"],["독서는 충실한 사람을 만들고, 토론은 재치 있는 사람을 만들며, 글쓰기는 정확한 사람을 만든다.","프랜시스 베이컨 「학문에 대하여」"],["운명은 따르는 사람은 이끌고, 거스르는 사람은 끌고 간다.","세네카 『서간집』(클레안테스 인용)"],["어려운 때에도 마음의 평정을 지킬 것을 기억하라.","호라티우스 『송가』"],["운은 용감한 사람을 돕는다.","베르길리우스 『아이네이스』"],["나는 인간이다. 인간에 관한 어떤 것도 나와 무관하다고 생각하지 않는다.","테렌티우스"],["천천히 서둘러라.","아우구스투스(수에토니우스 『황제전』)"],["피를 머금어 남에게 뿜으면 먼저 제 입이 더러워진다.","명심보감 계선편"],["은혜와 의리를 널리 베풀어라. 사람이 살면서 어디에서 서로 만나지 않겠는가.","명심보감 성심편"],["스스로 돌아보아 부끄러움이 없다면 무엇을 근심하고 무엇을 두려워하겠는가.","논어 안연"],["삶과 /* 시계(교시·급식 알림) · 다꾸(사진 배경·꾸미기) · 격려 문구 500개 · 설정 카드 */
const CHEER = { length: 500 };   /* 하위 호환 */
const CHEER_KIND = { mix: '명언·격언·위로 섞어서', q: '명언만', g: '격언만', c: '위로의 글만' };
const cheerPick = (shift = 0) => {
  const d = new Date(), day = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5), seed = (d.getFullYear() - 2020) * 366 + day;
  let k = S.profile.cheerKind || 'mix'; const sh = shift || 0;
  if (!CHEER_KIND[k]) k = 'mix';
  if (k === 'mix') k = ['q', 'g', 'c'][((seed + sh) % 3 + 3) % 3];
  const arr = k === 'q' ? QT_Q : k === 'g' ? QT_G : QT_C, n = arr.length;
  const i = ((Math.floor(seed / (S.profile.cheerKind === 'mix' || !S.profile.cheerKind ? 3 : 1)) * 7 + sh * 13 + 137) % n + n) % n;   /* 7과 500은 서로소 → 500일 동안 같은 글이 겹치지 않음 */
  const it = arr[i];
  return k === 'c' ? it : '「' + it[0] + '」 — ' + it[1];
};
let _cheerShift = 0;
