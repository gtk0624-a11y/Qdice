function clkPeriods() { const p = S.profile; if (p.bell && p.bell.length) return p.bell.map(x => ({ p: x.p, s: x.s, e: x.e })).sort((a, b) => a.s - b.s); const [h, m] = (p.start || '09:00').split(':').map(Number), st = h * 60 + m, L = []; for (let i = 1; i <= 7; i++) { const a = st + (i - 1) * (+p.classMin + +p.breakMin); L.push({ p: i, s: a, e: a + +p.classMin }); } return L; }
const clkHM = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
const clkParse = s => { const m = String(s || '').match(/^(\d{1,2}):(\d{2})$/); return m ? +m[1] * 60 + +m[2] : null; };
function clkLunch(P) { const p = S.profile, a = clkParse(p.lunchS), b = clkParse(p.lunchE); if (a != null && b != null) return [a, b]; let best = null; for (let i = 0; i + 1 < P.length; i++) { const g = P[i + 1].s - P[i].e; if (g >= 30 && (!best || g > best[1] - best[0])) best = [P[i].e, P[i + 1].s]; } return best || [12 * 60 + 40, 13 * 60 + 30]; }
function clkState() {
  const n = new Date(), mins = n.getHours() * 60 + n.getMinutes(), dow = n.getDay(), P = clkPeriods(), L = clkLunch(P);
  if (dow === 0 || dow === 6) return { big: '주말입니다', sub: '푹 쉬세요 🌿', cls: 'we' };
  if (mins >= L[0] && mins < L[1]) return { big: '급식시간입니다', sub: `${clkHM(L[0])}~${clkHM(L[1])} · 맛있게 드세요 🍚`, cls: 'lunch' };
  const cur = P.find(x => mins >= x.s && mins < x.e);
  if (cur) { const my = S.timetable[dow + '-' + cur.p]; return { big: `지금은 ${cur.p}교시입니다`, sub: `${clkHM(cur.s)}~${clkHM(cur.e)} · ${cur.e - mins}분 남음${my ? ' · 내 수업 ' + my : ' · 수업 없음(업무 시간)'}`, cls: my ? 'cls' : 'free' }; }
  const nx = P.find(x => x.s > mins);
  if (nx && mins >= P[0].s) { const prev = [...P].reverse().find(x => x.e <= mins), my = S.timetable[dow + '-' + nx.p]; return { big: '쉬는 시간입니다', sub: `${clkHM(nx.s)} ${nx.p}교시 시작(${nx.s - mins}분 뒤)${my ? ' · ' + my : ''}`, cls: 'brk' }; }
  if (nx) return { big: '수업 전입니다', sub: `${nx.p}교시는 ${clkHM(nx.s)}에 시작해요`, cls: 'pre' };
  return { big: '수업이 모두 끝났어요', sub: '오늘도 수고하셨습니다 🌙', cls: 'end' };
}

function clkOffTxt() {
  const p = S.profile; if (!p.offOn) return ''; const n = new Date(), dow = n.getDay(); if (dow === 0 || dow === 6) return '';
  const t = clkParse(p.offT || '16:40'); if (t == null) return ''; const win = +(p.offMin || 20), now = n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds(), left = t * 60 - now;

const ptApp = () => location.href.split('#')[0].replace(/[^\/]*$/, '');
function ptCode() {
  const f = function () {
    var APP = '__APP__';
    var clean = function (t) { return String(t || '').replace(/[ \t ]+/g, ' ').replace(/\n\s*\n+/g, '\n').trim(); };
    var bad = /logout|logoff|signout|로그아웃|delete|remove|삭제|withdraw|탈퇴|write|insert|save|update|submit|download|filedown|\.(pdf|hwpx?|xlsx?|docx?|pptx?|zip|png|jpe?g|gif)(\?|$)/i;
    var fileRe = /\.(pdf|hwpx?|xlsx?|docx?|pptx?|zip)(\?|$)|download|filedown/i;
    var files = [].slice.call(document.querySelectorAll('a[href]')).filter(function (a) { return /^https?:/i.test(a.href) && fileRe.test(a.href); }).map(function (a) { return '· ' + clean(a.innerText || a.title || '첨부') + ' — ' + a.href; });
    var pages = [{ title: document.title || '(제목 없음)', url: location.href, text: clean(document.body.innerText).slice(0, 60000) + (files.length ? '\n\n[첨부·자료 링크]\n' + files.slice(0, 60).join('\n') : '') }];
    var seen = {}, L = [];
    [].slice.call(document.querySelectorAll('a[href]')).map(function (a) { return { t: clean(a.innerText), h: a.href }; }).forEach(function (x) {
      if (!/^https?:/i.test(x.h) || x.h.indexOf(location.origin) !== 0) return; var k = x.h.split('#')[0]; if (k === location.href.split('#')[0] || seen[k] || bad.test(x.h + ' ' + x.t)) return; seen[k] = 1; L.push(x);
    });
    function copy(p) {
      var s = JSON.stringify(p);
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(s) : Promise.reject()).then(function () { alert('업무파탈로 바로 보내지 못해 내용을 복사해 두었습니다.\n업무파탈 설정의 [복사해서 붙여넣어 담기]에 붙여넣으세요.'); }).catch(function () { prompt('아래 내용을 모두 복사해 업무파탈에 붙여넣으세요', s.slice(0, 150000)); });

      window.addEventListener('message', onm);
      var iv = setInterval(function () { tries++; if (ok || tries > 16) { clearInterval(iv); if (!ok) copy(payload); return; } try { w.postMessage({ type: 'tf-ping' }, '*'); } catch (x) { } }, 500);
    }
    if (L.length && confirm('이 화면의 글을 담습니다.\n\n이어지는 같은 포털 안의 쪽 ' + Math.min(L.length, 30) + '개도 함께 담을까요?\n(읽기만 합니다. 로그아웃·삭제·저장 같은 링크는 건너뜁니다)\n\n[확인] 함께 담기   [취소] 지금 화면만')) {

        }).catch(function () { }).then(step);
      })();
    } else send();
  };
  return 'javascript:' + encodeURIComponent('(' + f.toString().replace('__APP__', ptApp()) + ')()');
}

}
const cmHash = async p => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tfcm|' + p)))].map(b => b.toString(16).padStart(2, '0')).join('');
const cmKey = async (p, salt) => { const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); };
const cmB64 = u => btoa(String.fromCharCode(...new Uint8Array(u))), cmUn64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
Object.assign(A, {
  async cmUnlock() { const v = (cmQ('cmpin') || {}).value || ''; if (await cmHash(v) === CM.pin) { cmUnl = true; TF.render(); } else toast('암호가 맞지 않아요.'); },

  cmWipe() { sure('이 기기의 학급 관리 데이터(학생 명렬·기록 전부)를 지울까요? 되돌릴 수 없어요.', () => { CM = cmNew(); cmReady = true; cmUnl = true; idb.set(CMK, CM); cmCfg().cur = ''; save(true); TF.render(); }); }

const B2_SYS = `당신은 교사 업무수첩 「업무파탈」 안의 비서 꿈송이입니다. 늘 존댓말로 짧고 정확하게 답합니다.

- 규정·지침·학칙·조항을 묻는 질문은 당신의 영역이 아닙니다. "규정은 위쪽 📜 규정줍줍 탭에서 찾아 드려요"라고만 안내하세요. 문서에 없으면 "올려 주신 자료에서는 찾지 못했습니다"라고 말하고 일반 상식으로 단정하지 마세요. 조항 원문은 짧게 인용합니다.
- 일정·할 일·업무 카드·예산·연수표를 넣거나 고치라는 요청은 쓰기 도구로 "제안"하세요. 제안은 사용자가 [적용]을 눌러야 반영됩니다. 날짜는 YYYY-MM-DD로, "내일·다음 주 금요일"은 오늘 날짜 기준으로 계산하세요. 삭제는 하지 않습니다.
- 정리·요약·비교를 부탁받으면 읽은 내용을 표나 목록으로 깔끔하게 정리하세요. 어느 화면에서 볼 수 있는지 go_to로 링크를 붙이세요.
- 정보가 모호하면 도구 호출 전에 한 가지만 되물으세요. 학생·교직원의 실명 명단은 이 수첩에 없으며 만들지도 않습니다.`;
async function b2Call(body) {
  const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': agKey(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status === 401 ? '키가 올바르지 않습니다' : r.status === 429 ? '요청이 몰렸습니다. 잠시 뒤 다시 해 주세요' : r.status === 400 || r.status === 402 ? '잔액(크레딧)이나 요청 형식을 확인해 주세요' : '응답 오류 ' + r.status);
  return r.json();
}
const B2_LBL = { search_site: '사이트 검색', find_rule: '규정 찾기', list_library: '자료실', read_library: '자료 읽기', get_calendar: '캘린더', get_day: '하루 보기', list_work_cards: '내 업무 카드', get_budget: '예산', list_training: '연수표', list_notes: '회의·연수 노트', get_worklog: '업무일지' };
async function b2Loop(q) {
  const hist = CH.slice(-9, -1).filter(m => m.text).map(m => (m.role === 'me' ? '사용자: ' : '꿈송이: ') + b2Cut(m.text, 300)).join('\n');
  const msgs = [{ role: 'user', content: agContext() + (hist ? '\n\n[앞선 대화]\n' + hist : '') + '\n\n[요청]\n' + q }];
  const tools = [...B2_READ.filter(x => x.name !== 'find_rule'), ...AG_TOOLS, ...B2_WRITE, B2_NAV], acts = [], links = [], seen = [];
  let text = '';
  for (let n = 0; n < 9; n++) {
    const j = await b2Call({ model: B2_MODEL(), max_tokens: 2500, system: B2_SYS, tools, messages: msgs });
    msgs.push({ role: 'assistant', content: j.content });
    const t = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n').trim(); if (t) text = t;
    const uses = (j.content || []).filter(c => c.type === 'tool_use');
    if (j.stop_reason !== 'tool_use' || !uses.length) break;
    const res = uses.map(u => {
      let out;
      try {
        if (B2_READ.some(x => x.name === u.name)) { out = JSON.stringify(b2Run(u.name, u.input || {})); const l = B2_LBL[u.name] + (u.name === 'find_rule' || u.name === 'search_site' ? '(' + (u.input.query || '') + ')' : ''); if (!seen.includes(l)) seen.push(l); }
        else if (u.name === 'go_to') { if (B2_NAVS.includes(u.input.hash)) links.push({ src: '바로가기', html: esc(u.input.label || u.input.hash), text: u.input.label || '', ref: u.input.hash }); out = '링크를 붙였습니다'; }
        else { acts.push({ name: u.name, input: u.input || {} }); out = '제안 목록에 담았습니다. 사용자가 [적용]을 눌러야 반영됩니다. 같은 제안을 다시 부르지 마세요.'; }
      } catch (e) { out = '도구 오류: ' + e.message; }
      return { type: 'tool_result', tool_use_id: u.id, content: b2Cut(out, 9000) };
    });
    msgs.push({ role: 'user', content: res });
  }
  if (!text && !acts.length) return false;
  acts.forEach(a => { a.plan = agPlan(a); });
  const rb = [];
  const m = { role: 'bot', q, text: (text || '이렇게 처리하려고 합니다.') + (seen.length ? '\n\n🔎 확인한 곳: ' + seen.join(' · ') : ''), blocks: [...rb, ...links] };
  if (acts.length) { m.act = acts; m.applied = false; }
  CH.push(m); return true;
}

/* ---- 챗봇 입구 교체: 키 있으면 비서 루프, 없으면 규정줍줍 + 기존 찾기 ---- */
ask1 = async function (q) {
  q = q.trim(); if (!q || busy) return;
  CH.push({ role: 'me', text: q }); busy = true; renderChat();
  if (agKey()) { let ok = false; try { ok = await b2Loop(q); } catch (e) { CH.push({ role: 'bot', text: '비서 기능을 쓰지 못했습니다(' + e.message + '). 대신 수첩에서 직접 찾아 드릴게요.', blocks: [] }); } if (ok) { busy = false; renderChat(); return; } }
  const rb = [];
  const dir = direct(q), hits = search(q), seenT = new Set(rb.map(b => b.text));
  const blocks = [...rb, ...dir.map(d => ({ src: d.src, text: d.text, ref: d.ref })), ...hits.filter(h => !seenT.has(h.c.text)).map(h => ({ src: h.c.src, text: h.c.text, ref: h.c.ref }))];
  const text = blocks.length ? '' : '올려 주신 자료에서 찾지 못했습니다. 규정·지침 파일은 [자료실]에 올려 두면 조항 단위로 찾아 드립니다. 다른 말로 한 번 더 물어봐 주세요.';
  busy = false; CH.push({ role: 'bot', q, blocks, text }); renderChat();
};

/* ---- 챗봇 안에서 모델 고르기 ---- */
const B2_MODELS = [['claude-haiku-5-5', '빠르고 저렴 · 기본 (Haiku)'], ['claude-sonnet-5-5', '균형 (Sonnet)'], ['claude-opus-5-5', '가장 똑똑함·비쌈 (Opus)']];
const _b2Kb = chatKeyBar;
chatKeyBar = function () {
  const h = _b2Kb.apply(this, arguments);
  if (!agKey() || window.__keyEdit) return h;
  return h + `<div class="ckb on"><span>🧠 모델</span><select data-b2model aria-label="비서 모델">${B2_MODELS.map(([v, l]) => `<option value="${v}" ${B2_MODEL() === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
};
document.addEventListener('change', e => { if (e.target.matches('[data-b2model]')) { localStorage.setItem('tf.botModel', e.target.value); toast('모델을 바꿨습니다: ' + e.target.selectedOptions[0].textContent); } });

/* ---- 챗봇에서 바로 규정 올리기(📎) → 규정줍줍이 찾는 자료실에 '규정'으로 저장 ---- */
document.addEventListener('change', async e => {
  if (e.target.id !== 'chatUp') return; const fs = [...e.target.files]; e.target.value = ''; if (!fs.length) return;
  try { await ingestFiles(fs, { kind: '규정', from: 'lib', noAsk: true }); toast('규정으로 올렸습니다. 이제 바로 물어보세요.'); } catch (er) { toast('올리지 못했습니다: ' + (er.message || er)); }
}, true);

/* setui.js — 설정의 "작업표시줄에 고정 · 위젯" 안내 칸(app.js `.guide`) 위에 [앱으로 설치하기]·[위젯 열기] 버튼을 붙입니다.
   (설정 칸 접기는 extra.js `setFold()`가 맡습니다.) */
const isStandalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
let _ip = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _ip = e; });
window.addEventListener('appinstalled', () => { _ip = null; toast('설치했습니다. 작업표시줄 아이콘을 오른쪽 클릭해 "작업 표시줄에 고정"을 누르세요.'); });
Object.assign(A, {
  pwaInstall() {
    if (isStandalone()) return toast('이미 앱으로 열려 있습니다.');
    if (!_ip) return toast('설치 창을 바로 띄울 수 없습니다. 크롬 ⋮ → 저장 및 공유 → 페이지를 앱으로 설치를 눌러 주세요.');
    _ip.prompt(); _ip.userChoice.finally(() => { _ip = null; });
  },
  widgetOpen() {
    const w = window.open('widget.html', 'tfwidget', `popup=yes,width=380,height=580,left=${Math.max(0, (screen.availWidth || 1200) - 410)},top=60`);
    if (!w) toast('팝업이 막혔습니다. 주소창 오른쪽의 팝업 차단을 풀어 주세요.');
  }
});
function installTools() {
  const g = document.querySelector('main .guide'); if (!g || g.querySelector('.itools')) return;
  const st = isStandalone(), d = document.createElement('div'); d.className = 'itools';
  d.innerHTML = `<div class="tools"><button class="btn pri" data-act="pwaInstall" ${st ? 'disabled' : ''}>${st ? '✅ 앱으로 열려 있습니다' : '앱으로 설치하기'}</button><button class="btn" data-act="widgetOpen">🧩 위젯 열기</button></div><p class="mu">🧩 위젯은 디데이·기한 임박·오늘 할 일만 작게 보여 주는 창입니다(보기 전용). 설치 후 작업표시줄 아이콘을 오른쪽 클릭하면 "위젯 열기"도 나옵니다. 항상 맨 위에 두려면 Windows PowerToys의 "Always On Top"(Win+Ctrl+T)을 쓰세요.</p>`;
  g.prepend(d);
}
new MutationObserver(installTools).observe(document.getElementById('app'), { childList: true, subtree: true });
/* 맨 마지막에 불러오는 파일이라, 여기서 한 번 더 그려 새 부품(디데이 칩·줄)이 처음 화면부터 빠짐없이 나오게 함 */
if (S.setup && TF.render) TF.render();

/* 화면 단순 보기: 소제목(h3) 구역·사용법 상자·오늘 화면의 큰 덩어리를 "접힌 토글"로 묶는다.
   기본은 모두 접힘. 선생님이 연 칸은 기억하고(tf.fold), 맨 위 [모두 펼치기/접기]로 한 번에 바꾼다. */
(function () {
  const K = 'tf.fold', KV = 'tf.foldv';
  let SET; try { SET = new Set(JSON.parse(localStorage.getItem(K) || '[]')); } catch (e) { SET = new Set(); }
  const keep = () => { try { localStorage.setItem(K, JSON.stringify([...SET].slice(-500))); } catch (e) { } };
  const SKIP = /^#\/(pages?|page\/)/;
  function wrap(nodes, title, key, cls) {
    const d = document.createElement('details'); d.className = 'afold ' + (cls || ''); d.dataset.fk = key; if (SET.has(key)) d.open = true;
    const s = document.createElement('summary'); s.innerHTML = title; d.appendChild(s);
    const b = document.createElement('div'); b.className = 'afb'; d.appendChild(b);
    nodes[0].parentNode.insertBefore(d, nodes[0]); nodes.forEach(n => b.appendChild(n)); return d;
  }
  function migrate() {
    try { if (!localStorage.getItem('tf.cmhide')) { localStorage.setItem('tf.cmhide', '1'); S.navHide = S.navHide || []; if (!S.navHide.includes('cm')) S.navHide.push('cm'); save(true); } } catch (e) { } /* 학급 관리는 선택해야 보임(메뉴 고르기) */
    try { if (localStorage.getItem(KV)) return; localStorage.setItem(KV, '1'); OPEN.clear(); localStorage.setItem('tf.open', '[]'); if (S.profile) { S.profile.hpOpen = false; save(true); } } catch (e) { }
  }
  /* 「오늘의 게시판」을 「오늘 꼭 할 일」 위로(다른 카드가 나중에 끼어들어도 다시 맞춤) */
  function placeBoard() {
    const main = document.querySelector('main'); if (!main) return; const d = main.querySelector(':scope > details.afold[data-fk*="게시판"]'), top = main.querySelector(':scope > .mttoday') || main.querySelector(':scope > .hpcard');
    if (d && top && !(d.compareDocumentPosition(top) & 4)) main.insertBefore(d, top);
  }
  function foldPass() {
    const main = document.querySelector('main'); if (!main || main.querySelector(':scope > .foldbar')) return;
    migrate();
    const hash = (location.hash || '#/today').replace(/\?.*$/, ''); if (SKIP.test(hash)) return;
    const today = /^#\/(today)?$/.test(hash) || hash === '#/'; let n = 0;
    const key = t => hash + '|' + String(t).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim().slice(0, 30);
    if (today) {
      const kids = [...main.children], bh = kids.find(e => e.classList.contains('bh')), sp = kids.find(e => e.classList.contains('spread')), cm = kids.find(e => e.classList.contains('cmtoday'));
      if (bh && sp) { const d = wrap([bh, sp], '📋 오늘의 게시판 <small>일정·할 일·평가·예산·연수 한눈에</small>', key('게시판')); n++; placeBoard(); }
      if (cm && getComputedStyle(cm).display !== 'none') { wrap([cm], '🏫 학급 관리 <small>오늘 반 일정·상담 후속</small>', key('학급')); n++; }
    } else {
      const hs = [...main.children].filter(e => e.matches('h3.h3'));
      if (hs.length >= 2) hs.forEach(h => {
        const grp = []; let x = h.nextElementSibling;
        while (x && !x.matches('h3.h3, .pgfiles, .pgfdet, .foldbar')) { grp.push(x); x = x.nextElementSibling; }
        if (!grp.length) return;
        const d = wrap(grp, h.innerHTML, key(h.textContent)); h.remove(); n++;
      });
      [...main.children].filter(e => e.matches('.steps2, .note2')).forEach((e, i) => { wrap([e], '💡 사용법 <small>필요할 때만 펼치세요</small>', key('사용법' + i), 'help'); n++; });
    }
    if (today) { setTimeout(placeBoard, 60); setTimeout(placeBoard, 500); }
    if (n >= 2) {
      const bar = document.createElement('div'); bar.className = 'foldbar';
      bar.innerHTML = '<button type="button" class="btn sm" data-fold="open">▾ 모두 펼치기</button><button type="button" class="btn sm" data-fold="close">▸ 모두 접기</button>';
      const bk = main.querySelector(':scope > .backbtn'); if (bk) bk.after(bar); else main.prepend(bar);
    }
  }
  document.addEventListener('toggle', e => { const d = e.target; if (d && d.classList && d.classList.contains('afold')) { d.open ? SET.add(d.dataset.fk) : SET.delete(d.dataset.fk); keep(); } }, true);
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-fold]');
    if (b) { const open = b.dataset.fold === 'open'; document.querySelectorAll('main details.afold').forEach(d => { d.open = open; }); return; }
    const g = e.target.closest('[data-go]'); if (g) { const t = document.getElementById(g.dataset.go), d = t && t.closest('details.afold'); if (d && !d.open) d.open = true; }
  }, true);
  const _r = TF.render; TF.render = function () { const v = _r.apply(this, arguments); try { foldPass(); } catch (e) { } return v; };
  { const _g = render; render = function () { const v = _g.apply(this, arguments); try { foldPass(); } catch (e) { } return v; }; }
  setTimeout(() => { try { foldPass(); } catch (e) { } }, 0);
})();
</script>
