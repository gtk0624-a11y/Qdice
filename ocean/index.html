const P1EV = {1:['start'],2:['factory'],3:['boom'],4:['heat'],5:['news'],6:[]};
function evList(part,y,P2N){
  if(part===1) return P1EV[y]||[];
  const a=[]; if(y===1) a.push('renew'); if(y===2) a.push('ghost'); if(y===3) a.push('boom');
  if(y>=P2N-1 && y>=2) a.push('kids'); return a;
}

const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
function grow(N,s,rm){
  if(N<=0) return 0;
  if(N<0.1*s.K){ N*=0.8; }
  else N += s.r*rm*N*(1-N/s.K);
  if(N<0.015*s.K) N=0;
  return N;
}
function chOf(team,part){ return part===2 ? (CH[team&&team.charter]||CH.free) : CH.free; }
function isRest(ch,part,y){ return part===2 && ch.rest && ch.rest.includes(y); }
function maxOut(team,part,y){ const ch=chOf(team,part); if(isRest(ch,part,y)) return 0; return Math.min(team.boats||0, ch.max); }

/* 한 해 결산 — 순수 함수 */
function settle(ocean, teams, decs, ctx){
  // ctx: {part, y, keys:[t1..], heat, P2N}
  const evs = evList(ctx.part, ctx.y, ctx.P2N);
  const price = evs.reduce((m,k)=>m*(EV[k].price||1),1);
  const o = Object.assign({}, ocean);
  const T = {}; ctx.keys.forEach(k=>T[k]=Object.assign({}, teams[k]));
  const eff={}, info={};
  let E=0;
  ctx.keys.forEach(k=>{
    const t=T[k], d=decs[k]||{}, ch=chOf(t,ctx.part), rest=isRest(ch,ctx.part,ctx.y);
    const boats = rest?0:clampN(Math.round(+d.boats||0),0,maxOut(t,ctx.part,ctx.y));
    const dense = !rest && boats>0 && !!d.dense && ch.dense!==false;
    eff[k] = boats*(dense?DENSE:1)*(t.sonar?SONAR:1);
    info[k] = {boats,dense,rest,ch};
    E += Q*eff[k];
  });
  const H=Math.min(MAXH,E), sc=E>0?H/E:0;
  const rep={}; let Hd=0;
  const caught={mk:0,pl:0,tn:0};
  ctx.keys.forEach(k=>{
    const h=Q*eff[k]*sc; if(info[k].dense) Hd+=h;
    const c={}; let val=0;
    SP.forEach(s=>{ c[s.k]=ocean[s.k]*h; val+=c[s.k]*s.p*price; });
    const ch=info[k].ch; let released=0;
    if(ch.cap && val>ch.cap){ const ratio=ch.cap/val; SP.forEach(s=>{ released+=c[s.k]*(1-ratio); c[s.k]*=ratio; }); val=ch.cap; }
    if(ch.income) val*=ch.income;
    SP.forEach(s=>caught[s.k]+=c[s.k]);
    rep[k]={c:{mk:Math.round(c.mk),pl:Math.round(c.pl),tn:Math.round(c.tn)}, inc:Math.round(val), boats:info[k].boats, dense:info[k].dense, rest:info[k].rest, rel:Math.round(released), kill:0};
  });
  SP.forEach(s=>{ o[s.k]=Math.max(0,o[s.k]-caught[s.k]); });
  // 바다거북 혼획
  let killTot=0; const kr={};
  ctx.keys.forEach(k=>{ const i=info[k]; kr[k]= i.ch.turtleSafe?0: i.boats*0.012*(i.dense?2:1)*(T[k].sonar?1.2:1); });
  const sumKr=Object.values(kr).reduce((a,x)=>a+x,0), killFrac=Math.min(0.35,sumKr);
  ctx.keys.forEach(k=>{ const kk = sumKr>0? o.tt*killFrac*kr[k]/sumKr : 0; rep[k].kill=Math.round(kk*10)/10; killTot+=kk; });
  o.tt=Math.max(0,o.tt-killTot);
  // 사건
  if(evs.includes('factory')){ o.mk*=0.9; o.pl*=0.9; }
  if(evs.includes('ghost')){ o.tt*=0.88; }
  const heat = ctx.heat || evs.includes('heat');
  // 성장
  const juv=Math.max(0.3,1-3*Hd);
  const nEco=ctx.keys.filter(k=>info[k].ch.reserve).length, res=1+0.1*nEco;
  o.mk=grow(o.mk,SP[0],juv*res);
  o.pl=grow(o.pl,SP[1],juv*res*(heat?0.6:1));
  o.tn=grow(o.tn,SP[2],res);
  o.tt=grow(o.tt,TT,res);
  ALLS.forEach(s=>o[s.k]=Math.round(o[s.k]*10)/10);
  // 돈·배
  const sfx=ctx.part===2?'2':'1';
  ctx.keys.forEach(k=>{
    const t=T[k], d=decs[k]||{}, r=rep[k];
    r.fuel=r.boats*FUEL;
    t.money=Math.round((+t.money||0)+r.inc-r.fuel);
    let bb=0, bs=false;
    const want=clampN(Math.round(+d.buyBoat||0),0,2);
    for(let i=0;i<want;i++){ if(t.money>=BOATC && (t.boats||0)<BOAT_MAX){ t.money-=BOATC; t.boats=(t.boats||0)+1; bb++; } }
    if(d.buySonar && !t.sonar && t.money>=SONARC){ t.money-=SONARC; t.sonar=true; bs=true; }
    r.bb=bb; r.bs=bs; r.money=t.money;
    t['earn'+sfx]=Math.round((+t['earn'+sfx]||0)+r.inc-r.fuel);
    t['foot'+sfx]=Math.round(((+t['foot'+sfx]||0)+r.c.mk*1+r.c.pl*2+r.c.tn*5+r.kill*25)*10)/10;
    t['kill'+sfx]=Math.round(((+t['kill'+sfx]||0)+r.kill)*10)/10;
    t['catch'+sfx]=(+t['catch'+sfx]||0)+r.c.mk+r.c.pl+r.c.tn;
  });
  return {ocean:o, teams:T, rep, evs, price, heat};
}
function recover(ocean,years=10){
  const o=Object.assign({},ocean), path=[];
  for(let i=0;i<years;i++){
    // 물고기: 이웃 바다에서 조금씩 건너와(최소 15%) 다시 번식 / 바다거북: 스스로 회복해야 함(느림)
    SP.forEach(s=>{ if(o[s.k]<0.15*s.K) o[s.k]=0.15*s.K; o[s.k]+=s.r*o[s.k]*(1-o[s.k]/s.K); });
    o.tt=grow(o.tt,TT,1);
    ALLS.forEach(s=>o[s.k]=Math.round(o[s.k]*10)/10);
    path.push(Object.assign({},o));
  }
  return {ocean:o,path};
}

   ========================================================= */
const clean = o => o==null ? null : JSON.parse(JSON.stringify(o));
let DBMODE='demo', backend=null;
async function initBackend(){
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL){
    try{
      const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const db = D.getDatabase(A.initializeApp(FIREBASE_CONFIG,'ocean'));
      backend = {
        set:(p,v)=>D.set(D.ref(db,p),clean(v)),
        update:(p,v)=>D.update(D.ref(db,p),clean(v)),
        remove:p=>D.remove(D.ref(db,p)),
        on:(p,cb)=>D.onValue(D.ref(db,p),s=>cb(s.val()),err=>toast('⚠️ 데이터베이스 연결 오류: '+err.message))
      };
      DBMODE='live'; return;
    }catch(e){ console.error(e); toast('⚠️ Firebase 연결 실패 → 체험 모드로 실행합니다'); }
  }
  const KEY='ocean_demo_db';
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('oceangame') : null;
  const L=[];
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } };
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=(t,p)=>parts(p).reduce((o,k)=>o==null?undefined:o[k],t);
  const setAt=(t,p,v)=>{ const ks=parts(p); let o=t; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } const last=ks[ks.length-1]; if(v==null) delete o[last]; else o[last]=clean(v); };
  const fire=()=>{ const t=read(); L.forEach(l=>l.cb(clean(getAt(t,l.p))??null)); };
  const write=t=>{ try{ localStorage.setItem(KEY,JSON.stringify(t)); }catch(e){} fire(); bc&&bc.postMessage(1); };
  if(bc) bc.onmessage=fire;
  window.addEventListener('storage',e=>{ if(e.key===KEY) fire(); });
  backend = {
    set:async(p,v)=>{ const t=read(); setAt(t,p,v); write(t); },
    update:async(p,obj)=>{ const t=read(); for(const k in obj) setAt(t,p+'/'+k,obj[k]); write(t); },
    remove:async p=>{ const t=read(); setAt(t,p,null); write(t); },
    on:(p,cb)=>{ const l={p,cb}; L.push(l); setTimeout(()=>cb(clean(getAt(read(),p))??null),0); return ()=>{ const i=L.indexOf(l); if(i>=0) L.splice(i,1); }; }
  };
}

function clockTime(h){ const hours=clampN(3+(0.9-h)/0.9*9,0,12); const hh=Math.floor(hours), mm=Math.floor((hours-hh)*60); return {hours, label:`${hh===0?12:hh}시 ${String(mm).padStart(2,'0')}분`, zone: hours<3?'양호':hours<6?'불량':hours<9?'심각':'위험'}; }
function clockSVG(h,size=210){
  const c=clockTime(h), cx=100, cy=100, r=86;
  const arc=(a0,a1,col)=>{ const p=a=>[cx+r*Math.sin(a*Math.PI/6), cy-r*Math.cos(a*Math.PI/6)]; const [x0,y0]=p(a0),[x1,y1]=p(a1); return `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z" fill="${col}"/>`; };
  let s=arc(0,3,'#bfe8d6')+arc(3,6,'#cfe3f6')+arc(6,9,'#fde2b8')+arc(9,12,'#f7c1c1');

function renderStudent(){

  if(!P||!P.joined||!P.nick||!P.team){ $app.innerHTML=`<div class="wrap">${vJoin()}</div>`; return; }
  const ph=phase(); let h='';
  if(ph==='lobby') h=vLobby();
  else if(ph==='intro') h=vIntro();
  else if(ph==='p1'||ph==='p2') h=vSea();
  else if(ph==='p1end') h=vP1End();
  else if(ph==='charter') h=vCharter();
  else if(ph==='final') h=vFinal();
  else if(ph==='reflect') h=vReflect();
  else h=`${sHeader()}${waitCard('오늘 바다 여행 끝! 수고했어요. 🌊')}`;
  $app.innerHTML=`<div class="wrap">${h}</div>`;

function finalData(){
  const p1=toArr(HIST.p1), rec=toArr(HIST.rec), p2=toArr(HIST.p2);
  const ks=keys();
  const rich=ks.map(k=>({k,v:+(TEAMSD[k]||{}).earn2||0})).sort((a,b)=>b.v-a.v);
  const foot=ks.map(k=>({k,v:+(TEAMSD[k]||{}).foot2||0})).sort((a,b)=>a.v-b.v);
  const kills=ks.map(k=>({k,v1:+(TEAMSD[k]||{}).kill1||0,v2:+(TEAMSD[k]||{}).kill2||0}));
  const last=p2.length?p2[p2.length-1]:(OCEAN||{});
  return {p1,rec,p2,rich,foot,kills,last};
}

    T.tab='run'; backend.update(`${BASE()}/meta`,{phase:v}); },
  startP1(){ if(META.started && !confirm('1부를 처음부터 다시 시작할까요? 지금까지의 바다·선단 기록이 지워집니다.')) { backend.update(`${BASE()}/meta`,{phase:'p1'}); T.tab='run'; return; } T.tab='run'; startP1Core(); },
  startP1force(){ if(!confirm('1부를 처음부터 다시 시작할까요? 바다·선단·헌장 기록이 지워집니다. (학생 입장 정보는 남습니다)')) return; T.tab='run'; startP1Core(); },
  async settle(){
    if(T.busy) return; if(partOver()) return;
    T.busy=true; render();
    try{
      const pt=part(), y=year(), ks=keys(), decs={};
      ks.forEach(k=>decs[k]=decFor(k));
      const R=settle(OCEAN, TEAMSD, decs, {part:pt, y, keys:ks, heat:!!META.heat, P2N:P2N()});
      const hk='p'+pt; const h=toArr(HIST[hk]); h.push(R.ocean);
      const upd={ocean:R.ocean, ['hist/'+hk]:h, 'meta/round':y+1, 'meta/last':{part:pt,y,rep:R.rep,at:Date.now()}, 'meta/heat':pt===1?R.heat:false};
      ks.forEach(k=>upd['teams/'+k]=R.teams[k]);
      await backend.update(BASE(),upd);
      const lost=SP.filter(s=>(+OCEAN[s.k]||0)>0 && R.ocean[s.k]===0);
      toast(lost.length?`🚨 ${lost.map(s=>s.n).join('·')}이(가) 바다에서 사라졌습니다!`:`🎣 ${y}년째 결산 완료!`);
    }catch(e){ console.error(e); toast('⚠️ 결산 실패: '+e.message); }
    T.busy=false; render();
  },
  endP1(){ if(!confirm('1부를 여기서 끝낼까요?')) return; backend.update(`${BASE()}/meta`,{round:P1N()+1}); },
  toggleExact(){ backend.update(`${BASE()}/meta`,{exact:!META.exact}); },
  toCharter(){
    if(META.rec){ T.tab='run'; backend.update(`${BASE()}/meta`,{phase:'charter'}); return; }
    if(!OCEAN) return toast('먼저 1부를 진행해 주세요.');
    const R=recover(OCEAN,10);
    const upd={ocean:R.ocean,'hist/rec':R.path,'hist/p2':[R.ocean],'meta/phase':'charter','meta/rec':true,'meta/part':2,'meta/round':1,'meta/last':null,'meta/exact':false, dec:null};
    const tm=initTeams(START_BOATS2,true); keys().forEach(k=>upd['teams/'+k]=tm[k]);
    T.tab='run'; backend.update(BASE(),upd);
  },
  startP2(){ const miss=keys().filter(k=>!(TEAMSD[k]||{}).charter); if(miss.length && !confirm(`${miss.map(k=>TM[k].n).join(', ')}이(가) 헌장을 고르지 않았어요. ‘인간 중심주의’로 시작할까요?`)) return;
    const upd={'meta/phase':'p2'}; miss.forEach(k=>upd[`teams/${k}/charter`]='human'); T.tab='run'; backend.update(BASE(),upd); },
  rv(el){ const v=clampN((+META.rv||0)+(+el.dataset.v),0,3); backend.update(`${BASE()}/meta`,{rv:v}); },
  spot(el){ T.spot={v:el.dataset.v,w:el.dataset.w}; render(); },
  spotClose(el,ev){ if(ev && ev.target!==el) return; T.spot=null; render(); },
  setN(el){ const k=el.dataset.k, v=+el.dataset.v; if(k==='TN' && META.started && !confirm('게임 도중 선단 수를 바꾸면 1부를 다시 시작해야 해요. 바꿀까요?')) return; backend.update(`${BASE()}/meta`,{[k]:v}).then(()=>{ if(k==='TN'&&META.started) startP1Core(); }); },
  copy(){ navigator.clipboard&&navigator.clipboard.writeText(studentURL()).then(()=>toast('📋 링크를 복사했어요.')); },
  rename(){ const v=(document.getElementById('lblIn').value||'').trim().slice(0,12); backend.update(`${INDEX}/${ROOM}`,{label:v,at:Date.now()}); toast('🏫 반 이름을 저장했어요.'); },
  reset(){ if(!confirm('이 방('+ROOM+')의 학생·바다 기록을 모두 지울까요? 되돌릴 수 없습니다.')) return; backend.remove(BASE()).then(()=>backend.set(`${BASE()}/meta`,{phase:'lobby',created:Date.now()})); toast('🗑️ 지웠어요.'); },
  csv(){
    const rows=[['번호','이름','선단','1부 까닭','1부 설명',...REFQ.map(q=>q.t)]];
    plist().forEach(p=>rows.push([p.num,p.nick,TM[p.team]?TM[p.team].n:'',p.a1&&p.a1.done?CAUSES[p.a1.c].s:'',p.a1&&p.a1.done?p.a1.t:'',...REFQ.map(q=>p.ref&&p.ref[q.k]||'')]));
    const s='﻿'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'})); a.download=`꿈결앞바다_${roomLabel(ROOM)||ROOM}.csv`; a.click(); },
  goPicker(){ location.search='?mode=teacher'; },
  async pickNew(){ const lb=T.newLabel.trim(); if(!lb) return toast('반 이름을 입력해 주세요. (예: 1-3반)'); const c=newCode(), now=Date.now(); await backend.set(`${INDEX}/${c}`,{label:lb,at:now,created:now}); location.search='?mode=teacher&room='+c; },
  pickOpen(el){ location.search='?mode=teacher&room='+el.dataset.v; },
  pickCode(){ const c=T.openCode.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8); if(c.length<3) return toast('방 코드를 확인해 주세요.'); location.search='?mode=teacher&room='+c; },
  pickRemove(el){ const c=el.dataset.v; if(!confirm(`${roomLabel(c)||c} 방을 목록에서 뺄까요? (기록은 지워지지 않습니다)`)) return; backend.remove(`${INDEX}/${c}`); }
};
const TBIND = { pin:v=>T.pin=v, newLabel:v=>T.newLabel=v, openCode:v=>T.openCode=v };

/* =========================================================
   ⑧ 이벤트 연결 · 시작
   ========================================================= */
document.addEventListener('error',e=>{ const t=e.target; if(t&&t.tagName==='IMG'&&t.src.indexOf(CHAR)>=0){ const sp=document.createElement('span'); sp.textContent='🐚'; sp.style.cssText='display:inline-flex;align-items:center;justify-content:center;font-size:40px;width:60px;flex:none'; t.replaceWith(sp); } },true);
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const A=MODE==='teacher'?TACT:SACT; const f=A[el.dataset.act]; if(f) f(el,e); });
document.addEventListener('input',e=>{ const el=e.target.closest('[data-bind]'); if(!el) return; const B=MODE==='teacher'?TBIND:SBIND; const f=B[el.dataset.bind]; if(f) f(el.value,el); });
document.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; const el=e.target.closest('[data-bind]'); if(!el||el.tagName==='TEXTAREA') return;
  const map={room:'enterRoom',pin:'login',newLabel:'pickNew',openCode:'pickCode'}; const a=map[el.dataset.bind]; if(a){ e.preventDefault(); (MODE==='teacher'?TACT:SACT)[a](); } });

(async function start(){
  await initBackend();
  const sub=()=>{
    backend.on(`${BASE()}/players`,v=>{ PLAYERS=v||{}; if(MODE==='student'&&P&&P.joined&&PLAYERS[P.id]==null&&P.epoch&&P.epoch===META.created) saveP(true); softRender(); });
    backend.on(`${BASE()}/ocean`,v=>{ OCEAN=v; softRender(); });
    backend.on(`${BASE()}/teams`,v=>{ TEAMSD=v||{}; softRender(); });
    backend.on(`${BASE()}/dec`,v=>{ DECS=v||{}; softRender(); });
    backend.on(`${BASE()}/hist`,v=>{ HIST=v||{}; softRender(); });
  };
  if(MODE==='teacher'){
    backend.on(INDEX,v=>{ ROOMLIST=v||{}; softRender(); });
    if(!ROOM){ render(); return; }
    backend.update(`${INDEX}/${ROOM}`,{at:Date.now()});
    let first=true;
    backend.on(`${BASE()}/meta`,v=>{ META=v||{}; if(first&&!v){ backend.set(`${BASE()}/meta`,{phase:'lobby',created:Date.now()}); } first=false; softRender(); });
    sub(); render(); return;
  }
  if(DBMODE!=='live' && !ROOM) ROOM='SOLO';
  if(!ROOM){ render(); return; }
  P=loadP();
  let lastPhase=null;
  backend.on(`${BASE()}/meta`,v=>{ META=v||{};
    if(P&&P.epoch&&META.created&&P.epoch!==META.created){ try{localStorage.removeItem(skey());}catch(e){} P=null; toast('선생님이 기록을 초기화했어요. 다시 입장해 주세요.'); render(); return; }
    if(P&&P.joined&&!P.epoch&&META.created){ P.epoch=META.created; saveP(true); }
    const ph=phase(); if(ph!==lastPhase){ if(lastPhase!==null) window.scrollTo(0,0); lastPhase=ph; render(); return; }
    softRender(); });
  sub(); render();
})();
</script>
