const byK = (arr,k)=>arr.find(x=>x.k===k);
function norm(d){
  d = d||{};
  return {
    name:d.name||'', flag:Object.assign({c1:'#e63946',c2:'#1d3557',sym:'⭐'},d.flag||{}),
    terr:d.terr||null, pop:d.pop||null, gov:d.gov||null, tax:d.tax||null,
    budget:d.budget||{}, choices:d.choices||{}, events:d.events||{},
    con:{a1:(d.con&&d.con.a1)||'',a2:(d.con&&d.con.a2)||'',duties:Object.values((d.con&&d.con.duties)||[])}
  };
}
function computeInd(d){
  d = norm(d);
  const v={safe:40,free:40,equal:40,welfare:40,eco:40,trust:40};
  const add=eff=>{ if(!eff) return; for(const k in eff) v[k]+=eff[k]; };
  add(byK(TERR,d.terr)?.eff); add(byK(POP,d.pop)?.eff); add(byK(GOV,d.gov)?.eff); add(byK(TAX,d.tax)?.eff);
  if(d.tax){
    for(const b of BUDGET){
      const p = +d.budget[b.k]||0;
      if(p===0) add(b.zero); else for(const k in b.per) v[k]+=b.per[k]*p;
    }
  }
  for(const c of CARDS){ const ch=d.choices[c.id]; if(ch && ch.opt!=null && c.opts[ch.opt]) add(c.opts[ch.opt].eff); }
  for(const e of EVENTS){ const r=d.events[e.id]; if(r && r.opt!=null && e.opts[r.opt]) add(e.opts[r.opt].eff); }
  for(const k in v) v[k]=Math.max(0,Math.min(100,Math.round(v[k])));
  return v;
}
function nationType(v,d){
  d=norm(d);
  if(v.free<35 && (v.safe>=55 || d.gov==='dict')) return 'control';
  if(v.welfare>=65 && v.equal>=60) return 'welfare';
  if(v.safe>=55 && v.welfare<45 && v.equal<50) return 'night';
  if(v.eco>=65 && v.equal<45) return 'market';
  if(v.trust>=70 && v.free>=65) return 'civic';
  if(Math.min(...Object.values(v))>=50) return 'balance';
  return 'shaky';
}
function personaScore(p,v){ let s=0; for(const k in p.w) s+=v[k]*p.w[k]; return Math.round(s); }
function budgetUsed(d){ return BUDGET.reduce((a,b)=>a+(+norm(d).budget[b.k]||0),0); }

/* =========================================================
   ④ 저장소 (Firebase 실시간 DB 또는 체험 모드)
   ========================================================= */
const clean = o => o==null ? null : JSON.parse(JSON.stringify(o));
let DBMODE='demo', backend=null;
async function initBackend(){
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL){
    try{
      const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const db = D.getDatabase(A.initializeApp(FIREBASE_CONFIG));
      backend = {
        set:(p,v)=>D.set(D.ref(db,p),clean(v)),
        update:(p,v)=>D.update(D.ref(db,p),clean(v)),
        remove:p=>D.remove(D.ref(db,p)),
        on:(p,cb)=>D.onValue(D.ref(db,p),s=>cb(s.val()),err=>toast('⚠️ 데이터베이스 연결 오류: '+err.message))
      };
      DBMODE='live'; return;
    }catch(e){ console.error(e); toast('⚠️ Firebase 연결 실패 → 체험 모드로 실행합니다'); }
  }
  // 체험 모드: localStorage + BroadcastChannel (같은 브라우저의 여러 탭끼리 연동)
  const KEY='natgame_demo_db';
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('natgame') : null;
  const L=[];
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } };
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=(t,p)=>parts(p).reduce((o,k)=>o==null?undefined:o[k],t);
  const setAt=(t,p,v)=>{ const ks=parts(p); let o=t; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } const last=ks[ks.length-1]; if(v==null) delete o[last]; else o[last]=clean(v); };
  const fire=()=>{ const t=read(); L.forEach(l=>l.cb(clean(getAt(t,l.p))??null)); };
  const write=t=>{ try{ localStorage.setItem(KEY,JSON.stringify(t)); }catch(e){} fire(); bc&&bc.postMessage(1); };
  if(bc) bc.onmessage=fire;
  window.addEventListener('storage',e=>{ if(e.key===KEY) fire(); });
  backend = {
    set:async(p,v)=>{ const t=read(); setAt(t,p,v); write(t); },
    update:async(p,obj)=>{ const t=read(); for(const k in obj) setAt(t,p+'/'+k,obj[k]); write(t); },
    remove:async p=>{ const t=read(); setAt(t,p,null); write(t); },
    on:(p,cb)=>{ const l={p,cb}; L.push(l); setTimeout(()=>cb(clean(getAt(read(),p))??null),0); return ()=>{ const i=L.indexOf(l); if(i>=0) L.splice(i,1); }; }
  };
}

function flagHTML(f,size=''){ f=Object.assign({c1:'#e63946',c2:'#1d3557',sym:'⭐'},f||{}); return `<span class="flag ${size}"><i style="background:${esc(f.c1)}"></i><i style="background:${esc(f.c2)}"></i><span>${esc(f.sym)}</span></span>`; }
function barsHTML(v,mini=false){ return `<div class="bars ${mini?'mini':''}">${IND.map(i=>`<div class="bar"><span>${mini?i.e:i.e+' '+i.n}</span><span class="tr"><i style="width:${v[i.k]}%;background:${i.c}"></i></span><span class="n">${v[i.k]}</span></div>`).join('')}</div>`; }
function typeBadge(tk){ const t=TYPES[tk]; return `<span class="typebadge" style="background:${t.c}">${t.e} ${esc(t.n)}</span>`; }
const modeBadge = () => DBMODE==='live' ? `<span class="pill live">● 실시간 연동</span>` : `<span class="pill demo">● 체험 모드</span>`;
let pending=false;
function isTyping(){ const a=document.activeElement; return a && $app.contains(a) && (a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && a.type!=='button')); }
function softRender(){ if(isTyping()){ pending=true; return; } render(); }
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(pending && !isTyping()){ pending=false; render(); } },150); });
function render(){ pending=false; const y=window.scrollY; (MODE==='teacher'?renderTeacher:renderStudent)(); if(keepScroll) window.scrollTo(0,y); keepScroll=false; }
let keepScroll=false;

/* =========================================================
   ⑥ 학생 화면
   ========================================================= */
let S=null, META={}, NATIONS={}, VOTES={};
let localEv=null; const curEv=()=> DBMODE==='live' ? META.event : localEv;
let tmpRoom='', evDraft={opt:null,reason:''}, voteDraft={to:null,reason:''}, openVote=null, studentView='main';
const SLOT = (qs.get('s')||'').replace(/[^0-9a-z]/gi,'').slice(0,6); // 체험용: 한 기기에서 여러 학생 흉내 (&s=1, &s=2 ...)
const skey = () => 'natgame_s_'+ROOM+(SLOT?'_'+SLOT:'');
function loadS(){ try{ const x=JSON.parse(localStorage.getItem(skey())); if(x){ x.d=norm(x.d); } return x; }catch(e){ return null; } }
function saveS(){ if(!S) return; try{ localStorage.setItem(skey(),JSON.stringify(S)); }catch(e){} }
function newS(){ return {id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),num:'',sname:'',step:0,ci:0,joinedAt:Date.now(),submitted:false,voted:null,d:norm({})}; }
function pushProgress(){ if(!S||!S.sname||!ROOM) return; backend.set(`rooms/${ROOM}/progress/${S.id}`,{num:S.num,sname:S.sname,step:S.step,submitted:!!S.submitted,at:Date.now()}); }
function go(step){ S.step=step; saveS(); pushProgress(); window.scrollTo(0,0); render(); }

function stepBar(){
  return `<div class="stepname">${S.step}/6 · ${STEPNAMES[S.step]}</div><div class="steps">${[1,2,3,4,5,6].map(i=>`<div class="${i<S.step?'done':i===S.step?'on':''}"></div>`).join('')}</div>`;
}
function sHeader(){
  const nm = S && S.d.name ? `${flagHTML(S.d.flag,'sm')} <b>${esc(S.d.name)}</b>` : '';
  return `<div class="top"><h1>🏛️ 내가 살고 싶은 국가 만들기</h1>${nm}${DBMODE==='live'?`<span class="pill">방 ${esc(ROOM||'-')}</span>`:''}${S&&S.sname?`<span class="pill">${esc(S.num)}번 ${esc(S.sname)}</span>`:''}${DBMODE==='live'?modeBadge():''}</div>`;
}
function nav(prev,nextLabel='다음 →',nextAct='next',cls='acc'){
  return `<div class="navbar"><div class="in">${prev?`<button class="btn ghost" data-act="prev">← 이전</button>`:'<span></span>'}<button class="btn ${cls}" data-act="${nextAct}">${nextLabel}</button></div></div>`;
}
function optBtn(field,o,sel){ return `<button class="opt ${sel?'sel':''}" data-act="set" data-f="${field}" data-v="${o.k}"><div class="e">${o.e}</div><div class="t">${esc(o.n)}</div><div class="d">${esc(o.d)}</div>${o.pro?`<div class="pc">👍 ${esc(o.pro)}<br>👎 ${esc(o.con)}</div>`:''}</button>`; }

function vJoinRoom(){
  return `${sHeader()}<div class="card center"><h2>방 코드를 입력하세요</h2><p class="muted">선생님 화면에 보이는 방 코드(예: AB12)</p>
  <input class="field" style="max-width:260px;text-align:center;font-size:24px;font-weight:800;letter-spacing:4px;text-transform:uppercase" data-bind="room" value="${esc(tmpRoom)}" maxlength="8">
  <div style="margin-top:14px"><button class="btn acc" data-act="enterRoom">입장하기</button></div></div>`;
}

}
function vBirth(){

   <div class="muted" style="margin-top:8px">오른쪽 색</div><div class="sw">${COLORS.map(c=>`<button style="background:${c}" class="${d.flag.c2===c?'sel':''}" data-act="flag" data-f="c2" data-v="${c}" aria-label="색"></button>`).join('')}</div>
  </div></div>
  <div class="muted" style="margin-top:10px">상징</div><div class="sw sym">${SYMS.map(s=>`<button class="${d.flag.sym===s?'sel':''}" data-act="flag" data-f="sym" data-v="${s}">${s}</button>`).join('')}</div>
  <h3>🗺️ 영토 — 우리 나라는 어디에 있나요?</h3><div class="grid g4">${TERR.map(o=>optBtn('terr',o,d.terr===o.k)).join('')}</div>
  <h3>👥 국민 — 얼마나 많은 사람이 사나요?</h3><div class="grid g3">${POP.map(o=>optBtn('pop',o,d.pop===o.k)).join('')}</div>

function vGov(){
  return `${sHeader()}${stepBar()}<div class="card"><h2>👑 주권 — 누가 나라의 일을 최종 결정하나요?</h2>
  <div class="tip"><b>주권</b>은 나라의 일을 최종적으로 결정하는 힘이에요. 주권을 누가 가지느냐에 따라 <b>국가의 모습</b>이 달라지고, 그 나라 <b>시민의 삶</b>도 달라져요.</div>
  <div class="grid g2">${GOV.map(o=>optBtn('gov',o,S.d.gov===o.k)).join('')}</div></div>${nav(true)}`;

function vBudget(){
  const d=S.d, tax=byK(TAX,d.tax), used=budgetUsed(d), total=tax?tax.pts:0, left=total-used;
  const v=computeInd(d);
  return `${sHeader()}${stepBar()}<div class="card"><h2>💰 세금과 예산 — 국가는 무슨 일을 해야 할까?</h2>
  <div class="tip"><b>국가의 역할</b> ① 시민의 <b>생명과 안전</b> 보호 ② 시민의 <b>인간다운 삶</b> 보장 (교과서 152쪽)<br>세금을 많이 걷으면 국가가 할 수 있는 일이 늘지만, 국민의 부담도 커져요.</div>
  <h3>1) 세금을 얼마나 걷을까요?</h3><div class="grid g3">${TAX.map(o=>optBtn('tax',o,d.tax===o.k)).join('')}</div>
  ${tax?`<h3>2) 예산 ${total}칸을 나눠 주세요</h3>
  <div class="remain ${left===0?'zero':left<0?'over':''}"><span>남은 예산</span><span>${left} / ${total}칸</span></div>
  ${BUDGET.map(b=>{const p=+d.budget[b.k]||0; return `<div class="brow"><div style="font-size:28px">${b.e}</div><div class="nm"><b>${esc(b.n)}</b><small>${esc(b.role)}</small><div class="dots">${'<i></i>'.repeat(p)}</div></div><div class="stp"><button data-act="bud" data-k="${b.k}" data-v="-1">−</button><span class="v">${p}</span><button data-act="bud" data-k="${b.k}" data-v="1">+</button></div></div>`;}).join('')}
  <h3>📊 지금 우리 나라 예상 상태 <span class="muted">(정책 결정 전)</span></h3>${barsHTML(v)}
  <p class="muted">💡 0칸인 분야는 시민이 크게 불만을 가져요.</p>`:''}
  </div>${nav(true)}`;
}

  const c=CARDS[S.ci], ch=S.d.choices[c.id]||{};

  <div class="steps" style="margin-top:8px">${CARDS.map((x,i)=>`<div class="${S.d.choices[x.id]&&S.d.choices[x.id].opt!=null&&i!==S.ci?'done':i===S.ci?'on':''}"></div>`).join('')}</div>
  <div class="scene"><span class="tag">${esc(c.tag)}</span><h3 style="margin:2px 0 6px">${esc(c.t)}</h3><div>${esc(c.s)}</div><div class="src">📖 ${esc(c.src)}</div></div>
  <div class="grid">${c.opts.map((o,i)=>`<button class="opt bigopt ${ch.opt===i?'sel':''}" data-act="pick" data-o="${i}"><span class="lt">${'ABC'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>

  <textarea class="field" data-bind="creason" maxlength="200" placeholder="예: 안전도 중요하지만, 국가가 모든 것을 감시하면 ...">${esc(ch.reason||'')}</textarea>
  </div>${nav(true, S.ci<CARDS.length-1?'다음 정책 →':'헌법 쓰러 가기 →')}`;

function vCon(){
  const d=S.d, nm=d.name||'우리 나라';

  <div class="tip"><b>시민</b>은 한 국가의 구성원으로서 <b>권리와 의무</b>를 가진 사람이에요. 국가와 시민은 서로 의존하는 <b>운명 공동체</b>랍니다. (교과서 145쪽)</div>

  <input class="field" data-bind="a1" maxlength="50" value="${esc(d.con.a1)}" placeholder="예: 모든 시민이 안전하고 자유롭게 꿈꿀 수 있는">

  <div class="chips">${DUTIES.map(x=>`<button class="chip ${d.con.duties.includes(x.k)?'sel':''}" data-act="duty" data-v="${x.k}">${x.n}</button>`).join('')}</div>

function resultBlock(d,showLaw=true){
  d=norm(d); const v=computeInd(d), tk=nationType(v,d), t=TYPES[tk], gov=byK(GOV,d.gov);
  return `<div class="hero">${flagHTML(d.flag,'lg')}<div><div style="font-size:26px;font-weight:900">${esc(d.name)}</div><div class="muted">${gov?gov.e+' '+esc(gov.n):''} · ${byK(TERR,d.terr)?.e||''} ${esc(byK(TERR,d.terr)?.n||'')} · ${esc(byK(POP,d.pop)?.n||'')}</div><div style="margin-top:6px">${typeBadge(tk)}</div></div></div>
  <p style="margin-top:12px">${esc(t.d)}</p>
  <h3>📊 국가 지표</h3>${barsHTML(v)}
  <h3>🗣️ 우리 나라 시민들의 목소리</h3><div class="grid g2">${PERSONAS.map(p=>{const s=personaScore(p,v); const lv=s>=65?0:s>=45?1:2; return `<div class="persona"><div class="av">${p.e}</div><div><div class="who">${esc(p.n)} <span class="face">${['😄','😐','😟'][lv]}</span> ${s}점</div><div class="q">“${esc(p.q[lv])}”</div></div></div>`;}).join('')}</div>
  ${showLaw?`<h3>📜 헌법</h3><div class="law"><p><b>제1조</b> ${esc(d.name)}은(는) ${esc(d.con.a1)} 국가이다.</p><p><b>제2조</b> 모든 시민은 ${esc(d.con.a2)} 권리를 가진다.</p><p><b>제3조</b> 시민의 의무: ${d.con.duties.map(k=>esc(DUTIES.find(x=>x.k===k)?.n||'')).join(', ')}</p></div>`:''}
  <div class="tip" style="margin-top:14px">🤔 <b>생각해 볼 질문</b><br>${esc(t.q)}</div>`;
}
function vResult(){
  let top='';
  if(S.submitted && DBMODE!=='live'){
    top=`<div class="banner ok">🎉 ${esc(S.d.name)} 선포 완료! 선생님이 부르는 <b>위기 사건</b> 버튼을 눌러 대응해 보세요.</div>
    <div class="card"><h3 style="margin-top:0">🚨 위기 사건 <span class="muted">(선생님 안내에 따라 하나씩)</span></h3><div class="grid g4">${EVENTS.map((e,i)=>{const dn=!!S.d.events[e.id]; return `<button class="opt ${dn?'sel':''}" data-act="selfEvent" data-v="${e.id}" ${dn?'disabled':''}><div class="e">${e.e}</div><div class="t">${i+1}. ${esc(e.t)}</div><div class="d">${dn?'✅ 대응 완료':'눌러서 대응하기'}</div></button>`;}).join('')}</div></div>`;
  } else if(S.submitted){
    top=`<div class="banner ok">🎉 선포 완료! 선생님 화면에 ${esc(S.d.name)}이(가) 나타났어요. 선생님의 안내를 기다려 주세요.</div>`;
    if(META.event && !S.d.events[META.event.id]) top+=`<div class="banner bad blink">🚨 위기 사건 발생! 대응이 필요합니다.</div>`;
    if(META.phase==='vote') top+=`<button class="btn teal" style="width:100%;margin-bottom:14px" data-act="toVote">🗳️ 살고 싶은 나라 투표하러 가기</button>`;
    if(META.phase==='closed') top+=`<div class="banner warn">🗳️ 투표가 마감되었습니다. 선생님 화면을 봐 주세요.</div>`;
  } else {
    top=`<div class="banner warn">아직 선포 전이에요. 결과를 확인하고 마음에 들면 <b>국가 선포하기</b>를 누르세요. 고치고 싶으면 이전으로 돌아가도 돼요.</div>`;
    if(META.event) top+=`<div class="banner bad">🚨 위기 사건이 발생했어요! 국가를 선포하면 대응할 수 있어요.</div>`;
  }
  const evDone = EVENTS.filter(e=>S.d.events[e.id]);
  const evHTML = evDone.length?`<h3>🚨 위기 대응 기록</h3>${evDone.map(e=>`<div class="persona" style="margin-bottom:8px"><div class="av">${e.e}</div><div><div class="who">${esc(e.t)}</div><div class="q">${'ABC'[S.d.events[e.id].opt]}. ${esc(e.opts[S.d.events[e.id].opt].t)}</div></div></div>`).join('')}`:'';
  const bottom = S.submitted
    ? `<div class="navbar"><div class="in"><button class="btn ghost" data-act="reedit">✏️ 고쳐서 다시 선포</button>${META.phase==='vote'?`<button class="btn teal" data-act="toVote">🗳️ 투표하기</button>`:'<span></span>'}</div></div>`
    : nav(true,'🎉 국가 선포하기','submit','acc');
  const myRec = `<h3>✏️ 나의 선택과 이유</h3><ul class="rlist">${CARDS.map(c=>{const ch=S.d.choices[c.id]; return ch&&ch.opt!=null?`<li><b>${esc(c.t)}</b>${'ABC'[ch.opt]}. ${esc(c.opts[ch.opt].t)}<br>→ ${esc(ch.reason||'')}</li>`:'';}).join('')}${EVENTS.map(e=>{const r=S.d.events[e.id]; return r?`<li><b>${e.e} ${esc(e.t)}</b>${'ABC'[r.opt]}. ${esc(e.opts[r.opt].t)}<br>→ ${esc(r.reason||'')}</li>`:'';}).join('')}</ul>`;
  return `${sHeader()}${stepBar()}${top}<div class="card">${resultBlock(S.d)}${evHTML}${myRec}</div>${bottom}`;
}
function vVote(){
  const list=Object.values(NATIONS||{}).filter(n=>n&&n.id!==S.id&&n.d);
  const mine=VOTES&&VOTES[S.id];
  return `${sHeader()}<div class="card"><h2>🗳️ 나는 어느 나라에서 살고 싶을까?</h2>
  <div class="tip">친구들이 만든 나라를 둘러보고, <b>내가 시민이라면 가장 살고 싶은 나라</b> 한 곳에 투표하세요. (내 나라는 제외)<br>“어떤 시민이 행복하고, 어떤 시민이 힘들까?”를 꼭 생각해 보세요.</div>
  ${mine?`<div class="banner ok">✅ 투표 완료: ${esc(NATIONS[mine.to]?.d?.name||'')} — 다시 고르면 바뀌어요.</div>`:''}

function validate(){

  if(S.step===0){ if(!String(S.num).trim()||!S.sname.trim()) return '번호와 이름을 입력하세요.'; }
  if(S.step===1){ if(!d.name.trim()) return '나라 이름을 지어 주세요.'; if(!d.terr) return '영토를 선택하세요.'; if(!d.pop) return '국민 수를 선택하세요.'; }
  if(S.step===2){ if(!d.gov) return '누가 다스릴지 선택하세요.'; }
  if(S.step===3){ const t=byK(TAX,d.tax); if(!t) return '세금을 얼마나 걷을지 선택하세요.'; const l=t.pts-budgetUsed(d); if(l>0) return `예산이 ${l}칸 남았어요. 모두 나눠 주세요.`; if(l<0) return `예산이 ${-l}칸 초과했어요.`; }
  if(S.step===4){ const c=CARDS[S.ci], ch=d.choices[c.id]; if(!ch||ch.opt==null) return 'A, B, C 중 하나를 고르세요.'; if(!ch.reason||ch.reason.trim().length<5) return '이유를 5글자 이상 써 주세요.'; }
  if(S.step===5){ if(!d.con.a1.trim()||!d.con.a2.trim()) return '헌법 제1조와 제2조를 완성하세요.'; if(d.con.duties.length!==2) return '시민의 의무를 2개 골라 주세요.'; }
  return null;
}

function bindStudentInput(t){

function startStudent(){
  if(!ROOM && DBMODE!=='live') ROOM='SOLO';

    if(META.phase==='vote' && prevPhase!=='vote' && S && S.submitted){ studentView='vote'; }
    if(META.phase!=='vote') studentView='main';

}

  <tr><th>윤리적 쟁점</th><td>① <b>공공의 안전 ↔ 사생활</b>(스마트 인증서, CCTV, 벌금 제도) ② <b>불평등 해소 ↔ 재산권</b>(부유세) ③ <b>법 준수 ↔ 시민 불복종</b>(비판 금지법, 시위)</td></tr>
  <tr><th>국가의 모습 → 시민의 삶</th><td>같은 정책이라도 시민마다 느끼는 삶이 다르다(시민 6명의 목소리). 《멋진 신세계》형 통제 국가는 안정적이지만 자유가 없다.</td></tr>
  <tr><th>바람직한 관계</th><td><b>소통과 협력</b>(위기 사건: 태안 사례처럼 국가+시민), <b>상호 존중</b>(시위에 대한 대응)</td></tr>
  </table>
  <h3>우리 반의 국가 유형</h3><div class="chips">${Object.keys(TYPES).map(k=>`<span class="chip">${TYPES[k].e} ${esc(TYPES[k].n)} ${cnt[k]||0}</span>`).join('')}</div>
  <p class="muted" style="margin-top:10px">※ ‘최소 국가(야경 국가)’와 ‘복지 국가’는 실제 국가 유형 개념이고, 나머지 유형 이름은 게임 결과를 설명하기 위한 이름입니다.</p>
  <h3>🗣️ 마무리 발문</h3><ol>
  <li>투표 1위 나라에서 <b>가장 불행할 수 있는 시민</b>은 누구일까?</li>
  <li>우리 반에서 가장 의견이 갈린 정책은 무엇이고, 각자 어떤 가치를 더 중요하게 여겼을까?</li>
  <li>“좋은 국가”를 만드는 것은 국가의 몫일까, 시민의 몫일까?</li></ol></div>`;
}
function tNationModal(){
  const n=nationsList().find(x=>x.id===openN); if(!n) return '';
  return `<div class="overlay" data-act="closeN"><div class="modal" data-stop="1"><div class="row"><b>${esc(n.num)}번 ${esc(n.sname)}</b><span class="sp"></span><button class="btn sm ghost" data-act="delN" data-v="${n.id}">삭제</button><button class="btn sm" data-act="closeN">닫기 ✕</button></div>
  <div style="margin-top:10px">${resultBlock(n.d)}</div>
  <h3>💰 세금·예산</h3><p>${esc(byK(TAX,n.d.tax)?.n||'')} · ${BUDGET.map(b=>`${b.e}${esc(b.n)} ${+n.d.budget[b.k]||0}`).join(' / ')}</p>
  <h3>⚖️ 정책 선택과 이유</h3><ul class="rlist">${CARDS.map(c=>{const ch=n.d.choices[c.id]; return ch?`<li><b>${esc(c.t)}</b>${'ABC'[ch.opt]}. ${esc(c.opts[ch.opt].t)}<br>→ ${esc(ch.reason)}</li>`:'';}).join('')}</ul>
  ${EVENTS.some(e=>n.d.events[e.id])?`<h3>🚨 위기 대응</h3><ul class="rlist">${EVENTS.map(e=>{const r=n.d.events[e.id]; return r?`<li><b>${e.e} ${esc(e.t)}</b>${'ABC'[r.opt]}. ${esc(e.opts[r.opt].t)}<br>→ ${esc(r.reason)}</li>`:'';}).join('')}</ul>`:''}
  </div></div>`;
}
function tQRModal(){
  return `<div class="overlay" data-act="closeQR"><div class="modal center" data-stop="1"><h2>📱 학생 접속</h2><div style="font-size:54px;font-weight:900;letter-spacing:6px">${esc(ROOM)}</div><div class="qrbox"><div id="qr"></div></div><p class="url">${esc(studentURL())}</p><p><button class="btn teal" data-act="copyLink">🔗 이 링크 복사</button></p><button class="btn" data-act="closeQR">닫기</button></div></div>`;
}
function renderTeacher(){
  if(!tAuthed){ $app.innerHTML=vPin(); return; }
  const L=nationsList(), phase=(DATA.meta&&DATA.meta.phase)||'build';
  const body = ttab==='gallery'?tGallery(L):ttab==='policy'?tPolicy(L):ttab==='event'?tEvents(L):ttab==='vote'?tVotes(L):tConcept(L);
  $app.innerHTML = `<div class="twrap"><div class="top"><h1>🏛️ 내가 살고 싶은 국가 만들기 · 교사</h1>${modeBadge()}<span class="pill" style="font-size:18px">방 코드 <b style="letter-spacing:2px">${esc(ROOM)}</b></span>
  <button class="btn sm teal" data-act="qr">📱 학생 접속 QR</button><button class="btn sm teal" data-act="copyLink">🔗 학생 링크 복사</button><button class="btn sm ghost" data-act="csv">📥 엑셀(CSV)</button><button class="btn sm ghost" data-act="newRoom">➕ 새 방</button><button class="btn sm ghost" data-act="reset">🗑️ 초기화</button></div>
  <div class="row"><span class="seg"><button class="${phase==='build'?'on':''}" data-act="phase" data-v="build">① 국가 만들기</button><button class="${phase==='vote'?'on':''}" data-act="phase" data-v="vote">② 갤러리·투표</button><button class="${phase==='closed'?'on':''}" data-act="phase" data-v="closed">③ 투표 마감</button></span>
  ${DATA.meta&&DATA.meta.event?`<span class="pill" style="border-color:var(--bad);color:var(--bad)">🚨 위기 사건 진행 중</span>`:''}</div>
  <div class="tabs">${[['gallery','🏳️ 국가 갤러리'],['policy','📊 정책 선택 통계'],['event','🚨 위기 사건'],['vote','🗳️ 투표 결과'],['concept','📘 개념 정리']].map(([k,n])=>`<button class="${ttab===k?'on':''}" data-act="tab" data-v="${k}">${n}</button>`).join('')}</div>
  ${body}</div>${openN?tNationModal():''}${showQR?tQRModal():''}`;
  if(showQR){ const el=document.getElementById('qr'); if(el && window.QRCode){ new QRCode(el,{text:studentURL(),width:300,height:300}); } else if(el){ el.innerHTML='<p class="muted">QR을 불러오지 못했어요. 아래 주소를 알려 주세요.</p>'; } }
}
function csvCell(s){ s=String(s??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function exportCSV(){
  const L=nationsList(), votes=DATA.votes||{};
  const head=['번호','이름','나라 이름','영토','국민','정치 체제','세금',...BUDGET.map(b=>'예산-'+b.n),...CARDS.flatMap(c=>[c.t+' 선택',c.t+' 이유']),'헌법1조','헌법2조','시민의 의무',...EVENTS.flatMap(e=>[e.t+' 선택',e.t+' 이유']),...IND.map(i=>i.n),'국가 유형','투표한 나라','투표 이유'];
  const rows=L.map(n=>{const d=n.d, vt=votes[n.id];
    return [n.num,n.sname,d.name,byK(TERR,d.terr)?.n,byK(POP,d.pop)?.n,byK(GOV,d.gov)?.n,byK(TAX,d.tax)?.n,...BUDGET.map(b=>+d.budget[b.k]||0),
    ...CARDS.flatMap(c=>{const ch=d.choices[c.id]; return ch?['ABC'[ch.opt]+'. '+c.opts[ch.opt].t,ch.reason]:['',''];}),
    d.con.a1,d.con.a2,d.con.duties.map(k=>DUTIES.find(x=>x.k===k)?.n.replace(/^\S+\s/,'')).join(', '),
    ...EVENTS.flatMap(e=>{const r=d.events[e.id]; return r?['ABC'[r.opt]+'. '+e.opts[r.opt].t,r.reason]:['',''];}),
    ...IND.map(i=>n.v[i.k]),TYPES[n.tk].n,vt?(DATA.nations?.[vt.to]?.d?.name||''):'',vt?vt.reason:''];});
  const csv='﻿'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=`국가만들기_${ROOM}_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
}
function newCode(){ const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=ch[Math.floor(Math.random()*ch.length)]; return s; }
const TACT = {
  pin(){ if(pinDraft===TEACHER_PIN){ tAuthed=true; try{sessionStorage.setItem('natgame_t','1');}catch(e){} startTeacherData(); render(); } else toast('비밀번호가 틀렸어요.'); },
  tab(ds){ ttab=ds.v; openCard=null; render(); },
  phase(ds){ backend.update(`rooms/${ROOM}/meta`,{phase:ds.v}); toast(ds.v==='vote'?'학생 화면이 투표 화면으로 바뀝니다':ds.v==='closed'?'투표를 마감했습니다':'국가 만들기 단계'); if(ds.v!=='build') ttab='vote'; },
  launch(ds){ const e=EVENTS.find(x=>x.id===ds.v); if(!confirm(`'${e.t}' 사건을 모든 학생에게 보낼까요?`)) return; backend.update(`rooms/${ROOM}/meta`,{event:{id:ds.v,at:Date.now()}}); },
  endEvent(){ backend.remove(`rooms/${ROOM}/meta/event`); },
  openN(ds){ openN=ds.v; render(); },
  closeN(){ openN=null; render(); },
  delN(ds){ if(!confirm('이 학생의 나라를 삭제할까요?')) return; backend.remove(`rooms/${ROOM}/nations/${ds.v}`); backend.remove(`rooms/${ROOM}/votes/${ds.v}`); openN=null; },
  openCard(ds){ openCard = openCard===ds.v?null:ds.v; keepScroll=true; render(); },
  qr(){ showQR=true; render(); },
  async copyLink(){ const u=studentURL(); let ok=false;
    try{ await navigator.clipboard.writeText(u); ok=true; }catch(e){}
    if(!ok){ try{ const t=document.createElement('textarea'); t.value=u; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); ok=document.execCommand('copy'); t.remove(); }catch(e){} }
    if(ok) toast('🔗 학생 링크를 복사했어요. 클래스룸·패들렛에 붙여 넣으세요 (방 '+ROOM+')');
    else { showQR=true; render(); toast('복사가 막혀 있어요. QR 창 아래 주소를 직접 복사하세요.'); } },
  closeQR(){ showQR=false; render(); },
  csv(){ if(!nationsList().length) return toast('아직 선포한 나라가 없어요.'); exportCSV(); },
  newRoom(){ if(!confirm('새 방(다른 반용)을 만들까요? 지금 방의 기록은 그대로 남습니다.')) return; location.search='?mode=teacher&room='+newCode(); },
  reset(){ if(!confirm('이 방의 모든 나라·투표·진행 기록을 지울까요? 되돌릴 수 없습니다.')) return; backend.set(`rooms/${ROOM}`,{meta:{phase:'build',resetAt:Date.now()}}); toast('초기화했습니다.'); }
};
let tStarted=false;
function startTeacherData(){
  if(tStarted) return; tStarted=true;
  backend.on(`rooms/${ROOM}`,v=>{ DATA=v||{}; if(!DATA.meta){ backend.update(`rooms/${ROOM}/meta`,{phase:'build',createdAt:Date.now()}); } softRender(); });
}
function startTeacher(){
  if(!ROOM){ ROOM=newCode(); history.replaceState(null,'','?mode=teacher&room='+ROOM); }
  if(tAuthed) startTeacherData();
  render();
}

/* =========================================================
   ⑧ 이벤트 연결 & 시작
   ========================================================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  if(t.classList.contains('overlay') && e.target!==t) return; // 모달 안쪽 클릭은 닫지 않음
  const A = MODE==='teacher'?TACT:SACT;
  const f=A[t.dataset.act]; if(f) f(t.dataset,t);
});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset||!t.dataset.bind) return;
  if(t.dataset.bind==='pin'){ pinDraft=t.value; return; }
  if(MODE==='student') bindStudentInput(t);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.dataset){ if(e.target.dataset.bind==='pin') TACT.pin(); if(e.target.dataset.bind==='room') SACT.enterRoom(); } });

await initBackend();
if(MODE==='teacher') startTeacher(); else startStudent();
</script>
</body>
</html>
