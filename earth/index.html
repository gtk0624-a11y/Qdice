<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지구 정상회담</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f5f1e8; --paper:#fffdf8; --ink:#1f2a44; --sub:#5b6478; --line:#e4dccb;
  --accent:#e4572e; --accent2:#2a9d8f; --gold:#f4a261; --blue:#3a6ea5; --soft:#fbefe0;
  --ok:#2a9d8f; --warn:#e9a23b; --bad:#d64545; --shadow:0 2px 0 rgba(31,42,68,.08),0 8px 24px rgba(31,42,68,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 120px}
.twrap{max-width:1280px;margin:0 auto;padding:16px 16px 80px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:20px;margin:0;flex:1;min-width:180px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.pill.live{border-color:var(--ok);color:var(--ok)}
.pill.demo{border-color:var(--warn);color:#a86b00}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h2{font-size:23px;margin:0 0 12px}
h3{font-size:18px;margin:18px 0 8px}
.muted{color:var(--sub);font-size:15px}
.tip{background:#eef6f5;border-left:5px solid var(--accent2);border-radius:10px;padding:12px 14px;margin:0 0 16px;font-size:15.5px}
.tip b{color:#1d6f65}
.steps{display:flex;gap:4px;margin:0 0 14px}
.steps div{flex:1;height:8px;border-radius:4px;background:var(--line)}
.steps div.on{background:var(--accent)}
.steps div.done{background:var(--accent2)}
.stepname{font-size:14px;color:var(--sub);margin-bottom:6px;font-weight:600}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;transition:.12s;display:block;width:100%}
.opt:hover{border-color:#cdbf9f}
.opt.sel{border-color:var(--accent);background:#fff4ef;box-shadow:0 0 0 3px rgba(228,87,46,.15)}
.opt .e{font-size:28px;line-height:1}
.opt .t{font-weight:700;margin-top:4px}
.opt .d{font-size:14px;color:var(--sub);margin-top:2px}
.opt .pc{font-size:13px;margin-top:6px}
.bigopt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;font-size:16.5px}
.bigopt .lt{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.bigopt.sel .lt{background:var(--accent)}
.btn{border:none;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--ink);color:#fff;font-size:17px}
.btn:active{transform:translateY(1px)}
.btn.acc{background:var(--accent)}
.btn.teal{background:var(--accent2)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.96);border-top:1.5px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:20}
.navbar .in{max-width:860px;width:100%;display:flex;gap:10px;justify-content:space-between}
.field{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.field:focus{outline:none;border-color:var(--accent2)}
textarea.field{min-height:84px;resize:vertical}
label.lb{display:block;font-weight:700;margin:14px 0 6px}
.flag{display:inline-flex;width:84px;height:56px;border-radius:8px;overflow:hidden;position:relative;border:2px solid rgba(0,0,0,.15);flex:none}
.flag i{flex:1}
.flag span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.flag.sm{width:42px;height:28px;border-radius:5px}
.flag.sm span{font-size:14px}
.flag.lg{width:150px;height:100px;border-radius:12px}
.flag.lg span{font-size:48px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw button.sel{box-shadow:0 0 0 3px var(--ink)}
.sym button{width:46px;height:46px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:24px}
.sym button.sel{border-color:var(--accent);background:#fff4ef}
.brow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.brow .nm{flex:1}
.brow .nm b{display:block}
.brow .nm small{color:var(--sub)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800}
.stp .v{min-width:30px;text-align:center;font-weight:800;font-size:20px}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:140px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--accent2)}
.remain{position:sticky;top:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;z-index:5;margin-bottom:8px}
.remain.zero{background:var(--accent2)}
.remain.over{background:var(--bad)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;font-size:14.5px;font-weight:600}
.bar .tr{height:14px;background:#efe8da;border-radius:7px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:7px;transition:width .4s}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.bars.mini .bar{grid-template-columns:44px 1fr 26px;font-size:12px;gap:5px}
.bars.mini .bar .tr{height:8px}
.scene{background:var(--soft);border-radius:14px;padding:16px;margin-bottom:14px}
.scene .tag{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:3px 10px;font-size:13.5px;font-weight:700;margin-bottom:8px}
.scene .src{font-size:13px;color:var(--sub);margin-top:6px}
.persona{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.persona .av{font-size:32px;line-height:1}
.persona .face{font-size:22px}
.persona .q{font-size:14.5px}
.persona .who{font-size:13px;color:var(--sub);font-weight:700}
.typebadge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 14px;font-weight:800;color:#fff;font-size:15px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.law{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px 16px;font-family:"Nanum Myeongjo",serif}
.law p{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.chip.sel{border-color:var(--accent2);background:#e8f5f3;color:#1d6f65}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:100;font-weight:700;max-width:90vw;box-shadow:var(--shadow);animation:pop .2s}
@keyframes pop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.overlay{position:fixed;inset:0;background:rgba(20,26,40,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px}
.modal{background:var(--paper);border-radius:20px;max-width:760px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.alert{border:4px solid var(--bad)}
.blink{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.5}}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:14px;font-weight:700}
.banner.ok{background:#e3f4f1;color:#16655b}
.banner.warn{background:#fff3dc;color:#8a5a00}
.banner.bad{background:#fde8e8;color:#9b2c2c}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* teacher */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.tabs button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 14px;font-weight:700;font-size:15.5px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:none;background:#fff;padding:9px 14px;font-weight:700;font-size:15px}
.seg button.on{background:var(--ink);color:#fff}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ncard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%}
.ncard:hover{border-color:var(--accent)}
.ncard .nh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ncard .nn{font-weight:800;font-size:17px;line-height:1.25}
.ncard .ns{font-size:13px;color:var(--sub)}
.ncard .a1{font-size:13.5px;color:var(--sub);margin:6px 0 8px;font-style:italic}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat .box{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;min-width:110px}
.stat .box b{font-size:26px;display:block;line-height:1.1}
.stat .box small{color:var(--sub);font-weight:600}
.obar{display:grid;grid-template-columns:1fr;gap:4px;margin:8px 0}
.obar .lbl{display:flex;justify-content:space-between;font-size:15px;font-weight:600;gap:8px}
.obar .tr{height:22px;background:#efe8da;border-radius:6px;overflow:hidden}
.obar .tr i{display:block;height:100%}
.rlist{margin:6px 0 4px 0;padding:0;list-style:none;font-size:14.5px}
.rlist li{padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:5px}
.rlist li b{color:var(--sub);font-weight:700;margin-right:6px}
.prog{display:flex;flex-wrap:wrap;gap:6px}
.prog span{font-size:13px;border-radius:8px;padding:3px 9px;background:#fff;border:1.5px solid var(--line);font-weight:600}
.prog span.done{background:#e3f4f1;border-color:var(--ok);color:#16655b}
.concept table{width:100%;border-collapse:collapse;font-size:15.5px}
.concept td,.concept th{border:1px solid var(--line);padding:9px 10px;vertical-align:top;text-align:left}
.concept th{background:var(--soft);width:22%}
.rank{display:flex;gap:12px;align-items:center;padding:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px}
.rank .no{font-size:26px;font-weight:900;width:36px;text-align:center}
.qrbox{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:12px}
.url{word-break:break-all;background:#fff;border:1.5px dashed var(--line);padding:10px;border-radius:10px;font-size:15px;font-weight:600}
footer{text-align:center;color:var(--sub);font-size:12.5px;margin-top:30px}
/* world */
.up{color:#16855b;font-weight:800;margin-left:3px;font-size:12px}.dn{color:var(--bad);font-weight:800;margin-left:3px;font-size:12px}
.bar{grid-template-columns:78px 1fr 58px}.bars.mini .bar{grid-template-columns:44px 1fr 26px}
.gauge{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.gauge .gl{display:flex;justify-content:space-between;margin-bottom:6px}
.gauge .gt{position:relative;height:18px;background:#efe8da;border-radius:9px;overflow:hidden}
.gauge .gt i{display:block;height:100%;transition:width .5s}.gauge .gt em{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.reason{background:#fff8e6;border:2px solid var(--gold);border-radius:14px;padding:14px 16px;margin:14px 0 4px}
.reason .rn{font-size:19px;font-weight:800;margin:4px 0}
.quote{background:#fff;border-left:5px solid var(--accent2);border-radius:8px;padding:10px 14px}
.chain{padding-left:22px}.chain li{margin:4px 0;font-weight:600}
.pz{display:flex;gap:10px;align-items:center;font-weight:600}.pzn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:800}
.pz.sel .pzn{background:var(--accent);color:#fff}
.oxr,.ckr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.okc{color:#16855b}.noc{color:var(--bad)}
.ckr .seg button{min-width:42px}
.mirror{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.mirror>div{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.mirror .big{font-size:28px;font-weight:900;margin-top:6px}
.pcard{background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--accent2);border-radius:12px;padding:12px 14px}
.pcard p{margin:6px 0}.pd{font-weight:800}.ps{display:inline-block;font-size:13px;background:#e8f5f3;color:#1d6f65;border-radius:999px;padding:2px 10px;font-weight:700}
.vwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}.vcard p{margin:6px 0}.vh{font-size:13.5px;font-weight:700;color:var(--sub)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}.pi .btn.sm{padding:5px 8px}.pi b{white-space:nowrap}
.pi{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
.pi.done{border-color:var(--ok);background:#f2faf8}.pi span small{display:block;color:var(--sub);font-size:12.5px}
.pbar .pg{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pbar .pg .tabs{margin:6px 0}
.rbox{padding:8px 0;border-bottom:1px dashed var(--line)}
.obh{border-left:6px solid;padding:4px 10px;font-weight:800;background:#fff;border-radius:6px;margin-bottom:6px}
.ncard.selc{border-color:var(--accent);box-shadow:0 0 0 3px rgba(228,87,46,.18)}.ncard:disabled{opacity:.45}
details{margin-top:12px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}summary{font-weight:700;cursor:pointer}
@media (max-width:520px){.mirror{grid-template-columns:1fr}}
/* ===== 지구 정상회담 ===== */
.doom{background:#141a2b;color:#f3efe6;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.doom.amber{box-shadow:0 0 0 3px #e9a23b inset}
.doom.red{box-shadow:0 0 0 3px #d64545 inset;animation:dpulse 1.6s infinite}
@keyframes dpulse{50%{box-shadow:0 0 0 7px #d64545 inset}}
.doom .clock{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px;margin-bottom:8px}
.doom .clock b{font-size:20px;color:#ffd166}
.mrow{display:grid;grid-template-columns:112px 1fr 70px;gap:8px;align-items:center;font-weight:700;font-size:15px;margin:6px 0}
.mrow .tr{height:16px;background:#2c3550;border-radius:8px;overflow:hidden}
.mrow .tr i{display:block;height:100%;transition:width .6s}
.mrow b{text-align:right;font-variant-numeric:tabular-nums}
.doom .up{color:#7ee2b8}.doom .dn{color:#ff8a8a}
.doom .dm{color:#b9c0d4;font-size:12.5px}
.board .mrow{grid-template-columns:150px 1fr 96px;font-size:20px}.board .mrow .tr{height:26px}.board .clock{font-size:19px}.board .clock b{font-size:28px}
.res{display:inline-flex;gap:12px;font-weight:800;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;font-size:16px}
.vtag{display:inline-block;background:var(--bad);color:#fff;border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:800;vertical-align:middle}
.otag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:800;color:#fff;vertical-align:middle}
.ofx{font-size:13.5px;color:var(--sub);margin-top:6px;line-height:1.5}
.ofx b{color:var(--ink)}
.req{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.req.mine{border-color:var(--gold);background:#fffaf0}
.req .rt{flex:1;min-width:180px}
.gift{background:#f2faf8;border:1.5px solid var(--ok);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.treaty{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.treaty.on{border-color:var(--accent2);background:#f4fbf9}
.treaty h4{margin:0 0 4px;font-size:17px}
.summit{border:3px solid var(--blue);background:#f2f6fc}
.ending{background:#141a2b;color:#f3efe6;border-radius:18px;padding:24px;margin-bottom:16px}
.ending.good{background:linear-gradient(135deg,#1d5f75,#2a9d8f)}
.ending.mid{background:linear-gradient(135deg,#6b4e1a,#b07a1e)}
.ending h2{font-size:28px;margin:6px 0 12px}
.ending p{margin:8px 0;line-height:1.7}
.ending .muted{color:#c9cfdd}
.step{display:flex;gap:6px;margin:0 0 10px}
.step i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.step i.on{background:var(--accent)}.step i.done{background:var(--accent2)}
.fate{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.fate .av{font-size:36px;line-height:1}
.fate.good{border-color:var(--ok)}.fate.bad{border-color:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.kv div{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.kv b{display:block;font-size:22px}
.kv small{color:var(--sub);font-weight:600}
select.field{appearance:auto}
.nmini{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
.nmini.v{border-color:var(--bad);background:#fff6f6}
.nmini small{color:var(--sub);display:block;font-size:12.5px}
.livefund{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
.livefund .tr{height:18px;background:#efe8da;border-radius:9px;overflow:hidden;position:relative}
.livefund .tr i{display:block;height:100%;background:var(--accent2);transition:width .4s}
.sol{border-radius:14px;padding:12px 14px;margin:10px 0;border:2px solid var(--line);background:#fff}
.sol .tr{height:22px;border-radius:11px;overflow:hidden;position:relative;background:linear-gradient(90deg,#fde8e8 0 40%,#fff3dc 40% 70%,#e3f4f1 70% 100%)}
.sol .tr i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#d64545,#e9a23b,#2a9d8f);transition:width .5s;border-radius:11px}
.sol .tr em{position:absolute;top:0;bottom:0;width:2px;background:rgba(31,42,68,.5)}
.sol .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-top:4px}
.tier{border-radius:16px;padding:16px;margin-bottom:12px;text-align:center;color:#fff}
.tier h2{margin:4px 0;font-size:26px}
.tier.win{background:linear-gradient(135deg,#1d6f65,#3a86ff)}
.tier.hold{background:linear-gradient(135deg,#8a5a00,#e9a23b)}
.tier.fall{background:linear-gradient(135deg,#5b1414,#d64545)}

function eventImpact(d,e,v){
  const b=norm(d).budget;
  const dd=norm(d).con.duties; let dpts=0; const dnotes=[];
  dd.forEach(k=>{ const fx=DUTY_FX[k]; if(fx&&fx.prep&&fx.prep[e.id]){ dpts+=fx.prep[e.id]; dnotes.push({c:'ok',t:`${fx.note} 덕분에 ${e.kind==='opp'?'투자':'대비'} +${fx.prep[e.id]}칸`}); } });
  const pts=(e.prep||[]).reduce((a,p)=>a+(+b[p[0]]||0)*p[1],0)+dpts;
  const LV=e.kind==='opp'?LV_OPP:LV_CRISIS;
  const lv=(e.prep&&e.prep.length)?LV.find(x=>pts>=x.min):{n:'신뢰가 좌우',m:1,c:'warn',d:'이 사건은 예산보다 시민의 신뢰가 결과를 좌우해요.'};
  let m=lv.m*EVENT_POWER; const notes=[...dnotes];
  const tr=Math.round(Math.max(0,Math.min(100,v?v.trust:50)));
  if(e.kind!=='opp'){
    if(tr>=65){ m*=0.7; notes.push({c:'ok',t:`🤝 시민 신뢰 ${tr}점 — 시민들이 정부와 힘을 모아 피해가 더 줄었어요.`}); }
    else if(tr<35){ m*=1.3; notes.push({c:'bad',t:`😠 시민 신뢰 ${tr}점 — 시민들이 정부를 믿지 않아 혼란이 더 커졌어요.`}); }
  } else if(tr>=65 && m>0){ m*=1.2; notes.push({c:'ok',t:`🤝 시민 신뢰 ${tr}점 — 시민들의 참여로 효과가 더 커졌어요.`}); }
  if(dd.includes('tax') && m>0){ m*= e.kind==='opp'?1.1:0.85; notes.push({c:'ok',t:'🧾 시민들의 성실한 납세로 생긴 재정 여유가 '+(e.kind==='opp'?'효과를 키웠어요.':'피해를 줄였어요.')}); }
  if(dd.includes('bal') && DUTY_FX.bal.ids.includes(e.id)){ m*=0.8; notes.push({c:'ok',t:'⚖️ 공익과 사익을 조화시키는 시민들 덕분에 갈등이 줄었어요.'}); }
  const scaled={}; for(const k in e.base){ const x=Math.round(e.base[k]*m); if(x) scaled[k]=x; }
  return {pts,lv,m,notes,scaled};
}

function successRate(d,e,v,nOpts){

}

const byK = (arr,k)=>arr.find(x=>x.k===k);
function norm(d){
  d = d||{};

    name:d.name||'', flag:Object.assign({c1:'#e63946',c2:'#1d3557',sym:'⭐'},d.flag||{}),
    terr:d.terr||null, ideo:d.ideo||null, pop:d.pop||null, gov:d.gov||null, tax:d.tax||null,
    budget:d.budget||{}, choices:d.choices||{}, events:d.events||{}, rescue:d.rescue||null,
    con:{a1:(d.con&&d.con.a1)||'',a2:(d.con&&d.con.a2)||'',duties:Object.values((d.con&&d.con.duties)||[]),rights:Object.values((d.con&&d.con.rights)||[])}
  };
}
function computeInd(d,log,st){
  d = norm(d);
  const v={safe:40,free:40,equal:40,welfare:40,eco:40,trust:40};
  const add=eff=>{ if(!eff) return; for(const k in eff) v[k]+=eff[k]; };
  add(byK(TERR,d.terr)?.eff); add(byK(POP,d.pop)?.eff); add(byK(GOV,d.gov)?.eff); add(byK(TAX,d.tax)?.eff); add(byK(IDEO,d.ideo)?.eff); for(const k of d.con.duties) add(DUTY_BASE[k]);
  if(d.tax){
    for(const b of BUDGET){
      const p = +d.budget[b.k]||0;
      if(p===0) add(b.zero); else for(const k in b.per) v[k]+=b.per[k]*p;
    }
  }
  for(const c of CARDS){ const ch=d.choices[c.id]; if(ch && ch.opt!=null && c.opts[ch.opt]) add(c.opts[ch.opt].eff); }
  const evs=EVENTS.filter(e=>{ const r=d.events[e.id]; return r && ((r.opts&&Object.values(r.opts).length)||(r.opt!=null&&e.opts[r.opt])); }).sort((a,b)=>(d.events[a.id].at||0)-(d.events[b.id].at||0));
  for(const e of evs){ const r=Object.assign({},d.events[e.id]); if(r.opts) r.opts=Object.values(r.opts); const imp=eventImpact(d,e,v); const delta=evApply(e,imp,r); add(delta);
    if(log) log.push({e,imp,opt:(r.opts||[r.opt])[0],out:r.out||'ok',roll:r.roll,delta}); }
  const rk=[]; const vv={}; for(const k in v) vv[k]=Math.max(0,Math.min(100,v[k]));
  for(const r of d.con.rights){ const RR=RIGHTS.find(x=>x.k===r); if(!RR) continue; const ok=!!RR.ok(vv,d); rk.push({k:r,ok}); v.trust+= ok?4:-8; }
  let bankrupt=false, warn=false;
  if(d.tax && v.eco<=20){ bankrupt=true; v.welfare-=15; v.trust-=15; v.equal-=8; v.safe-=5; const RS=d.rescue&&RESCUE[d.rescue.opt]; if(RS) add(typeof RS.eff==='function'?RS.eff(v):RS.eff); }
  else if(d.tax && v.eco<=30) warn=true;
  for(const k in v) v[k]=Math.max(0,Math.min(100,Math.round(v[k])));
  if(st){ st.rights=rk; st.bankrupt=bankrupt; st.warn=warn; st.rescued=!!(bankrupt&&d.rescue); }
  return v;
}
function nationType(v,d){
  d=norm(d);
  if(v.free<35 && (v.safe>=55 || d.gov==='dict')) return 'control';
  if(v.welfare>=65 && v.equal>=60) return 'welfare';
  if(v.safe>=55 && v.welfare<45 && v.equal<50) return 'night';
  if(v.eco>=65 && v.equal<45) return 'market';
  if(v.trust>=70 && v.free>=65) return 'civic';
  if(Math.min(...Object.values(v))>=50) return 'balance';
  return 'shaky';
}

   ========================================================= */
const clean = o => o==null ? null : JSON.parse(JSON.stringify(o));
let DBMODE='demo', backend=null;
async function initBackend(){
  if(!FORCE_DEMO && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL){
    try{
      const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const db = D.getDatabase(A.initializeApp(FIREBASE_CONFIG));
      backend = {
        set:(p,v)=>D.set(D.ref(db,p),clean(v)),
        update:(p,v)=>D.update(D.ref(db,p),clean(v)),
        remove:p=>D.remove(D.ref(db,p)),
        on:(p,cb)=>D.onValue(D.ref(db,p),s=>cb(s.val()),err=>toast('⚠️ 데이터베이스 연결 오류: '+err.message))
      };
      DBMODE='live'; return;
    }catch(e){ console.error(e); toast('⚠️ 인터넷 연결 실패 → 체험 모드로 실행합니다'); }
  }
  const KEY='natgame_demo_db';
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('natgame') : null;
  const L=[];
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } };
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=(t,p)=>parts(p).reduce((o,k)=>o==null?undefined:o[k],t);
  const setAt=(t,p,v)=>{ const ks=parts(p); let o=t; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } const last=ks[ks.length-1]; if(v==null) delete o[last]; else o[last]=clean(v); };
  const fire=()=>{ const t=read(); L.forEach(l=>l.cb(clean(getAt(t,l.p))??null)); };
  const write=t=>{ try{ localStorage.setItem(KEY,JSON.stringify(t)); }catch(e){} fire(); bc&&bc.postMessage(1); };
  if(bc) bc.onmessage=fire;
  window.addEventListener('storage',e=>{ if(e.key===KEY) fire(); });
  backend = {
    set:async(p,v)=>{ const t=read(); setAt(t,p,v); write(t); },
    update:async(p,obj)=>{ const t=read(); for(const k in obj) setAt(t,p+'/'+k,obj[k]); write(t); },
    remove:async p=>{ const t=read(); setAt(t,p,null); write(t); },
    on:(p,cb)=>{ const l={p,cb}; L.push(l); setTimeout(()=>cb(clean(getAt(read(),p))??null),0); return ()=>{ const i=L.indexOf(l); if(i>=0) L.splice(i,1); }; }
  };
}

  if(D.sort&&D.sort[id]) x+=10+(+D.sort[id].ok||0);

async function claim(info){

function ensureMe(){

    const x=xpOf(id); r.push(x,xpLv(x).n);
    rows.push(r.map(q).join(','));
  });
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`지구정상회담_${SRC}_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),500);
}
const tActs = {
  pin(){ if(String(dr.pin||'')===TEACHER_PIN){ try{ sessionStorage.setItem('earthgame_pin',TEACHER_PIN); }catch(e){} startTeacherData(); render(); } else toast('비밀번호가 틀렸습니다.'); },
  setRoom(){ const c=cleanCode(ttmp); if(c.length<3){ toast('방 코드를 확인해 주세요.'); return; } const u=new URL(location.href); u.searchParams.set('room',c); history.replaceState(null,'',u.toString()); SRC=c; startTeacherData(); render(); },
  changeRoom(){ const u=new URL(location.href); u.searchParams.delete('room'); location.href=u.toString(); },
  tab(ds){ tab=ds.v; render(); window.scrollTo(0,0); },
  names(){ showNames=!showNames; render(); },
  phase(ds){ const v=ds.v; const upd={phase:v};
    if(v==='assign' && !(DATA.meta&&DATA.meta.assign)) upd.assign=buildAssign();
    backend.update(`${ER()}/meta`,upd); tab={end1:'end',assign:'voice',link:'mission',sort:'mission',campaign:'mission',mirror:'mirror',pledge:'pledge',wrap:'wrap'}[v]||'run'; render(); },
  tmin(ds){ tmin=+ds.v; render(); },
  randCrisis(){ const W=calc(); if(W.openR) return toast('진행 중인 위기의 결과를 먼저 공개하세요.'); const left=CRISES.filter(c=>!W.cr.includes(c.id)); if(!left.length) return toast('모든 위기를 사용했습니다.'); tActs.newCrisis({v:left[Math.floor(Math.random()*left.length)].id,noconf:1}); },
  raidToggle(){ backend.update(`${ER()}/meta`,{noRaid:!(DATA.meta&&DATA.meta.noRaid)}); },
  trial(){ const n=+(DATA.meta&&DATA.meta.trials)||0; if(n>=3) return; if(!confirm(`🌩️ ${n+1}번째 시련 카드를 모든 시민에게 보낼까요?`)) return; backend.update(`${ER()}/meta`,{trials:n+1,trAt:Date.now()}); toast('🌩️ 시련이 닥쳤습니다! 학생 화면에 시련 카드가 뜹니다.'); },
  trialUndo(){ const n=+(DATA.meta&&DATA.meta.trials)||0; if(!n) return; if(!confirm('마지막 시련을 취소할까요?')) return; backend.update(`${ER()}/meta`,{trials:n-1}); },
  newCrisis(ds){ const W=calc(); if(W.openR) return toast('진행 중인 위기의 결과를 먼저 공개하세요.'); const c=crisisOf(ds.v); if(!ds.noconf && !confirm(`'${c.e} ${c.t}' 위기를 발생시킬까요?${tmin?` (제한 시간 ${tmin}분)`:''}`)) return;
    const k=W.cr.length; backend.update(`${ER()}/meta`,{cr:[...W.cr,ds.v],rev:W.rev,dl:tmin?Date.now()+tmin*60000+6000:null}); tab='board';
    crisisShow(c,{k,teacher:true,name:id=>{ const W2=calc(); return showNames&&W2.P[id]?`${W2.P[id].num}번 ${W2.P[id].name}`:rawNm(W2,id); },getV:async()=>{ for(let i=0;i<40;i++){ const W2=calc(); if(W2.openR&&W2.openR.k===k) return W2.openR.vict; await new Promise(r=>setTimeout(r,100)); } return []; }}); },
  addMin(){ const dl=+(DATA.meta&&DATA.meta.dl)||0; backend.update(`${ER()}/meta`,{dl:Math.max(dl,Date.now())+60000}); },
  cancelCrisis(){ const W=calc(); if(!W.openR) return; if(!confirm('진행 중인 위기를 취소할까요? 이 위기에 제출한 결정·지원·요청이 지워집니다.')) return; const k=W.openR.k;
    backend.update(`${ER()}/meta`,{cr:W.cr.slice(0,k),dl:null}); backend.remove(`${ER()}/act/${k}`); backend.remove(`${ER()}/gift/${k}`); backend.remove(`${ER()}/req/${k}`); },
  reveal(){ const W=calc(); if(!W.openR) return; const k=W.openR.k; const A=(DATA.act&&DATA.act[k])||{}; const miss=W.ids.filter(id=>!A[id]).length;
    if(miss && !confirm(`${miss}개 나라가 아직 제출하지 않았습니다. ‘대응 못 함’으로 처리하고 공개할까요?`)) return;
    backend.update(`${ER()}/meta`,{rev:k+1,dl:null,rvAt:Date.now()}); tab='board'; render(); },
  unreveal(){ const W=calc(); if(W.rev<1) return; if(!confirm('마지막 위기의 결과 공개를 취소할까요? (학생들이 다시 결정을 고칠 수 있게 됩니다)')) return; backend.update(`${ER()}/meta`,{rev:W.rev-1}); },
  summit(){ const on=!(DATA.meta&&DATA.meta.summit); backend.update(`${ER()}/meta`,on?{summit:on}:{summit:on,speak:null}); if(on){ tab='summit'; toast('🏛️ 정상회담을 열었습니다. 학생 화면에 협약 창이 나타납니다.'); } render(); },
  speakStart(ds){ const W=calc(); const hands=Object.entries(DATA.hand||{}).filter(([id])=>W.P[id]).sort((a,b)=>a[1]-b[1]).map(([id])=>id);
    const order=ds.v==='hand'?hands:shuffled(W.ids,'sp'+Date.now()); if(!order.length) return toast('발언할 나라가 없습니다.');
    backend.update(`${ER()}/meta`,{speak:{order,i:0,dl:Date.now()+30000}}); backend.remove(`${ER()}/hand`); },
  speakNext(){ const sp=speakNow(); if(!sp) return; const i=sp.i+1; backend.update(`${ER()}/meta`,{speak:i<sp.order.length?{order:sp.order,i,dl:Date.now()+30000}:null}); },
  speakMore(){ const sp=speakNow(); if(!sp) return; backend.update(`${ER()}/meta`,{speak:{order:sp.order,i:sp.i,dl:Math.max(+sp.dl||0,Date.now())+30000}}); },
  speakEnd(){ backend.update(`${ER()}/meta`,{speak:null}); },
  chatLock(){ backend.update(`${ER()}/meta`,{chatOff:!(DATA.meta&&DATA.meta.chatOff)}); },
  chatDel(ds){ backend.remove(`${ER()}/chat/${ds.v}`); },
  msgDel(ds){ backend.remove(`${ER()}/msg/${ds.v}`); },
  chatClear(){ if(!confirm('전체 채팅을 모두 지울까요? (비밀 쪽지는 남습니다)')) return; backend.remove(`${ER()}/chat`); },
  async tChatGo(){ const d=draft('tchat'); const t=String(d.text||'').trim(); if(!t) return; await backend.set(`${ER()}/chat/${Date.now().toString(36)+Math.random().toString(36).slice(2,6)}`,{from:TCH,text:t.slice(0,100),at:Date.now()}); d.text=''; render(); },
  assign(){ if(!confirm('시민 배정을 다시 할까요? 이미 쓴 편지는 남습니다.')) return; backend.update(`${ER()}/meta`,{assign:buildAssign()}); },
  fateRev(){ backend.update(`${ER()}/meta`,{fateRev:!(DATA.meta&&DATA.meta.fateRev)}); tab='mission'; render(); },
  unlock(ds){ backend.update(`${ER()}/players/${ds.v}`,{dev:null,want:null,kick:Date.now()}); toast('잠금을 풀었습니다. 기다리던 태블릿이 자동으로 들어갑니다.'); },
  unlockAll(){ if(!confirm('모든 나라의 태블릿 잠금을 풀까요? 학생들이 자기 나라를 다시 골라야 할 수 있습니다.')) return; const now=Date.now(); const u={}; Object.keys(DATA.players||{}).forEach(id=>{ u[id+'/dev']=null; u[id+'/want']=null; u[id+'/kick']=now; }); backend.update(`${ER()}/players`,u); toast('전체 잠금을 풀었습니다.'); },
  delP(ds){ if(!confirm('이 학생을 지구 정상회담에서 뺄까요? (국가 만들기 기록은 그대로)')) return; backend.remove(`${ER()}/players/${ds.v}`); },
  qr(){ const url=studentURL(); const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML=`<div class="modal center"><h2>📱 학생 접속</h2><div class="qrbox" id="qrbox"></div><p class="url">${esc(url)}</p><p class="muted">지난 시간과 같은 태블릿이면 “○번 ○○ 학생이 맞나요?”가 먼저 뜹니다. 아니면 목록에서 자기 나라를 고릅니다.</p><button class="btn" data-x="close">닫기</button></div>`; document.body.appendChild(ov); ov.addEventListener('click',e=>{ if(e.target===ov||e.target.dataset.x==='close') ov.remove(); }); try{ new QRCode(ov.querySelector('#qrbox'),{text:url,width:300,height:300}); }catch(e){ ov.querySelector('#qrbox').textContent='QR을 만들 수 없습니다. 위 주소를 알려 주세요.'; } },
  csv(){ csvDownload(); },
  reset(){ if(!confirm(`방 E${SRC}의 모든 기록을 지울까요? 되돌릴 수 없습니다.\n(국가 만들기 기록은 지워지지 않습니다)`)) return; backend.set(ER(),{meta:{phase:'lobby',src:SRC,resetAt:Date.now()}}); toast('초기화했습니다.'); }
};
let tStarted=false, tT=null;
function startTeacherData(){
  if(tStarted || !SRC || !pinOK()) return; tStarted=true;
  backend.on(ER(), v=>{ DATA=v||{}; gotData=true; if(!DATA.meta){ backend.update(`${ER()}/meta`,{phase:'lobby',src:SRC,createdAt:Date.now()}); } clearTimeout(tT); tT=setTimeout(softRender,250); });
  backend.on(`rooms/${SRC}/nations`, v=>{ SRCN=v||{}; gotSrc=true; softRender(); });
}

$app.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const acts = MODE==='teacher' ? tActs : sActs; const f=acts[b.dataset.act]; if(f) f(b.dataset);
});
function onBind(e){
  const el=e.target; const k=el.dataset.bind; if(!k) return;
  if(k==='room') tmpRoom=el.value; else if(k==='troom') ttmp=el.value; else if(k==='pin') dr.pin=el.value;
  else { const i=k.indexOf('.'); draft(k.slice(0,i))[k.slice(i+1)]=el.value; }
}
$app.addEventListener('input', onBind);
$app.addEventListener('change', e=>{ onBind(e); if(e.target.tagName==='SELECT'){ e.target.blur(); render(); } });
$app.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.tagName==='INPUT'){ const k=e.target.dataset.bind; if(k==='room') sActs.enterRoom(); else if(k==='troom') tActs.setRoom(); else if(k==='pin') tActs.pin(); else if(k==='dip.chat') sActs.chatGo(); else if(k==='dip.note') sActs.noteGo(); else if(k==='tchat.text') tActs.tChatGo(); } });
if(FORCE_DEMO) window.__earth={calc:()=>calc()};

  await initBackend();
  if(MODE==='teacher'){ startTeacherData(); render(); }
  else { startStudent(); render(); }
})();
