    if(P&&P.epoch&&META.created&&P.epoch!==META.created){ try{localStorage.removeItem(skey());}catch(e){} P=null; toast('선생님이 기록을 초기화했어요. 다시 입장해 주세요.'); render(); return; }
    if(P&&P.joined&&!P.epoch&&META.created){ P.epoch=META.created; saveP(true); }
    const ph=phase(); if(ph!==lastPhase){ if(lastPhase!==null) window.scrollTo(0,0); lastPhase=ph; render(); return; } softRender(); });
  sub(); render();
})();
</script>
