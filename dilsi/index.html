<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>딜시 — 딜레마 시뮬레이션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f1ea; --paper:#fff; --ink:#1d2433; --sub:#5f6b7a; --line:#e2dccf;
  --main:#7b2d26; --main2:#f6e8e4; --gold:#c8962d; --gold2:#fbf3df; --jade:#2f7d6d; --jade2:#e3f2ee;
  --ok:#2b8a3e; --ok2:#e6f6ea; --warn:#e67700; --bad:#c92a2a; --bad2:#ffe8e8; --soft:#efebe2;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 22px rgba(29,36,51,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.65;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:12px 14px 120px}
.twrap{max-width:1400px;margin:0 auto;padding:12px 14px 90px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.top h1{font-size:20px;margin:0;flex:1;min-width:180px;letter-spacing:-.3px}
.top h1 small{font-size:13px;color:var(--sub);font-weight:500;margin-left:6px}
.covers{display:flex;gap:14px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap}.cov{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;width:200px;box-shadow:0 4px 14px rgba(0,0,0,.08)}.cov img{width:100%;height:240px;object-fit:contain;border-radius:8px;display:block;margin-bottom:6px}
.logo.img{object-fit:cover;padding:0;background:#fff;border:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--main);color:#fff;font-weight:900;font-size:15px;margin-right:6px;vertical-align:middle}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:19px;margin:0 0 8px}
.card h3{font-size:16px;margin:14px 0 6px}
.muted{color:var(--sub);font-size:14px}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;background:var(--main);color:#fff;font-weight:700;min-height:44px}
.btn.sm{padding:6px 11px;min-height:34px;font-size:14px;border-radius:10px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#fff} .btn.jade{background:var(--jade)} .btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%} .btn.big{font-size:19px;padding:14px 22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.inp:focus{outline:none;border-color:var(--main)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.65}
textarea.tall{min-height:320px}
label.lb{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--soft);color:var(--sub);margin:2px}
.pill.ok{background:var(--ok2);color:var(--ok)} .pill.main{background:var(--main2);color:var(--main)} .pill.gold{background:var(--gold2);color:#8a5a00} .pill.bad{background:var(--bad2);color:var(--bad)} .pill.jade{background:var(--jade2);color:var(--jade)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{border:0;background:var(--soft);padding:9px 14px;border-radius:12px;font-weight:700;font-size:15px}
.tab.on{background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:99;font-size:15px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:30px}
.banner{background:var(--bad2);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0}
.note{background:var(--gold2);border:1px solid #f0dca8;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:15px}
.ovl{position:fixed;inset:0;background:rgba(20,24,32,.62);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px}
.ovl .box{background:#fff;border-radius:20px;max-width:780px;width:100%;padding:18px;margin:auto}
/* 장면 */
.art{border-radius:16px;overflow:hidden;line-height:0;margin-bottom:10px}
.art svg{width:100%;height:auto;display:block}
.stage{background:#fffdf8;border:1px solid #eadfcb;border-radius:16px;padding:16px}
.stage .ttl{font-weight:900;color:var(--main);font-size:15px;letter-spacing:.5px}
.stage p{margin:8px 0;font-size:18px}
.seed{background:#eef6f3;border-left:4px solid var(--jade);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px}
.event{background:#fff4e6;border-left:4px solid var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px}
.event.good{background:#ebfbee;border-left-color:var(--ok)}
.chg{font-size:13px;font-weight:800;margin-right:8px;white-space:nowrap}
.chg.p{color:var(--ok)} .chg.m{color:var(--bad)}
/* 게이지 */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.gg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.gg .h{display:flex;justify-content:space-between;font-size:13px;font-weight:800}
.gbar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:3px}
.gbar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.gbar i.lo{background:var(--bad)} .gbar i.mid{background:var(--warn)} .gbar i.hi{background:var(--ok)}
.gg.life{border:2px solid var(--main)}
.gg.danger{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(201,42,42,.25)}}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 8px}
.steps span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--sub);font-weight:700}
.steps span.on{background:var(--main);color:#fff} .steps span.done{background:var(--jade2);color:var(--jade)}
/* 증거 카드 */
.evs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.evs{grid-template-columns:1fr}}
.evc{border-radius:14px;min-height:140px;padding:12px;border:2px solid var(--line);background:#fff;text-align:left;font-size:15px}
.evc.back{background:repeating-linear-gradient(45deg,#7b2d26,#7b2d26 10px,#8b3a32 10px,#8b3a32 20px);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;border-color:#7b2d26}
.evc.back.lock{opacity:.4;cursor:not-allowed}
.evc b{display:block;margin-bottom:4px}
/* 사상가 */
.av{border-radius:22%;display:block;flex:none;object-fit:cover}
.thc{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.thc:hover:not([disabled]){border-color:var(--main)}
.thc.sel{border-color:var(--main);background:var(--main2)}
.thc[disabled]{opacity:.5;cursor:not-allowed;background:var(--soft)}
.thc .nm{font-weight:900;font-size:17px} .thc .sc{font-size:13px;color:var(--sub);margin-left:4px}
.thc .pl{font-size:16px;margin-top:4px}
.rival{display:flex;gap:10px;align-items:flex-start;background:#2b2f3a;color:#f3efe6;border-radius:16px;padding:14px;margin:10px 0}
.rival .ic{font-size:34px;line-height:1}
.rival b{color:#ffd8a8}
.chk{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chk span{font-size:14px;padding:4px 10px;border-radius:10px;background:var(--soft);font-weight:700}
.chk span.y{background:var(--ok2);color:var(--ok)} .chk span.n{background:var(--bad2);color:var(--bad)}
.lvl{font-size:26px;font-weight:900;text-align:center;margin:6px 0}
.lvl.a{color:var(--ok)} .lvl.b{color:var(--jade)} .lvl.c{color:var(--bad)}
.timer{font-size:24px;font-weight:900;color:var(--bad);text-align:right;font-variant-numeric:tabular-nums}
.timer.calm{color:var(--sub)}
.cnt{font-size:13px;color:var(--sub);text-align:right}
.rafts{width:100%;border-collapse:collapse;font-size:15px}
.rafts th{width:48px;background:var(--ink);color:#fff;padding:8px;text-align:center;vertical-align:top}
.rafts td{padding:8px 10px;border-bottom:1px solid var(--line)}
.dist .b{display:flex;align-items:center;gap:8px;margin:5px 0}
.dist .b .l{flex:0 0 120px;font-size:14px;font-weight:700}
.dist .b .g{flex:1;height:20px;background:var(--soft);border-radius:8px;overflow:hidden}
.dist .b .g i{display:block;height:100%;background:var(--gold)}
.dist .b.me .g i{background:var(--main)}
.dist .b .n{width:44px;text-align:right;font-weight:800}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dex .d{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px}
.dex .d.no{filter:grayscale(1);opacity:.45}
.dex .d .av{margin:0 auto 6px}
.ending{text-align:center;padding:20px 10px}
.ending .e{font-size:64px;line-height:1.1}
.ending .t{font-size:26px;font-weight:900;margin:6px 0}
.ending.hidden{background:linear-gradient(135deg,#fff9db,#e6fcf5);border-radius:18px;border:2px solid var(--gold)}
.sumtbl{width:100%;border-collapse:collapse;font-size:14px}
.sumtbl td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.sumtbl td:first-child{font-weight:800;white-space:nowrap;color:var(--main)}
.wbox{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.fbbtn{position:fixed;right:14px;bottom:14px;z-index:40;border:0;border-radius:99px;background:var(--ink);color:#fff;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* 교사 */
table.st{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
table.st th,table.st td{border:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}
table.st th{background:var(--soft);position:sticky;top:0;z-index:1}
table.st td.l{text-align:left;white-space:normal;min-width:180px}
table.st tr.warn td{background:#fff5f5}
.scroll{overflow:auto;max-height:72vh;border-radius:12px;border:1px solid var(--line)}
.bigcode{font-size:38px;font-weight:900;letter-spacing:5px;text-align:center;color:var(--main)}
.qr{display:flex;justify-content:center;padding:10px;background:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-size:28px;color:var(--main)}
.ed fieldset{border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:10px 12px;background:#fff}
.ed legend{font-weight:800;padding:0 6px}
.ed .vals{display:flex;gap:8px;flex-wrap:wrap}
.ed .vals label{font-size:13px;display:flex;flex-direction:column;gap:2px}
.ed .vals input,.ed .vals select{width:92px;padding:6px;border:1px solid var(--line);border-radius:8px}
.toggle{cursor:pointer;user-select:none}
.toggle.on{color:var(--ok);font-weight:900} .toggle.off{color:var(--bad);font-weight:900}
.toggle.ovr{text-decoration:underline dotted}

/* ===== 연출 (fx.js) ===== */
.fx-off *{animation:none!important;transition:none!important}
.world{border-radius:14px;overflow:hidden;line-height:0;margin:8px 0;border:1px solid var(--line)}
.world svg{width:100%;height:auto;display:block}
.world.hurt{animation:hurt .6s 2}
@keyframes hurt{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
body.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,2px)}40%{transform:translate(8px,-2px)}60%{transform:translate(-5px,1px)}80%{transform:translate(5px,0)}}
.stampwrap{display:flex;justify-content:center;margin:6px 0 2px}
.stamp{font-family:serif;font-weight:900;font-size:40px;letter-spacing:4px;padding:6px 18px;border:6px double currentColor;border-radius:10px;transform:rotate(-8deg);animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both}
.stamp.a{color:#c92a2a}.stamp.b{color:#2f7d6d}.stamp.c{color:#6b6b6b}
.stamp.still{animation:none}
@keyframes stampIn{0%{transform:scale(2.6) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.typein{animation:typein .9s ease both}
@keyframes typein{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.evc.flip{animation:flip .55s ease both}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg)}100%{transform:perspective(600px) rotateY(0)}}
.vs{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 4px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:110px}
.vsb{font-size:34px;font-weight:900;color:#fff;background:var(--main);border-radius:50%;width:66px;height:66px;display:flex;align-items:center;justify-content:center;font-style:italic}
.vsb.pulse{animation:vsp 1.2s infinite}
@keyframes vsp{50%{transform:scale(1.12)}}
.bubbles{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.rnd{font-weight:800;font-size:14px;color:var(--sub);text-align:center;margin-top:4px}
.bub{max-width:82%;padding:10px 12px;border-radius:16px;font-size:16px;line-height:1.55}
.bub.l{align-self:flex-start;background:#fff4e6;border:1px solid #f0d9b5;border-bottom-left-radius:4px}
.bub.r{align-self:flex-end;background:#e7f5ff;border:1px solid #c5dff5;border-bottom-right-radius:4px}
.bub.pop{animation:pop .45s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.lampbar{display:flex;align-items:center;gap:8px;margin:8px 0}
.lamps{display:flex;gap:6px;flex-wrap:wrap}
.lamps span{font-size:13px;font-weight:800;padding:6px 10px;border-radius:99px;background:#ececec;color:#8a8a8a;transition:all .25s}
.lamps span.on{background:#fff3bf;color:#8a5a00;box-shadow:0 0 0 2px #ffd43b,0 0 14px #ffe066}
.rivmini{text-align:center;line-height:1.1}
.gloss{min-height:0;font-size:15px;background:#f3f0ff;border-left:4px solid #7048e8;border-radius:8px;padding:0 12px;max-height:0;overflow:hidden;transition:all .3s}
.gloss.show{padding:8px 12px;max-height:120px;margin:6px 0}
.evref{background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:4px 0;transition:all .25s}
.evref.used{background:#fff3bf;border-color:#ffd43b}
.ring{position:relative;width:64px;height:64px}
.ring #tmr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.wrap.urgent{position:relative}
.wrap.urgent::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;box-shadow:inset 0 0 0 0 rgba(201,42,42,0);animation:urg 1.1s infinite}
@keyframes urg{50%{box-shadow:inset 0 0 0 10px rgba(201,42,42,.55)}}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start;margin:12px 0}
.paper{background:#f6ecd2;border:1px solid #d8c59a;border-radius:6px 6px 14px 14px;padding:12px;max-height:80vh;overflow:auto;box-shadow:inset 0 0 30px rgba(140,100,40,.18);font-size:14px;position:sticky;top:10px}
.ptitle{font-weight:900;font-family:serif;font-size:18px;color:#6b3a12;text-align:center;border-bottom:2px solid #c9a96b;margin-bottom:6px;padding-bottom:4px}
.chron{border-bottom:1px dashed #c9a96b;padding:6px 0}
.chron .ch{font-weight:900;color:#7b2d26;margin-bottom:2px}
.chron div{margin:2px 0}
.rf{border-radius:22%;display:block}
.rival .ic svg{display:block}
.bigscr{background:#1d2433;color:#fff;border-radius:20px;padding:20px}
.bigscr .bigcode{color:#ffd43b}
.bigscr .kpi div{background:#2b3446;border-color:#3b465c;color:#fff}
.bigscr .kpi b{color:#ffd43b}
.bigscr .dist .b .l{color:#fff}
.mosaic{display:flex;flex-wrap:wrap;gap:8px}
.mosaic div{background:#2b3446;border-radius:12px;padding:8px;text-align:center;width:84px;font-size:12px}
.mosaic div b{display:block;font-size:30px}

/* ===== 긴장감 장치 ===== */
.march{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:-2px 0 8px}
.mbar{flex:1;height:14px;background:#efe6d6;border-radius:99px;position:relative;overflow:visible}
.mbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f0b37e,#c0392b);transition:width .8s}
.mbar i.hot{animation:mhot 1s infinite}
@keyframes mhot{50%{filter:brightness(1.3)}}
.mbar b{position:absolute;top:-8px;font-size:18px;transition:left .8s}
.mhot{color:var(--bad)}
.npcs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.npc{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:#fff;border:1px solid var(--line)}
.npc.gone{opacity:.45;text-decoration:line-through}.npc.warn{background:#fff4e6;border-color:#f0c48a}.npc.hero{background:#fff3bf;border-color:#ffd43b}.npc.rv{background:#2b2f3a;color:#f3efe6;border-color:#2b2f3a}
.rank .rk{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:10px;font-size:15px}
.rank .rk.me{background:var(--main2);font-weight:800}
.alarm{background:#c92a2a;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;margin:8px 0;animation:pop .4s ease both}
.alarm .small{font-weight:500;opacity:.9}
.lesson{margin:8px 0}
.notep{background:#f8f9fa;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.hintl{background:#f3f0ff;border-left:4px solid #7048e8;border-radius:8px;padding:8px 12px;margin:6px 0;font-size:15px}
.keybox{background:var(--gold2);border:1px dashed var(--gold);border-radius:12px;padding:8px 10px;margin:8px 0}
.keyok{background:var(--ok2);color:var(--ok);border-radius:10px;padding:6px 10px;font-weight:800;margin:8px 0;font-size:14px}
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
@media(max-width:640px){.bets{grid-template-columns:1fr}}
.bet{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 10px}
.bet:hover{border-color:var(--main)}
.bet .bt{font-size:20px;font-weight:900;margin-bottom:4px}
.bet.b3{border-color:#f0a8a8;background:#fff5f5}
.rally{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0 4px;font-weight:800}
.rally i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.rally i.w{background:var(--ok);color:#fff}.rally i.l{background:var(--bad);color:#fff}.rally i.now{background:var(--main);color:#fff;animation:vsp 1s infinite}
.ex{margin:6px 0;font-size:14px}
.ex .exr{background:#2b2f3a;color:#f3efe6;border-radius:12px 12px 12px 4px;padding:7px 10px;max-width:85%}
