const byK = (arr,k)=>arr.find(x=>x.k===k);
function norm(d){
  d = d||{};
  return {
    name:d.name||'', flag:Object.assign({c1:'#e63946',c2:'#1d3557',sym:'⭐'},d.flag||{}),
    terr:d.terr||null, pop:d.pop||null, gov:d.gov||null, tax:d.tax||null,
    budget:d.budget||{}, choices:d.choices||{}, events:d.events||{},
    con:{a1:(d.con&&d.con.a1)||'',a2:(d.con&&d.con.a2)||'',duties:Object.values((d.con&&d.con.duties)||[])}
  };
}
function computeInd(d){
  d = norm(d);
  const v={safe:40,free:40,equal:40,welfare:40,eco:40,trust:40};
  const add=eff=>{ if(!eff) return; for(const k in eff) v[k]+=eff[k]; };
  add(byK(TERR,d.terr)?.eff); add(byK(POP,d.pop)?.eff); add(byK(GOV,d.gov)?.eff); add(byK(TAX,d.tax)?.eff);
  if(d.tax){
    for(const b of BUDGET){
      const p = +d.budget[b.k]||0;
      if(p===0) add(b.zero); else for(const k in b.per) v[k]+=b.per[k]*p;
    }
  }
  for(const c of CARDS){ const ch=d.choices[c.id]; if(ch && ch.opt!=null && c.opts[ch.opt]) add(c.opts[ch.opt].eff); }
  for(const e of EVENTS){ const r=d.events[e.id]; if(r && r.opt!=null && e.opts[r.opt]) add(e.opts[r.opt].eff); }
  for(const k in v) v[k]=Math.max(0,Math.min(100,Math.round(v[k])));
  return v;
}
function nationType(v,d){
  d=norm(d);
  if(v.free<35 && (v.safe>=55 || d.gov==='dict')) return 'control';
  if(v.welfare>=65 && v.equal>=60) return 'welfare';
  if(v.safe>=55 && v.welfare<45 && v.equal<50) return 'night';
  if(v.eco>=65 && v.equal<45) return 'market';
  if(v.trust>=70 && v.free>=65) return 'civic';
  if(Math.min(...Object.values(v))>=50) return 'balance';
  return 'shaky';
}
function personaScore(p,v){ let s=0; for(const k in p.w) s+=v[k]*p.w[k]; return Math.round(s); }
function budgetUsed(d){ return BUDGET.reduce((a,b)=>a+(+norm(d).budget[b.k]||0),0); }

const clamp = (x,a=0,b=100)=>Math.max(a,Math.min(b,x));
const meanV = v => Math.round(IND.reduce((s,i)=>s+(+v[i.k]||0),0)/IND.length);
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0;
function victims(c, P, ids){
  const set = new Set();
  if(c.vterr) ids.forEach(id=>{ if(c.vterr.includes(P[id].terr)) set.add(id); });
  if(!set.size && ids.length){
    const n = Math.max(1, Math.ceil(ids.length*0.3));
    [...ids].sort((a,b)=>P[a].base[c.vk]-P[b].base[c.vk]).slice(0,n).forEach(id=>set.add(id));
  }
  return set;
}
function calc(){
  const P = DATA.players || {};
  const ids = Object.keys(P).filter(id=>P[id] && P[id].base);
  const cur = {}; ids.forEach(id=>cur[id]=Object.assign({},P[id].base));
  const rev = (DATA.meta && DATA.meta.rev) || {};
  const rounds = []; let W = 50;
  for(const c of CRISES){
    const A = (DATA.ans && DATA.ans[c.id]) || {};
    const cnt = {A:0,B:0,C:0};
    ids.forEach(id=>{ const a=A[id]; if(a && cnt[a.opt]!=null) cnt[a.opt]++; });
    const tot = cnt.A+cnt.B+cnt.C;
    const r = {c, cnt, tot, revealed:!!rev[c.id], before:{}, after:{}, vict:new Set(), dW:0, k:0};
    ids.forEach(id=>r.before[id]=Object.assign({},cur[id]));
    if(r.revealed && tot>0){
      const a=cnt.A/tot, b=cnt.B/tot, cc=cnt.C/tot;
      r.k = b + 1.2*cc - 1.5*a;
      r.dW = Math.round(20*a - 12*b - 15*cc);
      W = clamp(W + r.dW);
      r.vict = victims(c, P, ids);
      ids.forEach(id=>{
        const m = r.vict.has(id) ? 1.5 : 1;
        c.hit.forEach(h=>{ cur[id][h] += Math.round(10*r.k*m); });
        const mine = A[id]; if(mine && OWN[mine.opt]) for(const k in OWN[mine.opt]) cur[id][k] += OWN[mine.opt][k];
        for(const k in cur[id]) cur[id][k] = clamp(Math.round(cur[id][k]));
      });
    }
    ids.forEach(id=>r.after[id]=Object.assign({},cur[id]));
    r.W = W; rounds.push(r);
  }
  const avgBase = Math.round(avg(ids.map(id=>meanV(P[id].base))));
  const avgNow = Math.round(avg(ids.map(id=>meanV(cur[id]))));
  const done = rounds.every(r=>r.revealed);
  return {P, ids, cur, rounds, W, avgBase, avgNow, done, win: done && ids.length>0 && avgNow>avgBase && W<50};
}
function aCount(sid){ let n={A:0,B:0,C:0}; for(const c of CRISES){ const a=DATA.ans&&DATA.ans[c.id]&&DATA.ans[c.id][sid]; if(a&&n[a.opt]!=null) n[a.opt]++; } return n; }
function buildAssign(){
  const W = calc(); const ids = W.ids;
  if(!ids.length) return {};
  // 지금 평균 지표가 가장 낮은(형편이 가장 어려운) 나라들
  const sorted = [...ids].sort((a,b)=>meanV(W.cur[a])-meanV(W.cur[b]));
  const T = sorted.slice(0, Math.max(1, Math.min(ids.length, Math.ceil(ids.length/4))));
  const out = {};
  [...ids].sort((a,b)=>(+W.P[a].num||999)-(+W.P[b].num||999)).forEach((id,j)=>{
    let t = T[j % T.length];
    if(t===id && ids.length>1){ t = T.length>1 ? T[(j+1)%T.length] : sorted.find(x=>x!==id); }
    // 그 나라가 실제로 피해국이었던 위기에 맞춘 시민 신분
    const hits = W.rounds.map((r,i)=>r.vict.has(t)?i:-1).filter(i=>i>=0);
    out[id] = {t, p: hits.length ? hits[j % hits.length] : j % CITIZENS.length};
  });
  return out;
}

const clean = o => o==null ? null : JSON.parse(JSON.stringify(o));
let DBMODE='demo', backend=null;
async function initBackend(){
  if(!FORCE_DEMO && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL){
    try{
      const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const db = D.getDatabase(A.initializeApp(FIREBASE_CONFIG));
      backend = {
        set:(p,v)=>D.set(D.ref(db,p),clean(v)),
        update:(p,v)=>D.update(D.ref(db,p),clean(v)),
        remove:p=>D.remove(D.ref(db,p)),
        on:(p,cb)=>D.onValue(D.ref(db,p),s=>cb(s.val()),err=>toast('⚠️ 데이터베이스 연결 오류: '+err.message))
      };
      DBMODE='live'; return;
    }catch(e){ console.error(e); toast('⚠️ Firebase 연결 실패 → 체험 모드로 실행합니다'); }
  }
  // 체험 모드: localStorage + BroadcastChannel (같은 브라우저의 여러 탭끼리 연동)
  const KEY='natgame_demo_db';
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('natgame') : null;
  const L=[];
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } };
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=(t,p)=>parts(p).reduce((o,k)=>o==null?undefined:o[k],t);
  const setAt=(t,p,v)=>{ const ks=parts(p); let o=t; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } const last=ks[ks.length-1]; if(v==null) delete o[last]; else o[last]=clean(v); };
  const fire=()=>{ const t=read(); L.forEach(l=>l.cb(clean(getAt(t,l.p))??null)); };
  const write=t=>{ try{ localStorage.setItem(KEY,JSON.stringify(t)); }catch(e){} fire(); bc&&bc.postMessage(1); };
  if(bc) bc.onmessage=fire;
  window.addEventListener('storage',e=>{ if(e.key===KEY) fire(); });
  backend = {
    set:async(p,v)=>{ const t=read(); setAt(t,p,v); write(t); },
    update:async(p,obj)=>{ const t=read(); for(const k in obj) setAt(t,p+'/'+k,obj[k]); write(t); },
    remove:async p=>{ const t=read(); setAt(t,p,null); write(t); },
    on:(p,cb)=>{ const l={p,cb}; L.push(l); setTimeout(()=>cb(clean(getAt(read(),p))??null),0); return ()=>{ const i=L.indexOf(l); if(i>=0) L.splice(i,1); }; }
  };
}

}
function gauge(W){
  const col = W>=70?'var(--bad)':W>=50?'var(--warn)':'var(--ok)';
  const lab = W>=70?'매우 위험':W>=50?'위험':W>=30?'회복 중':'안정';
  return `<div class="gauge"><div class="gl"><b>🌍 세계 위기 지수</b><span style="color:${col};font-weight:800">${W} · ${lab}</span></div><div class="gt"><i style="width:${W}%;background:${col}"></i><em style="left:50%"></em></div><div class="muted" style="font-size:13px">처음 50 · 50보다 낮아져야 세계가 회복된 것입니다</div></div>`;
}
function hashStr(s){ let h=2166136261; for(const ch of String(s)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function shuffled(arr, seed){ const a=[...arr]; let x=hashStr(seed)||1; for(let i=a.length-1;i>0;i--){ x=(Math.imul(x,1103515245)+12345)>>>0; const j=x%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function playerFrom(sid, num, sname, d, extra={}){
  d = norm(d); const v = computeInd(d);
  return Object.assign({sid, num:String(num||''), sname:String(sname||''), name:d.name||'이름 없는 나라', flag:d.flag, terr:d.terr||'', gov:d.gov||'', base:v, btype:nationType(v,d), quick:false}, extra);
}
async function claim(info){
  if(claiming) return; claiming=true;
  try{
    const ex = DATA.players && DATA.players[info.sid];
    if(ex && ex.dev && ex.dev!==DEV){ ME=info.sid; view='locked'; claiming=false; render(); return; }
    const rec = ex ? {dev:DEV} : Object.assign({}, info, {dev:DEV, joinedAt:Date.now()});
    if(ex) await backend.update(`${WR()}/players/${info.sid}`, rec); else await backend.set(`${WR()}/players/${info.sid}`, rec);
    ME = info.sid; ls.set(meKey(), ME); view='auto';
  }catch(e){ toast('⚠️ 저장 실패: '+e.message); }
  claiming=false; render();
}
function ensureMe(){
  if(!gotData || !gotSrc || claiming) return;
  const P = DATA.players || {};
  if(ME && P[ME]){ if(P[ME].dev && P[ME].dev!==DEV){ view='locked'; } else if(view==='locked'){ view='auto'; } if(!P[ME].dev){ backend.update(`${WR()}/players/${ME}`,{dev:DEV}); } return; }
  if(view==='find' || view==='quick') return;
  // 1) 이 태블릿이 기억하는 세계 게임 신분
  const saved = ls.get(meKey());
  if(saved && P[saved]){ ME=saved; return; }
  // 2) 이 태블릿에 저장된 국가 만들기 나라
  const S = nationLocal();
  if(S && S.id && S.d && S.d.name){
    const fb = SRCN[S.id];
    const d = fb && fb.d ? fb.d : S.d;
    claim(playerFrom(S.id, S.num, S.sname, d));
    return;
  }
  // 3) 저장된 정보가 사라졌지만 예전 기록이 있으면(재접속)
  if(saved && SRCN[saved]){ const n=SRCN[saved]; claim(playerFrom(saved, n.num, n.sname, n.d)); return; }
  ME=null; view='find';
}

  return `<div class="card"><h3 style="margin-top:0">🪞 세계 시민 체크리스트 반 평균 (${C.length}명)</h3>${CHECK.map((q,i)=>`<div class="obar"><div class="lbl"><span>${i+1}. ${esc(q)}</span><span>${avgs[i]}점</span></div><div class="tr"><i style="width:${avgs[i]==='-'?0:avgs[i]*20}%;background:var(--accent2)"></i></div></div>`).join('')}
  <div class="banner warn" style="margin-top:14px">🤔 '책임감을 느낀다'에 4~5점을 주었지만 지난 시간 자국 우선을 2번 이상 고른 학생: <b>${gaps.length}명</b> / ${C.length}명<br><small>이름 없이 이 숫자만 보여 주며 묻습니다: “생각과 행동 사이의 거리는 왜 생길까?”</small></div></div>
  <div class="card"><h3 style="margin-top:0">세계 시민이란 …</h3><ul class="rlist">${C.map(([id,x])=>`<li>${showNames?`<b>${who(id)}</b>`:''}세계 시민이란 ${esc(x.def)}</li>`).join('')||'<li>아직 없음</li>'}</ul></div>`;
}
function tPlan(W){
  const P=Object.entries(DATA.plan||{}).filter(([id])=>W.P[id]);
  const by={}; P.forEach(([id,x])=>{ (by[x.day]=by[x.day]||[]).push([id,x]); });
  return `<div class="card"><h3 style="margin-top:0">📅 실천 카드 벽 (${P.length})</h3>${DAYS.filter(d=>by[d.k]).map(d=>`<h3>${esc(d.n)} <small class="muted">${esc(d.d)} · ${by[d.k].length}명</small></h3><div class="vwall">${by[d.k].map(([id,x])=>`<div class="pcard"><div class="ps">${esc(x.scope)}</div><p><b>할 일</b> ${esc(x.act)}</p><p><b>이유</b> ${esc(x.why)}</p>${showNames?`<small class="muted">${who(id)}</small>`:''}</div>`).join('')}</div>`).join('')||'<p class="muted">아직 없음</p>'}
  <p class="muted">정리 발문: 이 실천들은 개인·국가·국제 차원 중 어디에 해당할까요? 개인의 실천만으로 충분할까요?</p></div>`;
}
function tFeel(W){
  const sec=(key,items,title)=>{ const L=Object.entries(DATA[key]||{}).filter(([id])=>W.P[id]); const ok=items.map((x,i)=>L.filter(([,v])=>v.a&&v.a[i]===x.a).length);
    return `<div class="card"><h3 style="margin-top:0">${title} (${L.length}명)</h3>${items.map((x,i)=>`<div class="oxr"><span>${i+1}. ${esc(x.q)} <b>(${x.a})</b></span><b>정답 ${ok[i]}/${L.length}</b></div>`).join('')}<ul class="rlist">${L.map(([id,v])=>`<li>${showNames?`<b>${who(id)}</b>`:''}${esc(v.feel)}</li>`).join('')}</ul></div>`; };
  return sec('ox1',OX1,'✅ 2차시 OX · 느낀 점') + sec('ox2',OX2,'✅ 3차시 OX · 느낀 점');
}
function tRecord(){
  return `<div class="card"><h3 style="margin-top:0">📥 기록 내려받기</h3><p>학생별 선택·이유·목소리·체크리스트·실천 계획이 한 파일로 나옵니다. 엑셀에서 바로 열립니다.</p><button class="btn teal" data-act="csv">엑셀(CSV) 내려받기</button></div>
  <div class="card"><h3 style="margin-top:0">🗑️ 초기화</h3><p class="muted">이 세계 게임 방(W${esc(SRC)})의 기록만 지웁니다. 1차시 국가 만들기 기록은 그대로 남습니다. 3차시까지 끝내고 엑셀을 받은 뒤에 누르세요.</p><button class="btn ghost" data-act="reset">이 방 초기화</button></div>
  <div class="card"><h3 style="margin-top:0">다른 반으로</h3><p class="muted">다른 반의 1차시 방 코드를 넣으면 그 반 세계 게임 방이 열립니다.</p><button class="btn ghost" data-act="changeRoom">방 코드 바꾸기</button></div>`;
}
function renderTeacher(){
  if(!pinOK()){ $app.innerHTML = `${tHeader()}<div class="card center"><h2>🔐 교사 비밀번호</h2><input class="field" type="password" style="max-width:220px;text-align:center;font-size:22px" data-bind="pin" inputmode="numeric"><div style="margin-top:12px"><button class="btn acc" data-act="pin">확인</button></div></div>`; return; }
  if(!SRC){ $app.innerHTML = `${tHeader()}<div class="card center"><h2>1차시 국가 만들기 방 코드를 입력하세요</h2><p class="muted">국가 만들기 교사 화면 주소 끝의 room= 뒤 4글자 (예: K7PM)</p><input class="field" style="max-width:260px;text-align:center;font-size:24px;font-weight:800;letter-spacing:4px;text-transform:uppercase" data-bind="troom" value="${esc(ttmp)}" maxlength="8"><div style="margin-top:14px"><button class="btn acc" data-act="setRoom">이 반 불러오기</button></div></div>`; return; }
  if(!gotData || !gotSrc){ $app.innerHTML = `${tHeader()}<div class="card center"><p class="blink">불러오는 중…</p></div>`; return; }
  const W=calc();
  const TABS=[['run','🎮 진행'],['board','🌍 세계 상태판'],['reasons','💬 선택 이유'],['voice','📣 시민의 목소리'],['check','🪞 자기 점검'],['plan','📅 실천 카드'],['feel','✅ OX·느낀 점'],['rec','📥 기록']];
  const body = tab==='run'?tRun(W):tab==='board'?tBoard(W):tab==='reasons'?tReasons(W):tab==='voice'?tVoice(W):tab==='check'?tCheck(W):tab==='plan'?tPlan(W):tab==='feel'?tFeel(W):tRecord();
  $app.innerHTML = `<div class="twrap">${tHeader()}${phaseBar()}<div class="tabs">${TABS.map(([k,n])=>`<button class="${tab===k?'on':''}" data-act="tab" data-v="${k}">${n}</button>`).join('')}</div>${body}</div>`;
}
function csvDownload(){
  const W=calc(); const q=s=>'"'+String(s??'').replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';
  const head=['번호','이름','나라','처음 유형','처음 평균','지금 평균','빠른 생성'];
  CRISES.forEach(c=>head.push(`${c.t} 선택`,`${c.t} 이유`));
  head.push('퍼즐 정답(5)','상상한 미래','2차시 OX 정답','2차시 느낀 점','시민 배정 나라','시민 신분','시민의 목소리',...CHECK.map((x,i)=>`체크${i+1}`),'세계 시민의 뜻','기념일','실천 장소','할 일','실천 이유','3차시 OX 정답','3차시 느낀 점');
  const rows=[head.map(q).join(',')];
  const as=(DATA.meta&&DATA.meta.assign)||{};
  [...W.ids].sort((a,b)=>(+W.P[a].num||999)-(+W.P[b].num||999)).forEach(id=>{
    const p=W.P[id]; const r=[p.num,p.sname,p.name,(TYPES[p.btype]||{}).n,meanV(p.base),meanV(W.cur[id]),p.quick?'예':''];
    CRISES.forEach(c=>{ const a=DATA.ans&&DATA.ans[c.id]&&DATA.ans[c.id][id]; r.push(a?(OPT.find(o=>o.k===a.opt)||{}).n:'', a?a.reason:''); });
    const pz=(DATA.puzzle||{})[id]; r.push(pz?pz.ok:'', pz?pz.future:'');
    const o1=(DATA.ox1||{})[id]; r.push(o1?OX1.filter((x,i)=>o1.a[i]===x.a).length+'/'+OX1.length:'', o1?o1.feel:'');
    const a=as[id]; r.push(a&&W.P[a.t]?W.P[a.t].name:'', a?CITIZENS[a.p%CITIZENS.length].n:'');
    const v=(DATA.voice||{})[id]; r.push(v?v.text:'');
    const ck=(DATA.check||{})[id]; CHECK.forEach((x,i)=>r.push(ck?ck.s[i]:'')); r.push(ck?ck.def:'');
    const pl=(DATA.plan||{})[id]; r.push(pl?(DAYS.find(d=>d.k===pl.day)||{}).n:'', pl?pl.scope:'', pl?pl.act:'', pl?pl.why:'');
    const o2=(DATA.ox2||{})[id]; r.push(o2?OX2.filter((x,i)=>o2.a[i]===x.a).length+'/'+OX2.length:'', o2?o2.feel:'');
    rows.push(r.map(q).join(','));
  });
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`세계시민_${SRC}_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),500);
}
const tActs = {
  pin(){ if(String(dr.pin||'')===TEACHER_PIN){ try{ sessionStorage.setItem('worldgame_pin',TEACHER_PIN); }catch(e){} startTeacherData(); render(); } else toast('비밀번호가 틀렸습니다.'); },
  setRoom(){ const c=cleanCode(ttmp); if(c.length<3){ toast('방 코드를 확인해 주세요.'); return; } const u=new URL(location.href); u.searchParams.set('room',c); history.replaceState(null,'',u.toString()); SRC=c; startTeacherData(); render(); },
  changeRoom(){ const u=new URL(location.href); u.searchParams.delete('room'); location.href=u.toString(); },
  tab(ds){ tab=ds.v; render(); },
  names(){ showNames=!showNames; keepScroll=true; render(); },
  phase(ds){ const v=ds.v; const upd={phase:v};
    if(v==='citizen' && !(DATA.meta&&DATA.meta.assign)){ upd.assign=buildAssign(); }
    backend.update(`${WR()}/meta`,upd); if(v==='citizen') tab='voice'; else if(v==='check') tab='check'; else if(v==='plan') tab='plan'; else if(v==='wrap1'||v==='wrap2') tab='feel'; else tab='run'; },
  reveal(){ const ph=phaseOf(); backend.update(`${WR()}/meta/rev`,{[ph]:true}); if(ph!=='puzzle') tab='board'; },
  unreveal(){ const ph=phaseOf(); if(!confirm('결과 공개를 취소할까요?')) return; backend.remove(`${WR()}/meta/rev/${ph}`); },
  assign(){ if(!confirm('시민 배정을 다시 할까요? 이미 쓴 목소리는 남지만, 새 신분이 바뀔 수 있습니다.')) return; backend.update(`${WR()}/meta`,{assign:buildAssign()}); },
  unlock(ds){ if(!confirm('이 나라의 태블릿 잠금을 풀까요? 다른 태블릿에서 이 나라로 들어갈 수 있게 됩니다.')) return; backend.update(`${WR()}/players/${ds.v}`,{dev:null}); },
  delP(ds){ if(!confirm('이 학생을 세계 게임에서 뺄까요? (1차시 나라 기록은 그대로)')) return; backend.remove(`${WR()}/players/${ds.v}`); },
  qr(){ const url=studentURL(); const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML=`<div class="modal center"><h2>📱 학생 접속</h2><div class="qrbox" id="qrbox"></div><p class="url">${esc(url)}</p><p class="muted">지난 시간과 <b>같은 태블릿, 같은 브라우저</b>로 들어오면 자기 나라가 자동으로 뜹니다.</p><button class="btn" data-x="close">닫기</button></div>`; document.body.appendChild(ov); ov.addEventListener('click',e=>{ if(e.target===ov||e.target.dataset.x==='close') ov.remove(); }); try{ new QRCode(ov.querySelector('#qrbox'),{text:url,width:300,height:300}); }catch(e){ ov.querySelector('#qrbox').textContent='QR을 만들 수 없습니다. 위 주소를 알려 주세요.'; } },
  csv(){ csvDownload(); },
  reset(){ if(!confirm(`세계 게임 방 W${SRC}의 모든 기록을 지울까요? 되돌릴 수 없습니다.\n(1차시 국가 만들기 기록은 지워지지 않습니다)`)) return; backend.set(WR(),{meta:{phase:'lobby',src:SRC,resetAt:Date.now()}}); toast('초기화했습니다.'); }
};
let tStarted=false;
function startTeacherData(){
  if(tStarted || !SRC || !pinOK()) return; tStarted=true;
  backend.on(WR(), v=>{ DATA=v||{}; gotData=true; if(!DATA.meta){ backend.update(`${WR()}/meta`,{phase:'lobby',src:SRC,createdAt:Date.now()}); } softRender(); });
  backend.on(`rooms/${SRC}/nations`, v=>{ SRCN=v||{}; gotSrc=true; softRender(); });
}

/* =========================================================
   ⑧ 이벤트 연결 · 시작
   ========================================================= */
$app.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const acts = MODE==='teacher' ? tActs : sActs; const f=acts[b.dataset.act]; if(f) f(b.dataset);
});
$app.addEventListener('input', e=>{
  const el=e.target; const k=el.dataset.bind; if(!k) return;
  if(k==='room') tmpRoom=el.value; else if(k==='troom') ttmp=el.value; else if(k==='pin') dr.pin=el.value;
  else { const [a,b]=k.split('.'); draft(a)[b]=el.value; }
});
$app.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.tagName==='INPUT'){ const k=e.target.dataset.bind; if(k==='room') sActs.enterRoom(); else if(k==='troom') tActs.setRoom(); else if(k==='pin') tActs.pin(); } });
(async function(){
  await initBackend();
  if(MODE==='teacher'){ startTeacherData(); render(); }
  else { startStudent(); render(); }
})();

</script>
