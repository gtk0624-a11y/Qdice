/*ENGINE_START*/
/* =========================================================
   ② 게임 엔진 — 화면과 무관한 순수 계산 (테스트 가능)
   ========================================================= */
const ROLES = {
  mafia:  {n:'마피아', e:'🎭', k:'kill',  d:'밤마다 시민 한 명을 노립니다. 가짜 소문을 퍼뜨려 마을을 속이세요.'},
  doctor: {n:'의사',   e:'💉', k:'save',  d:'밤마다 한 명을 지켜 줍니다. 자기 자신도 지킬 수 있어요.'},
  police: {n:'경찰',   e:'🔍', k:'check', d:'밤마다 한 명을 조사해 마피아인지 알아냅니다.'},
  citizen:{n:'시민',   e:'🏘️', k:null,    d:'토론과 투표로 마피아를 찾고, 가짜 소문을 가려내세요.'}
};
const RND = () => Math.random();
function shuffle(a, rng=RND){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function pickOne(a, rng=RND){ return a[Math.floor(rng()*a.length)]; }
function rolePlan(N){
  const m = Math.max(1, Math.round(N/5));
  let d = N>=4 ? Math.max(1, Math.floor(N/12)) : 0;
  let p = N>=4 ? Math.max(1, Math.floor(N/12)) : 0;
  while(N-m-d-p < 1 && (d>0||p>0)){ if(p>0) p--; else d--; }
  return {mafia:m, doctor:d, police:p, citizen:Math.max(0,N-m-d-p)};
}
function assignRoles(pids, rng=RND){
  const pl=rolePlan(pids.length), list=[];
  Object.keys(pl).forEach(r=>{ for(let i=0;i<pl[r];i++) list.push(r); });
  const sh=shuffle(pids,rng), out={};
  sh.forEach((p,i)=>out[p]=list[i]||'citizen');
  return out;
}
const winW = N => Math.max(2, Math.min(6, Math.round(N/5)+1, N-1));
/* 번호 순서 목록 위에서 연속된 W명을 '구간'으로 쓴다 */
function genNotes(o){
  const {order,roles,alive}=o, rng=o.rng||RND, N=order.length, W=winW(N);
  const isAM=p=>roles[p]==='mafia'&&alive[p];
  const idxAM=order.map((p,i)=>isAM(p)?i:-1).filter(i=>i>=0);
  if(!idxAM.length||N<3) return null;
  const maxS=N-W, cnt=s=>order.slice(s,s+W).filter(isAM).length;
  const mi=pickOne(idxAM,rng), lo=Math.max(0,mi-W+1), hi=Math.min(mi,maxS);
  const ts=lo+Math.floor(rng()*(hi-lo+1));
  const cand=[]; for(let s=0;s<=maxS;s++) if(s!==ts&&cnt(s)===0) cand.push(s);
  let fs=null, weak=false; const props={};
  (o.proposals||[]).forEach(s=>{ s=+s; if(cand.includes(s)) props[s]=(props[s]||0)+1; });
  const ks=Object.keys(props);
  if(ks.length){ const mx=Math.max(...ks.map(k=>props[k])); fs=+pickOne(ks.filter(k=>props[k]===mx),rng); }
  else if(cand.length) fs=pickOne(cand,rng);
  else { weak=true; const any=[]; for(let s=0;s<=maxS;s++) if(s!==ts) any.push(s); fs=any.length?pickOne(any,rng):ts; }
  const mk=s=>({p:order.slice(s,s+W)});
  const fakeFirst=rng()<0.5;
  return {notes:fakeFirst?[mk(fs),mk(ts)]:[mk(ts),mk(fs)], fakeIdx:fakeFirst?0:1, trueIdx:fakeFirst?1:0, weak, W};
}
function resolveNight(o){
  const {roles,alive}=o, acts=o.acts||{}, rng=o.rng||RND, pids=Object.keys(roles);
  const votes={};
  pids.forEach(p=>{ const a=acts[p]; if(!a||!alive[p]||roles[p]!=='mafia'||a.k!=='kill') return;
    if(a.t!=null&&alive[a.t]&&roles[a.t]!=='mafia') votes[a.t]=(votes[a.t]||0)+1; });
  let target=null; const ks=Object.keys(votes);
  if(ks.length){ const mx=Math.max(...ks.map(k=>votes[k])); target=pickOne(ks.filter(k=>votes[k]===mx),rng); }
  const saves=[]; pids.forEach(p=>{ const a=acts[p]; if(alive[p]&&roles[p]==='doctor'&&a&&a.k==='save'&&a.t!=null&&alive[a.t]) saves.push({by:p,t:a.t}); });
  const savedBy=saves.filter(s=>s.t===target).map(s=>s.by), saved=target!=null&&savedBy.length>0;
  const checks=[]; pids.forEach(p=>{ const a=acts[p]; if(alive[p]&&roles[p]==='police'&&a&&a.k==='check'&&a.t!=null&&alive[a.t]) checks.push({by:p,t:a.t,m:roles[a.t]==='mafia'}); });
  return {target, killed:(target!=null&&!saved)?target:null, saved, savedBy, checks};
}
function tallyJudge(o){
  const cnt=[0,0];
  Object.keys(o.votes||{}).forEach(p=>{ if(!o.alive[p]) return; const v=o.votes[p]; if(v&&(v.n===0||v.n===1)) cnt[v.n]++; });
  const pick=cnt[0]===cnt[1]?null:(cnt[0]>cnt[1]?0:1);
  return {cnt, pick, correct:pick==null?null:pick===o.fakeIdx};
}
function judgeEffect(t, notes, fakeIdx){
  const fp=notes[fakeIdx].p; const immune=[], susp={};
  if(t.correct===true) fp.forEach(p=>immune.push(p));
  if(t.correct===false) fp.forEach(p=>susp[p]=2);
  return {immune, susp};
}
function pointsJudge(o){      // 판별 점수 + 마피아 '속이기' 점수
  const pts={}, add=(p,x)=>pts[p]=(pts[p]||0)+x; let ok=0, bad=0;
  Object.keys(o.votes||{}).forEach(p=>{
    if(!o.alive[p]) return; const v=o.votes[p]; if(!v||(v.n!==0&&v.n!==1)) return;
    const c=Math.max(1,Math.min(3,+v.c||1));
    if(o.roles[p]==='mafia') return;
    if(v.n===o.fakeIdx){ add(p,c); ok++; } else { add(p,-c); bad++; }
  });
  const dec=[];
  if(o.tally.correct===false) Object.keys(o.roles).forEach(p=>{ if(o.roles[p]==='mafia'&&o.alive[p]){ add(p,2); dec.push(p); } });
  return {pts, ok, bad, dec};
}
function tallyExec(o){
  const alive=o.alive, aliveP=Object.keys(alive).filter(p=>alive[p]), votes=o.votes||{};
  const counts={}; let abs=0, real=0;
  aliveP.forEach(p=>{ const v=votes[p]; if(!v) return; if(v.t==='abs'){ abs++; return; } if(alive[v.t]){ counts[v.t]=(counts[v.t]||0)+1; real++; } });
  const imm=o.immune||[], sp=o.susp||{}, eff={};
  aliveP.forEach(p=>{ if(imm.includes(p)) return; const x=(counts[p]||0)+(sp[p]||0); if(x>0) eff[p]=x; });
  const silent=abs*2>aliveP.length, ks=Object.keys(eff);
  let top=null, tied=[];
  if(ks.length&&!silent&&real>0){ const mx=Math.max(...ks.map(k=>eff[k])); tied=ks.filter(k=>eff[k]===mx); top=tied.length===1?tied[0]:pickOne(tied,o.rng||RND); }
  return {counts, eff, abs, real, silent, top, tied:tied.length>1?tied:[]};
}
function pointsExec(o){       // 마피아를 지목하면 +2, 기권(방관)이면 -1
  const pts={}, add=(p,x)=>pts[p]=(pts[p]||0)+x; let abs=0;
  Object.keys(o.alive).forEach(p=>{ if(!o.alive[p]) return; const v=(o.votes||{})[p]; if(!v) return;
    if(v.t==='abs'){ add(p,-1); abs++; }
    else if(o.roles[v.t]==='mafia'&&o.roles[p]!=='mafia') add(p,2); });
  return {pts, abs};
}
function tallyFinal(o){
  let yes=0, no=0;
  Object.keys(o.alive).forEach(p=>{ if(!o.alive[p]||p===o.def) return; const v=(o.votes||{})[p]; if(!v) return; if(v.y===1) yes++; else if(v.y===0) no++; });
  return {yes, no, executed:yes>no};
}
function checkWin(roles, alive){
  let m=0, o=0; Object.keys(roles).forEach(p=>{ if(!alive[p]) return; if(roles[p]==='mafia') m++; else o++; });
  if(m===0) return 'citizen'; if(m>=o) return 'mafia'; return null;
}
function pointsEnd(roles, alive, win){
  const pts={};
  Object.keys(roles).forEach(p=>{ const w=(roles[p]==='mafia')===(win==='mafia'); pts[p]=w?(alive[p]?5:3):1; });
  return pts;
}
const orderOf = (PL, v) => Object.values(PL||{}).filter(p=>p&&p.v===v).sort((a,b)=>(a.num-b.num)||(a.id<b.id?-1:1)).map(p=>p.id);
/*ENGINE_END*/

/* =========================================================
   ③ 저장소 (Firebase 실시간 DB 또는 체험 모드)
   ========================================================= */
const clean = o => o==null ? null : JSON.parse(JSON.stringify(o));
let DBMODE='demo', backend=null, SOFF=0;
async function initBackend(){
  if(window.__MF_BACKEND){ backend=window.__MF_BACKEND; DBMODE='live'; return; }
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL){
    try{
      const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const db = D.getDatabase(A.initializeApp(FIREBASE_CONFIG,'mafia'));
      backend = {
        set:(p,v)=>D.set(D.ref(db,p),clean(v)),
        update:(p,v)=>D.update(D.ref(db,p),clean(v)),
        remove:p=>D.remove(D.ref(db,p)),
        on:(p,cb)=>D.onValue(D.ref(db,p),s=>cb(s.val()),err=>toast('⚠️ 데이터베이스 연결 오류: '+err.message))
      };
      D.onValue(D.ref(db,'.info/serverTimeOffset'),s=>{ SOFF=+s.val()||0; });
      DBMODE='live'; return;
    }catch(e){ console.error(e); setTimeout(()=>toast('⚠️ Firebase 연결 실패 → 체험 모드로 실행합니다'),500); }
  }
  const KEY='mafia_demo_db';
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('mafiagame') : null;
  const L=[];
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } };
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=(t,p)=>parts(p).reduce((o,k)=>o==null?undefined:o[k],t);
  const setAt=(t,p,v)=>{ const ks=parts(p); let o=t; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } const last=ks[ks.length-1]; if(v==null) delete o[last]; else o[last]=clean(v); };
  const fire=()=>{ const t=read(); L.forEach(l=>l.cb(clean(getAt(t,l.p))??null)); };
  const write=t=>{ try{ localStorage.setItem(KEY,JSON.stringify(t)); }catch(e){} fire(); bc&&bc.postMessage(1); };
  if(bc) bc.onmessage=fire;
  window.addEventListener('storage',e=>{ if(e.key===KEY) fire(); });
  backend = {
    set:async(p,v)=>{ const t=read(); setAt(t,p,v); write(t); },
    update:async(p,obj)=>{ const ks=Object.keys(obj); for(const a of ks) for(const b of ks) if(a!==b&&b.startsWith(a+'/')) throw new Error('경로 충돌: '+a+' ⊃ '+b); const t=read(); for(const k in obj) setAt(t,p+'/'+k,obj[k]); write(t); },
    remove:async p=>{ const t=read(); setAt(t,p,null); write(t); },
    on:(p,cb)=>{ const l={p,cb}; L.push(l); setTimeout(()=>cb(clean(getAt(read(),p))??null),0); return ()=>{ const i=L.indexOf(l); if(i>=0) L.splice(i,1); }; }
  };
}

function tone(f,d=0.12,type='sine',vol=0.15,when=0){ const a=ac(); if(!a) return; try{ const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f; const t=a.currentTime+when; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.02); }catch(e){} }

function bindHold(){

}

function bindPeek(){
  const el=document.getElementById('peek'); if(!el||el._b) return; el._b=1;
  const show=()=>{ el.dataset.old=el.innerHTML; const r=myRole(); el.innerHTML=`${ROLES[r].e}<b style="font-size:20px">${ROLES[r].n}</b><span class="muted small" style="margin-left:auto">${esc(ROLES[r].d)}</span>`; HOLD.on=true; };
  const hide=()=>{ if(el.dataset.old){ el.innerHTML=el.dataset.old; el.dataset.old=''; } HOLD.on=false; R(); };
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); show(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,hide));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

  {

  for(const p of sh){ const e=document.getElementById(`f${v}${p}`); if(e){ e.className=`fcard ${roles[p]==='mafia'?'m':''} ${al[p]?'':'dead'}`; e.innerHTML=`<div class="em">${ROLES[roles[p]].e}</div>${numOf(p)} ${esc(nickOf(p))}`; } roles[p]==='mafia'?sfx.sting():sfx.tick(); await sleep(roles[p]==='mafia'?700:260); }
  await sleep(900);
  const st=(HOST[v]||{}).stats||{};
  put(el,`<div class="winb ${w==='mafia'?'m':'c'}">${w==='mafia'?'🎭 마피아 승리':'🏘️ 시민 승리'}</div><div class="flipgrid" style="justify-content:center">${ord.map(p=>`<div class="fcard ${roles[p]==='mafia'?'m':''} ${al[p]?'':'dead'}"><div class="em">${ROLES[roles[p]].e}</div>${numOf(p)} ${esc(nickOf(p))}</div>`).join('')}</div>`);
  w==='mafia'?sfx.lose():sfx.win();
}

/* =========================================================
   ⑧ 교사 / 전광판 화면
   ========================================================= */
const PHN={lobby:'모집',roles:'역할 확인',night:'🌙 밤',dawn:'🌅 새벽',talk:'☀️ 광장 토론',vote:'🗳️ 투표',defense:'⚖️ 최후 변론',final:'👍👎 찬반 투표',exec:'처형 결과',end:'🏁 종료'};
function joinUrl(){ try{ return new URL('index.html?room='+ROOM, location.href).href; }catch(e){ return location.href; } }
function progress(v){
  const ph=phase(), al=aliveOf(v), ord=orderV(v), r=rk();
  const need=(role)=>ord.filter(p=>al[p]&&secOf(p)===role);
  if(ph==='roles'){ const seen=ord.filter(p=>RV[p]).length; return `역할 확인 ${seen}/${ord.length}`; }
  if(ph==='night'){ let tot=0,done=0; ['mafia','doctor','police'].forEach(role=>need(role).forEach(p=>{ tot++; const a=ACT[p]; if(a&&a.r===r&&a.t!=null) done++; })); return `밤 행동 완료 ${done}/${tot}`; }
  if(ph==='talk'){ const n=ord.filter(p=>al[p]&&JV[p]&&JV[p].r===r).length, t=ord.filter(p=>al[p]).length; return `소문 판별 제출 ${n}/${t}`; }
  if(ph==='vote'){ const n=ord.filter(p=>al[p]&&EV[p]&&EV[p].r===r).length, t=ord.filter(p=>al[p]).length; return `투표 ${n}/${t}`; }
  if(ph==='final'){ const d=((VS[v]||{}).ex||{}).top; const n=ord.filter(p=>al[p]&&p!==d&&FV[p]&&FV[p].r===r).length, t=ord.filter(p=>al[p]&&p!==d).length; return `찬반 ${n}/${t}`; }
  return '';
}
function stageStatic(v){
  const ph=phase(), vs=VS[v]||{}, rv=META.revealed!==false, ord=orderV(v), al=aliveOf(v);
  const showR = UI.showRoles;
  const chipR = p => { const r=secOf(p); return `<span class="chip ${ST[p]&&!ST[p].a?'dead':''} ${showR&&r==='mafia'?'bad':''}">${numOf(p)}<b>${esc(nickOf(p))}</b>${showR&&r?ROLES[r].e:''}${ST[p]&&!ST[p].a?'💀':''}</span>`; };
  if(ph==='lobby') return `<div class="muted">입장 ${ord.length}명 ${ord.length<4?'(4명 이상 필요)':''}</div><div>${ord.map(p=>chipR(p)).join('')||'<span class="muted">아직 없음</span>'}</div>`;
  if(vs.skip) return `<div class="big center muted">인원 부족으로 이번 판 쉼</div>`;
  const head=`<div class="muted small">${progress(v)}</div>`;
  const roster=`<div style="margin-top:8px">${ord.map(p=>chipR(p)).join('')}</div>`;
  if(ph==='roles') return `<div class="big center">🎭 역할 카드를 확인하세요</div>${head}${roster}`;
  if(vs.win&&ph!=='end') return `<div class="winb ${vs.win==='mafia'?'m':'c'}">${vs.win==='mafia'?'🎭 마피아 승리':'🏘️ 시민 승리'}</div>${roster}`;
  if(ph==='night') return `<div class="big center stars-bg" style="padding:30px 0">🌙 밤이 되었습니다<br><span style="font-size:.55em;font-weight:600">모두 눈을 감고 조용히…</span></div>${head}${roster}`;
  if(ph==='dawn'){
    if(!rv) return `<div class="big center blink" style="padding:30px 0">🌅 새벽이 밝아옵니다…<br><span style="font-size:.55em">🥁 발표 버튼을 눌러 주세요</span></div>${roster}`;
    const n=vs.night||{}; return `<div class="big center" style="padding:20px 0">${n.killed?`💀 ${esc(labelOf(n.killed))} 희생`:(n.saved?'💉 의사가 지켜냈습니다':'🌅 평화로운 밤')}</div>${roster}`;
  }
  if(ph==='talk') return `<div class="big center">☀️ 광장 토론</div>${head}${notesHtml(vs,false)}${roster}`;
  if(ph==='vote'){ if(!rv) return `<div class="big center blink" style="padding:30px 0">🥁 마을의 판단은…</div>`; return `${notesHtml(vs,true)}${head}${roster}`; }
  if(ph==='defense'){ if(!rv) return `<div class="big center blink" style="padding:30px 0">⚖️ 개표 대기</div>`; const ex=vs.ex; return `<div class="big center" style="padding:20px 0">${ex&&ex.top?`⚖️ 최후 변론 · ${esc(labelOf(ex.top))}`:'오늘은 지목된 사람이 없습니다'}</div>${roster}`; }
  if(ph==='final'){ const ex=vs.ex; return `<div class="big center">${ex&&ex.top?esc(labelOf(ex.top)):''}<br>👍 / 👎 투표 중</div>${head}`; }
  if(ph==='exec'){ if(!rv) return `<div class="big center blink" style="padding:30px 0">🥁 운명의 순간…</div>`; const ex=vs.ex, f=vs.fin; return `<div class="big center" style="padding:20px 0">${ex&&ex.top&&f?(f.executed?`💀 ${esc(labelOf(ex.top))} 처형`:`🕊️ ${esc(labelOf(ex.top))} 무사`):'아무도 처형되지 않았습니다'}</div>${roster}`; }
  if(ph==='end'){ if(!rv) return `<div class="big center blink" style="padding:30px 0">🎭 정체 공개 대기</div>`;
    const rl=vs.rl||{}; return `<div class="winb ${vs.win==='mafia'?'m':'c'}">${vs.win==='mafia'?'🎭 마피아 승리':'🏘️ 시민 승리'}</div><div class="flipgrid" style="justify-content:center">${ord.map(p=>`<div class="fcard ${rl[p]==='mafia'?'m':''} ${ST[p]&&!ST[p].a?'dead':''}"><div class="em">${rl[p]?ROLES[rl[p]].e:''}</div>${numOf(p)} ${esc(nickOf(p))}</div>`).join('')}</div>`; }
  return '';
}
function scoreBoard(){
  const vs=vList(); const rows=Object.keys(SC).map(p=>Object.assign({p},SC[p])).filter(x=>x.pt>0||x.last).sort((a,b)=>b.pt-a.pt);
  let vt='';
  if(META.mode==='grade'){ const sums=vs.map(v=>rows.filter(r=>String(r.v)===String(v)).reduce((a,r)=>a+r.pt,0)); const mx=Math.max(1,...sums);
    vt=`<h3>🏫 반 대항 점수</h3>`+vs.map((v,i)=>`<div class="rowx"><div class="lab" style="color:${VCOL[i]}">${v}반</div><div class="bar"><i style="width:${sums[i]/mx*100}%;background:${VCOL[i]}"></i></div><b>${sums[i]}</b></div>`).join(''); }
  const top=rows.slice(0,8);
  const aw=(key,label,filter)=>{ const c=rows.filter(filter||(()=>true)).sort((a,b)=>(b[key]||0)-(a[key]||0))[0]; return c&&(c[key]||0)>0?`<span class="chip hl">${label} ${c.v&&META.mode==='grade'?c.v+'반 ':''}${c.n}번 ${esc(c.nm)}</span>`:''; };
  const awards=aw('dc','🤥 최고 사기꾼')+aw('ok','🕵️ 최고 탐정')+(rows.find(r=>!(r.ab>0)&&r.pt>0)?aw('pt','😇 양심상',r=>!(r.ab>0)):'');
  return `${vt}<h3>🏆 개인 순위</h3><table class="tbl">${top.map((r,i)=>`<tr><td>${i+1}</td><td>${META.mode==='grade'?r.v+'반 ':''}${r.n}번 ${esc(r.nm)}</td><td><b>${r.pt}</b>점</td><td class="muted small">+${r.last||0}</td></tr>`).join('')||'<tr><td class="muted">아직 점수가 없어요</td></tr>'}</table>${awards?`<div style="margin-top:8px">${awards}</div>`:''}`;
}
function teacherView(){
  if(MODE==='teacher' && !sessionStorage.getItem('mf_pin')) return `<div class="wrap" style="max-width:420px;padding-top:60px">${say('선생님 확인 번호를 입력해 주세요.')}<div class="card"><input id="pin" class="field" type="password" inputmode="numeric" placeholder="비밀번호"><button class="btn block" style="margin-top:12px" data-a="pin">확인</button></div></div>`;
  if(!ROOM || !META.phase){
    if(MODE==='board') return `<div class="wrap">${say('방 코드가 필요해요. 주소 끝에 ?mode=board&room=코드 를 붙여 주세요.')}</div>`;
    return `<div class="wrap" style="max-width:640px;padding-top:30px"><div class="center"><img src="${CHAR}" width="110" alt="꿈송이"><h2 style="margin-top:6px">곡선 마을의 양심</h2><div class="muted">마피아 · 가짜 소문 · 2차시 게임</div></div>
      <div class="card"><h3 style="margin-top:0">${ROOM?'이 방은 아직 없어요. 새로 만들까요?':'새 방 만들기'}</h3>
        <div class="grid g2" style="margin-top:8px"><button class="opt" data-a="mk" data-m="class">🏫 교실판<small>한 반 약 30명 · 마을 1개</small></button><button class="opt" data-a="mk" data-m="grade">🏟️ 학년판<small>3개 반 약 90명 · 체육관</small></button></div>
        <div class="muted small" style="margin-top:10px">${modeBadge()}</div></div></div>`;
  }
  const ph=phase(), n=nextFn(), vs=vList();
  const tb=`<div class="tbar"><h1><img src="${CHAR}" alt="">곡선 마을의 양심 <span class="pill">${META.g?`${META.g}판 · ${META.r}일차`:'대기'}</span></h1>
    <span class="pill">${PHN[ph]||ph}</span>${TIMED.includes(ph)&&META.revealed!==false?tmr():''}${modeBadge()}</div>`;
  let lobby='';
  if(ph==='lobby'){
    const s=secs();
    lobby=`<div class="card" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center"><div class="center"><div class="qr" id="qrbox"></div><div class="muted small">학생은 QR 또는 코드로 입장</div></div>
      <div style="flex:1;min-width:240px"><div class="muted">방 코드</div><div class="big" style="font-size:54px;letter-spacing:6px">${esc(ROOM)}</div><div class="muted small" style="word-break:break-all">${esc(joinUrl())}</div>
      <div class="muted small" style="margin-top:6px">전광판 주소: <b>board.html?room=${esc(ROOM)}</b></div>
      <div class="grid g4" style="margin-top:10px">${[['night','밤'],['talk','토론'],['vote','투표'],['def','변론']].map(([k,l])=>`<div><div class="muted small">${l}(초)</div><input class="field" type="number" min="10" max="900" value="${s[k]}" data-sec="${k}" style="padding:6px 8px"></div>`).join('')}</div></div></div>`;
  }
  const cols=`<div class="vcols v${vs.length}">${vs.map((v,i)=>`<div class="vcol" style="border-color:${META.mode==='grade'?VCOL[i]:'var(--line)'}"><div class="vh">${META.mode==='grade'?`<i style="background:${VCOL[i]}"></i>`:''}${esc(vName(v))} <span class="muted small" style="font-weight:500">${ph==='lobby'?orderV(v).length+'명 입장':Object.values(aliveOf(v)).filter(Boolean).length+'/'+orderV(v).length+'명 생존'}</span></div><div class="stage" id="stg${v}">${stageStatic(v)}</div></div>`).join('')}</div>`;
  const side=Object.keys(SC).length?`<div class="card" style="margin-top:12px">${scoreBoard()}</div>`:'';
  const fbs=(ph==='end'&&Object.keys(FB).length)?`<div class="card"><h3 style="margin-top:0">✍️ 학생 한 줄 소감 (${Object.keys(FB).length})</h3>${Object.values(FB).slice(-12).map(f=>`<div class="small">${f.v&&META.mode==='grade'?f.v+'반 ':''}${f.n}번 ${esc(f.nm)} · ${esc(f.t)}</div>`).join('')}</div>`:'';
  if(MODE==='board') return `<div class="twrap">${tb}${lobby}${cols}${side}</div>`;
  const ctl=`<div class="ctl"><button class="btn xl ${n.reveal?'sun':''}" id="nx" data-a="next" ${n.ok?'':'disabled'}>${n.t}</button>
    <div class="grow"></div>${TIMED.includes(ph)?`<button class="btn sm ghost" data-a="plus">+30초</button>`:''}
    <button class="btn sm ${META.auto?'mint':'ghost'}" data-a="auto">${META.auto?'⏩ 자동 진행 켬':'⏩ 자동 진행'}</button>
    <button class="btn sm ghost" data-a="roles">👁 역할 ${UI.showRoles?'숨기기':'보기'}</button>
    <button class="btn sm ghost" data-a="csv">⬇ 점수 CSV</button>
    <button class="btn sm ghost" data-a="reset">⟲ 처음으로</button></div>`;
  return `<div class="twrap">${tb}${lobby}${cols}${fbs}${side}${ctl}</div>`;
}
const TH = {
  async pin(){ if((document.getElementById('pin').value||'')===TEACHER_PIN){ sessionStorage.setItem('mf_pin','1'); lastHtml=''; R(); } else toast('비밀번호가 달라요'); },
  async mk(d){ await createRoom(d.m); },
  next(){ runNext(); },
  plus(){ plusTime(); },
  auto(){ toggleAuto(); },
  roles(){ UI.showRoles=!UI.showRoles; lastHtml=''; R(); },
  async reset(){ if(!confirm('진행 중인 판을 끝내고 모집 단계로 돌아갈까요?\n(점수는 유지됩니다)')) return; await nextGame(); },
  csv(){
    const rows=[['반','번호','별명','누적점수','마지막 판','사기성공','판별정답','방관']];
    Object.keys(SC).forEach(p=>{ const r=SC[p]; rows.push([r.v,r.n,r.nm,r.pt||0,r.last||0,r.dc||0,r.ok||0,r.ab||0]); });
    Object.keys(FB).forEach(p=>{ const f=FB[p]; rows.push(['소감',f.n,f.nm,f.t]); });
    const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`마피아_${ROOM}.csv`; a.click();
  }
};

function render(){
  if(MODE!=='student' && PLAYING) return;                // 연출 중에는 화면을 건드리지 않음
  if(HOLD.on) return;                                    // 카드를 누르고 있는 동안은 유지
  let html;
  if(MODE==='student') html=studentView(); else { document.body.classList.toggle('night', ['night'].includes(phase())); html=teacherView(); }
  const act=document.activeElement, keep=act&&act.tagName==='INPUT'&&$app.contains(act)?{id:act.id,v:act.value,s:act.selectionStart,sec:act.dataset.sec}:null;
  const sig=html+(MODE==='student'?'':'');
  if(sig===lastHtml) return;
  lastHtml=sig; $app.innerHTML=html;
  if(keep&&keep.id){ const e=document.getElementById(keep.id); if(e){ e.value=keep.v; e.focus(); try{ e.setSelectionRange(keep.s,keep.s); }catch(_){} } }
  if(MODE==='student'){ bindHold(); bindPeek(); }
  const qb=document.getElementById('qrbox'); if(qb&&window.QRCode){ qb.innerHTML=''; try{ new QRCode(qb,{text:joinUrl(),width:150,height:150}); }catch(e){} }
  $app.querySelectorAll('.tmr[data-end]').forEach(el=>{ const e=+el.dataset.end; if(e){ const s=Math.max(0,Math.ceil((e-nowS())/1000)); el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); } });
}
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return; ac();
  const H=(MODE==='student')?SH:TH; const fn=H[b.dataset.a]; if(fn) Promise.resolve(fn(b.dataset,b)).catch(err=>{ console.error(err); toast('⚠️ '+(err.message||err)); });

$app.addEventListener('change',e=>{
  const i=e.target.closest('[data-sec]'); if(!i||MODE!=='teacher') return;
  const k=i.dataset.sec, v=Math.max(10,Math.min(900,+i.value||DEF_SEC[k])); backend.set(`${BASE()}/meta/sec/${k}`,v);
});

})();
