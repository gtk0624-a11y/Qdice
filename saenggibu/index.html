<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도디쌤 생기부 도우미</title>
<style>
:root{--navy:#1f3a68;--navy2:#2d4f8a;--yel:#f9cf7a;--yel2:#fdeec9;--mint:#8fe3c0;--bg:#f4f6fa;--line:#d9dee8;--red:#d93025;--org:#e08a00;--grn:#1a8f55;--txt:#1c2533;--sub:#667085}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header img{width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:var(--yel)}
header h1{font-size:18px;margin:0;white-space:nowrap}
header .sp{flex:1}
#gsearch{padding:8px 12px;border-radius:20px;border:0;width:210px;font-size:15px}
#savest{font-size:12px;opacity:.85}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 8px;overflow-x:auto;position:sticky;top:60px;z-index:19}
nav button{border:0;background:none;padding:11px 14px;font-size:15px;cursor:pointer;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
nav button.on{color:var(--navy);font-weight:700;border-bottom-color:var(--yel)}
#banner{background:var(--yel2);border-bottom:1px solid var(--yel);padding:7px 14px;font-size:14px;display:none}
#banner b{color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.box h2{font-size:16px;margin:0 0 10px;color:var(--navy)}
.box h3{font-size:14px;margin:14px 0 6px;color:var(--navy)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
select,input[type=text],input[type=date],input[type=number],input[type=url],input[type=password],textarea{font-family:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--txt)}
textarea{width:100%;resize:vertical;line-height:1.6}
button.b{font-family:inherit;font-size:14px;padding:7px 12px;border-radius:7px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
button.b:hover{background:var(--navy2)}
button.b.g{background:#fff;color:var(--navy)}
button.b.g:hover{background:#eef2f9}
button.b.r{background:#fff;color:var(--red);border-color:var(--red)}
button.b.s{padding:4px 9px;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card.over{border-color:var(--red);box-shadow:0 0 0 2px #fbd5d2}
.card.done{border-left:5px solid var(--grn)}
.chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chead .ttl{font-weight:700;font-size:15px}
.chead .sp{flex:1}
.meter{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.meter.over{color:var(--red);font-weight:700}
.bar{height:5px;background:#e9edf3;border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--grn)}
.bar i.w{background:var(--org)}.bar i.o{background:var(--red)}
.msgs{font-size:13px;margin-top:5px}
.msgs div{padding:3px 0}
.m-fix{color:var(--grn)}.m-warn{color:var(--org)}.m-over{color:var(--red)}
.m-over span{background:#fde3e1;border-radius:3px;padding:0 2px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:#e8f6ee;color:var(--grn)}
.tag.c{background:#e6eefb;color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center}
th{background:#eef2f9;color:var(--navy);font-weight:600}
td.l,th.l{text-align:left}
td.click{cursor:pointer}td.click:hover{background:var(--yel2)}
.c-ok{background:#e8f6ee}.c-mid{background:#fff6dd}.c-bad{background:#fde3e1}
.hint{font-size:13px;color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.row label{font-size:14px}
.chips span{display:inline-block;background:#eef2f9;border-radius:12px;padding:2px 9px;margin:2px;font-size:13px}
.chips span b{cursor:pointer;color:var(--red);margin-left:5px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1c2533;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90%}
#toast.on{opacity:.95}
footer{text-align:center;color:var(--sub);font-size:12px;padding:18px}
.num{width:58px;text-align:center}
.wide{width:100%}
.pos{color:var(--grn);font-weight:700}.neg{color:var(--red);font-weight:700}
.nv{border:1px dashed var(--navy);border-radius:8px;padding:8px 10px;margin-top:8px;background:#f7f9fd;font-size:13px}
.nv .nvrow{margin:6px 0}.nv textarea{font-size:14px;margin-top:4px}
.pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.pick .lab{font-weight:700;color:var(--navy);width:48px;font-size:15px}
.pick button{font-family:inherit;font-size:15px;padding:9px 14px;border-radius:9px;border:2px solid var(--line);background:#fff;color:var(--txt);cursor:pointer}
.pick button:hover{border-color:var(--navy)}
.pick button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.pick button small{opacity:.75;margin-left:5px;font-weight:400}
.now{font-size:17px;font-weight:700;color:var(--navy);margin:4px 0 8px}
.steps{font-size:16px;line-height:1.9}
#dchip{background:var(--yel);color:var(--navy);font-weight:700;border-radius:14px;padding:3px 10px;font-size:13px;white-space:nowrap;display:none;cursor:pointer}
.dd{display:flex;gap:10px;flex-wrap:wrap}
.dd div{flex:1;min-width:150px;background:var(--yel2);border:1px solid var(--yel);border-radius:10px;padding:10px 12px}
.dd div.hot{background:#fde3e1;border-color:var(--red)}
.dd b{display:block;font-size:26px;color:var(--navy);line-height:1.2}.dd div.hot b{color:var(--red)}
.dd small{color:var(--sub)}
.cal{table-layout:fixed}.cal th{padding:4px}.cal td{height:78px;vertical-align:top;text-align:left;padding:3px 4px;cursor:pointer;font-size:12px;overflow:hidden}
.cal td:hover{background:var(--yel2)}.cal td.out{background:#f6f7f9;cursor:default}
.cal td.today{box-shadow:inset 0 0 0 2px var(--navy)}
.cal .dn{font-weight:700;font-size:13px}.cal .sun{color:var(--red)}.cal .sat{color:var(--navy2)}
.cal .ev{display:block;background:var(--navy);color:#fff;border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.fin{background:#9aa5b5;text-decoration:line-through}
.cal .hol{display:block;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .clb{display:block;color:var(--grn)}
@media(max-width:640px){#gsearch{width:100%}nav{top:104px}header h1{font-size:16px}}
</style>
</head>

// 바이트 계산: 한글 등 비ASCII 3바이트, 영문·숫자·공백 1바이트, 엔터는 설정값(1 또는 2)
function byteLen(s, enterBytes){
  let n=0;
  for(const ch of String(s).replace(/\r\n?/g,'\n')){
    if(ch==='\n'){ n+=enterBytes; continue; }
    const c=ch.codePointAt(0);
    n += c<0x80 ? 1 : (c<0x10000 ? 3 : 4);
  }
  return n;
}
// 한도를 넘기 시작하는 글자 위치(넘지 않으면 -1)
function cutIndex(s, limit, enterBytes){
  let n=0,i=0;
  for(const ch of String(s).replace(/\r\n?/g,'\n')){
    const c=ch.codePointAt(0);
    n += ch==='\n' ? enterBytes : (c<0x80?1:(c<0x10000?3:4));
    if(n>limit) return i;
    i+=ch.length;
  }
  return -1;
}
// 기계적 교정: 공백·기호 정리(항상 자동)
function mechFix(src){
  let t=String(src), notes=[];
  const step=(name,fn)=>{ const b=t; t=fn(t); if(b!==t && !notes.includes(name)) notes.push(name); };
  step('줄바꿈 정리', x=>x.replace(/\r\n?/g,'\n'));
  step('보이지 않는 문자 제거', x=>x.replace(/[​-‍﻿]/g,'').replace(/[ 　\t]/g,' '));
  step('전각 문자→반각', x=>x.replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)));
  step('둥근 따옴표→곧은 따옴표', x=>x.replace(/[“”]/g,'"').replace(/[‘’]/g,"'"));
  step('연속 공백', x=>x.replace(/ {2,}/g,' '));
  step('문장부호 앞 공백', x=>x.replace(/ +([,.!?)\]])/g,'$1').replace(/([(\[]) +/g,'$1'));
  step('마침표 중복', x=>x.replace(/(^|[^.])\.\.(?!\.)/g,'$1.').replace(/,{2,}/g,','));
  step('문장부호 뒤 띄어쓰기', x=>x.replace(/([,.!?])(?=[가-힣])/g,'$1 '));
  step('줄 끝 공백', x=>x.replace(/ +\n/g,'\n').replace(/\n +/g,'\n').replace(/\n{2,}/g,'\n'));
  step('앞뒤 공백', x=>x.trim());
  return {text:t, notes};
}

function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function spellFix(src, custom){
  let t=String(src); const changes=[];
  const rules=SPELL_RULES.slice();
  (custom||[]).forEach(r=>{ if(r && r.from) rules.push([new RegExp(escRe(r.from),'g'), String(r.to||'').replace(/\$/g,'$$$$')]); });
  for(const [re,to] of rules){
    const one=new RegExp(re.source, re.flags.replace('g',''));
    t=t.replace(re, m=>{ const r=m.replace(one,to); if(r!==m) changes.push({from:m.trim(),to:r.trim()}); return r; });
  }
  return {text:t, changes};
}
// 기재요령 점검(경고만, 자동 수정 안 함)
const LINT_RULES=[

function lint(text, ctx){
  const out=[]; const t=String(text||''); if(!t.trim()) return out;
  for(const [re,msg] of LINT_RULES){ const m=t.match(re); if(m) out.push(msg+' — "'+m[0]+'"'); }

  (ctx&&ctx.names||[]).forEach(n=>{ if(n && n.length>=2 && t.includes(n)) out.push('다른 학생 이름이 들어 있음(내용 뒤바뀜 확인) — "'+n+'"'); });

function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function toDate(s){ const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m? new Date(+m[1],+m[2]-1,+m[3]) : null; }
function validYMD(y,m,d){ const x=new Date(y,m-1,d); return x.getFullYear()===y && x.getMonth()===m-1 && x.getDate()===d; }
function dayRange(a,b){ const out=[]; let x=toDate(a), e=toDate(b); if(!x||!e||x>e) return out; let g=0; while(x<=e && g++<800){ out.push(ymd(x)); x=new Date(x.getFullYear(),x.getMonth(),x.getDate()+1); } return out; }
// 글자에서 날짜 뽑기. year=학년도(3~12월은 그 해, 1~2월은 다음 해)
function extractDates(str, year){
  const s=String(str); const found=[];
  const re=/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*(?:일|\.)?(?!\d)|(?<![\d.\-\/])(\d{1,2})\s*(?:[.\/]|월)\s*(\d{1,2})\s*(?:일|\.)?(?![\d])/g;
  let m;
  while((m=re.exec(s))){
    const mo=+(m[2]||m[4]), d=+(m[3]||m[5]); const y=m[1]? +m[1] : (mo<=2? year+1 : year);
    if(mo<1||mo>12||!validYMD(y,mo,d)) continue;
    found.push({date:y+'-'+pad(mo)+'-'+pad(d), s:m.index, e:m.index+m[0].length});
  }
  if(!found.length) return {dates:[], rest:s.trim()};
  let dates=found.map(f=>f.date);
  if(found.length===2 && /[~∼～\-–—]/.test(s.slice(found[0].e, found[1].s)) && found[0].date<found[1].date){
    dates=dayRange(found[0].date, found[1].date);
  }
  let rest=s; for(let i=found.length-1;i>=0;i--) rest=rest.slice(0,found[i].s)+' '+rest.slice(found[i].e);
  rest=rest.replace(/\([월화수목금토일]\)/g,' ').replace(/[~∼～–—]/g,' ').replace(/\s+/g,' ').trim();
  return {dates, rest};
}
// 수업일 계산: 주말·휴업일 제외, 요일별 일수(월~금)
function countSchoolDays(start, end, holidays){
  const hs=new Set(holidays||[]); const by=[0,0,0,0,0]; let total=0;
  for(const d of dayRange(start,end)){
    const w=toDate(d).getDay(); if(w===0||w===6||hs.has(d)) continue;
    by[w-1]++; total++;
  }
  return {total, by};
}
function classifyEvent(txt){
  if(/(방학식|개학|입학식|졸업식|종업식)/.test(txt)) return /동아리/.test(txt)?'club':'no';
  if(/(방학|휴업|공휴|대체|재량|개교기념|연휴|설날|추석|어린이날|현충일|광복절|개천절|한글날|성탄|삼일절|3\.1절|선거|석가탄신|부처님)/.test(txt)) return 'hol';
  if(/동아리/.test(txt)) return 'club';
  return 'no';
}
// 글줄 목록 → 날짜·내용 목록. "3월" 머리글 아래 "2(월) 입학식"처럼 일(요일)만 적힌 줄도 읽음(요일이 실제와 맞을 때만)
function linesToEvents(lines, year){
  const out=[]; let cm=0;
  for(const raw of lines){
    const line=String(raw).replace(/\s+/g,' ').trim(); if(!line) continue;
    const r=extractDates(line,year);
    if(r.dates.length){ r.dates.forEach(d=>out.push({date:d,text:r.rest})); cm=+r.dates[r.dates.length-1].slice(5,7); continue; }
    const mh=line.match(/(?<!\d)(\d{1,2})\s*월(?!\s*\d)/);
    if(mh && +mh[1]>=1 && +mh[1]<=12) cm=+mh[1];
    if(!cm) continue;
    const re=/(?<!\d)(\d{1,2})\s*일?\s*\(\s*([월화수목금토일])\s*\)/g; const hits=[]; let m;
    while((m=re.exec(line))) hits.push({d:+m[1],w:m[2],s:m.index,e:m.index+m[0].length});
    hits.forEach((h,i)=>{ const y=cm<=2? year+1 : year; if(!validYMD(y,cm,h.d)) return;
      const ds=y+'-'+pad(cm)+'-'+pad(h.d); if('일월화수목금토'[toDate(ds).getDay()]!==h.w) return;
      out.push({date:ds,text:line.slice(h.e, i+1<hits.length? hits[i+1].s : line.length).replace(/[~∼～–—]/g,' ').trim()}); });
  }
  return out;
}
// PDF 글자 조각 → 글줄(같은 높이끼리 묶어 왼쪽부터 이어 붙임)
function itemsToLines(items){
  const rows=[];
  items.forEach(it=>{ if(!it.s||!String(it.s).trim()) return; let r=rows.find(r=>Math.abs(r.y-it.y)<4); if(!r){ r={y:it.y,items:[]}; rows.push(r); } r.items.push(it); });
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>{ r.items.sort((a,b)=>a.x-b.x); let t='', end=null;
    r.items.forEach(it=>{ if(end!==null && it.x-end > Math.max(1.5,(it.h||10)*0.25)) t+=' '; t+=it.s; end=it.x+(it.w||0); }); return t; });
}
// 독서기록(구글 폼 응답 표) → 학생별 "도서명(저자)" 목록
function cleanBook(v){ return String(v==null?'':v).replace(/[『』「」《》〈〉<>"“”'‘’\[\]]/g,'').replace(/\s+/g,' ').trim(); }
function parseReadingRows(rows){
  if(!rows||rows.length<2) return {ok:false,msg:'내용이 없는 파일입니다.'};
  const head=rows[0].map(x=>String(x==null?'':x).replace(/\s+/g,''));
  const find=re=>head.findIndex(h=>re.test(h));
  const ci={hak:find(/학번/), g:find(/학년/), c:head.findIndex(h=>/^반|학급/.test(h)), n:find(/번호/), name:find(/이름|성명/)};
  const tcols=[], acols=[];
  head.forEach((h,j)=>{ if(/저자|지은이|글쓴이|작가/.test(h)) acols.push(j); else if(/도서|책|제목/.test(h)) tcols.push(j); });
  if(!tcols.length) return {ok:false,msg:'책 제목 칸을 찾지 못했습니다. 질문 이름에 "책 제목"이나 "도서명"이 들어가야 합니다.'};
  if(ci.hak<0 && (ci.g<0||ci.c<0||ci.n<0)) return {ok:false,msg:'학년·반·번호 칸(또는 학번 칸)을 찾지 못했습니다.'};
  const num=v=>{ const m=String(v==null?'':v).match(/\d+/); return m? parseInt(m[0],10) : 0; };
  const out=[]; let bad=0;
  rows.slice(1).forEach(r=>{ let g,c,n;
    if(ci.g>=0&&ci.c>=0&&ci.n>=0){ g=num(r[ci.g]); c=num(r[ci.c]); n=num(r[ci.n]); }
    else { const d=String(r[ci.hak]==null?'':r[ci.hak]).replace(/\D/g,''); if(d.length===5){ g=+d[0]; c=+d.slice(1,3); n=+d.slice(3); } else if(d.length===4){ g=+d[0]; c=+d[1]; n=+d.slice(2); } }
    const books=[]; tcols.forEach((tj,i)=>{ const t=cleanBook(r[tj]); if(!t) return; const a=acols[i]!==undefined? cleanBook(r[acols[i]]).replace(/[()]/g,'') : ''; books.push(a? t+'('+a+')' : t); });
    if(!books.length) return;
    if(!(g>0&&c>0&&n>0)){ bad++; return; }
    out.push({g,c,n,name:ci.name>=0? String(r[ci.name]==null?'':r[ci.name]).replace(/\s+/g,'').trim() : '', books}); });
  return {ok:true, entries:out, bad};
}
// 네이버 맞춤법 검사기용: 문장 단위로 max자 이하 조각 나누기(이어 붙이면 원문과 같음)
function splitChunks(text, max){
  const parts=String(text).match(/[^.!?\n]*[.!?\n]+\s*|[^.!?\n]+$/g)||[];
  const out=[]; let cur='';
  const push=()=>{ if(cur) out.push(cur); cur=''; };
  for(let p of parts){
    while(p.length>max){ push(); out.push(p.slice(0,max)); p=p.slice(max); }
    if((cur+p).length>max) push();
    cur+=p;
  }
  push(); return out;
}

function autoFix(card){
  const {sidv,ik,ta}=cardCtx(card); const key=sidv+'|'+ik;
  if(noFix.has(key)) return false;
  const t0=ta.value; if(!t0) return false;
  const r1=mechFix(t0);
  const r2=S.settings.autoSpell? spellFix(r1.text,S.rules) : {text:r1.text,changes:[]};
  if(r2.text===t0) return false;
  undoMap.set(key,t0);
  const pos=ta.selectionStart; ta.value=r2.text;
  if(document.activeElement===ta){ try{ ta.selectionStart=ta.selectionEnd=Math.min(pos,r2.text.length); }catch(e){} }
  const r=rec(sidv,ik); r.text=r2.text; r.updated=Date.now(); r.copied=0;
  const parts=[]; if(r1.notes.length) parts.push(esc(r1.notes.join(', ')));
  const seen=new Set(); r2.changes.forEach(c=>{ const k=c.from+'→'+c.to; if(!seen.has(k)){ seen.add(k); parts.push(esc(c.from)+' → <b>'+esc(c.to)+'</b>'); } });
  refreshCard(card, '✔ 자동 교정: '+parts.join(' / ')+' <button class="b g s" data-act="undo">되돌리기</button>');
  save(); return true;
}

// 네이버 맞춤법 검사기 연결(300자 제한 → 자동으로 나눠 줌)
const NV_MAX=300, NV_URL='https://search.naver.com/search.naver?query='+encodeURIComponent('맞춤법 검사기');
function toggleNaver(card){
  const box=$('.nv',card); if(!box.hidden){ box.hidden=true; box.innerHTML=''; return; }
  autoFix(card);
  const {ta}=cardCtx(card); const t=ta.value; if(!t.trim()){ toast('검사할 내용이 없습니다.'); return; }
  const chunks=splitChunks(t,NV_MAX); card._nv=chunks;
  let h='<b>네이버 맞춤법 검사기로 한 번 더 검사하기</b> <span class="hint">네이버는 한 번에 '+NV_MAX+'자까지만 검사합니다.'+(chunks.length>1?' 글을 '+chunks.length+'조각으로 나눴습니다.':'')+'</span>';
  chunks.forEach((c,i)=>{ h+='<div class="nvrow"><button class="b s" data-act="nvcopy" data-i="'+i+'">'+(chunks.length>1?(i+1)+'번 조각 ':'')+'복사하고 네이버 열기 ('+c.length+'자)</button>'
    +'<textarea class="nvin" data-i="'+i+'" rows="2" placeholder="네이버에서 교정된 결과를 복사해 여기에 붙여넣으세요 (비워 두면 원래 글 그대로)"></textarea></div>'; });
  h+='<div class="hint">순서: ① 버튼 누르기 → ② 열린 네이버 창 입력칸에 Ctrl+V → 검사하기 → 고친 뒤 "복사" → ③ 위 칸에 Ctrl+V → ④ 적용. 학생 이름이 글에 들어 있으면 네이버로 그대로 넘어가니 주의하세요.</div>'
    +'<div class="row"><button class="b s" data-act="nvapply">교정본 적용</button><button class="b g s" data-act="nv">닫기</button></div>';
  box.innerHTML=h; box.hidden=false;
}
async function naverCopy(card,i){
  const c=(card._nv||[])[i]; if(c==null) return;
  const ok=await copyText(c.trim());
  const win=window.open(NV_URL,'naverSpell');
  toast(ok? (win? '복사했습니다. 네이버 창 입력칸에 Ctrl+V 하세요.' : '복사했습니다. 팝업이 막혀 있으니 네이버에서 "맞춤법 검사기"를 검색해 주세요.') : '복사에 실패했습니다.');
}
function naverApply(card){
  const {sidv,ik,ta}=cardCtx(card); const chunks=card._nv||[]; if(!chunks.length) return;
  let used=0;
  const out=chunks.map((c,i)=>{ const v=$('.nvin[data-i="'+i+'"]',card).value.trim(); if(!v) return c; used++; const tail=(c.match(/\s+$/)||[''])[0]; return v+(tail||(i<chunks.length-1?' ':'')); }).join('');
  if(!used){ toast('붙여넣은 교정 결과가 없습니다.'); return; }
  undoMap.set(sidv+'|'+ik, ta.value);
  ta.value=out; const r=rec(sidv,ik); r.text=out; r.updated=Date.now(); r.copied=0; noFix.delete(sidv+'|'+ik);
  const box=$('.nv',card); box.hidden=true; box.innerHTML='';
  if(!autoFix(card)) refreshCard(card,'✔ 네이버 교정본을 적용했습니다. <button class="b g s" data-act="undo">되돌리기</button>');
  save(); toast('교정본을 적용했습니다.');
}

function writeHeadHTML(){
  const cl=classes(), it=itemBy(UI.item); const mine=S.students.filter(s=>clsOf(s)===UI.cls); const all=mine.length;
  const written=countWritten(mine,it.key), need=needOf(all,it), ra=ratioOf(it);
  let done=0, over=0; mine.forEach(s=>{ const r=peek(sid(s),it.key); if(r.done) done++; if(B(r.text)>it.limit) over++; });
  const g=UI.cls.split('-')[0]; const gl=S.students.filter(s=>String(s.g)===g); const gw=countWritten(gl,it.key), gn=needOf(gl.length,it);
  let h='<div class="pick"><span class="lab">학급</span>'+cl.map(c=>{ const st=S.students.filter(s=>clsOf(s)===c); const ok=st.length && countWritten(st,it.key)>=needOf(st.length,it); return '<button data-cls="'+esc(c)+'" class="'+(c===UI.cls?'on':'')+'">'+esc(clsName(c))+(ok?'<small>✔완료</small>':'')+'</button>'; }).join('')+'</div>'
    +'<div class="pick"><span class="lab">영역</span>'+S.items.map(i=>{ const w=countWritten(mine,i.key), ok=all && w>=needOf(all,i); return '<button data-itemk="'+esc(i.key)+'" class="'+(i.key===UI.item?'on':'')+'">'+esc(i.name)+'<small>'+(ok?'✔완료 ':'')+w+'/'+all+'</small></button>'; }).join('')+'</div>';
  h+='<div class="now">'+esc(clsName(UI.cls))+' · '+esc(it.name)+' <span class="hint" style="font-weight:400">한도 '+it.limit.toLocaleString()+'B(한글 약 '+Math.floor(it.limit/3)+'자)'+(over?' · <b style="color:var(--red)">초과 '+over+'</b>':'')+'</span></div>';
  let msg, cls2;
  if(ra<100){
    if(written>need){ msg='✔ 입력 대상 '+ra+'%를 넘었습니다 — '+written+'/'+all+'명('+pct(written,all)+'%), 목표 '+need+'명보다 '+(written-need)+'명 많음'; cls2='c-mid'; }
    else if(written===need && all){ msg='✔ 완료 — 입력 대상 '+ra+'%('+need+'명)를 딱 채웠습니다 ('+written+'/'+all+'명)'; cls2='c-ok'; }
    else { msg='입력 대상 '+ra+'% = '+need+'명 · 지금 '+written+'명('+pct(written,all)+'%) · '+(need-written)+'명 더 쓰면 완료'; cls2=''; }
    msg+=' ｜ '+g+'학년 전체 '+gw+'/'+gl.length+'명('+pct(gw,gl.length)+'%), 목표 '+gn+'명'+(gw>gn?' → 넘음':(gw===gn?' → 채움':''));
  } else {
    if(all && written>=all){ msg='✔ 완료 — '+all+'명 모두 입력했습니다'; cls2='c-ok'; }
    else { const miss=mine.filter(s=>!peek(sid(s),it.key).text.trim()); msg='작성 '+written+'/'+all+'명 · 빠진 학생 '+miss.length+'명: '+miss.slice(0,12).map(s=>s.n+'번 '+s.name).join(', ')+(miss.length>12?' …':''); cls2=''; }
  }
  h+='<div class="'+cls2+'" style="border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-weight:600;margin-bottom:8px">'+esc(msg)+'</div>';
  h+='<div class="tb"><select id="selFilter">'+[['all','전체 학생 보기'],['empty','미작성만'],['over','초과만'],['undone','미완료만'],['uncopied','나이스 미복사만']].map(f=>'<option value="'+f[0]+'"'+(UI.filter===f[0]?' selected':'')+'>'+f[1]+'</option>').join('')+'</select>'
    +'<span class="hint">아래 학생별 칸에 쓰거나 붙여넣으세요. 칸을 벗어나면 띄어쓰기·맞춤법이 자동으로 고쳐집니다. 영역 추가·삭제와 입력 대상 %는 설정·백업 탭에서 고칩니다.</span></div>';
  return h;
}

// ───────── 7. 화면: 점검·현황 ─────────
function stats(){
  const rows=[];
  classes().forEach(c=>{ const st=S.students.filter(s=>clsOf(s)===c);
    S.items.forEach(it=>{ let w=0,d=0,o=0; st.forEach(s=>{ const r=peek(sid(s),it.key); if(r.text.trim()) w++; if(r.done) d++; if(B(r.text)>it.limit) o++; });
      rows.push({cls:c,item:it.name,key:it.key,mine:it.mine!==false,total:st.length,written:w,done:d,over:o,need:needOf(st.length,it),ratio:ratioOf(it)}); }); });
  return rows;
}
function problems(){
  const out=[];
  S.items.forEach(it=>{ const seen=new Map();
    S.students.forEach(s=>{ const r=peek(sid(s),it.key); const t=r.text.trim(); if(!t) return;
      const who=clsOf(s)+' '+s.n+'번 '+s.name;
      if(B(t)>it.limit) out.push({s,it,msg:'한도 초과 '+(B(t)-it.limit)+'B',who});
      const ws=lint(t,{banned:S.banned,names:otherNames(sid(s))}); if(ws.length) out.push({s,it,msg:ws.join(' / '),who});
      if(seen.has(t)) out.push({s,it,msg:'다른 학생과 내용이 완전히 같음 ↔ '+seen.get(t),who}); else seen.set(t,who);
    }); });
  return out;
}

    +'<span class="hint">'+(S.settings.sheetUrl? ('보내는 것: 교사 이름·학급·항목·숫자뿐입니다. 학생 이름과 생기부 내용은 보내지 않습니다.'+(S.settings.lastSent? ' 마지막 전송 '+new Date(S.settings.lastSent).toLocaleString('ko-KR'):'')) : '설정·백업 탭에서 현황판 주소를 먼저 넣어 주세요.')+'</span></div></div>';
  let mh='', mc=0;
  cl.forEach(c=>{ const st=S.students.filter(s=>clsOf(s)===c);
    S.items.forEach(it=>{ if(it.mine===false) return; const miss=st.filter(s=>!peek(sid(s),it.key).text.trim()); const w=st.length-miss.length, need=needOf(st.length,it), ra=ratioOf(it);
      if(ra<100){ if(w<need){ mc+=need-w; mh+='<tr><td>'+esc(c)+'</td><td>'+esc(it.name)+'</td><td class="l click" data-jump="'+esc(c)+'|'+esc(it.key)+'"><b class="neg">'+(need-w)+'명 더 필요</b> (목표 '+ra+'% = '+need+'명, 지금 '+w+'명)</td></tr>'; } }
      else if(miss.length){ mc+=miss.length; mh+='<tr><td>'+esc(c)+'</td><td>'+esc(it.name)+'</td><td class="l">'+miss.map(s=>'<span class="click" style="display:inline-block;padding:1px 6px;margin:1px;border:1px solid var(--line);border-radius:10px;cursor:pointer" data-miss="'+esc(sid(s))+'|'+esc(it.key)+'">'+esc(s.n+'번 '+s.name)+'</span>').join('')+'</td></tr>'; } }); });
  h+='<div class="box"><h2>빠진 입력 — '+mc+'건</h2>'+(mc? '<div style="max-height:420px;overflow:auto"><table><tr><th>학급</th><th>영역</th><th class="l">아직 안 쓴 학생 (이름을 누르면 그 학생 입력 화면으로)</th></tr>'+mh+'</table></div><div class="hint">내가 쓰지 않는 영역이 나오면 설정·백업 탭에서 그 영역의 "내 담당" 체크를 끄세요.</div>' : '<div class="hint">내 담당 영역에 빠진 입력이 없습니다.</div>')+'</div>';
  const ps=problems();
  h+='<div class="box"><h2>일괄 점검 — 확인할 곳 '+ps.length+'건</h2>';
  if(!ps.length) h+='<div class="hint">문제가 발견되지 않았습니다.</div>';
  else h+='<table><tr><th>학생</th><th>항목</th><th class="l">내용</th></tr>'+ps.slice(0,300).map(p=>'<tr><td class="click" data-jumps="'+esc(sid(p.s))+'">'+esc(p.who)+'</td><td>'+esc(p.it.name)+'</td><td class="l">'+esc(p.msg)+'</td></tr>').join('')+'</table>'+(ps.length>300?'<div class="hint">300건까지만 표시했습니다.</div>':'');
  h+='</div>';
  $('#main').innerHTML=h;
}
function queueSend(){ if(!S.settings.autoSend||!S.settings.sheetUrl||!S.settings.teacher) return; clearTimeout(sendTimer); sendTimer=setTimeout(()=>sendStats(true),120000); }
async function sendStats(silent){
  const st=S.settings;
  if(!st.sheetUrl||!st.teacher){ if(!silent) toast('설정·백업 탭에서 교사 이름과 현황판 주소를 먼저 넣어 주세요.'); return; }
  if(!/^https:\/\/script\.google\.com\//.test(st.sheetUrl)){ if(!silent) toast('현황판 주소는 https://script.google.com/ 으로 시작해야 합니다.'); return; }
  const rows=stats().filter(r=>r.mine && r.total>0).map(r=>({cls:r.cls,item:r.item,total:r.total,written:r.written,done:r.done,over:r.over}));
  try{
    await fetch(st.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:st.sheetKey,teacher:st.teacher,rows})});
    st.lastSent=Date.now(); DB.set('state',S).catch(()=>{});
    if(!silent){ toast('현황을 보냈습니다. 시트에서 반영됐는지 확인해 주세요.'); if(UI.tab==='check') renderCheck(); }
  }catch(e){ if(!silent) toast('전송하지 못했습니다. 인터넷 연결과 주소를 확인해 주세요.'); }
}

// ───────── 8. 화면: 일정 ─────────
function dday(date){ const t=toDate(date); if(!t) return null; const n=new Date(); const today=new Date(n.getFullYear(),n.getMonth(),n.getDate()); return Math.round((t-today)/86400000); }
function ddayText(n){ return n===0?'오늘':(n>0?'D-'+n:'D+'+(-n)+' 지남'); }
function renderBanner(){

function parseLines(text){ const out=[]; String(text).split(/\n/).forEach(line=>{ if(!line.trim()) return; const r=extractDates(line,S.settings.year); r.dates.forEach(d=>out.push({date:d,text:r.rest})); }); return out; }
let pdfP=null;
function needPDF(){ if(window.pdfjsLib) return Promise.resolve();
  if(!pdfP) pdfP=loadScript(['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'])
    .then(()=>{ const src=(document.querySelector('script[src*="pdf.min.js"]')||{}).src||''; window.pdfjsLib.GlobalWorkerOptions.workerSrc=src.replace('pdf.min.js','pdf.worker.min.js'); })
    .catch(e=>{ pdfP=null; toast('PDF 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); throw e; });
  return pdfP; }
async function pdfLines(buf){
  await needPDF();
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise; let lines=[], chars=0;
  for(let p=1;p<=pdf.numPages && p<=60;p++){ const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const items=tc.items.map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width,h:it.height})); items.forEach(it=>{ chars+=(it.s||'').trim().length; });
    lines=lines.concat(itemsToLines(items)); }
  return {lines,chars,pages:pdf.numPages};
}
async function scanFile(file){
  const found=[], seen=new Set();
  const add=(d,txt)=>{ txt=String(txt||'').replace(/\s+/g,' ').trim().slice(0,80); const k=d+'|'+txt; if(seen.has(k)) return; seen.add(k); found.push({date:d,text:txt,kind:classifyEvent(txt),hours:+((txt.match(/(\d+)\s*(?:시간|차시)/)||[])[1])||1}); };
  const isPdf=/\.pdf$/i.test(file.name||'') || file.type==='application/pdf';
  if(isPdf){
    const r=await pdfLines(await readFile(file));
    if(!r.chars){ toast('이 PDF에는 글자가 없습니다(스캔한 그림 PDF). 아래 직접 입력칸을 이용해 주세요.'); return; }
    linesToEvents(r.lines,S.settings.year).forEach(e=>add(e.date,e.text));
  } else {
    await needXLSX();
    const wb=XLSX.read(await readFile(file),{type:'array',cellDates:true});
    wb.SheetNames.forEach(name=>{ const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''}); const loose=[];
      rows.forEach(row=>{ const texts=[], dates=[];
        row.forEach(cell=>{ if(Object.prototype.toString.call(cell)==='[object Date]' && !isNaN(cell)){ dates.push(ymd(new Date(cell.getTime()+3*3600000))); }
          else if(typeof cell==='string' && cell.trim()){ const r=extractDates(cell,S.settings.year); if(r.dates.length){ dates.push.apply(dates,r.dates); if(r.rest) texts.push(r.rest); } else texts.push(cell.trim()); }
          else if(typeof cell==='number') texts.push(String(cell)); });
        if(dates.length){ const txt=texts.filter(t=>!/^\d+$/.test(t)).join(' '); dates.forEach(d=>add(d,txt)); loose.push(dates[dates.length-1].slice(5,7)*1+'월'); }
        else loose.push(texts.join(' ')); });
      linesToEvents(loose,S.settings.year).forEach(e=>add(e.date,e.text)); });
  }
  found.sort((a,b)=>a.date.localeCompare(b.date));
  UI.detected=found.slice(0,600);
  toast(found.length? '날짜 '+found.length+'개를 찾았습니다. 아래 표에서 분류를 확인해 주세요.'+(isPdf?' (PDF는 빠진 날짜가 있을 수 있습니다. 엑셀이 더 정확합니다.)':'') : '날짜를 찾지 못했습니다. 아래 직접 입력칸을 이용해 주세요.');
  renderSisu();
}

function addRoster(rows){
  let add=0, upd=0, bad=0;
  rows.forEach(r=>{ const c=r.map(x=>String(x==null?'':x).trim()).filter(x=>x!==''); if(c.length<4){ if(c.length) bad++; return; }
    const g=parseInt(c[0],10), cl=parseInt(c[1],10), n=parseInt(c[2],10), name=c[3]; if(!(g>0&&cl>0&&n>0)||!name||name.length>20){ bad++; return; }
    const ex=S.students.find(s=>s.g===g&&s.c===cl&&s.n===n); if(ex){ if(ex.name!==name){ ex.name=name; upd++; } } else { S.students.push({g,c:cl,n,name}); add++; } });
  sortStudents(); save(); toast('추가 '+add+'명, 이름 변경 '+upd+'명'+(bad?', 읽지 못한 줄 '+bad+'개(제목 줄 포함)':''));
}

    a.push(base.concat(S.items.map(i=>peek(sid(s),i.key).text)));

async function importXlsx(file){
  await needXLSX();
  const wb=XLSX.read(await readFile(file),{type:'array'});
  const ws=wb.Sheets['생기부']||wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
  if(rows.length<2){ toast('내용이 없는 파일입니다.'); return; }
  const head=rows[0].map(x=>String(x).trim());
  const ci={g:head.indexOf('학년'),c:head.indexOf('반'),n:head.indexOf('번호'),name:head.indexOf('이름')};
  if(ci.name<0) ci.name=head.indexOf('성명');
  if(ci.g<0||ci.c<0||ci.n<0||ci.name<0){ toast('첫 줄에 학년·반·번호·이름 제목이 있어야 합니다.'); return; }
  const limits={}; if(wb.Sheets['항목한도']) XLSX.utils.sheet_to_json(wb.Sheets['항목한도'],{header:1,defval:''}).slice(1).forEach(r=>{ if(r[0]&&+r[1]>0) limits[String(r[0]).trim()]=+r[1]; });
  const doneRows={}; if(wb.Sheets['완료여부']){ const dr=XLSX.utils.sheet_to_json(wb.Sheets['완료여부'],{header:1,defval:''}); const dh=(dr[0]||[]).map(x=>String(x).trim()); dr.slice(1).forEach(r=>{ const k=parseInt(r[0],10)+'-'+parseInt(r[1],10)+'-'+parseInt(r[2],10); doneRows[k]={}; dh.forEach((nm,j)=>{ if(j>3&&String(r[j]).trim()==='완료') doneRows[k][nm]=true; }); }); }
  const cols=[]; head.forEach((nm,j)=>{ if(!nm||[ci.g,ci.c,ci.n,ci.name].includes(j)) return;
    let it=S.items.find(i=>i.name===nm); if(!it){ it={key:'i'+Date.now().toString(36)+j,name:nm,limit:limits[nm]||1500,mine:true}; S.items.push(it); }
    cols.push({j,it}); });
  let filled=0, conflict=0;
  const plan=[];
  rows.slice(1).forEach(r=>{ const g=parseInt(r[ci.g],10), c=parseInt(r[ci.c],10), n=parseInt(r[ci.n],10), name=String(r[ci.name]||'').trim(); if(!(g>0&&c>0&&n>0)||!name) return;
    plan.push({g,c,n,name,r}); const k=g+'-'+c+'-'+n; cols.forEach(o=>{ const t=String(r[o.j]||''); if(!t.trim()) return; const cur=peek(k,o.it.key).text; if(cur.trim()&&cur!==t) conflict++; }); });
  if(conflict && !confirm('이미 써 둔 내용과 다른 칸이 '+conflict+'개 있습니다.\n[확인] 파일 내용으로 덮어쓰기\n[취소] 불러오기 중단')){ return; }
  plan.forEach(p=>{ let s=S.students.find(x=>x.g===p.g&&x.c===p.c&&x.n===p.n); if(!s){ s={g:p.g,c:p.c,n:p.n,name:p.name}; S.students.push(s); } else s.name=p.name;
    const k=sid(s); cols.forEach(o=>{ const t=String(p.r[o.j]||''); if(!t.trim()) return; const rr=rec(k,o.it.key); if(rr.text!==t){ rr.text=t; rr.updated=Date.now(); rr.copied=0; } if(doneRows[k]&&doneRows[k][o.it.name]) rr.done=true; filled++; }); });
  sortStudents(); save(); toast('불러왔습니다. 학생 '+plan.length+'명, 내용 '+filled+'칸'); render();
}

// 독서기록 불러오기(학생이 구글 폼으로 입력한 응답 파일)
async function planReading(file){
  await needXLSX();
  const buf=await readFile(file); let wb;
  if(/\.csv$/i.test(file.name||'')) wb=XLSX.read(new TextDecoder('utf-8').decode(buf).replace(/^﻿/,''),{type:'string',raw:true});
  else wb=XLSX.read(buf,{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
  const r=parseReadingRows(rows); if(!r.ok){ toast(r.msg); return; }
  let it=S.items.find(i=>/^독서/.test(i.name));
  const per=new Map(), issues=[];
  r.entries.forEach(e=>{ const k=e.g+'-'+e.c+'-'+e.n; const s=S.students.find(x=>sid(x)===k);
    if(!s){ issues.push(k+' '+e.name+' — 명단에 없는 학년·반·번호 (넣지 않음): '+e.books.join(', ')); return; }
    if(e.name && e.name!==s.name.replace(/\s+/g,'')) issues.push(k+' — 폼에 적은 이름 "'+e.name+'" ≠ 명단 "'+s.name+'" (번호를 잘못 적었을 수 있음, 일단 넣음): '+e.books.join(', '));
    if(!per.has(k)) per.set(k,[]); const cur=it? peek(k,it.key).text : '';
    e.books.forEach(b=>{ if(!per.get(k).includes(b) && !cur.includes(b)) per.get(k).push(b); }); });
  let cnt=0; per.forEach(v=>cnt+=v.length);
  UI.readPlan={per:Array.from(per.entries()).filter(e=>e[1].length), issues, bad:r.bad, cnt};
  renderSet(); const el=$('#readBox'); if(el) el.scrollIntoView&&el.scrollIntoView({block:'center'});
}
function applyReading(){
  const P=UI.readPlan; if(!P) return;
  let it=S.items.find(i=>/^독서/.test(i.name));
  if(!it){ it={key:'read'+Date.now().toString(36),name:'독서활동상황',limit:1500,mine:true}; S.items.push(it); }
  P.per.forEach(([k,books])=>{ const r=rec(k,it.key); const cur=r.text.trim().replace(/[,\s]+$/,''); r.text=(cur? cur+', ' : '')+books.join(', '); r.updated=Date.now(); r.copied=0; });
  const n=P.cnt, st=P.per.length; UI.readPlan=null; save();
  toast('학생 '+st+'명에게 책 '+n+'권을 넣었습니다. 영역별 입력 탭에서 "'+it.name+'" 항목을 확인하세요.'); UI.item=it.key; renderSet();
}

  if(t.dataset.it!==undefined){ const it=S.items[+t.dataset.it], f=t.dataset.f; if(!it) return; if(f==='name'){ if(t.value.trim()) it.name=t.value.trim(); } else if(f==='limit'){ if(+t.value>0) it.limit=Math.floor(+t.value); } else if(f==='ratio'){ const v=Math.round(+t.value); if(v>=1&&v<=100) it.ratio=v; } else it.mine=t.checked; save(); keep(renderSet); return; }
  if(t.id==='stEnter'){ st.enterBytes=+t.value; save(); return; }
  if(t.id==='stNL'){ st.stripNL=t.checked; save(); return; }
  if(t.id==='stSpell'){ st.autoSpell=t.checked; save(); return; }
  if(t.id==='stTeacher'){ st.teacher=t.value.trim(); save(); return; }
  if(t.id==='stYear'){ if(+t.value>2000) st.year=+t.value; save(); return; }
  if(t.id==='stUrl'){ st.sheetUrl=t.value.trim(); save(); return; }
  if(t.id==='stKey'){ st.sheetKey=t.value.trim(); save(); return; }
  if(t.id==='stView'){ const v=t.value.trim(); st.sheetView=/^https:\/\//.test(v)? v : ''; save(); return; }
  if(t.id==='stAuto'){ st.autoSend=t.checked; save(); return; }
  if(t.id==='readFile' && t.files[0]){ planReading(t.files[0]).catch(()=>toast('독서기록 파일을 읽지 못했습니다. 엑셀(.xlsx)이나 CSV 파일인지 확인해 주세요.')); return; }
  if(t.id==='xlsIn' && t.files[0]){ importXlsx(t.files[0]).catch(()=>toast('엑셀 파일을 읽지 못했습니다.')); return; }
  if(t.id==='rosterFile' && t.files[0]){ needXLSX().then(()=>readFile(t.files[0])).then(buf=>{ const wb=XLSX.read(buf,{type:'array'}); addRoster(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})); renderSet(); }).catch(()=>toast('명단 파일을 읽지 못했습니다.')); return; }
  if(t.id==='jsonIn' && t.files[0]){ t.files[0].text().then(txt=>{ const d=JSON.parse(txt); if(!d||!Array.isArray(d.students)||!d.records||!Array.isArray(d.items)) throw 0; if(!confirm('지금 자료를 모두 지우고 이 파일 내용으로 바꿉니다. 계속할까요?')) return; S=Object.assign(freshState(),d); S.settings=Object.assign(freshState().settings,d.settings||{}); S.sisu=Object.assign(freshState().sisu,d.sisu||{}); save(); toast('불러왔습니다.'); render(); }).catch(()=>toast('이 프로그램의 백업 파일이 아닙니다.')); return; }
  if(t.id==='ruleIn' && t.files[0]){ t.files[0].text().then(txt=>{ const d=JSON.parse(txt); if(!d||!Array.isArray(d.items)) throw 0;
      d.items.forEach(n=>{ if(!n||!n.name||!(+n.limit>0)) return; const it=S.items.find(i=>i.name===n.name); if(it) it.limit=Math.floor(+n.limit); else S.items.push({key:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:String(n.name),limit:Math.floor(+n.limit),mine:true}); });
      if(Array.isArray(d.rules)) S.rules=d.rules.filter(r=>r&&r.from).map(r=>({from:String(r.from),to:String(r.to||'')}));
      if(Array.isArray(d.banned)) S.banned=d.banned.map(String).filter(Boolean);
      if(d.enterBytes===1||d.enterBytes===2) S.settings.enterBytes=d.enterBytes;
      save(); toast('규칙 파일을 등록했습니다.'); renderSet(); }).catch(()=>toast('규칙 파일 형식이 아닙니다.')); return; }
});
M.addEventListener('click',async e=>{
  const t=e.target, Z=S.sisu;
  const g=t.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const card=t.closest('.card');
  if(card && t.dataset.act==='copy'){ onCopy(card); return; }
  if(card && t.dataset.act==='nv'){ toggleNaver(card); return; }
  if(card && t.dataset.act==='nvcopy'){ naverCopy(card,+t.dataset.i); return; }
  if(card && t.dataset.act==='nvapply'){ naverApply(card); return; }
  if(card && t.dataset.act==='undo'){ const c=cardCtx(card), k=c.sidv+'|'+c.ik; if(undoMap.has(k)){ c.ta.value=undoMap.get(k); const r=rec(c.sidv,c.ik); r.text=c.ta.value; r.updated=Date.now(); undoMap.delete(k); noFix.add(k); save(); refreshCard(card,''); toast('되돌렸습니다. 이 칸은 다시 고칠 때까지 자동 교정을 하지 않습니다.'); } return; }
  if(t.dataset.pick){ UI.sid=t.dataset.pick; renderSearch(); return; }
  const pc=t.closest('[data-cls]'); if(pc){ UI.cls=pc.dataset.cls; renderWrite(); return; }
  const pi=t.closest('[data-itemk]'); if(pi){ UI.item=pi.dataset.itemk; renderWrite(); return; }
  if(t.dataset.goit){ const c=$('.card[data-ik="'+t.dataset.goit+'"]'); if(c){ c.scrollIntoView({block:'center',behavior:'smooth'}); const ta=$('.ta',c); ta.focus(); } return; }
  if(t.id==='copyAll'){ const s=S.students.find(x=>sid(x)===UI.sid); if(!s) return; const txt=S.items.map(it=>'['+it.name+']\n'+peek(UI.sid,it.key).text).join('\n\n'); toast(await copyText(txt)? '전 항목을 복사했습니다.' : '복사에 실패했습니다.'); return; }
  const ms=t.closest('[data-miss]'); if(ms){ const p=ms.dataset.miss.split('|'); const st=S.students.find(x=>sid(x)===p[0]); if(st){ UI.cls=clsOf(st); UI.item=p[1]; UI.filter='empty'; go('write'); } return; }
  const j=t.closest('[data-jump]'); if(j){ const p=j.dataset.jump.split('|'); UI.cls=p[0]; UI.item=p[1]; UI.filter='all'; go('write'); return; }
  const js=t.closest('[data-jumps]'); if(js){ const s=S.students.find(x=>sid(x)===js.dataset.jumps); if(s){ UI.q=s.name; UI.sid=sid(s); $('#gsearch').value=s.name; go('search'); } return; }
  if(t.id==='sendNow'){ sendStats(false); return; }
  if(t.dataset.cal!==undefined){ const k=+t.dataset.cal; const n=new Date(); let y=+UI.cal.slice(0,4), m=+UI.cal.slice(5,7); if(k===0){ y=n.getFullYear(); m=n.getMonth()+1; } else { m+=k; if(m<1){m=12;y--;} if(m>12){m=1;y++;} } UI.cal=y+'-'+pad(m); renderSched(); return; }
  const dc=t.closest('td[data-day]'); if(dc){ UI.selDate=dc.dataset.day; const di=$('#scDate'); if(di){ di.value=UI.selDate; $('#scTitle').focus(); toast(UI.selDate+' 을(를) 골랐습니다. 일정 이름을 적고 등록을 누르세요.'); } return; }
  if(t.id==='scAdd'){ const ti=$('#scTitle').value.trim(), d=$('#scDate').value; if(!ti||!d){ toast('일정 이름과 날짜를 넣어 주세요.'); return; } S.schedules.push({id:'s'+Date.now().toString(36),title:ti,date:d,note:$('#scNote').value.trim(),fin:false}); UI.selDate=''; UI.cal=d.slice(0,7); save(); render(); return; }
  if(t.dataset.scdel){ S.schedules=S.schedules.filter(o=>o.id!==t.dataset.scdel); save(); render(); return; }
  if(t.id==='scNoti'){ if(!('Notification' in window)){ toast('이 브라우저는 알림을 지원하지 않습니다.'); return; } const p=await Notification.requestPermission(); toast(p==='granted'?'알림을 켰습니다.':'알림이 차단되어 있습니다. 브라우저 주소창 옆 자물쇠에서 허용해 주세요.'); notifyDue(); renderSched(); return; }
  if(t.id==='scIcs'){ exportIcs(); return; }
  if(t.id==='detApply'){ let h=0,c=0; UI.detected.forEach(d=>{ if(d.kind==='hol'){ if(!Z.holidays.some(x=>x.date===d.date)){ Z.holidays.push({date:d.date,name:d.text.slice(0,20)}); h++; } } else if(d.kind==='club'){ if(!Z.club.some(x=>x.date===d.date)){ Z.club.push({date:d.date,hours:+d.hours||1}); c++; } } }); UI.detected=[]; save(); toast('휴업일 '+h+'일, 동아리 '+c+'회를 반영했습니다.'); renderSisu(); return; }
  if(t.id==='detClear'){ UI.detected=[]; renderSisu(); return; }
  if(t.id==='holAdd'){ const ls=parseLines($('#holText').value); let n=0; ls.forEach(o=>{ if(!Z.holidays.some(x=>x.date===o.date)){ Z.holidays.push({date:o.date,name:o.text.slice(0,20)}); n++; } }); save(); toast(n? '휴업일 '+n+'일을 추가했습니다.' : '날짜를 읽지 못했습니다. 예) 5.5 어린이날'); renderSisu(); return; }
  if(t.id==='holClear'){ if(confirm('휴업일을 모두 지울까요?')){ Z.holidays=[]; save(); renderSisu(); } return; }
  if(t.dataset.holdel){ Z.holidays=Z.holidays.filter(x=>x.date!==t.dataset.holdel); save(); renderSisu(); return; }
  if(t.id==='zrAdd'){ Z.rows.push({name:'',w:[0,0,0,0,0],target:'',adj:0}); save(); renderSisu(); return; }
  if(t.dataset.zrdel!==undefined){ Z.rows.splice(+t.dataset.zrdel,1); save(); renderSisu(); return; }
  if(t.id==='clubAdd'){ let n=0; String($('#clubText').value).split(/\n/).forEach(line=>{ const r=extractDates(line,S.settings.year); const hrs=parseFloat((r.rest.match(/\d+(?:\.\d+)?/)||[])[0])||1; r.dates.forEach(d=>{ if(!Z.club.some(x=>x.date===d)){ Z.club.push({date:d,hours:hrs}); n++; } }); }); save(); toast(n? '동아리 '+n+'회를 추가했습니다.' : '날짜를 읽지 못했습니다. 예) 3.13 2'); renderSisu(); return; }
  if(t.dataset.clubdel){ Z.club=Z.club.filter(x=>x.date!==t.dataset.clubdel); save(); renderSisu(); return; }
  if(t.id==='readApply'){ applyReading(); return; }
  if(t.id==='readCancel'){ UI.readPlan=null; renderSet(); return; }
  if(t.id==='xlsOut'){ exportXlsx().catch(()=>{}); return; }
  if(t.id==='jsonOut'){ download('생기부도우미_전체백업_'+stamp()+'.json', new Blob([JSON.stringify(S)],{type:'application/json'})); S.settings.lastBackup=Date.now(); flush(); return; }
  if(t.id==='rosterAdd'){ addRoster(String($('#roster').value).split(/\n/).map(l=>l.split(/[\t,]+|\s{1,}/))); render(); return; }
  if(t.dataset.studel){ const k=t.dataset.studel; const has=S.items.some(it=>peek(k,it.key).text.trim()); if(has && !confirm('이 학생에게 써 둔 내용이 있습니다. 명단에서 지우면 내용도 함께 지워집니다. 지울까요?')) return; S.students=S.students.filter(s=>sid(s)!==k); Object.keys(S.records).forEach(rk=>{ if(rk.indexOf(k+'|')===0) delete S.records[rk]; }); save(); renderSet(); return; }
  if(t.id==='itAdd'){ const nm=prompt('항목 이름을 적어 주세요. 예) 세특: 역사'); if(!nm||!nm.trim()) return; if(S.items.some(i=>i.name===nm.trim())){ toast('같은 이름의 항목이 이미 있습니다.'); return; } S.items.push({key:'i'+Date.now().toString(36),name:nm.trim(),limit:1500,mine:true}); save(); renderSet(); return; }
  if(t.dataset.itdel!==undefined){ const it=S.items[+t.dataset.itdel]; if(!it) return; const n=Object.keys(S.records).filter(k=>k.endsWith('|'+it.key)&&S.records[k].text.trim()).length; if(!confirm('"'+it.name+'" 항목을 지웁니다.'+(n? ' 써 둔 내용 '+n+'건도 함께 지워집니다.':'')+' 계속할까요?')) return; Object.keys(S.records).forEach(k=>{ if(k.endsWith('|'+it.key)) delete S.records[k]; }); S.items.splice(+t.dataset.itdel,1); save(); renderSet(); return; }
  if(t.id==='ruleOut'){ download('기재요령규칙_'+S.settings.year+'.json', new Blob([JSON.stringify({year:S.settings.year,enterBytes:S.settings.enterBytes,items:S.items.map(i=>({name:i.name,limit:i.limit})),rules:S.rules,banned:S.banned},null,2)],{type:'application/json'})); return; }
  if(t.id==='ruleAdd'){ const f=$('#ruleFrom').value.trim(), to=$('#ruleTo').value.trim(); if(!f||f===to){ toast('틀린 표현과 고칠 표현을 넣어 주세요.'); return; } S.rules.push({from:f,to}); save(); renderSet(); return; }
  if(t.dataset.ruledel!==undefined){ S.rules.splice(+t.dataset.ruledel,1); save(); renderSet(); return; }
  if(t.id==='banAdd'){ const w=$('#banWord').value.trim(); if(!w) return; if(!S.banned.includes(w)) S.banned.push(w); save(); renderSet(); return; }
  if(t.dataset.bandel!==undefined){ S.banned.splice(+t.dataset.bandel,1); save(); renderSet(); return; }
  if(t.id==='wipe'){ if(confirm('이 컴퓨터에 저장된 학생 명단·생기부 내용·일정이 모두 지워집니다. 백업을 받으셨습니까?') && confirm('정말 지웁니다. 되돌릴 수 없습니다.')){ S=freshState(); await flush(); toast('모두 지웠습니다.'); go('write'); } return; }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flush(); });
window.addEventListener('beforeunload',()=>{ flush(); });

// ───────── 12. 시작 ─────────
(async function init(){
  await DB.open();
  const d=await DB.get('state');
  if(d && Array.isArray(d.students) && d.records){ const f=freshState(); S=Object.assign(f,d); S.settings=Object.assign(freshState().settings,d.settings||{}); S.sisu=Object.assign(freshState().sisu,d.sisu||{}); }
  $('#savest').textContent='자료 불러옴'+backupNote();
  render(); notifyDue(); setInterval(()=>{ renderBanner(); notifyDue(); },3600000);
})();
