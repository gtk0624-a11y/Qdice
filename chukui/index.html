<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>축의금 접수 장부</title>
<style>
:root{--bg:#fff8f2;--card:#fff;--ink:#3a3340;--sub:#8a8190;--pri:#ee7c9f;--pri2:#fde3ec;--mint:#4fb59a;--mint2:#dff4ee;--warn:#d9822b;--warn2:#fff1de;--bad:#d64c5b;--line:#f0e4dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;line-height:1.45}
body{padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:10px 16px calc(10px);display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header .ttl{font-weight:800;font-size:16px;line-height:1.2}
header .ttl small{display:block;font-weight:500;opacity:.9;font-size:12px}
header .sum{text-align:right;line-height:1.2}
header .sum span{font-size:13px;opacity:.95}
header .sum b{display:block;font-size:22px;letter-spacing:-.5px}
main{max-width:560px;margin:0 auto;padding:14px 14px 20px}
section[hidden]{display:none}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(120,80,60,.08)}
.lb{display:block;font-weight:700;margin:12px 0 6px;font-size:15px}
.lb small{font-weight:500;color:var(--sub)}
.in{width:100%;font-size:20px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;font-family:inherit}
.in:focus{border-color:var(--pri)}
.in.amt{font-size:28px;font-weight:800;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{flex:1 0 20%;min-height:46px;border:2px solid var(--pri2);background:var(--pri2);color:#b5456b;font-weight:800;font-size:17px;border-radius:12px;font-family:inherit}
.chip:active{transform:scale(.96)}
.chip.b{background:var(--mint2);border-color:var(--mint2);color:#1f6e5a}
.chip{flex:1 0 18%}
.big{margin-top:10px;padding:12px;border-radius:12px;background:var(--mint2);color:#1f6e5a;text-align:center;min-height:68px;display:flex;flex-direction:column;justify-content:center}
.big .k{font-size:26px;font-weight:900;line-height:1.2}
.big .n{font-size:15px;opacity:.85}
.big.empty{background:#f6f1ee;color:var(--sub)}
.big.warnbox{background:var(--warn2);color:var(--warn)}
.segs{display:flex;flex-wrap:wrap;gap:8px}
.seg{flex:1 0 auto}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:11px 12px;border:2px solid var(--line);border-radius:12px;font-weight:700;min-width:64px;background:#fff}
.seg input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}
.step{display:flex;align-items:center;gap:10px}
.step button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:26px;font-weight:800;color:var(--ink)}
.step input{width:84px;text-align:center;font-size:24px;font-weight:800;padding:10px;border:2px solid var(--line);border-radius:12px;font-family:inherit}
.warn{margin-top:6px;padding:9px 12px;border-radius:10px;background:var(--warn2);color:var(--warn);font-size:15px;font-weight:600}
.go{width:100%;margin-top:16px;padding:18px;border:0;border-radius:16px;background:var(--mint);color:#fff;font-size:21px;font-weight:900;font-family:inherit;box-shadow:0 3px 0 #3d9a82}
.go:active{transform:translateY(2px);box-shadow:none}
.btn{display:inline-block;padding:11px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:16px;font-family:inherit;color:var(--ink)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.bad{color:var(--bad);border-color:#f3c5ca}
.btn.full{width:100%;margin-top:8px}
.last{border:3px solid var(--mint);background:#f3fbf8}
.last .no{font-size:15px;color:var(--sub)}
.last .env{font-size:44px;font-weight:900;color:var(--mint);letter-spacing:1px;line-height:1.1}
.last .who{font-size:20px;font-weight:800;margin-top:4px}
.last .amt{font-size:22px;font-weight:900;color:#1f6e5a}
.row{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.del{opacity:.45;text-decoration:line-through}
.row .no{min-width:58px;font-weight:900;color:var(--pri);font-size:15px}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:800;font-size:18px}
.row .mt{font-size:13px;color:var(--sub)}
.row .am{font-weight:900;font-size:18px;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--pri2);color:#b5456b;vertical-align:middle}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 4px rgba(120,80,60,.08)}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right}
th{font-size:13px;color:var(--sub);font-weight:700}
h3{margin:4px 0 8px;font-size:17px}
.ok{color:var(--mint);font-weight:800}.ng{color:var(--bad);font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 4px 10px;border:0;background:none;font-size:13px;font-weight:700;color:var(--sub);font-family:inherit}
nav button i{display:block;font-style:normal;font-size:22px;line-height:1.2}
nav button.on{color:var(--pri)}
#modal{position:fixed;inset:0;background:rgba(40,30,40,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
#mbox{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 28px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#3a3340;color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;z-index:60;font-size:15px;max-width:90%;text-align:center}
#toast[hidden]{display:none}
.note{font-size:14px;color:var(--sub)}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tools .in{font-size:17px;padding:10px 12px;flex:1;min-width:140px}
select.in{flex:0 0 auto;min-width:0;width:auto}
.banner{background:var(--warn2);color:var(--warn);padding:12px;border-radius:12px;font-weight:700;margin-bottom:12px}
#printArea{display:none}
#land{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto}
#land[hidden]{display:none}
#newVer{position:fixed;top:62px;left:8px;right:8px;z-index:75;background:#fff1de;color:#b3641a;padding:10px 12px;border-radius:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;justify-content:space-between;align-items:center;gap:8px}
#newVer[hidden]{display:none}
#rep{position:fixed;inset:0;z-index:70;background:#f4efeb;overflow:auto;-webkit-overflow-scrolling:touch}
#rep[hidden]{display:none}
.repbar{position:sticky;top:0;z-index:2;background:#fff;display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.repbar b{margin-right:auto;font-size:17px}
.repbar .btn{padding:9px 11px;font-size:15px}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff;padding:0;font-size:11pt}
 header,main,nav,#modal,#toast{display:none!important}
 #printArea{display:block;color:#000}
 .rep h2{margin:0 0 4px;font-size:18pt}
 .rep .sub{font-size:10.5pt;margin-bottom:8px}
 .rep h3{margin:12px 0 4px;font-size:12pt;color:#000}
 .rep table{width:100%;border-collapse:collapse;font-size:10.5pt}
 .rep td,.rep th{border:1px solid #777;padding:4px 6px;text-align:left;color:#000;font-size:10.5pt}
 .rep th{background:#eee}
 .rep td.r,.rep th.r{text-align:right}
 .rep thead{display:table-header-group}
 .rep tfoot{display:table-row-group}
 .rep tr{page-break-inside:avoid}
 .rep .sum th{width:17%}
 .sign{display:flex;gap:30px;margin-top:18px;page-break-inside:avoid}
 .sign div{flex:1;border-bottom:1px solid #000;padding-bottom:22px}
}
</style>
</head>
<body>
<header>
  <div class="ttl" id="ttl">축의금 접수 장부<small id="ttlSub"></small></div>
  <div class="sum"><span id="sCnt">0건</span><b id="sTot">0원</b></div>
</header>
<main>
  <section id="tab-in"></section>
  <section id="tab-list" hidden></section>
  <section id="tab-calc" hidden></section>
  <section id="tab-set" hidden></section>
</main>
<nav>
  <button data-tab="in" class="on"><i>✍️</i>접수</button>
  <button data-tab="list"><i>📒</i>명부</button>
  <button data-tab="calc"><i>🧮</i>정산</button>
  <button data-tab="set"><i>⚙️</i>설정·저장</button>
</nav>
<div id="modal" hidden><div id="mbox"></div></div>
<div id="land" hidden></div>
<div id="newVer" hidden></div>
<div id="rep" hidden></div>
<div id="toast" hidden></div>
<div id="printArea"></div>

<script>
/* ====== 기본 도구 ====== */
const APP_V=11;
const isKakao=/KAKAOTALK/i.test(navigator.userAgent||'');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n)||0).toLocaleString('ko-KR')+'원';
const pad=n=>String(n).padStart(3,'0');
const hm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const RELS=['친척','지인','친구','직장','기타'];
const METHODS=['현금','수표','송금'];
const DIG='영일이삼사오육칠팔구';
function spell4(n){const u=['','십','백','천'];const ds=String(n).padStart(4,'0');let s='';
  for(let i=0;i<4;i++){const d=+ds[i];if(!d)continue;const p=3-i;s+=(d===1&&p>0?'':DIG[d])+u[p];}return s;}
function krw(w){if(!w||w<=0)return'';const man=Math.floor(w/10000),r=w%10000;let s='';
  if(man)s+=(man===1?'일':spell4(man))+'만';
  if(r)s+=(s?' ':'')+spell4(r);return s+' 원';}
function parseAmt(str){const v=parseFloat(String(str||'').replace(/[,\s원]/g,''));if(!v||v<=0||isNaN(v))return{won:0,unit:''};
  if(v>=1000)return{won:Math.round(v),unit:'원'};return{won:Math.round(v*10000),unit:'만원'};}

/* ====== 저장 ====== */
const LS='chukui_ledger_v1';
let mem=null;
function fresh(){return{v:1,set:{groom:'',bride:'',date:'',venue:'',seat:'A',meals:1,who:'',big:100},entries:[],cash:{50000:0,10000:0,5000:0,1000:0,etc:0},last:{rel:'친척',method:'현금'},since:0}}
const LS2='chukui_ledger_copy',LST='chukui_trash';
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('chukui',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej();}catch(e){rej();}});}
function idbPut(s){idbOpen().then(db=>{db.transaction('k','readwrite').objectStore('k').put(s,'S');}).catch(()=>{});}
function idbGet(){return idbOpen().then(db=>new Promise(res=>{const q=db.transaction('k').objectStore('k').get('S');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);})).catch(()=>null);}
function adopt(o){return Object.assign(fresh(),o,{set:Object.assign(fresh().set,o.set||{}),cash:Object.assign(fresh().cash,o.cash||{})});}
function load(){try{const r=localStorage.getItem(LS)||localStorage.getItem(LS2);if(r){const o=JSON.parse(r);return Object.assign(fresh(),o,{set:Object.assign(fresh().set,o.set||{}),cash:Object.assign(fresh().cash,o.cash||{})});}}catch(e){}return fresh();}
let S=load();
function save(){const s=JSON.stringify(S);try{localStorage.setItem(LS,s);localStorage.setItem(LS2,s);}catch(e){mem=S;}idbPut(s);}
async function tryRestore(){if(S.entries.length)return;let c=null;try{c=localStorage.getItem(LS2);}catch(e){}
  let cand=null;for(const raw of [c,await idbGet()]){if(!raw)continue;try{const o=JSON.parse(raw);if(o&&o.entries&&o.entries.length){cand=o;break;}}catch(e){}}
  if(!cand)return;
  const n=cand.entries.filter(e=>!e.del);
  if(await ask('이전 접수 내역을 찾았습니다',`<b>${n.length}건 · ${fmt(sum(n))}</b><br>이전에 접수한 내역이 폰 안에 남아 있습니다.<br>복구할까요?`,'복구하기','복구 안 함')){S=adopt(cand);save();refreshAll();toast('복구했습니다');}}
let undoStack=[];
function snap(){undoStack.push(JSON.stringify({entries:S.entries,since:S.since}));if(undoStack.length>40)undoStack.shift();}
function undo(){const s=undoStack.pop();if(!s){toast('되돌릴 작업이 없습니다');return false;}const o=JSON.parse(s);S.entries=o.entries;S.since=o.since;save();lastId=null;refreshAll();toast('되돌렸습니다');return true;}

/* ====== 계산 ====== */
const act=()=>S.entries.filter(e=>!e.del);
const bigWon=()=>Math.round((S.set.big||100)*10000);
const isBig=e=>!e.del&&e.won>=bigWon();
const sum=a=>a.reduce((t,e)=>t+e.won,0);
const noStr=e=>e.seat+'-'+pad(e.no);
function nextNo(){const m=S.entries.filter(e=>e.seat===S.set.seat).reduce((t,e)=>Math.max(t,e.no),0);return m+1;}
function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function missing(){const by={};S.entries.forEach(e=>{(by[e.seat]=by[e.seat]||new Set()).add(e.no)});const out=[];
  for(const s in by){const mx=Math.max(...by[s]);for(let i=1;i<=mx;i++)if(!by[s].has(i))out.push(s+'-'+pad(i));}return out;}
function dupNos(){const seen={},d=[];act().forEach(e=>{const k=noStr(e);if(seen[k])d.push(k);seen[k]=1;});return d;}

/* ====== 화면 공통 ====== */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}
function showModal(html){$('#mbox').innerHTML=html;$('#modal').hidden=false;}
function closeModal(){$('#modal').hidden=true;$('#mbox').innerHTML='';}
function ask(title,msg,ok,cancel){return new Promise(res=>{
  showModal(`<h3>${esc(title)}</h3><div style="font-size:19px;margin:8px 0 16px;line-height:1.5">${msg}</div>
  <button class="go" id="aOk" style="margin-top:0">${esc(ok||'확인')}</button>
  <button class="btn full" id="aNo">${esc(cancel||'다시 확인')}</button>`);
  $('#aOk').onclick=()=>{closeModal();res(true)};$('#aNo').onclick=()=>{closeModal();res(false)};});}
function topbar(){const a=act();$('#sCnt').textContent=a.length+'건 접수';$('#sTot').textContent=fmt(sum(a));
  const s=S.set;const nm=[s.groom,s.bride].filter(Boolean).join(' ♥ ');$('#ttlSub').textContent=(nm?nm+' · ':'')+'접수자 '+s.seat+' · v'+APP_V;}

/* ====== 입력 폼 ====== */
function won2in(w){return String(w/10000);}
function fh(p,e){e=e||{};
  const rel=e.rel||S.last.rel,met=e.method||S.last.method,meals=e.meals!=null?e.meals:S.set.meals;
  return `<label class="lb">이름</label>
  <input id="${p}name" data-p="${p}" data-k="name" class="in" autocomplete="off" placeholder="봉투에 적힌 이름" value="${esc(e.name||'')}">
  <div id="${p}dup" class="warn" hidden></div>
  <label class="lb">금액 <small>만원 단위로 쓰세요 (10 = 10만원, 3.5 = 3만5천원)</small></label>
  <input id="${p}amt" data-p="${p}" data-k="amt" class="in amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${e.won?won2in(e.won):''}">
  <div class="chips">${[1,2,3,5,10,20,30,50,100].map(n=>`<button type="button" class="chip" data-chip="${n}" data-p="${p}">${n}만</button>`).join('')}</div>
  <div id="${p}big" class="big empty">금액을 누르면 한글로 크게 보여드립니다</div>
  <label class="lb">관계</label>
  <div class="segs">${RELS.map(r=>`<label class="seg"><input type="radio" name="${p}rel" value="${r}" ${r===rel?'checked':''}><span>${r}</span></label>`).join('')}</div>
  <label class="lb">받은 방식</label>
  <div class="segs">${METHODS.map(r=>`<label class="seg"><input type="radio" name="${p}met" value="${r}" ${r===met?'checked':''}><span>${r==='현금'?'💵 현금':r==='수표'?'🧾 수표':'📱 송금'}</span></label>`).join('')}</div>
  <label class="lb">식권 (장)</label>
  <div class="step"><button type="button" data-step="-1" data-p="${p}">−</button><input id="${p}meals" inputmode="numeric" value="${meals}"><button type="button" data-step="1" data-p="${p}">＋</button></div>
  <label class="lb">메모 <small>(선택: 소속, 동행 인원 등)</small></label>
  <input id="${p}memo" class="in" style="font-size:17px" autocomplete="off" value="${esc(e.memo||'')}">`;}
function readF(p){const g=k=>document.getElementById(p+k);const r=n=>(document.querySelector(`input[name="${p}${n}"]:checked`)||{}).value;
  const a=parseAmt(g('amt').value);
  return{name:g('name').value.trim(),won:a.won,rel:r('rel')||'기타',method:r('met')||'현금',meals:Math.max(0,parseInt(g('meals').value)||0),memo:g('memo').value.trim()};}
let editingId=null;
function updBig(p){const a=parseAmt(document.getElementById(p+'amt').value);const b=document.getElementById(p+'big');
  if(!a.won){b.className='big empty';b.textContent='금액을 누르면 한글로 크게 보여드립니다';return;}
  const over=a.won>99990000;
  b.className='big'+((a.won<10000||a.won>=500000)?' warnbox':'');
  b.innerHTML=`<div class="k">${over?'금액이 너무 큽니다':krw(a.won)}</div><div class="n">${a.won.toLocaleString('ko-KR')}원 · ${a.unit==='원'?'원 단위로 읽음':'만원 단위로 읽음'}</div>`;}
function updDup(p){const nm=document.getElementById(p+'name').value.trim();const d=document.getElementById(p+'dup');
  if(!nm){d.hidden=true;return;}
  const f=act().filter(e=>e.name===nm&&e.id!==editingId);
  if(!f.length){d.hidden=true;return;}
  d.hidden=false;d.innerHTML='⚠️ 같은 이름이 이미 있습니다: '+f.map(e=>`${noStr(e)} (${krw(e.won)})`).map(esc).join(', ')+'<br>동명이인이 아니라면 중복 접수일 수 있습니다.';}

/* ====== 접수 탭 ====== */
let lastId=null;
function bkHTML(){return S.entries.length?`<div class="${S.since>=5?'banner':'card'}" style="display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 12px"><span>${S.since>=5?'📌':'💾'} 백업 안 한 접수 <b>${S.since}건</b>${S.since>=5?' · 지금 백업하세요':''}</span><button class="btn pri" data-act="backup" style="padding:9px 12px;white-space:nowrap">📋 백업</button></div>`:'';}
function recentHTML(){const recent=[...S.entries].filter(e=>!e.del).sort((a,b)=>b.ts-a.ts).slice(0,5);
  if(!recent.length)return'';

function confirmBig(f){return new Promise(res=>{

  $('#bigOk').onclick=()=>{if(parseAmt($('#bigRe').value).won===f.won){closeModal();res(true);}else{const m=$('#bigMsg');m.hidden=false;m.textContent='처음 입력한 금액과 다릅니다. 봉투를 다시 확인해 주세요.';}};

async function checkAmount(f){
  if(f.won>99990000){toast('금액이 너무 큽니다. 다시 확인해 주세요');return false;}
  if(f.won>=bigWon())return confirmBig(f);
  const med=median(act().map(e=>e.won));
  let reason='';
  if(f.won<10000)reason='금액이 1만 원보다 적습니다.';
  else if(f.won>=500000)reason='금액이 50만 원 이상입니다.';
  else if(act().length>=5&&f.won>=med*5&&f.won>=100000)reason='평소 금액보다 훨씬 큽니다. 0을 하나 더 쓴 건 아닌지 확인해 주세요.';
  if(!reason)return true;
  return ask('금액 확인',`<b>${esc(f.name)}</b> 님<br><span style="font-size:30px;font-weight:900;color:var(--pri)">${krw(f.won)}</span><br>${fmt(f.won)}<br><span style="font-size:15px;color:var(--sub)">${reason}</span>`,'맞습니다, 저장','다시 확인');}
async function submitMain(){

  if(!(await checkAmount(f)))return;
  snap();
  const e={id:uid(),seat:S.set.seat,no:nextNo(),name:f.name,won:f.won,rel:f.rel,method:f.method,meals:f.meals,memo:f.memo,ts:Date.now(),upd:Date.now(),del:false};
  S.entries.push(e);S.last={rel:f.rel,method:f.method};S.since++;save();lastId=e.id;
  topbar();renderIn();window.scrollTo({top:0,behavior:'smooth'});

  const keys=(order||Object.keys(m)).filter(k=>m[k]);
  return keys.map(k=>`<tr><td>${esc(k)}</td><td class="r">${m[k].n}건</td><td class="r"><b>${fmt(m[k].w)}</b></td></tr>`).join('')||'<tr><td colspan="3" class="note">내역 없음</td></tr>';}
function cashTotal(){const c=S.cash;return 50000*(c[50000]||0)+10000*(c[10000]||0)+5000*(c[5000]||0)+1000*(c[1000]||0)+(c.etc||0);}

function pagesToPdf(pages){

  offs[2]=off;str('2 0 obj\n<</Type/Pages/Count '+n+'/Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>\nendobj\n');
  pages.forEach((pc,i)=>{const jpg=b64(pc.toDataURL('image/jpeg',0.92));const pid=3+3*i,cid=4+3*i,iid=5+3*i;const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    offs[pid]=off;str(pid+' 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox [0 0 595.28 841.89]/Resources<</XObject<</Im0 '+iid+' 0 R>>>>/Contents '+cid+' 0 R>>\nendobj\n');
    offs[cid]=off;str(cid+' 0 obj\n<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream\nendobj\n');
    offs[iid]=off;str(iid+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+pc.width+'/Height '+pc.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>\nstream\n');push(jpg);str('\nendstream\nendobj\n');});

async function textShare(){try{await navigator.share({text:ktChunks.join('\n\n')});}catch(e){if(e&&e.name!=='AbortError')toast('공유창을 열 수 없습니다. 복사 버튼을 이용하세요');}}


/* ====== 카톡 안 화면 → 기본 브라우저로 넘기기 / 새 버전 확인 ====== */
function bar(html,onBtn,btnText){const b=$('#newVer');b.hidden=false;b.innerHTML='<span>'+html+'</span><button class="btn pri" id="barBtn" style="padding:7px 12px;white-space:nowrap">'+btnText+'</button>';$('#barBtn').onclick=onBtn;}
/*PACK_START*/
async function packLedger(L){
  const rows=L.entries.map(e=>[e.id,e.seat,e.no,e.name,e.won,e.rel,e.method,e.meals,e.memo||'',e.ts,e.upd,e.del?1:0,e.dev||'']);
  const payload=JSON.stringify({s:L.set,c:L.cash,r:rows});
  const b64u=u8=>{let bin='';for(let i=0;i<u8.length;i++)bin+=String.fromCharCode(u8[i]);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
  try{if(typeof CompressionStream!=='undefined'&&typeof Blob!=='undefined'&&Blob.prototype.stream){
    const cs=new Blob([payload]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 'z.'+b64u(new Uint8Array(await new Response(cs).arrayBuffer()));}}catch(e){}
  return 'p.'+b64u(new TextEncoder().encode(payload));}
async function unpackLedger(str){
  const kind=str.slice(0,2),b=atob(str.slice(2).replace(/-/g,'+').replace(/_/g,'/'));
  const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  let text;
  if(kind==='z.'){const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));text=await new Response(ds).text();}
  else text=new TextDecoder().decode(u);
  const o=JSON.parse(text);
  return{entries:o.r.map(r=>({id:r[0],seat:r[1],no:r[2],name:r[3],won:r[4],rel:r[5],method:r[6],meals:r[7],memo:r[8],ts:r[9],upd:r[10],del:!!r[11],dev:r[12]})),set:o.s,cash:o.c};}
/*PACK_END*/
async function openExternal(){
  try{await copyText(JSON.stringify(S));}catch(e){}
  let hash='';try{hash=await packLedger(S);}catch(e){}
  let url=location.origin+location.pathname+'?from=kakao&t='+Date.now();
  if(hash&&hash.length<70000)url+='#kd='+hash;
  toast('기본 브라우저로 이동합니다…');
  setTimeout(()=>{location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url);},500);}

function showLanding(){
  const n=act().length,el=$('#land');
  el.innerHTML=`<div style="max-width:520px;margin:0 auto;padding:36px 18px;text-align:center">
  <div style="font-size:56px">📱</div><h2 style="margin:8px 0 12px">기본 브라우저에서 사용합니다</h2>
  <div style="font-size:17px;line-height:1.65;margin-bottom:20px">카톡 안 화면에서는 <b>정산서 PDF·이미지 저장과 전달이 막힙니다.</b><br>삼성 인터넷·크롬·엣지·사파리 등 <b>폰의 기본 브라우저</b>로 열어서 쓰면 모두 됩니다.${n?`<br><br>이 화면에 접수한 <b>${n}건</b>은 자동으로 가져갑니다.`:''}</div>
  <button class="go" id="landGo" style="background:#f5c518;box-shadow:0 3px 0 #d9aa00;color:#3a3340">🌐 기본 브라우저로 열기</button>
  <div class="note" style="margin-top:12px;min-height:22px" id="landMsg">잠시 후 자동으로 열립니다.</div>
  <button class="btn" id="landStay" style="margin-top:24px;font-size:14px">그냥 카톡 화면에서 쓸게요 (PDF 저장 불가)</button></div>`;
  el.hidden=false;
  $('#landGo').onclick=()=>{openExternal();$('#landMsg').textContent='열리지 않으면 한 번 더 눌러 주세요.';};
  $('#landStay').onclick=()=>{el.hidden=true;};
  try{if(!sessionStorage.getItem('autoExt')){sessionStorage.setItem('autoExt','1');setTimeout(()=>{if(!el.hidden)openExternal();},1500);}else{$('#landMsg').textContent='';}}catch(e){}}
async function importKd(h){
  try{const o=await unpackLedger(h.slice(4));
    ['groom','bride','date','venue','who'].forEach(k=>{if(!S.set[k]&&o.set&&o.set[k])S.set[k]=o.set[k];});
    if(cashTotal()===0&&o.cash)S.cash=Object.assign(S.cash,o.cash);
    mergeText(JSON.stringify({entries:o.entries}));return true;}catch(e){return false;}}
async function importFromClipboard(){
  try{const t=await navigator.clipboard.readText();if(t&&t.trim().startsWith('{')){mergeText(t);$('#newVer').hidden=true;return;}}catch(e){}
  showModal(`<h3>접수 내용 불러오기</h3><div class="note">카톡 화면에서 복사해 둔 내용을 아래 칸에 길게 눌러 <b>붙여넣기</b> 하세요.</div><textarea class="in" id="impBox" style="height:140px;font-size:14px" placeholder="여기에 붙여넣기"></textarea><button class="go" id="impGo">불러오기</button><button class="btn full" id="mClose2">닫기</button>`);
  $('#mClose2').onclick=closeModal;$('#impGo').onclick=()=>{const v=$('#impBox').value;if(!v.trim()){toast('붙여넣은 내용이 없습니다');return;}closeModal();mergeText(v);$('#newVer').hidden=true;};}
async function checkVersion(){try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const APP_V=(\d+)/);
  if(m&&+m[1]>APP_V)bar('🔄 새 버전(v'+m[1]+')이 있습니다',()=>{location.replace(location.pathname+'?v='+m[1]+'&t='+Date.now());},'새로 불러오기');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion();});
function kakaoBoxHTML(){return isKakao?`<div class="card" style="background:#fff8d6;border:2px solid #f5c518"><b>📱 지금은 카톡 안 화면입니다.</b><div style="font-size:15px;margin:6px 0 10px">이 화면에서는 PDF·이미지 저장·전달이 막혀 있습니다. 아래 버튼으로 <b>기본 브라우저(크롬 등)</b>에서 열면 정산서를 PDF로 만들어 카톡으로 보낼 수 있습니다. 지금까지 접수한 내용은 자동으로 가져갑니다.</div><button class="go" data-act="openExt" style="margin:0;background:#f5c518;box-shadow:0 3px 0 #d9aa00;color:#3a3340">🌐 기본 브라우저로 열기</button></div>`:'';}

/* ====== 탭·이벤트 ====== */
let tab='in';
function show(t){tab=t;['in','list','calc','set'].forEach(k=>$('#tab-'+k).hidden=k!==t);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(t==='in')updateIn();if(t==='list')renderList();if(t==='calc')renderCalc();if(t==='set')renderSet();window.scrollTo(0,0);}
function refreshAll(){topbar();if(tab==='in')updateIn();else if(tab==='list')renderList();else if(tab==='calc')renderCalc();else renderSet();}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-edit]');if(!t)return;
  if(t.dataset.tab){show(t.dataset.tab);return;}
  if(t.dataset.copy!=null){doCopy(parseInt(t.dataset.copy));return;}
  if(t.dataset.chip){const p=t.dataset.p;const i=document.getElementById(p+'amt');i.value=t.dataset.chip;updBig(p);return;}
  if(t.dataset.step){const p=t.dataset.p;const i=document.getElementById(p+'meals');i.value=Math.max(0,(parseInt(i.value)||0)+parseInt(t.dataset.step));return;}
  if(t.id==='fGo'){submitMain();return;}
  if(t.dataset.edit){openEdit(t.dataset.edit);return;}
  const a=t.dataset.act;if(!a)return;
  if(a==='undoLast'||a==='undo'){undo();}
  else if(a==='copyBackup')copyBackup();
  else if(a==='pasteMerge'){const v=$('#pasteBox').value;if(!v.trim()){toast('붙여넣은 내용이 없습니다');}else{mergeText(v);}}
  else if(a==='backup')doBackup();else if(a==='csv')doCsv();else if(a==='share')kakaoText();else if(a==='openExt')openExternal();else if(a==='textShare')textShare();
  else if(a==='print')printSheet();else if(a==='pdf')showReport();else if(a==='repClose')closeReport();else if(a==='repPdf')repPdf();else if(a==='repImg')repImg();else if(a==='reset')resetAll();else if(a==='restoreTrash')restoreTrash();});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.k==='amt')updBig(t.dataset.p);
  else if(t.dataset.k==='name')updDup(t.dataset.p);
  else if(t.id==='q'){q=t.value;fillList();}
  else if(t.dataset.cash){const v=t.dataset.cash;S.cash[v]=Math.max(0,parseInt(String(t.value).replace(/\D/g,''))||0);save();calcDiff();}
  else if(t.dataset.set){const k=t.dataset.set;S.set[k]=(k==='meals'||k==='big')?Math.max(0,parseInt(t.value)||0):t.value;save();topbar();}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='sortBy'){sortBy=t.value;fillList();}
  else if(t.id==='showDel'){showDel=t.checked;fillList();}
  else if(t.id==='onlyBig'){onlyBig=t.checked;fillList();}
  else if(t.id==='imp'&&t.files[0]){mergeFile(t.files[0]);t.value='';}
  else if(t.dataset.set==='seat'){S.set.seat=t.value;save();topbar();}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!document.getElementById('aOk')&&!document.getElementById('bigOk')){editingId=null;closeModal();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.p==='f'&&e.target.dataset.k==='amt'){e.preventDefault();submitMain();}});

topbar();renderIn();tryRestore();checkVersion();
(async()=>{let fromK=false;try{fromK=new URLSearchParams(location.search).get('from')==='kakao';}catch(e){}
  const kd=location.hash||'';let done=false;
  try{if(fromK||kd.startsWith('#kd='))history.replaceState(null,'',location.pathname);}catch(e){}
  if(kd.startsWith('#kd='))done=await importKd(kd);
  if(isKakao&&!fromK&&!kd.startsWith('#kd='))showLanding();
  if(fromK&&!done)setTimeout(()=>bar('📥 카톡에서 가져온 접수 내용이 있습니다',importFromClipboard,'불러오기'),600);})();
</script>
