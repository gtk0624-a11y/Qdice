<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한 번뿐인 인생 — 도덕 인생 시뮬레이션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f6f2ea; --paper:#fff; --ink:#1f2a37; --sub:#5d6b7a; --line:#e3ddd1;
  --main:#3b5bdb; --main2:#e8edff; --warm:#e8590c; --warm2:#fff1e6; --ok:#2b8a3e; --ok2:#e6f6ea;
  --warn:#f08c00; --bad:#c92a2a; --bad2:#ffe8e8; --soft:#f1efe9;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 6px 20px rgba(31,42,55,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 110px}
.twrap{max-width:1400px;margin:0 auto;padding:14px 14px 80px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:20px;margin:0;flex:1;min-width:200px}
.top h1 small{font-size:13px;color:var(--sub);font-weight:500;margin-left:6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:19px;margin:0 0 8px}
.card h3{font-size:16px;margin:12px 0 6px}
.muted{color:var(--sub);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;background:var(--main);color:#fff;font-weight:700;min-height:44px}
.btn.sm{padding:7px 11px;min-height:34px;font-size:14px;border-radius:10px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.warm{background:var(--warm)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
textarea.inp{min-height:110px;resize:vertical;line-height:1.6}
textarea.big{min-height:300px}
label.lb{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--soft);color:var(--sub);margin:2px}
.pill.on{background:var(--ok2);color:var(--ok)}
.pill.main{background:var(--main2);color:var(--main)}
.pill.warm{background:var(--warm2);color:var(--warm)}
.pill.bad{background:var(--bad2);color:var(--bad)}
.scene{background:linear-gradient(135deg,#fffaf2,#fff);border:1px solid #f1dfc6;border-radius:16px;padding:16px;font-size:18px}
.scene .age{font-weight:800;color:var(--warm);font-size:15px}
.echo{background:#f3f0ff;border-left:4px solid #7048e8;padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px;color:#5f3dc4}
.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 15px;margin:8px 0;font-size:17px}
.choice:hover{border-color:var(--main)}
.choice.mine{border-color:var(--main);background:var(--main2)}
.result{background:var(--ok2);border-radius:14px;padding:14px;margin-top:10px}
.chg{font-size:13px;font-weight:700;margin-right:6px}
.chg.p{color:var(--ok)} .chg.m{color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{border:0;background:var(--soft);padding:9px 14px;border-radius:12px;font-weight:700;font-size:15px}
.tab.on{background:var(--ink);color:#fff}
.tab[disabled]{opacity:.4}
.tl{display:flex;flex-direction:column;gap:8px}
.tli{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;text-align:left;width:100%}
.tli .ag{min-width:54px;text-align:center;font-weight:800;color:var(--warm);font-size:15px}
.tli .tt{flex:1}
.tli .tt b{display:block;font-size:16px}
.tli.lock{opacity:.5}
.tli.today{border:2px solid var(--main)}
.gbar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--main);border-radius:99px}
.rafts{width:100%;border-collapse:collapse;font-size:15px}
.rafts th{width:64px;background:var(--ink);color:#fff;padding:8px;border-radius:0;text-align:center;vertical-align:top}
.rafts td{padding:8px 10px;border-bottom:1px solid var(--line)}
.cnt{font-size:13px;color:var(--sub);text-align:right}
.status{padding:10px 12px;border-radius:12px;font-weight:700;font-size:15px;margin:8px 0}
.status.w{background:var(--soft)} .status.d{background:var(--warm2);color:var(--warm)} .status.u{background:var(--main2);color:var(--main)} .status.p{background:var(--ok2);color:var(--ok)}
.sage{display:flex;gap:10px;align-items:flex-start;background:#fff8e1;border:1px solid #ffe08a;border-radius:14px;padding:12px}
.sage .ic{font-size:28px}
.cardsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cardsg .c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px}
.cardsg .c.lock{background:var(--soft);color:#aaa}
.ovl{position:fixed;inset:0;background:rgba(20,24,32,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px}
.ovl .box{background:#fff;border-radius:20px;max-width:760px;width:100%;padding:18px;margin:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:99;font-size:15px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:30px}
.bars .b{display:flex;align-items:center;gap:8px;margin:6px 0}
.bars .b .l{flex:0 0 46%;font-size:14px}
.bars .b .g{flex:1;height:22px;background:var(--soft);border-radius:8px;overflow:hidden}
.bars .b .g i{display:block;height:100%;background:var(--warm)}
.bars .b .n{width:40px;text-align:right;font-weight:800}
table.st{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
table.st th,table.st td{border:1px solid var(--line);padding:4px 5px;text-align:center;white-space:nowrap}
table.st th{background:var(--soft);position:sticky;top:0}
table.st td.cell{cursor:pointer}
table.st td.cell:hover{background:var(--main2)}
.scroll{overflow:auto;max-height:70vh;border-radius:12px;border:1px solid var(--line)}
.banner{background:var(--bad2);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0}
.qr{display:flex;justify-content:center;padding:10px;background:#fff}
.imgbox img{max-width:100%;border-radius:12px;display:block;margin:8px auto}
.ed fieldset{border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:10px 12px}
.ed legend{font-weight:800;padding:0 6px}
.ed .vals{display:flex;gap:6px;flex-wrap:wrap}
.ed .vals label{font-size:13px;display:flex;flex-direction:column;align-items:center}

.wlist .w{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px;white-space:pre-wrap}
.big{font-size:34px;font-weight:900;letter-spacing:4px;text-align:center;color:var(--main)}
.hl{background:#fff3bf}
</style>

<body>
<div id="app"></div>
<script src="content.js"></script>
<script>
/* =====================================================================
   한 번뿐인 인생 — 도덕①·② 인생 시뮬레이션 (index.html)
   © 김정환 · M.A.D.T (Moral And Digital Teacher)
   ---------------------------------------------------------------------
   ① 설정 ② 공통 도구 ③ 저장소(Firebase/체험) ④ 콘텐츠(편집본 합치기·이미지)
   ⑤ 학생 화면 ⑥ 교사 화면 ⑦ 내용 편집 ⑧ 시작
   ===================================================================== */

/* ---------- ① 설정 ---------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAPJAMUITr6w0H63Ze1L1eViCsuq3zXlbE",
  authDomain: "nation-game-cf684.firebaseapp.com",
  databaseURL: "https://nation-game-cf684-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "nation-game-cf684",
  storageBucket: "nation-game-cf684.firebasestorage.app",
  messagingSenderId: "947361689624",
  appId: "1:947361689624:web:9f09cd27fbd2334ae0136d"
};
const TEACHER_PIN = '0624';       // 교사 화면 비밀번호
const CSET = 'default';           // 편집한 내용 묶음 이름(모든 반 공통)
const P_CONTENT = 'rooms/OLCONTENT/'+CSET;   // 편집 내용 저장 위치
const P_SAVE = 'rooms/OLSAVE';               // 1→2학년 이어하기 코드 저장 위치
const MINI_MIN = 60;              // 차시 글쓰기 최소 글자 수
const MINI_MIN_DEFAULT = MINI_MIN;

/* ---------- ② 공통 도구 ---------- */
const qs = new URLSearchParams(location.search);
const MODE = qs.get('mode')==='teacher' ? 'teacher' : 'student';
let ROOM = (qs.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);
const app = document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => o==null ? o : JSON.parse(JSON.stringify(o));
const nz = s => String(s||'').replace(/\s+/g,'');
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function toast(m,ms){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),ms||2600); }
function newCode(n){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<(n||4);i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function hits(text,words){ const t=nz(text); return (words||[]).filter(w=>w && t.includes(nz(w))); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
let DEV = lsGet('onelife_dev'); if(!DEV){ DEV = 'd'+Date.now().toString(36)+newCode(4); lsSet('onelife_dev',DEV); }
function fmtTime(t){ if(!t) return '-'; const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast('📋 복사했어요. 하이러닝 답안 칸에 붙여 넣으세요.'); return; }catch(e){}
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('📋 복사했어요.'); }catch(e){ toast('복사가 안 돼요. 글을 길게 눌러 직접 복사해 주세요.'); }
  ta.remove();
}
function downloadText(name,txt,mime){
  try{
    const blob=new Blob(['﻿'+txt],{type:(mime||'text/plain')+';charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
    toast('💾 파일을 저장했어요. (카카오톡 안에서는 저장이 안 될 수 있어요 → 복사하기를 쓰세요)');
  }catch(e){ toast('저장이 안 돼요. 복사하기를 써 주세요.'); }
}
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }

/* ---------- ③ 저장소 (Firebase 실시간 DB, 실패하면 체험 모드) ---------- */
let DBMODE='demo', backend=null;
async function initBackend(){
  if(qs.get('demo')!=='1' && FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL){
    try{
      const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const db = D.getDatabase(A.initializeApp(FIREBASE_CONFIG));
      backend = {
        set:(p,v)=>D.set(D.ref(db,p),clone(v)),
        update:(p,v)=>D.update(D.ref(db,p),clone(v)),
        remove:p=>D.remove(D.ref(db,p)),
        get:p=>D.get(D.ref(db,p)).then(s=>s.val()),
        on:(p,cb)=>D.onValue(D.ref(db,p),s=>cb(s.val()),err=>toast('⚠️ 데이터베이스 연결 오류: '+err.message))
      };
      DBMODE='live'; return;
    }catch(e){ console.error(e); toast('⚠️ 인터넷 연결 실패 → 체험 모드(이 기기에서만 저장)로 실행합니다'); }
  }
  const KEY='onelife_demo_db';
  const bc=('BroadcastChannel' in window)?new BroadcastChannel('onelife'):null;
  const L=[];
  const read=()=>lsGet(KEY)||{};
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=(t,p)=>parts(p).reduce((o,k)=>o==null?undefined:o[k],t);
  const setAt=(t,p,v)=>{ const ks=parts(p); let o=t; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } const last=ks[ks.length-1]; if(v==null) delete o[last]; else o[last]=clone(v); };
  const fire=()=>{ const t=read(); L.forEach(l=>l.cb(clone(getAt(t,l.p))??null)); };
  const write=t=>{ lsSet(KEY,t); fire(); bc&&bc.postMessage(1); };
  if(bc) bc.onmessage=fire;
  window.addEventListener('storage',e=>{ if(e.key===KEY) fire(); });
  backend={
    set:async(p,v)=>{ const t=read(); setAt(t,p,v); write(t); },
    update:async(p,v)=>{ const t=read(); Object.keys(v).forEach(k=>setAt(t,p+'/'+k,v[k])); write(t); },
    remove:async p=>{ const t=read(); setAt(t,p,null); write(t); },
    get:async p=>clone(getAt(read(),p))??null,
    on:(p,cb)=>{ L.push({p,cb}); setTimeout(()=>cb(clone(getAt(read(),p))??null),0); }
  };
}

/* ---------- ④ 콘텐츠: 기본(content.js) + 교사 편집본 ---------- */
const BASE_UNITS = clone(window.UNITS||[]);
const BASE_END = clone(window.ENDINGS||{});
let UNITS = clone(BASE_UNITS), ENDINGS = clone(BASE_END), OVR = {}, ENDOVR = null;
function rebuildUnits(){
  UNITS = BASE_UNITS.map(u=> OVR[u.id] ? Object.assign({},clone(OVR[u.id]),{id:u.id,g:u.g}) : clone(u));
  ENDINGS = Object.assign({},clone(BASE_END),ENDOVR||{});
}
const UG = g => UNITS.filter(u=>u.g===g);
const unitById = id => UNITS.find(u=>u.id===id);
function lessonById(id){ for(const u of UNITS){ const i=(u.lessons||[]).findIndex(l=>l.id===id); if(i>=0) return {u,l:u.lessons[i],i}; } return null; }
// 이미지: 'img:아이디'(데이터베이스) 또는 'https://...'(인터넷 주소)
const IMG = {}, IMGREQ = {};
function imgHTML(ref){
  if(!ref) return '';
  if(/^https?:\/\//.test(ref)) return `<div class="imgbox"><img src="${esc(ref)}" alt="" loading="lazy"></div>`;
  if(ref.startsWith('img:')){
    const id=ref.slice(4);
    if(IMG[id]) return `<div class="imgbox"><img src="${IMG[id]}" alt=""></div>`;
    if(!IMGREQ[id]){ IMGREQ[id]=1; backend.get(P_CONTENT+'/img/'+id).then(v=>{ if(v&&v.d){ IMG[id]=v.d; safeRender(); } }).catch(()=>{}); }
    return `<div class="imgbox muted" style="text-align:center;padding:20px">🖼️ 이미지 불러오는 중…</div>`;
  }
  return '';
}
function compressImage(file,maxW,maxBytes){
  return new Promise((ok,no)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{
        let w=im.width,h=im.height; const sc=Math.min(1,(maxW||1000)/w); w=Math.round(w*sc); h=Math.round(h*sc);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(im,0,0,w,h);
        let q=0.8, d=cv.toDataURL('image/jpeg',q);
        while(d.length*0.75>(maxBytes||220000) && q>0.35){ q-=0.1; d=cv.toDataURL('image/jpeg',q); }
        ok(d);
      }; im.onerror=no; im.src=fr.result; };
    fr.onerror=no; fr.readAsDataURL(file);
  });
}

/* ---------- 공통 상태 ---------- */
let META = {};            // 방 설정(교사)
let metaLoaded=false;
let renderPending=false;
function render(){ if(MODE==='teacher') renderTeacher(); else renderStudent(); }
function safeRender(){
  const a=document.activeElement;
  if(a && (a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && a.type!=='checkbox' && a.type!=='file') || a.tagName==='SELECT')){ renderPending=true; return; }
  render();
}
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(renderPending){ renderPending=false; safeRender(); } },150); });
const foot = `<div class="foot">© 김정환 · M.A.D.T (Moral And Digital Teacher) · 한 번뿐인 인생</div>`;

/* =====================================================================
   ⑤ 학생 화면
   ===================================================================== */
let S=null;                // 내 인생 기록
let PASS={}, UPL={}, DEL={};
let sv={view:'join', uid:null, tab:'ev'};
let joinDraft={room:ROOM, num:'', cname:''};
let pushT=null;
const skey = sid => `onelife_${ROOM}_${sid}`;
function saveS(){ if(!S) return; lsSet(skey(S.sid),S); lsSet('onelife_last_'+ROOM,S.sid); clearTimeout(pushT); pushT=setTimeout(pushS,1000); }
function pushS(){ if(!S||!ROOM) return; S.at=Date.now(); backend.set(`rooms/${ROOM}/students/${S.sid}`,S).catch(e=>toast('⚠️ 저장 실패: 인터넷 연결을 확인해 주세요. (기기에는 남아 있어요)')); }
function grade(){ return +(META.grade||1); }
function newLife(num,cname){
  const vals={}; VALUE_KEYS.forEach(k=>vals[k]=5);
  return { sid:'s'+num, num:+num, cname, dev:DEV, joinedAt:Date.now(), birth:null, vals, g:{rel:5,joy:5,res:5}, flags:{}, cards:{}, ch:{}, w:{} };
}
function chosen(uid){ return S && S.ch && S.ch[uid] && S.ch[uid].c!=null; }
function wkeyR(uid){ return 'R-'+uid; }
function writing(key){ return (S && S.w && S.w[key]) || null; }
function raftsState(uid){
  if(PASS[uid]) return 'p';
  const w=writing(wkeyR(uid));
  if(UPL[wkeyR(uid)]) return 'u';
  if(w && w.done) return 'd';
  if(w && (w.text||w.deleted)) return 'w';
  return '';
}
function unitOpen(i){
  const L=UG(grade()); const u=L[i]; if(!u) return false;
  const open=+(META.open||1);
  if(i>=open) return false;
  if(i===0 || META.gate===false) return true;
  return !!PASS[L[i-1].id];
}
function lockReason(i){
  const L=UG(grade()); const open=+(META.open||1);
  if(i>=open) return '선생님이 아직 열지 않았어요';
  if(META.gate!==false && i>0 && !PASS[L[i-1].id]) return '앞 단원 글쓰기를 통과해야 열려요';
  return '';
}

/* --- 선택 적용/되돌리기 --- */
function applyChoice(u,ci,sign){
  const c=u.ev.c[ci]; if(!c) return;
  Object.entries(c.v||{}).forEach(([k,v])=>{ S.vals[k]=clamp((S.vals[k]||0)+sign*v,0,30); });
  Object.entries(c.g||{}).forEach(([k,v])=>{ S.g[k]=clamp((S.g[k]||0)+sign*v,0,10); });
  if(c.f){ if(sign>0) S.flags[c.f]=1; else delete S.flags[c.f]; }
}
function choose(uid,ci,reason){
  const u=unitById(uid); if(!u) return;
  const prev=S.ch[uid];
  if(prev && prev.c===ci) return;
  if(prev && prev.c!=null) applyChoice(u,prev.c,-1);
  applyChoice(u,ci,+1);
  if(u.sage) S.cards[uid]=1;
  S.ch[uid]= prev ? Object.assign({},prev,{c:ci,changed:true,reason:reason||prev.reason||'',at:Date.now()}) : {c:ci,first:ci,at:Date.now()};
  saveS();
}
function chgHTML(c){
  const a=[];
  Object.entries(c.v||{}).forEach(([k,v])=>{ if(v) a.push(`<span class="chg ${v>0?'p':'m'}">${k} ${v>0?'+':''}${v}</span>`); });
  Object.entries(c.g||{}).forEach(([k,v])=>{ if(v) a.push(`<span class="chg ${v>0?'p':'m'}">${GAUGE_KEYS[k]} ${v>0?'+':''}${v}</span>`); });
  return a.join('');
}
function echoHTML(u){
  return (u.ev.echo||[]).filter(e=>S && S.flags && S.flags[e.f]).map(e=>`<div class="echo">🔁 ${esc(e.s)}</div>`).join('');
}

/* --- 차트 --- */
function radarSVG(vals,size){
  const K=VALUE_KEYS, n=K.length, R=(size||220)/2-34, cx=(size||220)/2, cy=(size||220)/2, MAX=15;
  const pt=(i,r)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  let g='';
  [0.33,0.66,1].forEach(f=>{ g+=`<polygon points="${K.map((k,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#e3ddd1"/>`; });
  K.forEach((k,i)=>{ const [x,y]=pt(i,R); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e3ddd1"/>`; const [lx,ly]=pt(i,R+18); g+=`<text x="${lx}" y="${ly+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a37">${k}</text>`; });
  g+=`<polygon points="${K.map((k,i)=>pt(i,R*Math.min(vals[k]||0,MAX)/MAX).join(',')).join(' ')}" fill="rgba(59,91,219,.25)" stroke="#3b5bdb" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${size||220} ${size||220}" width="100%" style="max-width:${size||220}px">${g}</svg>`;
}
function gaugesHTML(g){
  return Object.entries(GAUGE_KEYS).map(([k,n])=>`<div style="margin:6px 0"><div class="row" style="justify-content:space-between"><b style="font-size:14px">${n}</b><span class="muted">${g[k]||0}/10</span></div><div class="gbar"><i style="width:${(g[k]||0)*10}%"></i></div></div>`).join('');
}

async function deleteUploaded(silent){

  autoDelDone=true; deleteUploaded(true).then(n=>{ if(n) toast(`🗑️ 삭제 예정일이 지나 업로드 완료 글 ${n}개를 자동 삭제했습니다.`,5000); });
}
async function buildZip(filter){
  if(!window.JSZip){ try{ await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'); }catch(e){ return toast('ZIP 도구를 불러오지 못했어요. 인터넷을 확인해 주세요.'); } }
  const z=new JSZip(); const g=+META.grade; let n=0; const kl=(META.klass||'반').replace(/[^0-9A-Za-z가-힣\-]/g,'');
  studs().forEach(s=>Object.entries(s.w||{}).forEach(([k,w])=>{
    if(!w.text || !filter(k)) return;
    const num=String(s.num).padStart(2,'0');
    z.file(`${kl}_${num}번_${keyLabel(k)}.txt`, `${META.klass||''} ${s.num}번 (인물: ${s.cname})\n${keyLabel(k)}\n\n[문항]\n${promptOf(k)}\n\n[학생 글]\n${w.text}\n`); n++;
  }));
  if(!n) return toast('내려받을 글이 없어요.');
  const blob=await z.generateAsync({type:'blob'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${kl}_한번뿐인인생_${new Date().toISOString().slice(0,10)}.zip`; a.click(); toast(`📦 ${n}개 파일을 ZIP으로 받았습니다.`);
}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset && t.dataset.sel){ tSel[t.dataset.sel]=t.checked; return; }
  if(!(t.dataset && t.dataset.tin)) return;
  const k=t.dataset.tin, v=t.value;
  if(k==='lesson') backend.update(`rooms/${ROOM}/meta`,{lesson:v||null});
  else if(k==='tUnit'){ tUnit=v||null; render(); }
  else if(k==='pauseU'){ tUnit=v; render(); }
  else if(k==='fu'){ tFilter={u:v,k:''}; render(); }
  else if(k==='fk'){ tFilter.k=v; render(); }
  else if(k==='delEnd') backend.update(`rooms/${ROOM}/meta/del`,{end:v||null,days:+((META.del||{}).days||30)});
  else if(k==='delDays') backend.update(`rooms/${ROOM}/meta/del`,{days:+v||30});
  else if(k==='edU'){ edOpen(v); }
});

function getPath(o,p){ return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o); }
function setPath(o,p,v){ const ks=p.split('.'); let a=o; for(let i=0;i<ks.length-1;i++){ if(a[ks[i]]==null) a[ks[i]]=isNaN(+ks[i+1])?{}:[]; a=a[ks[i]]; } a[ks[ks.length-1]]=v; }
function fIn(path,label,opt){
  opt=opt||{}; let v=getPath(ED.d,path);
  if(opt.type==='csv') v=(v||[]).join(', '); else if(opt.type==='lines') v=(v||[]).join('\n');
  const attrs=`data-ed="${path}" data-edtype="${opt.type||'text'}"`;
  const field = opt.area ? `<textarea class="inp" ${attrs} style="min-height:${opt.h||80}px">${esc(v)}</textarea>` : `<input class="inp" ${attrs} ${opt.type==='num'?'type="number"':''} value="${esc(v==null?'':v)}">`;
  return `<label class="lb">${label}</label>${field}${opt.help?`<div class="muted">${opt.help}</div>`:''}`;
}
function fImg(path,label){
  const v=getPath(ED.d,path)||'';
  return `<label class="lb">🖼️ ${label}</label><div class="row"><input type="file" accept="image/*" data-edimg="${path}"><input class="inp" style="flex:1;min-width:200px" data-ed="${path}" data-edtype="text" placeholder="또는 이미지 인터넷 주소(https://...)" value="${esc(v.startsWith('img:')?'':v)}">${v?`<button class="btn sm ghost" data-act="edImgDel" data-v="${path}">이미지 빼기</button>`:''}</div>${imgHTML(v)}`;
}

function bindEditor(){
  if(MODE!=='teacher' || ttab!=='edit' || !ED) return;
  app.querySelectorAll('[data-ed]').forEach(el=>{
    el.oninput=()=>{ const t=el.dataset.edtype; let v=el.value;
      if(t==='csv') v=v.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
      else if(t==='lines') v=v.split('\n').map(x=>x.trim()).filter(Boolean);
      else if(t==='num') v=v===''?0:+v;
      setPath(ED.d,el.dataset.ed,v); ED.dirty=true; };
  });
  app.querySelectorAll('[data-edimg]').forEach(inp=>{
    inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f) return; toast('이미지를 줄이는 중…');
      try{ const dataUrl=await compressImage(f,1000,220000); const id='i'+Date.now().toString(36)+newCode(3);
        await backend.set(P_CONTENT+'/img/'+id,{d:dataUrl,at:Date.now()}); IMG[id]=dataUrl;
        setPath(ED.d,inp.dataset.edimg,'img:'+id); ED.dirty=true; toast('🖼️ 이미지를 넣었어요. [저장]을 눌러야 학생에게 보입니다.'); render();
      }catch(e){ console.error(e); toast('이미지를 넣지 못했어요.'); } };
  });
}

  await initBackend();
  backend.on(P_CONTENT+'/units',v=>{ OVR=v||{}; rebuildUnits(); if(ED && !ED.dirty && unitById(ED.uid)) ED.d=clone(unitById(ED.uid)); safeRender(); });
  backend.on(P_CONTENT+'/endings',v=>{ ENDOVR=v||null; rebuildUnits(); safeRender(); });
  if(MODE==='teacher'){ if(tAuthed) startTeacherData(); else if(!ROOM){ ROOM='OL'+newCode(4); history.replaceState(null,'','?mode=teacher&room='+ROOM); } render(); }
  else startStudent();
})();
</script>
</body>
