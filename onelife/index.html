<!doctype html>
<html lang="ko">
<head>

<title>한 번뿐인 인생 — 도덕 인생 시뮬레이션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
:root{
  --bg:#f6f2ea; --paper:#fff; --ink:#1f2a37; --sub:#5d6b7a; --line:#e3ddd1;
  --main:#3b5bdb; --main2:#e8edff; --warm:#e8590c; --warm2:#fff1e6; --ok:#2b8a3e; --ok2:#e6f6ea;
  --warn:#f08c00; --bad:#c92a2a; --bad2:#ffe8e8; --soft:#f1efe9; --gold:#f59f00; --gold2:#fff9db;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 6px 20px rgba(31,42,55,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:880px;margin:0 auto;padding:14px 14px 110px}
.twrap{max-width:1440px;margin:0 auto;padding:14px 14px 80px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:20px;margin:0;flex:1;min-width:200px}
.top h1 small{font-size:13px;color:var(--sub);font-weight:500;margin-left:6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:19px;margin:0 0 8px}
.card h3{font-size:16px;margin:12px 0 6px}
.muted{color:var(--sub);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;background:var(--main);color:#fff;font-weight:700;min-height:44px}
.btn.sm{padding:7px 11px;min-height:34px;font-size:14px;border-radius:10px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.warm{background:var(--warm)} .btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.gold{background:var(--gold);color:#222}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.btn.big{font-size:19px;padding:14px 22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
textarea.inp{min-height:110px;resize:vertical;line-height:1.6}
textarea.tall{min-height:300px}
label.lb{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--soft);color:var(--sub);margin:2px}
.pill.on{background:var(--ok2);color:var(--ok)} .pill.main{background:var(--main2);color:var(--main)} .pill.warm{background:var(--warm2);color:var(--warm)} .pill.bad{background:var(--bad2);color:var(--bad)} .pill.gold{background:var(--gold2);color:#b35c00}
.scene{background:linear-gradient(135deg,#fffaf2,#fff);border:1px solid #f1dfc6;border-radius:16px;padding:16px;font-size:18px}
.scene .age{font-weight:800;color:var(--warm);font-size:15px}
.echo{background:#f3f0ff;border-left:4px solid #7048e8;padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px;color:#5f3dc4}
.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:17px}
.choice:hover:not([disabled]){border-color:var(--main)}
.choice.mine{border-color:var(--main);background:var(--main2)}
.choice.path{border-color:#be4bdb;background:#fbf0ff}
.choice[disabled]{opacity:.55;cursor:not-allowed}
.choice .tags{margin-top:4px;font-size:13px}
.result{border-radius:14px;padding:14px;margin-top:10px}
.result.ok{background:var(--ok2)} .result.no{background:var(--bad2)}
.chg{font-size:13px;font-weight:800;margin-right:6px;white-space:nowrap}
.chg.p{color:var(--ok)} .chg.m{color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{border:0;background:var(--soft);padding:9px 14px;border-radius:12px;font-weight:700;font-size:15px}
.tab.on{background:var(--ink);color:#fff}
.tab[disabled]{opacity:.4}
.tl{display:flex;flex-direction:column;gap:8px}
.tli{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;text-align:left;width:100%}
.tli .ag{min-width:54px;text-align:center;font-weight:800;color:var(--warm);font-size:15px}
.tli .tt{flex:1} .tli .tt b{display:block;font-size:16px}
.tli.lock{opacity:.5} .tli.today{border:2px solid var(--main)} .tli.now{border:2px solid var(--warm);background:#fffaf5}
.gb{margin:5px 0}
.gb .hd{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.gbar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;position:relative}
.gbar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.gbar i.lo{background:var(--bad)} .gbar i.mid{background:var(--warn)} .gbar i.hi{background:var(--ok)}
.gbar b{position:absolute;top:0;height:100%;border-right:2px dashed var(--ink);opacity:.6}
.abil{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.abil div{background:var(--soft);border-radius:12px;padding:8px 4px}
.abil b{font-size:22px;display:block}
.xpbar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.xpbar i{display:block;height:100%;background:var(--gold)}
.rafts{width:100%;border-collapse:collapse;font-size:15px}
.rafts th{width:64px;background:var(--ink);color:#fff;padding:8px;text-align:center;vertical-align:top}
.rafts td{padding:8px 10px;border-bottom:1px solid var(--line)}
.cnt{font-size:13px;color:var(--sub);text-align:right}
.status{padding:10px 12px;border-radius:12px;font-weight:700;font-size:15px;margin:8px 0}
.status.w{background:var(--soft)} .status.d{background:var(--warm2);color:var(--warm)} .status.u{background:var(--main2);color:var(--main)} .status.p{background:var(--ok2);color:var(--ok)}
.sage{display:flex;gap:10px;align-items:flex-start;background:#fff8e1;border:1px solid #ffe08a;border-radius:14px;padding:12px}
.sage .ic{font-size:28px}
.cardsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cardsg .c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px}
.cardsg .c.lock{background:var(--soft);color:#aaa}
.pk{border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center;background:#fff;cursor:pointer}
.pk:hover{border-color:var(--gold)}
.pk .e{font-size:36px}
.ovl{position:fixed;inset:0;background:rgba(20,24,32,.62);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px}
.ovl .box{background:#fff;border-radius:20px;max-width:760px;width:100%;padding:18px;margin:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:99;font-size:15px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:30px}
.bars .b{display:flex;align-items:center;gap:8px;margin:6px 0}
.bars .b .l{flex:0 0 46%;font-size:14px}
.bars .b .g{flex:1;height:22px;background:var(--soft);border-radius:8px;overflow:hidden}
.bars .b .g i{display:block;height:100%;background:var(--warm)}
.bars .b .n{width:40px;text-align:right;font-weight:800}
table.st{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
table.st th,table.st td{border:1px solid var(--line);padding:4px 5px;text-align:center;white-space:nowrap}
table.st th{background:var(--soft);position:sticky;top:0;z-index:1}
table.st td.cell{cursor:pointer} table.st td.cell:hover{background:var(--main2)}
.scroll{overflow:auto;max-height:70vh;border-radius:12px;border:1px solid var(--line)}
.banner{background:var(--bad2);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0}
.qr{display:flex;justify-content:center;padding:10px;background:#fff}
.imgbox img{max-width:100%;border-radius:12px;display:block;margin:8px auto}
.ed fieldset{border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:10px 12px}
.ed legend{font-weight:800;padding:0 6px}
.ed .vals{display:flex;gap:6px;flex-wrap:wrap}
.ed .vals label{font-size:13px;display:flex;flex-direction:column;align-items:center}
.ed .vals input{width:56px;text-align:center;padding:5px;border:1px solid var(--line);border-radius:8px}
.wlist .w{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px;white-space:pre-wrap}
.bigcode{font-size:34px;font-weight:900;letter-spacing:4px;text-align:center;color:var(--main)}
.dice{font-size:64px;line-height:1;display:inline-block}
.dice.roll{animation:shake .25s infinite}
@keyframes shake{0%{transform:rotate(-15deg)}50%{transform:rotate(15deg) translateY(-6px)}100%{transform:rotate(-15deg)}}
.diceline{text-align:center;padding:12px;background:var(--soft);border-radius:14px;margin:10px 0}
.verdict{font-size:24px;font-weight:900}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.alloc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.act{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.act .h{display:flex;align-items:center;justify-content:space-between;font-weight:800}
.act .ctl{display:flex;align-items:center;gap:6px}
.act .ctl button{width:40px;height:40px;border-radius:10px;border:0;background:var(--soft);font-size:22px;font-weight:900}
.act .ctl b{min-width:28px;text-align:center;font-size:22px}
.tokens{font-size:26px;letter-spacing:2px}
.timer{font-size:22px;font-weight:900;color:var(--bad);text-align:right}
.crisis{background:linear-gradient(135deg,#ffe3e3,#fff);border:2px solid var(--bad)}
.phase{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.phase span{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--sub);font-weight:700}
.phase span.on{background:var(--warm);color:#fff} .phase span.done{background:var(--ok2);color:var(--ok)}
.hl{background:#fff3bf}
</style>

<body>
<div id="app"></div>
<script src="content.js"></script>
<script src="game.js"></script>
<script>
/* =====================================================================
   한 번뿐인 인생 v2 — 도덕①·② 인생 시뮬레이션 게임 (index.html)
   © 김정환 · M.A.D.T (Moral And Digital Teacher)
   ① 설정 ② 공통 도구 ③ 저장소 ④ 콘텐츠 합치기
   ⑤ 게임 엔진(게이지·주사위·위기·레벨) ⑥ 학생 화면 ⑦ 교사 화면 ⑧ 내용 편집 ⑨ 시작
   ===================================================================== */

/* ---------- ① 설정 ---------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAPJAMUITr6w0H63Ze1L1eViCsuq3zXlbE",
  authDomain: "nation-game-cf684.firebaseapp.com",
  databaseURL: "https://nation-game-cf684-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "nation-game-cf684",
  storageBucket: "nation-game-cf684.firebasestorage.app",
  messagingSenderId: "947361689624",
  appId: "1:947361689624:web:9f09cd27fbd2334ae0136d"
};
const TEACHER_PIN = '0624';
const CSET = 'default';
const TITLE0 = '한 번뿐인 인생';   // 기본 게임 이름 (교사 편집에서 바꾸면 rooms/OLCONTENT/default/title 에 저장)
let TITLE = TITLE0;
const P_CONTENT = 'rooms/OLCONTENT/'+CSET;
const P_SAVE = 'rooms/OLSAVE';
const MINI_MIN = 60;
const G = window.GAME;
const GK = Object.keys(G.GAUGES);   // body heart rel money
const AB = G.ABIL;                   // 지혜 공감 용기 끈기
/* 엔딩 목표 기준 (2학년 끝) */
const GOAL_T = { wealth:{f:s=>s.earned, t:70, u:'평생 번 돈'}, fame:{f:s=>s.lv, t:14, u:'레벨'}, love:{f:s=>(s.pairC||0)*2+(s.g.rel||0), t:30, u:'협력 횟수×2+관계'},
  justice:{f:s=>(s.cmGiven||0)+(s.vals['정의']||0), t:30, u:'기금+정의'}, wisdom:{f:s=>s.ab['지혜'], t:10, u:'지혜'}, freedom:{f:s=>(s.vals['자율']||0)+(s.g.heart||0), t:20, u:'자율+마음'} };

/* ---------- ② 공통 도구 ---------- */
const qs = new URLSearchParams(location.search);
const MODE = qs.get('mode')==='teacher' ? 'teacher' : 'student';
let ROOM = (qs.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);
const app = document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => o==null ? o : JSON.parse(JSON.stringify(o));
const nz = s => String(s||'').replace(/\s+/g,'');
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const r1 = v => Math.round(v*10)/10;
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const DF=['','⚀','⚁','⚂','⚃','⚄','⚅'];
function toast(m,ms){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),ms||2800); }
function newCode(n){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<(n||4);i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function hits(text,words){ const t=nz(text); return (words||[]).filter(w=>w && t.includes(nz(w))); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
let DEV = lsGet('onelife_dev'); if(!DEV){ DEV='d'+Date.now().toString(36)+newCode(4); lsSet('onelife_dev',DEV); }
function fmtTime(t){ if(!t) return '-'; const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast('📋 복사했어요. 하이러닝 답안 칸에 붙여 넣으세요.'); return; }catch(e){}
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('📋 복사했어요.'); }catch(e){ toast('복사가 안 돼요. 글을 길게 눌러 직접 복사해 주세요.'); }
  ta.remove();
}
function downloadText(name,txt,mime){
  try{ const blob=new Blob(['﻿'+txt],{type:(mime||'text/plain')+';charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); toast('💾 저장했어요. (카카오톡 안에서는 안 될 수 있어요 → 복사하기)'); }
  catch(e){ toast('저장이 안 돼요. 복사하기를 써 주세요.'); }
}
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
// 2d6 ≥ need 확률
function probAtLeast(need){ if(need<=2) return 1; if(need>12) return 0; let c=0; for(let a=1;a<=6;a++) for(let b=1;b<=6;b++) if(a+b>=need) c++; return c/36; }

/* ---------- ③ 저장소 ---------- */
let DBMODE='demo', backend=null;
async function initBackend(){
  if(qs.get('demo')!=='1' && FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL){
    try{
      const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const db = D.getDatabase(A.initializeApp(FIREBASE_CONFIG));
      backend = { set:(p,v)=>D.set(D.ref(db,p),clone(v)), update:(p,v)=>D.update(D.ref(db,p),clone(v)), remove:p=>D.remove(D.ref(db,p)),
        get:p=>D.get(D.ref(db,p)).then(s=>s.val()), on:(p,cb)=>D.onValue(D.ref(db,p),s=>cb(s.val()),err=>toast('⚠️ 데이터베이스 연결 오류: '+err.message)) };
      DBMODE='live'; return;
    }catch(e){ console.error(e); toast('⚠️ 인터넷 연결 실패 → 체험 모드(이 기기에서만 저장)'); }
  }
  const KEY='onelife_demo_db', bc=('BroadcastChannel' in window)?new BroadcastChannel('onelife'):null, L=[];
  const read=()=>lsGet(KEY)||{}, parts=p=>p.split('/').filter(Boolean);
  const getAt=(t,p)=>parts(p).reduce((o,k)=>o==null?undefined:o[k],t);
  const setAt=(t,p,v)=>{ const ks=parts(p); let o=t; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } const last=ks[ks.length-1]; if(v==null) delete o[last]; else o[last]=clone(v); };
  const fire=()=>{ const t=read(); L.forEach(l=>l.cb(clone(getAt(t,l.p))??null)); };
  const write=t=>{ lsSet(KEY,t); fire(); bc&&bc.postMessage(1); };
  if(bc) bc.onmessage=fire; window.addEventListener('storage',e=>{ if(e.key===KEY) fire(); });
  backend={ set:async(p,v)=>{ const t=read(); setAt(t,p,v); write(t); }, update:async(p,v)=>{ const t=read(); Object.keys(v).forEach(k=>setAt(t,p+'/'+k,v[k])); write(t); },
    remove:async p=>{ const t=read(); setAt(t,p,null); write(t); }, get:async p=>clone(getAt(read(),p))??null, on:(p,cb)=>{ L.push({p,cb}); setTimeout(()=>cb(clone(getAt(read(),p))??null),0); } };
}

/* ---------- ④ 콘텐츠: content.js + game.js + 교사 편집본 ---------- */
const mapG = g => { const o={}; Object.entries(g||{}).forEach(([k,v])=>{ const kk={joy:'heart',res:'money'}[k]||k; o[kk]=(o[kk]||0)+v; }); return o; };
function mergeGame(u){
  const gu=G.U[u.id]||{};
  u.ev.c.forEach((c,i)=>{ Object.assign(c, clone((gu.c||[])[i]||{})); c.g=mapG(c.g); if(c.gf) c.gf=mapG(c.gf); });
  (gu.extra||[]).forEach(x=>u.ev.c.push(clone(x)));
  u.pair=clone(gu.pair); u.cm=clone(gu.cm);
  return u;
}
const BASE_UNITS = (window.UNITS||[]).map(u=>mergeGame(clone(u)));
const BASE_END = clone(window.ENDINGS||{});
let UNITS=clone(BASE_UNITS), ENDINGS=clone(BASE_END), OVR={}, FATE=clone(G.FATE), FATEOVR=null;
function rebuildUnits(){
  UNITS = BASE_UNITS.map(u=> OVR[u.id] ? Object.assign(clone(OVR[u.id]),{id:u.id,g:u.g}) : clone(u));
  UNITS.forEach(u=>{ if(!u.ev.c) u.ev.c=[]; u.ev.c.forEach(c=>{ c.g=mapG(c.g); if(c.gf) c.gf=mapG(c.gf); }); });
  FATE = FATEOVR ? clone(FATEOVR) : clone(G.FATE);
}
const UG = g => UNITS.filter(u=>u.g===g);
const unitById = id => UNITS.find(u=>u.id===id);

function compressImage(file,maxW,maxBytes){
  return new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{
    let w=im.width,h=im.height; const sc=Math.min(1,(maxW||1000)/w); w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(im,0,0,w,h);
    let q=0.8, d=cv.toDataURL('image/jpeg',q); while(d.length*0.75>(maxBytes||220000) && q>0.35){ q-=0.1; d=cv.toDataURL('image/jpeg',q); } ok(d);
  }; im.onerror=no; im.src=fr.result; }; fr.onerror=no; fr.readAsDataURL(file); });
}

function upgradeS(){ const d=newLife(S.num,S.cname); Object.keys(d).forEach(k=>{ if(S[k]==null) S[k]=d[k]; }); ['vals','g','ab','flags','cards','ch','u','fate','w','xpw'].forEach(k=>{ if(!S[k]||typeof S[k]!=='object') S[k]={}; }); if(!Array.isArray(S.perks)) S.perks=[]; if(!Array.isArray(S.crisisLog)) S.crisisLog=[]; if(!Array.isArray(S.pairLog)) S.pairLog=[]; GK.forEach(k=>{ if(S.g[k]==null) S.g[k]=G.START_G; }); AB.forEach(k=>{ if(S.ab[k]==null) S.ab[k]=2; }); }
function abil(k){ return Math.floor(S.ab[k]||0); }
function diceBonus(k){ let b=0; perksOf('dice').forEach(p=>{ if(p.a===k) b+=p.v; }); const P=pathById(S.path); if(P&&P.dice&&P.dice[k]) b+=P.dice[k]; return b; }
function modOf(k){ return abil(k)+diceBonus(k); }
function roll(k,dc,pen){ const d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6); const m=modOf(k)-(pen||0); const tot=d1+d2+m; const ok = (d1+d2===12) || (d1+d2!==2 && tot>=dc); return {d1,d2,m,tot,dc,s:k,ok}; }
/* 효과 적용: 되돌릴 수 있도록 실제 변화량(delta)을 돌려줌 */
function applyFx(fx){
  const d={g:{},ab:{},v:{},flags:[]}; fx=fx||{};
  Object.entries(fx.g||{}).forEach(([k,v])=>{ if(!GK.includes(k)||!v) return; const before=S.g[k]; S.g[k]=r1(clamp(before+v,0,10)); d.g[k]=r1(S.g[k]-before); if(k==='money'&&d.g[k]>0) S.earned=r1((S.earned||0)+d.g[k]); });
  Object.entries(fx.ab||{}).forEach(([k,v])=>{ if(!AB.includes(k)||!v) return; const b=S.ab[k]; S.ab[k]=r1(clamp(b+v,0,12)); d.ab[k]=r1(S.ab[k]-b); });
  Object.entries(fx.v||{}).forEach(([k,v])=>{ if(!v) return; S.vals[k]=r1(clamp((S.vals[k]||0)+v,0,30)); d.v[k]=v; });
  (fx.flags||[]).forEach(f=>{ if(f && !S.flags[f]){ S.flags[f]=1; d.flags.push(f); } });
  return d;
}
function revertFx(d){ if(!d) return; Object.entries(d.g||{}).forEach(([k,v])=>{ S.g[k]=r1(clamp(S.g[k]-v,0,10)); if(k==='money'&&v>0) S.earned=r1((S.earned||0)-v); }); Object.entries(d.ab||{}).forEach(([k,v])=>{ S.ab[k]=r1(S.ab[k]-v); }); Object.entries(d.v||{}).forEach(([k,v])=>{ S.vals[k]=r1((S.vals[k]||0)-v); }); (d.flags||[]).forEach(f=>delete S.flags[f]); }
function fxHTML(d){
  const a=[];
  Object.entries(d.g||{}).forEach(([k,v])=>{ if(v) a.push(`<span class="chg ${v>0?'p':'m'}">${G.GAUGES[k].e}${G.GAUGES[k].n} ${v>0?'+':''}${r1(v)}</span>`); });
  Object.entries(d.ab||{}).forEach(([k,v])=>{ if(v) a.push(`<span class="chg ${v>0?'p':'m'}">${G.ABIL_E[k]}${k} ${v>0?'+':''}${r1(v)}</span>`); });
  Object.entries(d.v||{}).forEach(([k,v])=>{ if(v) a.push(`<span class="chg ${v>0?'p':'m'}">🧭${k} ${v>0?'+':''}${r1(v)}</span>`); });
  return a.join('');
}
function addXP(n){ if(!n) return; let m=1; perksOf('xp').forEach(p=>m+=p.v); S.xp+=Math.round(n*m); while(S.lv<G.LV.length && S.xp>=G.LV[S.lv]){ S.lv++; S.perkQ=(S.perkQ||0)+1; } }
function lvProg(){ const a=G.LV[S.lv-1]||0, b=G.LV[S.lv]||a+100; return {p:clamp((S.xp-a)/(b-a),0,1), need:b-S.xp}; }
function makePerkOffer(){
  if(S.perkOffer || !(S.perkQ>0)) return;
  const pool=G.PERKS.filter(p=>!hasPerk(p.id));
  S.perkOffer=shuffle(pool).slice(0,3).map(p=>p.id);
  if(!S.perkOffer.length){ S.perkOffer=null; S.perkQ=0; }
}
function checkCrisis(){
  if(S.crisis) return;
  for(const k of GK){ if(S.g[k]<0.5){
    if(hasPerk('shield')){ S.perks=S.perks.filter(x=>x!=='shield'); S.g[k]=2; toast('🛡️ 버팀목이 위기를 막아 주었다! (재능 카드 소모)',4000); continue; }
    S.crisis={type:k, at:Date.now(), tried:[]}; toast(`${G.CRISES[k].e} 위기! ${G.CRISES[k].n} — 극복해야 다음 시기로 갈 수 있어요`,4500); return; } }
}
function actFx(a,n){
  // a: ACTS 항목, n: 토큰 수 → 총 효과
  const fx={g:{},ab:{},v:{}};
  const add=(o,src,mul)=>Object.entries(src||{}).forEach(([k,v])=>o[k]=(o[k]||0)+v*mul);
  add(fx.g,a.g,n); add(fx.ab,a.ab,n); add(fx.v,a.v,n);
  const P=pathById(S.path); if(P&&P.bonus&&P.bonus[a.k]){ add(fx.g,P.bonus[a.k].g,n); add(fx.ab,P.bonus[a.k].ab,n); }
  (S.perks||[]).map(perkById).filter(p=>p&&p.k==='act'&&p.a===a.k).forEach(p=>{ add(fx.g,p.g,n); add(fx.ab,p.ab,n); });
  return fx;
}
function decayOf(){ const d=clone(G.DECAY[grade()]); perksOf('decay').forEach(p=>{ d[p.gk]=Math.max(0,(d[p.gk]||0)-p.v); }); return d; }
function tokensOf(){ let t=G.TOKENS[grade()]; perksOf('tok').forEach(p=>t+=p.v); t-=(S.tokPen||0); return Math.max(3,t); }
function visibleChoices(u){ return u.ev.c.map((c,i)=>({c,i})).filter(x=>!x.c.p || (S.path && x.c.p.includes(S.path))); }
function goalScore(){ const T=GOAL_T[S.goal]; if(!T) return 0; return clamp(T.f(S)/T.t,0,1); }

function resolveEvent(uid,ci,opt){
  const u=unitById(uid); const c=u.ev.c[ci]; if(!c) return;
  const st=S.u[uid]; opt=opt||{};
  if(c.cost) Object.entries(c.cost).forEach(([k,v])=>{ S.g[k]=r1(clamp(S.g[k]-v,0,10)); });
  let rr=null, ok=true;
  if(c.chk && c.chk.s){ rr=roll(c.chk.s,evDC(c),opt.pen||0); ok=rr.ok; }
  const fx = ok ? {g:c.g, ab:Object.assign({},c.ab||{}), v:c.v, flags:[c.fs&&ok?c.fs:c.f].filter(Boolean)} : {g:c.gf, v:c.v, flags:[c.ff||c.f].filter(Boolean)};
  if(c.chk && c.chk.s && ok){ fx.ab[c.chk.s]=(fx.ab[c.chk.s]||0)+0.3; }
  const d=applyFx(fx);
  if(u.sage) S.cards[uid]=1;
  st.ev={c:ci, ok, roll:rr, d, cost:c.cost||null, timeout:!!opt.timeout, at:Date.now()};
  const prev=S.ch[uid];
  S.ch[uid]= prev ? Object.assign({},prev,{c:ci,ok,changed:true,reason:opt.reason||prev.reason||'',at:Date.now()}) : {c:ci,first:ci,ok,at:Date.now()};
  if(!prev){ addXP(G.XP.ev+(ok&&rr?G.XP.evOk:0)); }
  if(st.ph==='event') st.ph='event';
  checkCrisis();
  sv.rolling = !!rr; if(rr) setTimeout(()=>{ sv.rolling=false; render(); },1200);
  saveS();
}
function undoEvent(uid){ const st=S.u[uid]; if(!st||!st.ev) return; revertFx(st.ev.d); if(st.ev.cost) Object.entries(st.ev.cost).forEach(([k,v])=>{ S.g[k]=r1(clamp(S.g[k]+v,0,10)); }); }

function radarSVG(vals,size){
  const K=VALUE_KEYS, n=K.length, sz=size||220, R=sz/2-34, cx=sz/2, cy=sz/2, MAX=15;
  const pt=(i,r)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  let g=''; [0.33,0.66,1].forEach(f=>{ g+=`<polygon points="${K.map((k,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#e3ddd1"/>`; });
  K.forEach((k,i)=>{ const [x,y]=pt(i,R); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e3ddd1"/>`; const [lx,ly]=pt(i,R+18); g+=`<text x="${lx}" y="${ly+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a37">${k}</text>`; });
  g+=`<polygon points="${K.map((k,i)=>pt(i,R*Math.min(vals[k]||0,MAX)/MAX).join(',')).join(' ')}" fill="rgba(59,91,219,.25)" stroke="#3b5bdb" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${sz} ${sz}" width="100%" style="max-width:${sz}px">${g}</svg>`;
}

  else if(k==='edMode'){ edMode=v; render(); }
});

/* =====================================================================
   ⑧ 내용 편집 (모든 반 공통)
   ===================================================================== */
let ED=null, FED=null, edMode='unit', FDRAFT=null;
function getPath(o,p){ return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o); }
function setPath(o,p,v){ const ks=p.split('.'); let a=o; for(let i=0;i<ks.length-1;i++){ if(a[ks[i]]==null) a[ks[i]]=isNaN(+ks[i+1])?{}:[]; a=a[ks[i]]; } a[ks[ks.length-1]]=v; }
function edRoot(){ return edMode==='fate' ? FDRAFT : ED.d; }
function fIn(path,label,opt){ opt=opt||{}; let v=getPath(edRoot(),path); if(opt.type==='csv') v=(v||[]).join(', '); else if(opt.type==='lines') v=(v||[]).join('\n');
  const at=`data-ed="${path}" data-edtype="${opt.type||'text'}"`;
  const f = opt.sel ? `<select class="inp" ${at}>${opt.sel.map(o=>`<option value="${o}" ${String(v||'')===o?'selected':''}>${o||'(없음)'}</option>`).join('')}</select>` : opt.area ? `<textarea class="inp" ${at} style="min-height:${opt.h||80}px">${esc(v)}</textarea>` : `<input class="inp" ${at} ${opt.type==='num'?'type="number"':''} value="${esc(v==null?'':v)}">`;
  return `<label class="lb">${label}</label>${f}${opt.help?`<div class="muted">${opt.help}</div>`:''}`; }
function fImg(path,label){ const v=getPath(edRoot(),path)||''; return `<label class="lb">🖼️ ${label}</label><div class="row"><input type="file" accept="image/*" data-edimg="${path}"><input class="inp" style="flex:1;min-width:200px" data-ed="${path}" data-edtype="text" placeholder="또는 이미지 주소(https://...)" value="${esc(v.startsWith('img:')?'':v)}">${v?`<button class="btn sm ghost" data-act="edImgDel" data-v="${path}">이미지 빼기</button>`:''}</div>${imgHTML(v)}`; }
function fNums(base,keys,label){ const o=getPath(edRoot(),base)||{}; return `<label class="lb">${label}</label><div class="vals">${keys.map(([k,n])=>`<label>${n}<input type="number" step="0.5" min="-5" max="5" data-ed="${base}.${k}" data-edtype="num" value="${o[k]||0}"></label>`).join('')}</div>`; }
const GOPT=()=>GK.map(k=>[k,G.GAUGES[k].e+G.GAUGES[k].n]);
function choiceFields(base,c,opt){
  return `${fIn(base+'.t','선택지 문장')}<div class="grid2"><div>${fIn(base+'.chk.s','🎲 판정 능력치 (없으면 확실한 선택)',{sel:['',...AB]})}</div><div>${fIn(base+'.chk.dc','판정 목표 (보통 7~11)',{type:'num'})}</div></div>
  ${fIn(base+'.r','✅ 성공했을 때 이야기',{area:true})}${fNums(base+'.g',GOPT(),'성공 시 게이지 변화')}
  ${fIn(base+'.rf','❌ 실패했을 때 이야기 (판정이 있을 때만)',{area:true})}${fNums(base+'.gf',GOPT(),'실패 시 게이지 변화')}
  ${opt&&opt.vals?fNums(base+'.v',VALUE_KEYS.map(k=>[k,k]),'가치 나침반 변화 (성공·실패 모두)'):''}
  ${opt&&opt.bio?fIn(base+'.bio','자서전 한 줄 (성공 시)'):''}${opt&&opt.cost?fIn(base+'.cost.money','고르는 데 드는 돈 (없으면 0)',{type:'num'}):''}`;
}
function tEdit(){
  const g=+META.grade, L=UG(g);
  const modeBar=`<div class="row"><select class="inp" style="width:auto" data-tin="edMode"><option value="unit" ${edMode==='unit'?'selected':''}>📘 단원 내용 편집</option><option value="fate" ${edMode==='fate'?'selected':''}>🃏 운명 카드 편집</option><option value="title" ${edMode==='title'?'selected':''}>🏷️ 게임 이름 바꾸기</option></select></div>`;
  if(edMode==='fate') return tEditFate(modeBar);
  if(edMode==='title') return tEditTitle(modeBar);
  if(!ED || !L.some(u=>u.id===ED.uid)) ED={uid:L[0].id,d:clone(L[0]),dirty:false};
  const d=ED.d; const nChose=studs().filter(s=>(((s.u||{})[ED.uid]||{}).ev)).length;
  return `<div class="card ed"><div class="row" style="justify-content:space-between"><h2 style="margin:0">✏️ 내용 편집</h2>${modeBar}
  <div class="row"><select class="inp" style="width:auto" data-tin="edU">${L.map(u=>`<option value="${u.id}" ${u.id===ED.uid?'selected':''}>${esc(u.code)} ${esc(u.title)}${OVR[u.id]?' (편집됨)':''}</option>`).join('')}</select>
  <button class="btn ok" data-act="edSave">💾 저장 (모든 반 반영)</button><button class="btn ghost" data-act="edRevert">처음 내용으로</button></div></div>
  <p class="muted">${OVR[ED.uid]?'<span class="pill warm">편집본 사용 중</span>':'<span class="pill">기본 내용</span>'} ${ED.dirty?'<span class="pill bad">저장 안 됨</span>':''}</p>
  ${nChose?`<div class="banner">⚠️ 이 반에서 이미 ${nChose}명이 이 사건을 겪었습니다. 선택지의 <b>순서를 바꾸거나 지우면</b> 기록이 엉킵니다. 문구 다듬기는 괜찮습니다.</div>`:''}
  <fieldset><legend>단원 기본</legend><div class="grid2"><div>${fIn('title','단원 질문')}</div><div>${fIn('stage','인생 시기 이름')}</div><div>${fIn('age','나이',{type:'num'})}</div><div>${fIn('code','단원 번호')}</div></div>${fIn('concepts','개념어·가치어 (쉼표 구분) — 단원 글쓰기 채점 기준',{type:'csv'})}</fieldset>
  <fieldset><legend>🎲 인생 사건(상황)</legend>${fIn('ev.t','사건 제목')}${fIn('ev.s','상황 설명',{area:true,h:110})}${fIn('ev.q','갈림길 질문')}${fImg('ev.img','상황 이미지')}
  ${(d.ev.c||[]).map((c,ci)=>`<fieldset><legend>선택지 ${String.fromCharCode(65+ci)} ${c.p?'🧭 진로 전용':''}</legend>${choiceFields('ev.c.'+ci,c,{vals:true,bio:true,cost:true})}${fIn(`ev.c.${ci}.p`,'진로 전용이면 진로 아이디 (쉼표 구분, 비우면 모두에게 보임): '+G.PATHS.map(p=>p.id+'='+p.n).join(', '),{type:'csv'})}
   ${d.ev.c.length>2?`<button class="btn sm bad" data-act="edDelC" data-v="${ci}">이 선택지 삭제</button>`:''}</fieldset>`).join('')}
  ${d.ev.c.length<6?`<button class="btn sm ghost" data-act="edAddC">＋ 선택지 추가</button>`:''}
  <h3>🔁 돌아온 인연</h3>${(d.ev.echo||[]).map((e,ei)=>`<div class="grid2"><div>${fIn(`ev.echo.${ei}.f`,'예전 선택 표시(flag)')}</div><div>${fIn(`ev.echo.${ei}.s`,'붙는 문장')}</div></div>`).join('')||'<p class="muted">없음</p>'}</fieldset>
  <fieldset><legend>🤝 짝 딜레마</legend>${fIn('pair.t','제목')}${fIn('pair.s','상황',{area:true})}<div class="grid2"><div>${fIn('pair.co','협력 선택 문장')}</div><div>${fIn('pair.de','배신 선택 문장')}</div></div>${fIn('pair.g','걸린 게이지',{sel:GK})}</fieldset>
  <fieldset><legend>🏘️ 공동체 기금</legend>${fIn('cm.t','제목')}${fIn('cm.s','상황',{area:true})}<div class="grid2"><div>${fIn('cm.good','목표 달성 시 문장')}</div><div>${fIn('cm.bad','목표 실패 시 문장')}</div></div></fieldset>
  <fieldset><legend>✏️ 차시 글쓰기 (형성평가)</legend>${(d.lessons||[]).map((l,li)=>`<fieldset><legend>${li+1}차시</legend><div class="grid2"><div>${fIn(`lessons.${li}.t`,'소단원 제목')}</div><div>${fIn(`lessons.${li}.p`,'교과서 쪽',{type:'num'})}</div></div>${fIn(`lessons.${li}.q`,'문항',{area:true})}${fIn(`lessons.${li}.any`,'반드시 쓸 개념어 (쉼표, 하나 이상)',{type:'csv'})}${fImg(`lessons.${li}.img`,'문항 이미지')}</fieldset>`).join('')}</fieldset>
  <fieldset><legend>📝 단원 글쓰기 (RAFTS · 관문)</legend>${fIn('rafts.R','R 역할')}${fIn('rafts.A','A 독자')}${fIn('rafts.F','F 형식')}${fIn('rafts.T','T 주제',{area:true,h:120})}${fIn('rafts.S','S 강력한 동사')}
  <div class="grid2"><div>${fIn('rafts.need','개념어 최소 개수',{type:'num'})}</div><div>${fIn('rafts.min','최소 글자 수',{type:'num'})}</div></div>${fIn('rafts.cond','스스로 확인하기 조건 (한 줄에 하나)',{type:'lines',area:true})}${fImg('rafts.img','과제 자료 이미지')}</fieldset>
  <fieldset><legend>🃏 사상가 카드</legend>${fIn('sage.n','사상가 이름')}${fIn('sage.s','핵심 생각 (내 말로 요약)',{area:true})}</fieldset>
  <div class="row"><button class="btn ok" data-act="edSave">💾 저장 (모든 반 반영)</button></div></div>`;
}
function tEditTitle(modeBar){
  return `<div class="card ed"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🏷️ 게임 이름 바꾸기</h2>${modeBar}</div>
  <p class="muted">여기서 바꾼 이름은 <b>모든 반·모든 학생 화면</b>(첫 화면, 교사 화면 맨 위, 맨 아래 줄, 브라우저 탭)에 바로 바뀝니다. 사이트 주소(…/onelife/)는 그대로라서 이미 나눠 준 링크·QR은 계속 쓸 수 있습니다.</p>
  <label class="lb">지금 이름</label><div style="font-size:20px;font-weight:700;margin-bottom:10px">🌱 ${esc(TITLE)}</div>
  <label class="lb">새 이름 (1~20자)</label><input class="inp" id="titleIn" maxlength="20" value="${esc(TITLE)}">
  <div class="row" style="margin-top:10px"><button class="btn warm" data-act="titleSave">💾 이름 저장</button><button class="btn line" data-act="titleRevert">↩️ 처음 이름(${esc(TITLE0)})으로</button></div></div>`;
}
function tEditFate(modeBar){
  if(!FDRAFT) FDRAFT=clone(FATE);
  const id=(FED&&FED.id)||FDRAFT[0].id; const fi=FDRAFT.findIndex(f=>f.id===id); const f=FDRAFT[fi];
  return `<div class="card ed"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🃏 운명 카드 편집</h2>${modeBar}
  <div class="row"><select class="inp" style="width:auto" data-tin="edF">${FDRAFT.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${x.e} ${esc(x.t)} (${x.g===1?'1학년':x.g===2?'2학년':'공통'})</option>`).join('')}</select><button class="btn sm ghost" data-act="fAdd">＋ 새 카드</button><button class="btn ok" data-act="fSave">💾 저장 (모든 반 반영)</button><button class="btn ghost" data-act="fRevert">처음 카드로</button></div></div>
  ${f?`<fieldset><legend>${f.e} ${esc(f.t)}</legend><div class="grid2"><div>${fIn(fi+'.t','카드 제목')}</div><div>${fIn(fi+'.e','이모지')}</div><div>${fIn(fi+'.k','종류',{sel:['위기','기회']})}</div><div>${fIn(fi+'.g','학년 (1, 2, 0=공통)',{type:'num'})}</div></div>${fIn(fi+'.s','상황',{area:true})}
  ${(f.c||[]).map((c,ci)=>`<fieldset><legend>선택 ${ci+1}</legend>${choiceFields(fi+'.c.'+ci,c,{})}${f.c.length>1?`<button class="btn sm bad" data-act="fDelC" data-v="${ci}">삭제</button>`:''}</fieldset>`).join('')}
  ${(f.c||[]).length<4?`<button class="btn sm ghost" data-act="fAddC">＋ 선택 추가</button>`:''}</fieldset>`:''}</div>`;
}
function bindEditor(){
  if(MODE!=='teacher'||ttab!=='edit') return;
  app.querySelectorAll('[data-ed]').forEach(el=>{ const fn=()=>{ const t=el.dataset.edtype; let v=el.value; if(t==='csv') v=v.split(/[,，]/).map(x=>x.trim()).filter(Boolean); else if(t==='lines') v=v.split('\n').map(x=>x.trim()).filter(Boolean); else if(t==='num') v=v===''?0:+v;
    const root=edRoot(); setPath(root,el.dataset.ed,v); if(edMode==='fate') FDRAFT.dirty=true; else ED.dirty=true; }; el.oninput=fn; if(el.tagName==='SELECT') el.onchange=fn; });
  app.querySelectorAll('[data-edimg]').forEach(inp=>{ inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f) return; toast('이미지를 줄이는 중…');
    try{ const dataUrl=await compressImage(f,1000,220000); const id='i'+Date.now().toString(36)+newCode(3); await backend.set(P_CONTENT+'/img/'+id,{d:dataUrl,at:Date.now()}); IMG[id]=dataUrl; setPath(edRoot(),inp.dataset.edimg,'img:'+id); ED.dirty=true; toast('🖼️ 이미지를 넣었어요. [저장]을 눌러야 학생에게 보입니다.'); render(); }catch(e){ toast('이미지를 넣지 못했어요.'); } }; });
}
function cleanUnit(d){ (d.ev.c||[]).forEach(c=>{ if(c.chk&&!c.chk.s) delete c.chk; if(c.cost&&!(+c.cost.money)) delete c.cost; if(Array.isArray(c.p)&&!c.p.length) delete c.p; }); return d; }
Object.assign(TA,{
  async edSave(){ const d=cleanUnit(clone(ED.d)); if(!d.ev||!d.ev.c||d.ev.c.length<2) return toast('선택지는 2개 이상이어야 해요.'); await backend.set(P_CONTENT+'/units/'+ED.uid,d); ED.dirty=false; toast('💾 저장했습니다. 모든 반에 반영됩니다.'); },
  async edRevert(){ if(!confirm('이 단원을 처음 내용으로 되돌릴까요?')) return; await backend.remove(P_CONTENT+'/units/'+ED.uid); setTimeout(()=>{ ED={uid:ED.uid,d:clone(unitById(ED.uid)),dirty:false}; render(); },300); },
  edAddC(){ ED.d.ev.c.push({t:'새 선택지',v:{},g:{},r:'성공했을 때 이야기',bio:''}); ED.dirty=true; render(); },
  edDelC(ds){ if(!confirm('이 선택지를 삭제할까요?')) return; ED.d.ev.c.splice(+ds.v,1); ED.dirty=true; render(); },
  edImgDel(ds){ setPath(edRoot(),ds.v,''); ED.dirty=true; render(); },
  fAdd(){ const id='fx'+Date.now().toString(36); FDRAFT.push({id,g:0,e:'🃏',k:'위기',t:'새 운명 카드',s:'상황을 쓰세요',c:[{t:'선택 1',r:'결과'}]}); FED={id}; render(); },
  fAddC(){ const f=FDRAFT.find(x=>x.id===((FED&&FED.id)||FDRAFT[0].id)); f.c.push({t:'새 선택',r:'결과'}); render(); },
  fDelC(ds){ const f=FDRAFT.find(x=>x.id===((FED&&FED.id)||FDRAFT[0].id)); f.c.splice(+ds.v,1); render(); },
  async fSave(){ const arr=clone(FDRAFT).map(f=>{ f.g=+f.g||0; (f.c||[]).forEach(c=>{ if(c.chk&&!c.chk.s) delete c.chk; }); return f; }); await backend.set(P_CONTENT+'/fate',arr); toast('💾 운명 카드를 저장했습니다.'); },
  async titleSave(){ const el=document.getElementById('titleIn'); const v=((el&&el.value)||'').replace(/\s+/g,' ').trim(); if(!v) return toast('이름을 입력하세요.'); if(v.length>20) return toast('20자 이하로 써 주세요.'); await backend.set(P_CONTENT+'/title',{name:v,at:Date.now()}); TITLE=v; applyTitle(); render(); toast('💾 게임 이름을 「'+v+'」(으)로 바꿨습니다.'); },
  async titleRevert(){ if(!confirm('게임 이름을 「'+TITLE0+'」(으)로 되돌릴까요?')) return; await backend.remove(P_CONTENT+'/title'); TITLE=TITLE0; applyTitle(); render(); toast('↩️ 처음 이름으로 되돌렸습니다.'); },
  async fRevert(){ if(!confirm('운명 카드를 처음 상태로 되돌릴까요?')) return; await backend.remove(P_CONTENT+'/fate'); FDRAFT=null; setTimeout(render,300); }
});

/* ---------- 클릭 연결 ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  if(el.classList.contains('ovl') && e.target!==el) return;
  const H = MODE==='teacher' ? TA : SA; if(H[el.dataset.act]) H[el.dataset.act](el.dataset);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.id==='pinIn') TA.pin(); });

function applyTitle(){ document.title=TITLE+' — 도덕 인생 시뮬레이션'; }
/* ---------- ⑨ 시작 ---------- */
(async function(){
  await initBackend();
  backend.on(P_CONTENT+'/units',v=>{ OVR=v||{}; rebuildUnits(); if(ED&&!ED.dirty&&unitById(ED.uid)) ED.d=clone(unitById(ED.uid)); safeRender(); });
  backend.on(P_CONTENT+'/title',v=>{ TITLE=(v&&v.name)||TITLE0; applyTitle(); safeRender(); });
  backend.on(P_CONTENT+'/fate',v=>{ FATEOVR=v||null; rebuildUnits(); if(!(FDRAFT&&FDRAFT.dirty)) FDRAFT=null; safeRender(); });
  if(MODE==='teacher'){ if(tAuthed) startTeacherData(); else if(!ROOM){ ROOM='OL'+newCode(4); history.replaceState(null,'','?mode=teacher&room='+ROOM); } render(); }
  else startStudent();
})();
</script>
