<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>꿈결마을 이웃 프로젝트</title>
<link rel="icon" href="ggumsong.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f3f5fa; --paper:#ffffff; --ink:#1b2a4a; --sub:#5b6478; --line:#dfe4ef;
  --navy:#1f3a6e; --gink:#f2c014; --gink2:#fff6cf; --teal:#2a9d8f; --soft:#eef2fb;
  --ok:#2a9d8f; --warn:#e9a23b; --bad:#d64545; --star:#e8a200; --moon:#5b6fd6;
  --shadow:0 2px 0 rgba(27,42,74,.06),0 8px 24px rgba(27,42,74,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 120px}
.twrap{max-width:1320px;margin:0 auto;padding:16px 16px 80px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:20px;margin:0;flex:1;min-width:180px;display:flex;align-items:center;gap:8px}
.top h1 img{width:36px;height:36px;object-fit:contain}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.pill.live{border-color:var(--ok);color:var(--ok)}
.pill.demo{border-color:var(--warn);color:#a86b00}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h2{font-size:23px;margin:0 0 12px}
h3{font-size:18px;margin:18px 0 8px}
.muted{color:var(--sub);font-size:15px}
.tip{background:#eef6f5;border-left:5px solid var(--teal);border-radius:10px;padding:12px 14px;margin:0 0 16px;font-size:15.5px}
.tip b{color:#1d6f65}
.concept{background:var(--gink2);border:2px solid var(--gink);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.concept .h{font-weight:800;color:#7a5a00;margin-bottom:4px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:440px){.g2,.g3{grid-template-columns:1fr}}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;transition:.12s;display:block;width:100%}
.opt:hover{border-color:#b9c3da}
.opt.sel{border-color:var(--navy);background:#eef2fb;box-shadow:0 0 0 3px rgba(31,58,110,.15)}
.opt.right{border-color:var(--ok);background:#e6f6f3}
.opt.wrong{border-color:var(--bad);background:#fdeeee}
.opt .e{font-size:28px;line-height:1}
.opt .t{font-weight:700;margin-top:4px}
.opt .d{font-size:14px;color:var(--sub);margin-top:2px}
.bigopt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;font-size:16.5px}
.bigopt .lt{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.bigopt.sel .lt{background:var(--navy)}
.btn{border:none;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--ink);color:#fff;font-size:17px}
.btn:active{transform:translateY(1px)}
.btn.acc{background:var(--navy)}
.btn.gink{background:var(--gink);color:#3b2d00}
.btn.teal{background:var(--teal)}
.btn.bad{background:var(--bad)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1.5px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}
.navbar .in{max-width:860px;width:100%;display:flex;gap:10px;justify-content:space-between}
.field{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.field:focus{outline:none;border-color:var(--teal)}
textarea.field{min-height:84px;resize:vertical}
label.lb{display:block;font-weight:700;margin:14px 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.center{text-align:center}
/* 꿈송이 말풍선 */
.say{display:flex;gap:10px;align-items:flex-end;margin:0 0 14px}
.say img{width:68px;height:68px;object-fit:contain;flex:none;animation:bob 2.6s ease-in-out infinite}
.say .bub{background:#fff;border:2px solid var(--navy);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:15.5px;box-shadow:var(--shadow)}
.say .bub b{color:var(--navy)}
.say.big img{width:110px;height:110px}
.say.big .bub{font-size:17px}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.hero img{width:170px;height:170px;object-fit:contain;animation:bob 2.6s ease-in-out infinite}
/* 팀 */
.team{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 14px;font-weight:800;color:#fff}
.team.star{background:var(--star)} .team.moon{background:var(--moon)}
.teambig{border-radius:22px;padding:26px;color:#fff;text-align:center}
.teambig.star{background:linear-gradient(135deg,#f2b705,#e08e00)} .teambig.moon{background:linear-gradient(135deg,#6b7fe6,#3c4fb8)}
.teambig .e{font-size:64px;line-height:1}
.teambig .n{font-size:30px;font-weight:900;margin-top:6px}
canvas.dots{width:100%;max-width:520px;aspect-ratio:3/2;background:#fff;border:2px solid var(--line);border-radius:16px;display:block;margin:0 auto}
.coin{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.coin .who{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px}
.coin .who b{display:block;font-size:30px}
input[type=range]{width:100%;accent-color:var(--navy);height:34px}
/* 진행 */
.steps{display:flex;gap:4px;margin:0 0 14px}
.steps div{flex:1;height:8px;border-radius:4px;background:var(--line)}
.steps div.on{background:var(--navy)}
.steps div.done{background:var(--teal)}
.stepname{font-size:14px;color:var(--sub);margin-bottom:6px;font-weight:600}
/* 주민 */
.resgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.resgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.resgrid{grid-template-columns:1fr}.ind .box small{font-size:11.5px}}
.res{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;position:relative}
.res .hd{display:flex;align-items:center;gap:8px}
.res .av{font-size:28px;line-height:1}
.res .nm{font-weight:800;line-height:1.2}
.res .rl{font-size:12.5px;color:var(--sub)}
.res .fc{margin-left:auto;font-size:30px;line-height:1}
.res .q{font-size:13.5px;color:#34405c;margin-top:6px}
.res .tr{height:8px;background:#e9edf5;border-radius:4px;overflow:hidden;margin-top:6px}
.res .tr i{display:block;height:100%;transition:width .4s}
.res.low{border-color:var(--bad);background:#fff7f7}
.ind{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ind .box{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.ind .box b{font-size:26px;display:block;line-height:1.15}
.ind .box small{color:var(--sub);font-weight:700;font-size:13px}
@media (max-width:440px){.ind .box b{font-size:21px}}
.pol{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.pol .nm{flex:1}
.pol .nm b{display:block}
.pol .nm small{color:var(--sub);font-size:13px}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800}
.stp .v{min-width:26px;text-align:center;font-weight:800;font-size:20px}
.remain{position:sticky;top:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;z-index:5;margin-bottom:8px}
.remain.zero{background:var(--teal)}
.scene{background:var(--soft);border-radius:14px;padding:16px;margin-bottom:14px}
.scene .tag{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:3px 10px;font-size:13.5px;font-weight:700;margin-bottom:8px}
.scene .src{font-size:13px;color:var(--sub);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.chip.sel{border-color:var(--navy);background:#eef2fb;color:var(--navy)}
.symbtn{width:46px;height:46px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:24px}
.symbtn.sel{border-color:var(--navy);background:#eef2fb}
.flag{display:inline-flex;width:84px;height:56px;border-radius:8px;overflow:hidden;position:relative;border:2px solid rgba(0,0,0,.15);flex:none}
.flag i{flex:1}
.flag span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.flag.sm{width:42px;height:28px;border-radius:5px}
.flag.sm span{font-size:14px}
.cityic{display:inline-flex;width:42px;height:42px;border-radius:12px;background:var(--soft);align-items:center;justify-content:center;font-size:24px;flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13.5px;background:var(--soft);color:var(--navy)}
.badge.melt{background:#fde9dc;color:#a4461a} .badge.salad{background:#e2f5e7;color:#1f7a3c} .badge.apart{background:#eceef3;color:#4b5568}
.ncard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%}
.ncard.sel{border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,58,110,.15)}
.ncard .nh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ncard .nn{font-weight:800;font-size:17px;line-height:1.25}
.ncard .ns{font-size:13px;color:var(--sub)}
.slog{font-weight:900;font-size:18px;color:var(--navy);margin:6px 0;line-height:1.35}
.small{font-size:13.5px}
.rlist{margin:6px 0 4px;padding:0;list-style:none;font-size:14.5px}
.rlist li{padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:5px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:100;font-weight:700;max-width:90vw;box-shadow:var(--shadow);animation:pop .2s}
@keyframes pop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.overlay{position:fixed;inset:0;background:rgba(20,26,40,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px}
.modal{background:var(--paper);border-radius:20px;max-width:760px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.alert{border:4px solid var(--bad)}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:14px;font-weight:700}
.banner.ok{background:#e3f4f1;color:#16655b}
.banner.warn{background:#fff3dc;color:#8a5a00}
.banner.bad{background:#fde8e8;color:#9b2c2c}
.blink{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.5}}
.delta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.delta span{border-radius:8px;padding:3px 9px;font-weight:700;font-size:14px;background:#eef2fb}
.delta .up{background:#e3f4f1;color:#16655b} .delta .dn{background:#fde8e8;color:#9b2c2c}
.oxbtn{width:64px;height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:900}
.oxbtn.sel{border-color:var(--navy);background:#eef2fb}
.oxbtn.right{border-color:var(--ok);background:#e3f4f1}
.oxbtn.wrong{border-color:var(--bad);background:#fde8e8}
.caselist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.caselist{grid-template-columns:repeat(2,1fr)}}
.casebtn{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.casebtn .e{font-size:30px}
.casebtn.done{border-color:var(--ok);background:#effaf7}
/* 교사 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.tabs button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 14px;font-weight:700;font-size:15.5px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.phasebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.phasebar .lbl{font-weight:900;color:var(--sub);width:58px;font-size:14px}
.phasebar button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.phasebar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat .box{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;min-width:120px}
.stat .box b{font-size:28px;display:block;line-height:1.1}
.stat .box small{color:var(--sub);font-weight:600}
.obar{display:grid;gap:4px;margin:8px 0}
.obar .lbl{display:flex;justify-content:space-between;font-size:15px;font-weight:600;gap:8px}
.obar .tr{height:24px;background:#e9edf5;border-radius:6px;overflow:hidden}
.obar .tr i{display:block;height:100%;transition:width .5s}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.wcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;font-size:15px}
.wcard:hover{border-color:var(--navy)}
.wcard small{display:block;color:var(--sub);font-weight:700;margin-bottom:4px}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.faces{font-size:22px;letter-spacing:2px}
.prog{display:flex;flex-wrap:wrap;gap:6px}
.prog span{font-size:13px;border-radius:8px;padding:3px 9px;background:#fff;border:1.5px solid var(--line);font-weight:600}
.prog span.done{background:#e3f4f1;border-color:var(--ok);color:#16655b}
table.tb{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff}
table.tb td,table.tb th{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.tb th{background:var(--soft)}
.qrbox{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:12px}
.url{word-break:break-all;background:#fff;border:1.5px dashed var(--line);padding:10px;border-radius:10px;font-size:15px;font-weight:600}
.punch{font-size:28px;font-weight:900;line-height:1.35;color:var(--navy)}
.spot{font-size:34px;font-weight:800;line-height:1.45;padding:10px}
body.big .twrap{font-size:20px} body.big .obar .lbl{font-size:19px} body.big .wcard{font-size:18px} body.big .punch{font-size:36px}
footer{text-align:center;color:var(--sub);font-size:12.5px;margin-top:30px;padding:0 16px 20px}
</style>
</head>

function budgetUsed(c){ return POL.reduce((a,p)=>a+(+c.budget[p.k]||0),0); }
function cityCalc(c, fired){
  const h={}; RES.forEach(r=>h[r.k]=r.base);
  const dir=DIRM[c.dir]; const mult=dir?dir.mult:1;
  POL.forEach(p=>{ const n=+c.budget[p.k]||0; for(const k in p.per) h[k]+=p.per[k]*n*mult; });
  const b=k=>+c.budget[k]||0;
  if(!b('life')){ h.r2-=5; h.r3-=5; }
  if(!b('right')) h.r3-=6;
  if(!b('know')&&!b('fest')&&!b('hosp')) h.r6-=6;
  if(dir) for(const k in dir.base) h[k]+=dir.base[k];
  (fired||[]).forEach(eid=>{
    const E=EVM[eid]; if(!E) return;
    if(c.dir==='melt') MINOR.forEach(k=>h[k]-=3);
    const ans=c.ev[eid]; if(!ans||ans.o==null) return;
    const o=E.opts[ans.o]; const prot=E.pol.some(p=>b(p)>=2);
    for(const k in o.eff){ let v=o.eff[k]; if(v>0) v*=mult; else if(prot) v*=0.5; h[k]+=v; }
  });
  for(const k in h) h[k]=Math.round(clamp(h[k]));
  const vals=Object.values(h); const avg=Math.round(vals.reduce((a,x)=>a+x,0)/vals.length);
  const mn=Math.min(...vals), mx=Math.max(...vals);
  let conflict=clamp((100-avg)*0.9+(mx-mn)*0.4); if(c.dir==='melt') conflict*=0.4; if(c.dir==='apart') conflict*=0.8;
  const minK=RES.reduce((a,r)=>h[r.k]<h[a]?r.k:a,'r1');
  return {h,avg,conflict:Math.round(conflict),low:vals.filter(x=>x<40).length,minK};
}

const clean = o => o==null ? null : JSON.parse(JSON.stringify(o));
let DBMODE='demo', backend=null;
async function initBackend(){
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL){
    try{
      const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const db = D.getDatabase(A.initializeApp(FIREBASE_CONFIG,'multi'));
      backend = {
        set:(p,v)=>D.set(D.ref(db,p),clean(v)),
        update:(p,v)=>D.update(D.ref(db,p),clean(v)),
        remove:p=>D.remove(D.ref(db,p)),
        on:(p,cb)=>D.onValue(D.ref(db,p),s=>cb(s.val()),err=>toast('⚠️ 데이터베이스 연결 오류: '+err.message))
      };
      DBMODE='live'; return;
    }catch(e){ console.error(e); toast('⚠️ Firebase 연결 실패 → 체험 모드로 실행합니다'); }
  }
  const KEY='mcgame_demo_db';
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('mcgame') : null;
  const L=[];
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } };
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=(t,p)=>parts(p).reduce((o,k)=>o==null?undefined:o[k],t);
  const setAt=(t,p,v)=>{ const ks=parts(p); let o=t; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } const last=ks[ks.length-1]; if(v==null) delete o[last]; else o[last]=clean(v); };
  const fire=()=>{ const t=read(); L.forEach(l=>l.cb(clean(getAt(t,l.p))??null)); };
  const write=t=>{ try{ localStorage.setItem(KEY,JSON.stringify(t)); }catch(e){} fire(); bc&&bc.postMessage(1); };
  if(bc) bc.onmessage=fire;
  window.addEventListener('storage',e=>{ if(e.key===KEY) fire(); });
  backend = {
    set:async(p,v)=>{ const t=read(); setAt(t,p,v); write(t); },
    update:async(p,obj)=>{ const t=read(); for(const k in obj) setAt(t,p+'/'+k,obj[k]); write(t); },
    remove:async p=>{ const t=read(); setAt(t,p,null); write(t); },
    on:(p,cb)=>{ const l={p,cb}; L.push(l); setTimeout(()=>cb(clean(getAt(read(),p))??null),0); return ()=>{ const i=L.indexOf(l); if(i>=0) L.splice(i,1); }; }
  };
}

  if(n>=DOTS.length){ assignTeam(); return vDots(); }
  const i=n;
  return `${sHeader()}${phaseTitle()}<div class="card">
  ${say(`점이 <b>아주 잠깐</b> 나타났다가 사라져. 몇 개였는지 어림해서 적어 봐! 결과를 보고 <b>팀</b>을 나눌 거야. (${i+1}/${DOTS.length})`)}
  <canvas class="dots" id="dotc" width="600" height="400"></canvas>
  <div class="row" style="justify-content:center;margin-top:12px">${ui.dotIdx===i&&!ui.dotShow?`<input class="field" style="max-width:160px;text-align:center;font-size:22px;font-weight:800" inputmode="numeric" data-bind="dotIn" value="${esc(ui.dotIn)}" placeholder="몇 개?"><button class="btn acc" data-act="dotSubmit">확인</button>`:`<button class="btn gink" data-act="dotShow" ${ui.dotShow?'disabled':''}>👀 점 보기</button>`}</div></div>`;
}
function drawDots(n){
  const cv=document.getElementById('dotc'); if(!cv) return; const g=cv.getContext('2d'); g.clearRect(0,0,600,400);
  if(!ui.dotShow){ g.fillStyle='#c7cfe0'; g.font='bold 30px Pretendard,sans-serif'; g.textAlign='center'; g.fillText(ui.dotIdx===Object.keys(P.dots).length?'몇 개였을까요?':'준비되면 [점 보기]를 누르세요',300,210); return; }
  const pts=[]; let guard=0;
  while(pts.length<n && guard++<5000){ const x=30+Math.random()*540, y=30+Math.random()*340; if(pts.every(p=>(p[0]-x)**2+(p[1]-y)**2>400)) pts.push([x,y]); }
  g.fillStyle='#1f3a6e'; pts.forEach(p=>{ g.beginPath(); g.arc(p[0],p[1],8,0,Math.PI*2); g.fill(); });
}
function assignTeam(){ if(P.g) return; P.g = Math.random()<0.5?'star':'moon'; saveP(true); }
function vTeamCard(){
  const star=P.g==='star';
  return `<div class="card"><div class="teambig ${P.g}"><div class="e">${star?'⭐':'🌙'}</div><div class="n">${star?'별빛 팀':'달빛 팀'}</div>

/* 27-② 코인 */
function coinPair(r){ // 결정적 의사 무작위
  const seed=(P.id+r).split('').reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
  return {a:10+seed%30, b:10+(seed>>5)%30, flip:!!(seed&1)};
}
function vCoins(){
  if(!P.g) assignTeam();
  const my=P.g==='star'?'⭐ 별빛 팀':'🌙 달빛 팀', ot=P.g==='star'?'🌙 달빛 팀':'⭐ 별빛 팀';
  const done1=P.coins.r1!=null, done2=P.coins.r2!=null;
  if(done1&&done2&&P.mat) return `${sHeader()}${phaseTitle()}${waitCard('코인 나누기 끝! 결과는 곧 선생님 화면에서 함께 볼 거야. 두근두근…')}`;
  if(!done1||!done2){
    const r=done1?'r2':'r1', pr=coinPair(r);
    const L={lab:`${my} ${pr.a}번 이웃`,me:true}, R={lab:`${ot} ${pr.b}번 이웃`,me:false};
    const [A,B]=pr.flip?[R,L]:[L,R];
    const v=ui.coinDraft; const aVal=A.me?v:20-v;
    return `${sHeader()}${phaseTitle()}<div class="card"><div class="stepname">라운드 ${done1?2:1} / 3</div>
    ${say(`꿈결마을 기금 <b>코인 20개</b>를 두 이웃에게 나눠 줘. 이웃이 누구인지는 서로 몰라. 너 자신에게는 줄 수 없어.`)}
    <div class="coin"><div class="who"><div class="muted small">${esc(A.lab)}</div><b id="ca">${aVal}</b>코인</div><div style="font-size:28px">⚖️</div><div class="who"><div class="muted small">${esc(B.lab)}</div><b id="cb">${20-aVal}</b>코인</div></div>
    <input type="range" min="0" max="20" step="1" value="${A.me?v:20-v}" data-bind="coin" data-flip="${A.me?0:1}" style="margin-top:14px">
    <div class="row" style="justify-content:space-between" class="muted"><span class="muted small">← 왼쪽 이웃에게 더</span><span class="muted small">오른쪽 이웃에게 더 →</span></div></div>
    <div class="navbar"><div class="in"><span></span><button class="btn acc" data-act="coinSubmit" data-r="${r}">이렇게 나누기 →</button></div></div>`;
  }
  const order=shuffle([0,1,2]);
  return `${sHeader()}${phaseTitle()}<div class="card"><div class="stepname">라운드 3 / 3</div>
  ${say(`마지막! 세 가지 방법 중 하나를 골라 줘. 숫자는 <b>${my}</b>와 <b>${ot}</b> 전체가 받는 코인이야.`)}
  <div class="grid">${order.map(i=>{ const m=MAT[i]; return `<button class="opt bigopt" data-act="matPick" data-v="${m.k}"><span class="lt">${'ABC'[order.indexOf(i)]}</span><span>우리 팀(${my}) <b style="font-size:22px">${m.us}</b>개 · 상대 팀(${ot}) <b style="font-size:22px">${m.them}</b>개</span></button>`; }).join('')}</div></div>`;
}

/* 27-③ 반전 */
function classCoinStats(list){
  const res={star:{n:0,in:0},moon:{n:0,in:0},all:{n:0,in:0},mat:{MD:0,FAIR:0,MAX:0},matN:0};
  list.forEach(p=>{ if(!p.g) return; ['r1','r2'].forEach(r=>{ if(p.coins[r]!=null){ const v=+p.coins[r]; res[p.g].n++; res[p.g].in+=v; res.all.n++; res.all.in+=v; } }); if(p.mat){ res.mat[p.mat]++; res.matN++; } });
  const avg=o=>o.n?Math.round(o.in/o.n*10)/10:null;
  return {star:avg(res.star),moon:avg(res.moon),all:avg(res.all),mat:res.mat,matN:res.matN,n:res.all.n};
}
function vReveal(){

  ${say('비밀을 하나 알려 줄게. 사실 <b>별빛 팀과 달빛 팀은 점 세기와 아무 상관이 없어.</b> 컴퓨터가 <b>무작위</b>로 나눴어!',true)}

  <div class="ind"><div class="box"><small>우리 팀 이웃에게 (20개 중)</small><b>${myAvg??'-'}</b></div><div class="box"><small>상대 팀 이웃에게</small><b>${myAvg==null?'-':Math.round((20-myAvg)*10)/10}</b></div><div class="box"><small>라운드 3 선택</small><b style="font-size:17px">${m?esc(m.n):'-'}</b></div></div>

  ${say('5분 전에 생긴, <b>아무 의미 없는 팀</b>에도 마음이 기울었다면… 피부색, 말투, 종교처럼 눈에 보이는 차이라면 어떨까?')}</div>`;

  spot(el){ T.spot={v:el.dataset.v,w:el.dataset.w}; render(); },
  spotClose(el,ev){ if(ev && ev.target!==el) return; T.spot=null; render(); },
  natSave(){ const v=(document.getElementById('natIn').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8); if(!v) return toast('방 코드를 입력하세요.'); if(v===ROOM) return toast('이 방이 아니라 국가 만들기 때의 방 코드를 넣어 주세요.'); backend.update(`${BASE()}/meta`,{natRoom:v}); toast('🏛️ 연결했어요.'); },
  natClear(){ backend.update(`${BASE()}/meta`,{natRoom:null}); },
  csv(){ csvExport(); },
  reset(){ if(!confirm('이 방('+ROOM+')의 학생 기록을 모두 지울까요? 되돌릴 수 없습니다. (국가 만들기 기록은 지워지지 않습니다)')) return; backend.remove(BASE()).then(()=>backend.set(`${BASE()}/meta`,{phase:'lobby',created:Date.now()})); toast('🗑️ 지웠어요.'); },
  newRoom(){ if(!confirm('새 방(다른 반용)을 만들까요? 지금 방의 기록은 그대로 남습니다.')) return; location.search='?mode=teacher&room='+newCode(); }
};
const TBIND = { pin:v=>T.pin=v };

/* =========================================================
   ⑧ 이벤트 연결 · 시작
   ========================================================= */
document.addEventListener('error',e=>{ const t=e.target; if(t&&t.tagName==='IMG'&&t.src.indexOf(CHAR)>=0){ const sp=document.createElement('span'); sp.textContent='🌼'; sp.className=t.className; sp.style.cssText='display:inline-flex;align-items:center;justify-content:center;font-size:'+Math.max(24,Math.round((t.width||60)*0.7))+'px;width:'+(t.width||60)+'px;flex:none'; t.replaceWith(sp); } },true);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const A = MODE==='teacher'?TACT:SACT; const f=A[el.dataset.act]; if(f) f(el,e);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-bind]'); if(!el) return;
  const B = MODE==='teacher'?TBIND:SBIND; const f=B[el.dataset.bind]; if(f) f(el.value,el);
});
document.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; const el=e.target.closest('[data-bind]'); if(!el||el.tagName==='TEXTAREA') return;
  const map={room:'enterRoom',pin:'login',dotIn:'dotSubmit'}; const a=map[el.dataset.bind]; if(a){ e.preventDefault(); (MODE==='teacher'?TACT:SACT)[a](); } });

(async function start(){
  await initBackend();
  if(MODE==='teacher'){
    if(!ROOM){ ROOM=newCode(); history.replaceState(null,'','?mode=teacher&room='+ROOM); }
    let first=true;
    backend.on(`${BASE()}/meta`,v=>{ const old=META.natRoom; META=v||{}; if(first&&!v){ backend.set(`${BASE()}/meta`,{phase:'lobby',created:Date.now()}); } first=false; if(old!==META.natRoom) watchNatCount(); softRender(); });
    backend.on(`${BASE()}/players`,v=>{ PLAYERS=v||{}; softRender(); });
    render(); return;
  }
  if(DBMODE!=='live' && !ROOM) ROOM='SOLO';
  if(!ROOM){ render(); return; }
  P=loadP();
  let lastPhase=null, lastEvAt=null;
  backend.on(`${BASE()}/meta`,v=>{ META=v||{}; const ph=phase();
    if(P&&P.epoch&&META.created&&P.epoch!==META.created){ try{localStorage.removeItem(skey());}catch(e){} P=null; ui.cityStep=0; ui.det=null; ui.evResult=null; ui.voteTo=null; toast('선생님이 기록을 초기화했어요. 다시 입장해 주세요.'); render(); return; }
    if(P&&P.nick&&!P.epoch&&META.created){ P.epoch=META.created; saveP(true); }
    if(ph!==lastPhase){ ui.det=null; ui.evOpen=null; if(lastPhase!==null) window.scrollTo(0,0); lastPhase=ph; render(); return; }
    const at=META.event&&META.event.at; if(at!==lastEvAt){ lastEvAt=at; ui.evOpen=null; }
    softRender(); });
  backend.on(`${BASE()}/players`,v=>{ PLAYERS=v||{};
    if(P&&P.nick&&PLAYERS[P.id]==null&&P.epoch&&P.epoch===META.created){ saveP(true); }   // 연결이 끊겼다 돌아온 경우 내 기록 다시 올림
    if(['reveal','vote','wrap28'].includes(phase())) softRender(); });
  if(P&&P.nick&&P.city.done) ui.cityStep=2;
  render();
})();
</script>
</body>
</html>
