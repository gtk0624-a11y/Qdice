<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#6A4BC4">
<title>수업 참여</title>
<link rel="icon" href="ggumsong.png">
<link rel="stylesheet" href="engine.css">
<style>
  html,body{background:#F7F5FC;overflow:hidden}
  #app{position:absolute;inset:0;display:flex;flex-direction:column}
  header{flex:none;background:#6A4BC4;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:800}
  header img{width:34px;height:34px;object-fit:contain}
  header .sp{flex:1}
  header button{background:#ffffff30;border:0;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
  main{flex:1;overflow:auto;padding:12px 12px 20px;-webkit-overflow-scrolling:touch}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(75,58,140,.08)}
  .card h2{margin:0 0 8px;font-size:17px;color:#6A4BC4}
  .card h3{margin:0 0 6px;font-size:15px}
  .big{font-size:19px}
  textarea,input[type=text],input[type=number],select{width:100%;font-family:inherit;font-size:17px;border:2px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);background:#fff}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--acc)}
  .pbtn{width:100%;background:#6A4BC4;color:#fff;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:800;margin-top:10px}
  .pbtn:disabled{background:#b9afdc}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:18px;font-weight:700;margin:8px 0;color:var(--ink)}
  .opt.on{background:#6A4BC4;border-color:#6A4BC4;color:#fff}
  .mine{background:#fff8d6;border-radius:12px;padding:8px 12px;margin-top:8px;font-size:16px;line-height:1.4;display:flex;justify-content:space-between;gap:8px}
  .mine small{color:#8a8399;flex:none}
  .mine.ok{background:#e9f9f2}
  .fl{font-weight:800;margin:12px 0 4px;color:#6A4BC4}
  .rx{flex:none;background:#fff;border-top:2px solid var(--chip);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px}
  .rx .r{display:flex;justify-content:space-around;gap:4px}
  .rx button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:22px;padding:6px 0}
  .rx button.on{background:var(--chip);border-color:var(--acc)}
  .rx .u button{font-size:13px;font-weight:700;color:var(--ink)}
  .pad{position:relative;width:100%;aspect-ratio:1000/560;background:#fff;border:2px solid var(--line);border-radius:12px;touch-action:none;overflow:hidden}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%}
  .tl{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
  .tl button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
  .tl button.on{border-color:var(--acc);background:var(--chip)}
  .dot{width:26px!important;height:26px;padding:0!important;border-radius:50%!important}
  .center{text-align:center;padding:30px 10px}
  .center img{width:110px}
  .view{margin-bottom:12px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);background:#fff;display:flex;justify-content:center}
  .tag{display:inline-block;background:var(--chip);color:var(--acc);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script src="engine.js"></script>
<script src="join.js"></script>
</body>
</html>
