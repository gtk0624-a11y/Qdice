<body>
<div id="app"></div><div id="sheet"></div><div id="toast"></div>
<script>
'use strict';
/* ============ 공통 도구 ============ */
const $=s=>document.querySelector(s);
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const LSset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>(n<0?'-':'')+Math.abs(Math.round(n)).toLocaleString('ko-KR')+'원';
const pad=n=>String(n).padStart(2,'0');
const DOW=['일','월','화','수','목','금','토'];
function h53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}

/* ============ 분류 ============ */
const CATS=[
 {id:'food',n:'식비',e:'🍚'},{id:'cafe',n:'카페·간식',e:'☕'},{id:'mart',n:'장보기',e:'🛒'},
 {id:'trans',n:'교통·차량',e:'🚌'},{id:'home',n:'주거·통신',e:'🏠'},{id:'shop',n:'쇼핑',e:'🛍️'},
 {id:'med',n:'의료·건강',e:'💊'},{id:'fun',n:'문화·여가',e:'🎬'},{id:'edu',n:'교육·도서',e:'📚'},
 {id:'kid',n:'자녀',e:'🧒'},{id:'sport',n:'운동·취미',e:'🏸'},{id:'gift',n:'경조사·선물',e:'🎁'},{id:'etc',n:'기타',e:'📦'}];
const INCS=[{id:'salary',n:'월급',e:'💰'},{id:'bonus',n:'수당·상여',e:'🎉'},{id:'inetc',n:'기타수입',e:'➕'}];
const catOf=id=>CATS.concat(INCS).find(c=>c.id===id);
const BUILTIN=[
 ['cafe',/스타벅스|투썸|메가커피|메가MGC|컴포즈|이디야|빽다방|할리스|매머드|카페|커피|베이커리|파리바게|뚜레쥬르|배스킨|던킨|제과|디저트/i],
 ['fun',/넷플릭스|유튜브|CGV|메가박스|롯데시네마|영화|노래방|PC방|스팀|티빙|웨이브|디즈니|멜론|왓챠|볼링|당구/i],
 ['trans',/택시|카카오T|타다|버스|지하철|코레일|KTX|SRT|주유|GS칼텍스|SK에너지|S-OIL|에쓰오일|현대오일|주차|하이패스|티머니|T-?money|도로공사|세차/i],
 ['med',/병원|의원|약국|치과|한의원|클리닉|메디|안과|피부과|이비인후|정형외과|소아과/i],
 ['edu',/학원|서점|교보|영풍|YES24|예스24|알라딘|도서|독서실|스터디|인강|교육/i],
 ['kid',/키즈|유치원|어린이|완구|토이저러스|아이스크림몰/i],
 ['sport',/헬스|피트니스|체육|배드민턴|스포츠|골프|수영|요가|필라테스|짐\b/i],
 ['mart',/이마트|홈플러스|롯데마트|코스트코|하나로|GS25|\bCU\b|씨유|세븐일레븐|편의점|마켓컬리|컬리|슈퍼|마트|정육|청과/i],
 ['food',/식당|음식|치킨|피자|김밥|분식|한식|국밥|갈비|고기|횟집|족발|배달의민족|배민|요기요|쿠팡이츠|맥도날드|버거킹|롯데리아|KFC|맘스터치|서브웨이|떡볶이|초밥|스시|라면|반점|면옥|냉면|죽\b|밥/i],
 ['home',/KT|SKT|LG유플러스|통신|전기|한전|도시가스|관리비|아파트|수도|보험|월세|임대/i],
 ['shop',/쿠팡|11번가|G마켓|옥션|네이버페이|SSG|무신사|올리브영|다이소|아울렛|백화점|의류|신발|스토어|몰\b/i]];
const normM=m=>String(m||'').replace(/\(.*?\)/g,'').replace(/[\s*·\-_.,]/g,'').toLowerCase();
function autoCat(m,t,rules){
  if(t==='i') return /급여|월급|봉급/.test(m)?'salary':'inetc';
  const k=normM(m); if(!k) return '';
  const r=rules[h53(k).toString(36)]; if(r&&r.c) return r.c;
  for(const [c,re] of BUILTIN) if(re.test(m)) return c;
  return '';
}

/* ============ 문자 파서 ============ */
// <PARSER>
function parseSms(raw,fallbackTs){
  let s=String(raw||'').replace(/\r/g,'\n').replace(/\[Web발신\]|\[국제발신\]|\(광고\)/g,' ').replace(/\s+/g,' ').trim();
  if(!s) return null;
  const cancel=/취소/.test(s);
  const isOut=/승인|결제|사용|출금|이체|체크/.test(s);
  const isIn=/입금/.test(s);
  if(!(cancel||isOut||isIn)) return null;
  if(/인증번호|인증 번호|OTP/i.test(s)&&!/승인|결제/.test(s)) return null;
  // 금액
  let am=s.match(/(?:출금|입금|승인취소|취소|승인|결제)\s*(?:금액)?\s*:?\s*(-?[\d,]{1,13})\s*원?/);
  if(!am||!/\d/.test(am[1])) am=s.match(/(-?[\d,]{1,13})\s*원/);
  if(!am) return null;
  const a=Math.abs(parseInt(am[1].replace(/,/g,''),10));
  if(!a||isNaN(a)) return null;
  const amEnd=am.index+am[0].length;
  // 시각
  let ts=fallbackTs||Date.now(), tail=s.slice(amEnd);
  const tm=s.match(/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/);
  if(tm){
    const now=new Date();let y=now.getFullYear();
    let d=new Date(y,+tm[1]-1,+tm[2],+tm[3],+tm[4]);
    if(d.getTime()>now.getTime()+2*864e5) d=new Date(y-1,+tm[1]-1,+tm[2],+tm[3],+tm[4]);
    ts=d.getTime(); tail=s.slice(tm.index+tm[0].length);
  }
  // 가맹점
  let m=tail.split(/누적|잔액|잔여|한도|총|이용|현재|포인트|\(|\[|사용금액/)[0];
  m=m.replace(/일시불|할부\s*\d*\s*개월?|\d+\s*개월|승인|취소|결제|출금|입금|체크|원/g,' ').replace(/-?\d[\d,]{3,}/g,' ').replace(/\s+/g,' ').trim();
  if(/^[\d\s,\/:\-*]*$/.test(m)) m='';
  if(m.length>30) m=m.slice(0,30);
  const t=(isIn&&!isOut&&!cancel)?'i':'o';
  if(!m) m=t==='i'?'입금':/출금|이체/.test(s)?'출금':'(가맹점 미확인)';
  // 카드
  const cn=s.match(/(신한|삼성|KB국민|국민|현대|롯데|하나|우리|NH농협|농협|BC|비씨|씨티|카카오뱅크|카카오|토스|IBK|기업|우체국|새마을|iM|케이뱅크)\s?(카드|체크|뱅크)?/);
  const c4=s.match(/\((\d{4})\)|(\d{4})\s*승인|(\d{4})\s*\*/);
  let cd=cn?cn[1].replace('KB국민','국민'):'';
  if(c4) cd+=' '+(c4[1]||c4[2]||c4[3]);
  return {a,m,ts,t,cd:cd.trim(),cancel};
}
// </PARSER>

/* ============ 저장소 ============ */
let CFG=LS('gb_cfg',{db:'',key:''});
let DB=LS('gb_db',{tx:{},rules:{},cfg:{}});
let Q=LS('gb_q',[]);
const S={tab:'home',ym:(()=>{const n=new Date();return{y:n.getFullYear(),m:n.getMonth()}})(),net:'local',tri:0,sheet:null,sig:''};

(function init(){
  const p=new URLSearchParams(location.search);
  if(p.get('k')){CFG.key=p.get('k');if(p.get('db'))CFG.db=p.get('db');LSset('gb_cfg',CFG)}
  if(!CFG.key){const a=new Uint8Array(16);crypto.getRandomValues(a);CFG.key='k'+Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,24);LSset('gb_cfg',CFG)}
  if(p.get('text')||p.get('title')){S.sheet={mode:'paste',text:(p.get('title')?p.get('title')+' ':'')+(p.get('text')||'')}}
  if(p.has('k')||p.has('text')||p.has('title')) history.replaceState(null,'',location.pathname);
})();

const cloud=()=>!!(CFG.db&&CFG.key);
const cloudUrl=p=>`${CFG.db}/m/${CFG.key}${p?'/'+p:''}.json`;
const saveDB=()=>LSset('gb_db',DB);
const txs=()=>Object.entries(DB.tx).map(([id,v])=>Object.assign({id},v));

async function sendOp(op){
  const r=await fetch(cloudUrl(op.p),{method:op.m,headers:{'Content-Type':'application/json'},body:op.m==='DELETE'?undefined:JSON.stringify(op.b)});
  if(r.status===401||r.status===403){S.net='rules';throw new Error('rules')}
  if(!r.ok&&r.status!==400) throw new Error(String(r.status));
}
let flushing=false;
async function flush(){
  if(flushing||!cloud()) return; flushing=true;
  try{while(Q.length){await sendOp(Q[0]);Q.shift();LSset('gb_q',Q)}}catch(e){}
  flushing=false;
}
function enqueue(m,p,b){if(!cloud())return;Q.push({m,p,b});LSset('gb_q',Q);flush()}

function putTx(id,obj){DB.tx[id]=obj;saveDB();enqueue('PUT','tx/'+id,obj)}
function delTx(id){delete DB.tx[id];saveDB();enqueue('DELETE','tx/'+id)}
function putRule(norm,name,c){const h=h53(norm).toString(36);DB.rules[h]={k:norm,n:name,c};saveDB();enqueue('PUT','rules/'+h,DB.rules[h])}
function delRule(h){delete DB.rules[h];saveDB();enqueue('DELETE','rules/'+h)}
function setBudget(b){DB.cfg.b=b;saveDB();enqueue('PUT','cfg/b',b)}

/* 문자 1건 → 내역 */
function addParsed(p,raw){
  const id='p'+h53([p.cd,p.a,Math.floor(p.ts/60000),normM(p.m),p.t,p.cancel?'c':'a'].join('|')).toString(36);
  if(DB.tx[id]) return false;
  if(p.cancel){
    const orig=txs().find(x=>x.t==='o'&&!x.x&&!x.h&&x.a===p.a&&p.ts>=x.ts-6e4&&p.ts-x.ts<60*864e5&&(p.m==='(가맹점 미확인)'||normM(x.m).includes(normM(p.m))||normM(p.m).includes(normM(x.m))));
    if(orig){
      putTx(orig.id,Object.assign({},DB.tx[orig.id],{x:1}));
      putTx(id,{a:p.a,m:p.m,ts:p.ts,t:'o',c:'etc',cd:p.cd,x:1,h:1,s:'sms'});
    }else{
      putTx(id,{a:-p.a,m:p.m+' (취소)',ts:p.ts,t:'o',c:autoCat(p.m,'o',DB.rules)||'etc',cd:p.cd,s:'sms'});
    }
    return true;
  }
  const o={a:p.a,m:p.m,ts:p.ts,t:p.t,c:autoCat(p.m,p.t,DB.rules),cd:p.cd,s:'sms'};
  if(raw) o.raw=String(raw).slice(0,300);
  putTx(id,o);return true;
}

let busy=false;
async function pull(){
  if(!cloud()||busy) return; busy=true;
  try{
    await flush();
    if(Q.length){S.net=S.net==='rules'?'rules':'off';return}
    const r=await fetch(cloudUrl(''));
    if(r.status===401||r.status===403){S.net='rules';return}
    if(!r.ok){S.net='off';return}
    const d=await r.json()||{};
    DB.tx=d.tx||{};DB.rules=d.rules||{};DB.cfg=d.cfg||{};saveDB();S.net='ok';
    let added=0;
    for(const [k,v] of Object.entries(d.inbox||{})){
      const p=parseSms(v&&v.t,v&&v.ts);
      if(p&&addParsed(p,v.t)) added++;
      enqueue('DELETE','inbox/'+k);
    }
    if(added) toast(`새 내역 ${added}건이 들어왔어요`);
  }catch(e){S.net='off'}
  finally{busy=false;softRender()}
}

const sum=(l,t)=>l.filter(x=>x.t===t&&!x.x).reduce((s,x)=>s+x.a,0);
function monthTx(y,m){const a=new Date(y,m,1).getTime(),b=new Date(y,m+1,1).getTime();return txs().filter(t=>t.ts>=a&&t.ts<b&&!t.h)}
const uncls=()=>txs().filter(t=>!t.c&&!t.x&&!t.h&&t.t==='o').sort((a,b)=>b.ts-a.ts);

function vHome(){

  const out=sum(list,'o'),inc=sum(list,'i'),b=+DB.cfg.b||0,now=new Date();
  const cur=S.ym.y===now.getFullYear()&&S.ym.m===now.getMonth();
  let bud='';
  if(b){
    const pct=Math.min(100,Math.round(out/b*100)),left=b-out;
    let ex='';if(cur){const last=new Date(S.ym.y,S.ym.m+1,0).getDate(),dl=last-now.getDate()+1;ex=left>0?` · 하루 ${won(Math.floor(left/dl))}`:''}
    bud=`<div class="bar"><i style="width:${pct}%" class="${pct>=100?'over':pct>=80?'warn':''}"></i></div><div class="sub">${left>=0?'남은 예산 '+won(left)+ex:'예산 '+won(-left)+' 초과'}</div>`;
  }else bud=`<button class="link" data-act="gobudget">+ 월 예산 정하기</button>`;
  let today='';
  if(cur){const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();today=`<div class="row"><span>오늘 <b>${won(sum(list.filter(x=>x.ts>=t0),'o'))}</b></span><span>수입 <b>${won(inc)}</b></span></div>`}
  else today=`<div class="row"><span>수입 <b>${won(inc)}</b></span></div>`;
  const nu=uncls().length;
  let h=`<div class="card hero"><div class="lb">${S.ym.m+1}월에 쓴 돈</div><div class="big">${won(out)}</div>${bud}${today}</div>`;
  if(nu) h+=`<button class="banner" data-act="tab" data-v="triage"><span>🗂️ 분류할 내역 ${nu}건</span><span>›</span></button>`;
  if(!cloud()) h+=`<div class="sub" style="margin:0 4px 10px">📱 지금은 이 폰에만 저장돼요. 문자 자동 입력은 <a class="link" data-act="tab" data-v="set">설정</a>에서 연결하세요.</div>`;
  if(!list.length) return h+`<div class="empty">아직 내역이 없어요.<br>카드 문자가 오면 자동으로 쌓이고,<br>현금은 아래 ＋ 버튼으로 적어요.</div>`;
  let last='';
  const byDay={};list.forEach(t=>{const d=new Date(t.ts),k=`${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;(byDay[k]=byDay[k]||[]).push(t)});
  for(const [k,arr] of Object.entries(byDay)){
    h+=`<div class="day"><span>${k}</span><span>${won(sum(arr,'o'))}</span></div>`;
    arr.forEach(t=>{
      const c=catOf(t.c),d=new Date(t.ts);
      h+=`<div class="it ${t.x?'x':''}" data-act="edit" data-id="${t.id}"><div class="ic ${c?'':'warn'}">${c?c.e:'❓'}</div><div class="mid"><b>${esc(t.m)}</b><small>${esc(t.cd||'직접입력')} · ${pad(d.getHours())}:${pad(d.getMinutes())} · ${c?c.n:'미분류'}${t.x?' · 취소됨':''}</small></div><div class="amt ${t.t==='i'?'in':''}">${t.t==='i'?'+':t.a<0?'+':'-'}${Math.abs(t.a).toLocaleString('ko-KR')}</div></div>`;
    });
  }
  return h;
}

function vStats(){
  const list=monthTx(S.ym.y,S.ym.m).filter(t=>t.t==='o'&&!t.x);
  const tot=list.reduce((s,x)=>s+x.a,0);
  if(!list.length) return `<div class="empty">이 달 지출이 없어요.</div>`;
  const by={};list.forEach(t=>by[t.c||'?']=(by[t.c||'?']||0)+t.a);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  let h=`<div class="card"><h3>카테고리별 지출</h3>${rows.map(([c,v])=>{const k=catOf(c);return `<div class="srow"><div class="n">${k?k.e+' '+k.n:'❓ 미분류'}</div><div class="bg"><i style="width:${Math.round(v/rows[0][1]*100)}%"></i></div><div class="v">${Math.round(v/tot*100)}% · ${(v/10000).toFixed(v>=1e6?0:1)}만</div></div>`}).join('')}</div>`;
  const ms=[];for(let i=5;i>=0;i--){const d=new Date(S.ym.y,S.ym.m-i,1);ms.push({l:d.getMonth()+1+'월',v:sum(monthTx(d.getFullYear(),d.getMonth()),'o'),cur:i===0})}
  const mx=Math.max(...ms.map(x=>x.v),1);
  h+=`<div class="card"><h3>최근 6개월</h3><div class="cols">${ms.map(x=>`<div class="${x.cur?'cur':''}"><span style="margin-bottom:3px">${x.v?Math.round(x.v/10000)+'만':''}</span><i style="height:${Math.round(x.v/mx*90)}%"></i>${x.l}</div>`).join('')}</div></div>`;
  const mer={};list.forEach(t=>{const k=normM(t.m);(mer[k]=mer[k]||{n:t.m,v:0,c:0}).v+=t.a;mer[k].c++});
  const top=Object.values(mer).sort((a,b)=>b.v-a.v).slice(0,5);
  h+=`<div class="card"><h3>많이 쓴 곳 TOP 5</h3>${top.map((x,i)=>`<div class="srow"><div class="n" style="width:auto;flex:1">${i+1}. ${esc(x.n)} <span class="sub">${x.c}회</span></div><div class="v" style="width:auto">${won(x.v)}</div></div>`).join('')}</div>`;
  return h;
}

function render(){
  const v={home:vHome,triage:vTriage,stats:vStats,set:vSet}[S.tab]();
  $('#app').innerHTML=header()+`<main>${v}</main>`+nav();

const sigOf=()=>S.tab+S.net+JSON.stringify(DB.tx).length+JSON.stringify(DB.cfg)+Object.keys(DB.rules).length;
function softRender(){
  const a=document.activeElement;
  if(S.sheet||(a&&/INPUT|TEXTAREA/.test(a.tagName)&&$('#app').contains(a))) return;
  if(sigOf()!==S.sig) render();
}

function localDT(ts){const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function renderSheet(){
  const sh=S.sheet;
  if(!sh){$('#sheet').innerHTML='';return}
  let h='';
  if(sh.mode==='paste'){
    h=`<h2>문자 붙여넣기</h2><div class="sub">카드 문자를 붙여넣으면 여러 건도 한 번에 등록돼요.</div><textarea id="ptxt" rows="7" placeholder="[Web발신] 삼성카드 승인 ...">${esc(sh.text||'')}</textarea><div class="row2"><button class="btn ghost" data-act="close">닫기</button><button class="btn" data-act="dopaste">등록</button></div>`;
  }else{
    const isNew=sh.mode==='new',cs=sh.t==='i'?INCS:CATS;
    h=`<h2>${isNew?'내역 추가':'내역 수정'}</h2>
    <div class="seg"><button class="${sh.t==='o'?'on':''}" data-act="stype" data-v="o">지출</button><button class="${sh.t==='i'?'on':''}" data-act="stype" data-v="i">수입</button></div>
    <input class="amtin" type="tel" inputmode="numeric" id="f_a" placeholder="0" value="${sh.a?Math.abs(sh.a).toLocaleString('ko-KR'):''}">
    <label class="l">가맹점 / 메모</label><input type="text" id="f_m" value="${esc(sh.m||'')}" placeholder="예: 점심, 현금 시장">
    <label class="l">분류</label><div class="grid">${cs.map(c=>`<button class="cb ${sh.c===c.id?'on':''}" data-act="spick" data-c="${c.id}"><span>${c.e}</span>${c.n}</button>`).join('')}</div>
    <label class="l">날짜·시간</label><input type="datetime-local" id="f_d" value="${localDT(sh.ts)}">
    ${!isNew&&sh.cd?`<div class="sub">${esc(sh.cd)} 카드${sh.raw?' · 문자 원문: '+esc(sh.raw):''}</div>`:''}
    <label class="chk"><input type="checkbox" id="f_r" checked> 이 가맹점은 앞으로 자동 분류</label>
    <div class="row2">${isNew?'':'<button class="btn red" data-act="sdel">삭제</button>'}<button class="btn ghost" data-act="close">닫기</button><button class="btn" data-act="ssave">저장</button></div>`;
  }
  $('#sheet').innerHTML=`<div class="ov" data-act="ovclose"><div class="sheet">${h}</div></div>`;
  const f=$('#f_a');if(f&&sh.mode==='new')setTimeout(()=>f.focus(),60);
}
function openEdit(id){const t=DB.tx[id];if(!t)return;S.sheet=Object.assign({mode:'edit',id},t);renderSheet()}
function readSheet(){
  const sh=S.sheet,a=parseInt(($('#f_a').value||'').replace(/[^\d]/g,''),10)||0;
  const d=new Date($('#f_d').value);
  return {a:(sh.a<0?-a:a),m:$('#f_m').value.trim(),ts:isNaN(d)?Date.now():d.getTime(),rem:$('#f_r')&&$('#f_r').checked};
}

/* ============ 동작 ============ */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
async function copy(v){try{await navigator.clipboard.writeText(v);toast('복사했어요')}catch(e){prompt('길게 눌러 복사하세요',v)}}
function applyRule(m,c){
  const k=normM(m);if(!k||!c)return;
  putRule(k,m,c);
  txs().filter(t=>!t.c&&t.t==='o'&&normM(t.m)===k).forEach(t=>putTx(t.id,Object.assign({},DB.tx[t.id],{c})));
}
function wonInput(e){const el=e.target;if(el.id==='f_a'||el.id==='bud'){const n=el.value.replace(/[^\d]/g,'');el.value=n?(+n).toLocaleString('ko-KR'):''}}
document.addEventListener('input',wonInput);

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id,v=el.dataset.v,c=el.dataset.c;
  if(act==='ovclose'){if(e.target===el){S.sheet=null;renderSheet()}return}
  switch(act){
   case 'tab':S.tab=v;S.tri=0;render();scrollTo(0,0);break;
   case 'pm':S.ym.m--;if(S.ym.m<0){S.ym.m=11;S.ym.y--}render();break;
   case 'nm':S.ym.m++;if(S.ym.m>11){S.ym.m=0;S.ym.y++}render();break;
   case 'gobudget':S.tab='set';render();setTimeout(()=>$('#bud')&&$('#bud').focus(),50);break;
   case 'new':S.sheet={mode:'new',t:'o',a:0,m:'',c:'',ts:Date.now()};renderSheet();break;
   case 'edit':openEdit(id);break;
   case 'close':S.sheet=null;renderSheet();break;
   case 'stype':{const cur=readSheet();Object.assign(S.sheet,{t:v,a:cur.a,m:cur.m,ts:cur.ts,c:''});renderSheet();break}
   case 'spick':{const cur=readSheet();Object.assign(S.sheet,{a:cur.a,m:cur.m,ts:cur.ts,c:c});renderSheet();break}
   case 'ssave':{
     const r=readSheet(),sh=S.sheet;
     if(!r.a){toast('금액을 입력하세요');return}
     if(!r.m)r.m=sh.t==='i'?'수입':'직접입력';
     const obj=Object.assign({},sh.mode==='edit'?DB.tx[sh.id]:{s:'man'},{a:r.a,m:r.m,ts:r.ts,t:sh.t,c:sh.c||''});
     if(!obj.c&&sh.t==='o')obj.c=autoCat(r.m,'o',DB.rules);
     if(sh.mode==='edit')putTx(sh.id,obj);else putTx('m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),obj);
     if(r.rem&&obj.c&&sh.t==='o'&&obj.m!=='직접입력')applyRule(obj.m,obj.c);
     S.sheet=null;renderSheet();render();toast('저장했어요');break}
   case 'sdel':if(confirm('이 내역을 삭제할까요?')){delTx(S.sheet.id);S.sheet=null;renderSheet();render()}break;
   case 'tripick':{const t=DB.tx[id];if(!t)break;const rem=$('#rem')&&$('#rem').checked;
     if(rem)applyRule(t.m,c);else putTx(id,Object.assign({},t,{c}));
     render();break}
   case 'triskip':S.tri++;render();break;
   case 'tridel':if(confirm('이 내역을 삭제할까요? (문자 오인식일 때)')){delTx(id);render()}break;
   case 'savedb':{
     let u=($('#dburl').value||'').trim().replace(/\/+$/,'');
     if(u&&!/^https:\/\/.+/.test(u)){toast('https:// 로 시작하는 주소여야 해요');return}
     CFG.db=u;LSset('gb_cfg',CFG);S.net='off';render();toast(u?'저장! 불러오는 중…':'서버 연결을 해제했어요');pull();break}
   case 'copy':copy(v);break;
   case 'invite':{
     if(!cloud()){toast('먼저 서버 주소를 저장하세요');return}
     const link=`${location.origin}${location.pathname}?k=${encodeURIComponent(CFG.key)}&db=${encodeURIComponent(CFG.db)}`;
     if(navigator.share){try{await navigator.share({title:'똑똑 가계부 초대',text:'우리 집 가계부에 들어오세요',url:link})}catch(e){}}else copy(link);break}
   case 'test':{
     if(!cloud()){toast('먼저 서버 주소를 저장하세요');return}
     const d=new Date(),sample=`[Web발신]\n삼성카드 승인 김*환 4,500원 일시불 ${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())} 스타벅스 누적 123,000원`;
     try{const r=await fetch(cloudUrl('inbox'),{method:'POST',body:JSON.stringify({t:sample,ts:Date.now()})});
       if(!r.ok)throw 0;toast('테스트 문자를 보냈어요');setTimeout(()=>{pull().then(()=>{S.tab='home';render()})},1500)}
     catch(e){toast('보내지 못했어요. 주소·규칙을 확인하세요')}break}
   case 'paste':S.sheet={mode:'paste',text:''};renderSheet();break;
   case 'dopaste':{
     const txt=$('#ptxt').value;
     const parts=txt.split(/(?=\[Web발신\])|\n\s*\n/).map(x=>x.trim()).filter(Boolean);
     let n=0;parts.forEach(p=>{const r=parseSms(p,Date.now());if(r&&addParsed(r,p))n++});
     S.sheet=null;renderSheet();S.tab='home';render();toast(n?`${n}건 등록했어요`:'등록할 카드 내역을 찾지 못했어요');break}
   case 'savebud':{const n=parseInt(($('#bud').value||'').replace(/[^\d]/g,''),10)||0;setBudget(n);toast('저장했어요');render();break}
   case 'delrule':delRule(id);render();break;
   case 'resync':S.net=cloud()?'off':'local';pull();toast('새로고침');break;
   case 'csv':{
     const rows=[['날짜','시간','구분','가맹점','분류','금액','카드']];
     txs().filter(t=>!t.h).sort((a,b)=>a.ts-b.ts).forEach(t=>{const d=new Date(t.ts);rows.push([`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,`${pad(d.getHours())}:${pad(d.getMinutes())}`,t.t==='i'?'수입':'지출'+(t.x?'(취소)':''),t.m,(catOf(t.c)||{}).n||'미분류',t.x?0:t.a,t.cd||''])});
     const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
     const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='가계부.csv';a.click();break}
  }
});

/* ============ 시작 ============ */
render();
if(S.sheet)renderSheet();
if(cloud()){S.net='off';render();pull();setInterval(()=>{if(!document.hidden)pull()},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});addEventListener('online',pull)}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
