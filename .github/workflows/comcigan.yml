name: 컴시간 시간표 가져오기
on:
  schedule:
    - cron: '0 20 * * 0-4'   # 한국시간 월~금 새벽 5시
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i parse-comcigan --no-save
      - run: node gyomu/tools/comcigan.js /tmp/comcigan.json
      - name: data 가지에 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then git checkout -B data origin/data; else git checkout --orphan data && git rm -rf . >/dev/null 2>&1 || true; fi
          cp /tmp/comcigan.json comcigan.json
          git add comcigan.json
          git diff --cached --quiet || git commit -m "컴시간 시간표 갱신"
          git push origin data
